<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    /* Tokens mirror the pair views' shared base (drivers/controller/pair/*.html)
       so the app looks like one product across pairing and settings. This page
       is a document of its own, so they can live on :root — the pair views have
       to scope theirs to a root id because all four share one document.

       THIS PAGE IS PRIVILEGED. The API key is stored in `homey.settings`, so a
       settings webview can read it back through Homey.get — that is the SDK's own
       design and not something the app can prevent. Two rules follow, and both
       are enforced by test/unit/webview-safety.test.ts: nothing here ever asks
       Homey.get for that setting (the test forbids even naming it, which is why
       this comment does not), and no interpolated value reaches the document
       through an HTML parser. See lib/credential-service.ts for the perimeter
       this page sits inside. */
    :root {
      --lk-accent: #180e32;
      --lk-accent-ink: #ffffff;
      --lk-accent-tint: #f3eefc;
      --lk-accent-strong: #2b1a52;
      --lk-ring: rgba(24, 14, 50, .16);

      --lk-ink: #16181d;
      --lk-sub: #6b7280;
      --lk-body: #4b5563;
      --lk-muted: #8b929e;
      --lk-faint: #9aa1ac;

      /* transparent, so the Homey settings frame keeps painting the page
         behind us. */
      --lk-page: transparent;
      --lk-surface: #ffffff;
      --lk-raised: #f7f8fa;
      --lk-line: #eceef2;
      --lk-field: #e3e6ec;
      --lk-hover: #c9d2e0;
      --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

      --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
      --lk-warn-bg: #fef3c7; --lk-warn-ink: #92400e;
      --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
      --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

      --lk-code-bg: #f4f5f7; --lk-code-ink: #16181d;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                        "Helvetica Neue", sans-serif;
           background: var(--lk-page); color: var(--lk-ink); padding: 16px;
           -webkit-font-smoothing: antialiased; }

    /* Eyebrow labels, as in the pair views, rather than small bold headings. */
    h2 { font-size: 12px; font-weight: 600; text-transform: uppercase;
         letter-spacing: .06em; color: var(--lk-faint); margin: 24px 0 8px 2px; }
    h2:first-of-type { margin-top: 0; }
    p { font-size: 13px; line-height: 1.55; color: var(--lk-body); }

    .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
            border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
            margin-bottom: 10px; }

    /* A default ground, so a message shown before a state class lands on it is
       still a message rather than bare text on the page.

       It MUST stay above the state colours below. .msg and .ready weigh the
       same, so whichever is declared last wins — with .msg last, every
       `className = 'msg ready'` painted flat grey and the whole page reported
       success, failure and progress in one indistinguishable colour. */
    .msg { margin-top: 10px; padding: 11px 13px; border-radius: 11px; font-size: 13px;
           line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }

    /* Shared by the state pills and by .msg blocks: geometry comes from .state
       or .msg, the colour pair from here. */
    .state { display: inline-block; padding: 3px 9px; border-radius: 999px;
             font-size: 11px; font-weight: 600; }
    .ready { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
    .partial { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
    .broken { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
    .flat { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }

    input { width: 100%; padding: 12px 13px; border: 1.5px solid var(--lk-field);
            border-radius: 11px; box-sizing: border-box; background: var(--lk-surface);
            color: var(--lk-ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; }
    input:focus { outline: none; border-color: var(--lk-accent);
                  box-shadow: 0 0 0 3px var(--lk-ring); }

    button { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
    button:hover { border-color: var(--lk-hover); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { background: var(--lk-accent); color: var(--lk-accent-ink);
               border-color: var(--lk-accent); font-weight: 600; }

    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    /* The recent-presses and recent-writes rows. These were built with
       row.style.cssText in the render loop, which put the styling of the two
       busiest lists in the file out of reach of both the token palette and
       anyone reading the CSS. */
    .entry { padding: 7px 0; border-bottom: 1px solid var(--lk-line); font-size: 12px; }
    .entry:last-child { border-bottom: none; }
    .entry code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  color: var(--lk-body); }
    .entry-error { color: var(--lk-bad-ink); margin-top: 3px; }
    .entry-meta { margin: 6px 0 0; }
    .entry-sub { margin: 4px 0 0; color: var(--lk-muted); }
    /* First child of a card, so the card's own padding is the only spacing. */
    .tight { margin: 0; }

    pre { margin-top: 14px; background: var(--lk-code-bg); color: var(--lk-code-ink);
          padding: 12px; border-radius: 11px; font-size: 11px; max-height: 320px;
          overflow: auto; white-space: pre-wrap; word-break: break-word;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>

<!--
  Static copy is resolved by homey.js, which looks up every [data-i18n] and
  [data-i18n-placeholder] element against locales/*.json on load. Strings built
  at runtime go through Homey.__ in the script below. The app ships English only,
  but anything hard-coded here could never be translated — so it still goes
  through a key.
-->

<h2 data-i18n="settings.apiKeyTitle"></h2>
<!-- The one line on this page people come to check. As plain body text it read
     as prose and had to be parsed; refresh() gives it the same green/amber/red
     grounds the rest of the page uses for state, so it answers at a glance. -->
<p id="credText" class="msg flat" data-i18n="settings.checking"></p>
<div class="card">
  <input id="key" type="password" data-i18n-placeholder="settings.newKeyPlaceholder"
         autocomplete="off" spellcheck="false" />
  <div class="row">
    <button id="save" class="primary" data-i18n="settings.saveKey"></button>
    <button id="clear" data-i18n="settings.removeKey"></button>
  </div>
  <div id="credMsg" class="msg" style="display:none;"></div>
</div>
<p data-i18n="settings.apiKeyExplain"></p>

<h2 data-i18n="settings.controllers"></h2>
<div id="controllers"></div>

<h2 data-i18n="settings.schedules"></h2>
<div id="schedules"></div>

<h2 data-i18n="settings.circadian"></h2>
<div id="circadian"></div>

<h2 data-i18n="settings.flowsTitle"></h2>
<div class="card">
  <p id="orphanText" class="tight" data-i18n="settings.checking"></p>
  <div class="row">
    <button id="sweep" style="display:none;"></button>
  </div>
  <div id="sweepMsg" class="msg" style="display:none;"></div>
</div>
<p data-i18n="settings.flowsExplain"></p>

<h2 data-i18n="settings.pressesTitle"></h2>
<p data-i18n="settings.pressesExplain"></p>
<div id="events" class="card" data-i18n="settings.loading"></div>

<h2 data-i18n="settings.writesTitle"></h2>
<p data-i18n="settings.writesExplain"></p>
<div id="writes" class="card" data-i18n="settings.loading"></div>

<h2 data-i18n="settings.diagnostics"></h2>
<div class="row">
  <button id="diag" data-i18n="settings.showDiagnostics"></button>
  <button id="download" data-i18n="settings.downloadDiagnostics"></button>
</div>
<pre id="out" style="display:none;"></pre>

<script type="text/javascript">
  var HomeyRef = null;

  function api(method, path, body) {
    return new Promise(function (resolve, reject) {
      HomeyRef.api(method, path, body || null, function (err, result) {
        if (err) return reject(err instanceof Error ? err : new Error(String(err)));
        resolve(result);
      });
    });
  }

  /** Shorthand for a translated string with optional __token__ substitutions. */
  function t(key, tokens) {
    return HomeyRef.__('settings.' + key, tokens || {});
  }

  /**
   * A DOM node, BUILT rather than parsed.
   *
   * Every interpolated value on this page now reaches the document through
   * `textContent`, never through an HTML parser. That matters here more than
   * almost anywhere else in the app: this page is privileged — it can read the
   * stored API key through `Homey.get` — and the values it renders are device
   * names, zone names and error text from other people's integrations. None of
   * that is authored by us, and a device named `"><img src=x onerror=…>` was one
   * string concatenation away from executing in a webview that can read a secret.
   *
   * There is no `escapeHtml()` on this page any more, and that is the point: it
   * existed to make concatenation safe, and there is no concatenation left to
   * make safe. `test/unit/webview-safety.test.ts` fails on any new interpolated
   * `innerHTML`.
   */
  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  /** Remove every child. What `innerHTML = ''` did, without the parser. */
  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
    return el;
  }

  /** ` · ` between two facts on one line. */
  function separator() {
    return document.createTextNode(' \u00b7 ');
  }

  function stateClass(state) {
    if (state === 'ready') return 'ready';
    if (state === 'partial') return 'partial';
    if (state === 'disabled') return 'flat';
    return 'broken';
  }

  /**
   * ControllerState is a code, not a label.
   *
   * This chip printed `controller.state` verbatim, so a controller waiting on a
   * key showed the literal string "needs_credential" — an internal identifier,
   * underscore and all, in the one place a user looks to find out what is wrong.
   * The enum lives in lib/profiles/controller-profile.ts.
   */
  function stateLabel(state) {
    switch (state) {
      case 'ready': return t('stateReady');
      case 'partial': return t('statePartial');
      case 'needs_repair': return t('stateNeedsRepair');
      case 'needs_credential': return t('stateNeedsCredential');
      case 'disabled': return t('stateDisabled');
      default: return state;
    }
  }

  /**
   * Translate a credential failure.
   *
   * `status.hint` comes from describeFailure() in lib/credential-service.ts and
   * is always English — lib/ has no access to Homey.__. The failure CODE is what
   * carries the translation. Mirrors credentialFailureKey() on the app side.
   */
  function failureText(cred) {
    switch (cred.failure) {
      case 'malformed': return HomeyRef.__('credential.malformed');
      case 'session_expired': return HomeyRef.__('credential.expired');
      case 'insufficient_scope': return HomeyRef.__('credential.noScope');
      case 'unknown': return HomeyRef.__('credential.unreachable');
      default: return cred.hint || t('keyBroken');
    }
  }

  function refresh() {
    return api('GET', '/').then(function (status) {
      var cred = status.credential || {};
      var credText = document.getElementById('credText');
      credText.textContent = cred.valid
        ? t('keyValid')
        : cred.present
          ? failureText(cred)
          : t('keyMissing');
      // Amber, not red, when no key was ever saved: nothing is broken, the
      // setup simply is not finished. Red is reserved for a key that was
      // supposed to work and does not.
      credText.className = 'msg ' + (cred.valid ? 'ready' : cred.present ? 'broken' : 'partial');

      var events = clear(document.getElementById('events'));
      if (!status.recentEvents || !status.recentEvents.length) {
        events.textContent = t('noPresses');
      } else {
        status.recentEvents.forEach(function (e) {
          var row = node('div', 'entry');
          row.appendChild(node('span', 'state ' + (e.accepted ? 'ready' : 'broken'),
            e.accepted ? t('eventHandled') : t('eventIgnored')));
          row.appendChild(document.createTextNode(' ' + new Date(e.at).toLocaleTimeString()));
          row.appendChild(separator());
          row.appendChild(node('code', null, e.eventKey));
          if (e.magnitude !== undefined) {
            row.appendChild(separator());
            row.appendChild(document.createTextNode(t('eventValue', { value: e.magnitude })));
          }
          if (e.reason) row.appendChild(node('div', 'entry-error', e.reason));
          events.appendChild(row);
        });
      }

      var writes = clear(document.getElementById('writes'));
      if (!status.recentWrites || !status.recentWrites.length) {
        writes.textContent = t('noWrites');
      } else {
        status.recentWrites.forEach(function (w) {
          var row = node('div', 'entry');
          row.appendChild(node('span', 'state ' + (w.ok ? 'ready' : 'broken'),
            w.ok ? t('writeSent') : t('writeFailed')));
          row.appendChild(document.createTextNode(' ' + new Date(w.at).toLocaleTimeString()));
          row.appendChild(separator());
          row.appendChild(node('code', null, w.capability + ' = ' + String(w.value)));
          row.appendChild(separator());
          row.appendChild(document.createTextNode(String(w.ms) + ' ms'));
          if (w.error) row.appendChild(node('div', 'entry-error', w.error));
          writes.appendChild(row);
        });
      }

      renderControllers(status.controllers || []);
      renderSchedules(status.schedules || []);
      renderCircadian(status.circadian || []);
    });
  }

  function renderControllers(controllers) {
    var list = clear(document.getElementById('controllers'));
    if (!controllers.length) {
      list.appendChild(node('p', null, t('noControllers')));
      return;
    }
    controllers.forEach(function (controller) {
      var el = node('div', 'card');
      el.appendChild(node('span', 'state ' + stateClass(controller.state), stateLabel(controller.state)));
      el.appendChild(document.createTextNode(' '));
      el.appendChild(node('strong', null, controller.sourceName || t('controllerFallback')));

      var meta = node('p', 'entry-meta', t('mappingsAndFlows', {
        mappings: controller.mappings,
        flows: controller.managedFlows,
      }));
      if (controller.schedulerReady === false) {
        meta.appendChild(separator());
        meta.appendChild(node('strong', null, t('notStarted')));
      }
      el.appendChild(meta);

      el.appendChild(node('p', 'entry-sub', t('controls', {
        names: (controller.targetNames || []).join(', ') || t('noLights'),
      })));
      list.appendChild(el);
    });
  }

  /** Weekday names come from the schedule screen's own keys, not settings'. */
  var DAY_KEYS = ['schedule.mon', 'schedule.tue', 'schedule.wed', 'schedule.thu',
                  'schedule.fri', 'schedule.sat', 'schedule.sun'];

  function daysText(days) {
    // The runtime sends the string 'every day' for an unrestricted schedule and
    // an array of ISO weekdays otherwise.
    if (!days || typeof days === 'string') return t('scheduleEveryDay');
    return days.map(function (day) { return HomeyRef.__(DAY_KEYS[day - 1]); }).join(', ');
  }

  function renderSchedules(schedules) {
    var list = clear(document.getElementById('schedules'));
    if (!schedules.length) {
      list.appendChild(node('p', null, t('noSchedules')));
      return;
    }
    schedules.forEach(function (schedule) {
      // Paused is not a fault, so it gets its own label rather than borrowing
      // the controller's "Disabled".
      var label = schedule.enabled === false ? t('statePaused') : stateLabel(schedule.state);
      var cls = schedule.enabled === false ? 'flat' : stateClass(schedule.state);

      var el = node('div', 'card');
      el.appendChild(node('span', 'state ' + cls, label));
      el.appendChild(document.createTextNode(' '));
      el.appendChild(node('strong', null, schedule.name || t('controllerFallback')));

      var meta = node('p', 'entry-meta');
      var entries = schedule.entries || [];
      if (!entries.length) meta.textContent = t('noSchedules');
      entries.forEach(function (entry, index) {
        if (index > 0) meta.appendChild(document.createElement('br'));
        meta.appendChild(document.createTextNode(
          t('scheduleWindow', { on: entry.on, off: entry.off }) + ' \u00b7 ' + daysText(entry.days),
        ));
        if (entry.active) {
          meta.appendChild(separator());
          meta.appendChild(node('strong', null, t('scheduleActiveNow')));
        }
      });
      el.appendChild(meta);

      el.appendChild(node('p', 'entry-sub',
        t('controls', { names: (schedule.targetNames || []).join(', ') || t('noLights') })
        + ' \u00b7 ' + t('scheduleFlows', { flows: schedule.managedFlows })));

      // Which clock the times above are read against. "It fired an hour out" is
      // almost always this line — and `timezoneResolved: false` means the app
      // could not use the Homey's own zone, which blocks a schedule outright.
      var clock = t('scheduleClock', {
        local: schedule.localTime || '?', zone: schedule.timezone || '?',
      });
      if (schedule.timezoneResolved === false) clock += ' \u00b7 ' + t('clockUnresolved');
      el.appendChild(node('p', 'entry-sub', clock));

      list.appendChild(el);
    });
  }

  /**
   * Circadian lights, which report a position on a curve rather than a list of
   * times. Two facts carry it: where the curve is NOW, and how many of its lights
   * somebody has taken over by hand — a light that has stopped following the curve
   * on purpose looks exactly like one that has stopped by accident.
   */
  function renderCircadian(devices) {
    var list = clear(document.getElementById('circadian'));
    if (!devices.length) {
      list.appendChild(node('p', null, t('noCircadian')));
      return;
    }
    devices.forEach(function (device) {
      // Paused is not a fault, so it borrows the schedule's label rather than
      // the controller's "Disabled".
      var label = device.enabled === false ? t('statePaused') : stateLabel(device.state);
      var cls = device.enabled === false ? 'flat' : stateClass(device.state);

      var el = node('div', 'card');
      el.appendChild(node('span', 'state ' + cls, label));
      el.appendChild(document.createTextNode(' '));
      el.appendChild(node('strong', null, device.name || t('controllerFallback')));

      var meta = node('p', 'entry-meta', t('circadianNow', {
        warmth: device.now ? Math.round(device.now.warmth * 100) : '?',
        next: device.nextPoint ? device.nextPoint.at : '?',
      }));
      if (device.overridden) {
        meta.appendChild(separator());
        meta.appendChild(document.createTextNode(
          t('circadianOverridden', { count: device.overridden }),
        ));
      }
      el.appendChild(meta);

      el.appendChild(node('p', 'entry-sub', t('controls', {
        names: (device.targetNames || []).join(', ') || t('noLights'),
      })));
      if (device.preStageDisabled) {
        el.appendChild(node('p', 'entry-sub', t('circadianPreStageOff')));
      }
      el.appendChild(node('p', 'entry-sub', t('scheduleClock', {
        local: device.localTime || '?', zone: device.timezone || '?',
      })));

      list.appendChild(el);
    });
  }

  function showMsg(cls, text) {
    var el = document.getElementById('credMsg');
    el.className = 'msg ' + cls;
    el.textContent = text;
    el.style.display = 'block';
  }

  function onHomeyReady(Homey) {
    HomeyRef = Homey;
    Homey.ready();
    refresh().catch(function (e) { showMsg('broken', e.message); });

    document.getElementById('save').addEventListener('click', function () {
      var key = document.getElementById('key').value.trim();
      if (!key) return showMsg('broken', Homey.__('credential.pasteFirst'));
      showMsg('partial', Homey.__('credential.checking'));
      api('POST', '/credential', { token: key }).then(function (status) {
        if (status.valid) {
          showMsg('ready', Homey.__('credential.accepted'));
          document.getElementById('key').value = '';
        } else {
          showMsg('broken', failureText(status));
        }
        return refresh();
      }).catch(function (e) { showMsg('broken', e.message); });
    });

    document.getElementById('clear').addEventListener('click', function () {
      api('DELETE', '/credential').then(function () {
        showMsg('partial', t('keyRemoved'));
        return refresh();
      }).catch(function (e) { showMsg('broken', e.message); });
    });

    // The exact set the user was last SHOWN, handed back when they click.
    // The app refuses a delete whose approval no longer matches what it can
    // see now: a count is not consent, a specific list is.
    var approvedSweep = null;

    function refreshOrphans() {
      return api('GET', '/orphans').then(function (info) {
        var text = document.getElementById('orphanText');
        var button = document.getElementById('sweep');
        approvedSweep = null;

        // With no controller running, EVERY managed Flow looks orphaned. The
        // count is meaningless in that state, so say so and hide the button
        // rather than offering a delete the API would refuse anyway.
        if (info.refused) {
          text.textContent = t('sweepRefused', { total: info.total });
          button.style.display = 'none';
          return;
        }

        // Flows that call a Lightkeeper card but were not built by this app.
        // Mentioned so the totals add up on screen — they are never deleted.
        var aside = info.unmanaged
          ? ' ' + t('sweepUnmanaged', { unmanaged: info.unmanaged })
          : '';

        if (info.orphans === 0) {
          text.textContent = t('noneOrphaned', { total: info.total }) + aside;
          button.style.display = 'none';
          return;
        }

        approvedSweep = { token: info.token, flowIds: info.flowIds };

        text.textContent = t('orphansFound', {
          orphans: info.orphans,
          total: info.total,
          live: info.liveControllers,
        }) + aside;
        button.style.display = 'inline-block';
        button.textContent = t('deleteOrphans', { count: info.orphans });
      }).catch(function (e) {
        document.getElementById('orphanText').textContent = t('checkFailed', { message: e.message });
      });
    }
    refreshOrphans();

    document.getElementById('sweep').addEventListener('click', function () {
      var button = document.getElementById('sweep');
      var msg = document.getElementById('sweepMsg');
      button.disabled = true;
      msg.className = 'msg partial';
      msg.textContent = t('sweeping');
      msg.style.display = 'block';

      api('POST', '/orphans', approvedSweep || {}).then(function (result) {
        if (result.refused === 'stale_preview') {
          // Something changed between the count and the click. Nothing was
          // deleted; refreshOrphans() below re-reads and re-arms the approval.
          msg.className = 'msg partial';
          msg.textContent = t('sweepStale');
        } else if (result.refused) {
          msg.className = 'msg partial';
          msg.textContent = t('sweepRefused', { total: result.kept });
        } else {
          msg.className = 'msg ready';
          msg.textContent = result.failed
            ? t('sweptWithFailures', {
              deleted: result.deleted, kept: result.kept, failed: result.failed,
            })
            : t('swept', { deleted: result.deleted, kept: result.kept });
        }
        button.disabled = false;
        return refreshOrphans();
      }).catch(function (e) {
        msg.className = 'msg broken';
        msg.textContent = t('requestFailed');
        button.disabled = false;
      });
    });

    document.getElementById('diag').addEventListener('click', function () {
      api('GET', '/diagnostics').then(function (data) {
        var out = document.getElementById('out');
        out.style.display = 'block';
        out.textContent = JSON.stringify(data, null, 2);
      }).catch(function (e) { showMsg('broken', e.message); });
    });

    /**
     * navigator.clipboard is blocked by permissions policy inside the settings
     * iframe, and Blob downloads are blocked too. execCommand('copy') on a real
     * selection still works, and showing the text is the guaranteed fallback.
     */
    function copyText(text) {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:absolute;left:-9999px;top:0;';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);

      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      return ok;
    }

    document.getElementById('download').addEventListener('click', function () {
      var button = document.getElementById('download');
      api('GET', '/diagnostics').then(function (data) {
        var text = JSON.stringify(data, null, 2);
        var out = document.getElementById('out');
        out.style.display = 'block';
        out.textContent = text;

        if (copyText(text)) {
          button.textContent = t('copied');
        } else {
          // Select it so one keystroke finishes the job.
          var range = document.createRange();
          range.selectNodeContents(out);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          button.textContent = t('selectToCopy');
        }
        setTimeout(function () { button.textContent = t('downloadDiagnostics'); }, 4000);
      }).catch(function (e) {
        showMsg('broken', e.message);
      });
    });
  }
</script>

</body>
</html>
