<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="A hooded form with three strokes across it">
  <!--
    Supplied as artwork, 16 September 2026, and shipped as given. Six strokes: a
    dome-topped form with two folds inside it, and three parallel diagonals
    across its lower right.

    Two things a later editor should know rather than rediscover.

    It was delivered carrying a C2PA manifest in a <metadata> element - about
    8 KB of base64, larger than every other master in this folder combined.
    That is STRIPPED here rather than in the export, because build_icon() copies
    inner markup through verbatim and Homey fetches an icon by MD5 to use as an
    alpha mask: provenance metadata inside one is weight that nothing can read.
    The provenance lives in artwork/provenance.md, which is where this folder
    keeps it for every other master too.

    And it is the one icon in the set that does not depict what its device type
    does - the reservation, and the 24px reading that prompted it, are recorded
    under "The hood mark" in artwork/provenance.md. Recorded, not re-argued.

    Stroke 7.8 of 512, on the group so the export's substitution finds it -
    ICONS['stroke'] in export-assets.py must mirror this number.
  -->
  <g stroke-width="7.8">
    <path d="M257.0 314.0 L178.4 337.7 L178.4 207.4 A 61.3 56.4 0 0 1 301.1 207.4 L301.1 249.9"/>
    <path d="M219.6 154.4 C218.9 189.2 207.1 235.9 178.4 259.9"/>
    <path d="M242.1 151.3 C241.3 198.0 224.9 253.8 178.4 278.7"/>
    <path d="M261.3 228.5 L333.6 300.8"/>
    <path d="M255.4 257.5 L331.5 333.6"/>
    <path d="M250.6 287.9 L323.7 360.9"/>
  </g>
</svg>
