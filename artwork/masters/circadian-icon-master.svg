<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="A rayed sun on the horizon">
  <!--
    A sun on the horizon, which is what this device is about: the colour of the
    day, from sunrise to sunset. Two drawings came before it and neither said so.
    The first hung a bulb and a daylight arc inside a rounded-square frame with a
    five-stroke sunrise at each foot — seventeen strokes, and a smudge at the 24px
    the App Store draws a driver icon into (platform §10). The second dropped the
    frame and the sunrises and kept the bulb under the arc, which read at 24px
    and meant nothing: a bulb under an arch.

    Three rays, not eight. At 24px a ray is about four pixels long, and eight of
    them close into a halo — the same density fault as the frame, one scale down.
    They run from 185 to 255 units of a 150-unit sun so they are unmistakably
    rays and not a second outline.

    The half-disc sits ON the horizon rather than above it, because a sun clear of
    the line is just a circle over a rule, and the curve icon is already a line
    over a rule.
  -->
  <g stroke-width="5.5">
    <path d="M60 380 L452 380"/>
    <path d="M106 380 A 150 150 0 0 1 406 380"/>
  </g>
  <g stroke-width="5.5">
    <path d="M256 195 L256 125"/>
    <path d="M125.2 249.2 L75.7 199.7"/>
    <path d="M386.8 249.2 L436.3 199.7"/>
  </g>
</svg>
