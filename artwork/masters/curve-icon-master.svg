<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="A three-point curve above a baseline">
  <!--
    Five strokes, down from thirteen. The rounded-square frame and the row of
    seven hour ticks both went: at the 24px the App Store draws a driver icon
    into, the frame was the only thing you could see and the ticks were a grey
    band. What is left says curve — a baseline, a rise and fall, and the points
    you set. See scripts/render-icons.mjs.
  -->
  <g stroke-width="5.5">
    <path d="M80 330 C150 330 170 110 256 110 C342 110 362 260 432 260"/>
    <path d="M62 430 L450 430"/>
  </g>
  <g stroke-width="5.5">
    <circle cx="80" cy="330" r="30"/>
    <circle cx="256" cy="110" r="30"/>
    <circle cx="432" cy="260" r="30"/>
  </g>
</svg>
