<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <title>Light schedule</title>
  <desc>A clock dial with a wedge of the day marked out in amber.</desc>

  <!-- Same construction rules as the controller icon: a solid navy body, amber
       for the one thing that distinguishes the device, and nothing that stops
       being legible at the ~40 px Homey actually renders.

       The first version drew a clock above a bulb. At thumbnail size two shapes
       of equal weight read as two unrelated blobs, and the bulb — the part every
       other lighting app also draws — won the attention. So the mark is the dial
       alone, and the amber wedge is the stretch of the day the lights are on:
       the one thing this device does that the controller does not.

       Unlike the controller, this driver ships its mark rather than a product
       photograph, because there is no product. A schedule is not a device you can
       hold, and photographing a stand-in lamp would say the wrong thing. -->
  <circle cx="480" cy="480" r="330" fill="#1F3A5F"/>

  <!-- Inset inside the rim, so a navy ring survives all the way round: a wedge
       drawn to the full radius reads as a pie chart rather than as a dial. -->
  <path d="M480 480 L480 180 A300 300 0 0 1 630 740 Z" fill="#F2A93B"/>

  <!-- The hub. Two shapes meeting at a point read as a fan; a hub reads as hands. -->
  <circle cx="480" cy="480" r="46" fill="#1F3A5F"/>
</svg>
