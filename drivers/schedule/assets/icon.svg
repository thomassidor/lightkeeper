<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <title>Light schedule</title>
  <desc>A clock face showing ten past four.</desc>

  <!-- Delivered as a CSS mask painted with a theme colour, fetched from Athom's
       icon CDN by this file's MD5 — see ../../../assets/icon.svg for the whole
       mechanism, including why a CLI-installed app correctly shows no icon at
       all and why colour inside an icon is discarded. -->

  <!-- Line art, for the reasons recorded in ../../../assets/icon.svg.

       Two earlier attempts died on the contact sheet, both at 32 px:

       - A filled navy dial with an amber wedge for the on-stretch of the day.
         Fills are out (guideline 1.5/1.6), and rendered white the wedge and the
         dial became one shape.
       - The same idea in outline: an inner arc from twelve round to half past
         four. The arc closed against the two hands and the whole mark read as a
         leaf. A variant with the arc pushed outside the rim read as a wifi
         indicator instead.

       So the mark is a plain clock, which says "time" with nothing to
       misinterpret, and is unmistakably not the controller's remote beside it in
       the add-device list. The hands point at ten past four rather than twelve
       o'clock: an asymmetric time reads as a clock, where twelve reads as a
       plus sign. -->
  <g stroke="#000" fill="none" fill-rule="evenodd" stroke-width="40"
     stroke-linejoin="round" stroke-linecap="round">
    <circle cx="480" cy="480" r="360"/>
    <path d="M480 480 L480 215"/>
    <path d="M480 480 L672 620"/>
  </g>
</svg>
