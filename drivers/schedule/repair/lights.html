<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #lt-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #lt-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #lt-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #lt-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #lt-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #lt-root .section { margin-bottom: 18px; }
  #lt-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #lt-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #lt-root .tile:hover { border-color: var(--lk-hover); }
  #lt-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #lt-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #lt-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #lt-root input[type=text], #lt-root input[type=password], #lt-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #lt-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #lt-root input:focus, #lt-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #lt-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #lt-root .btn:hover { border-color: var(--lk-hover); }
  #lt-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #lt-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #lt-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #lt-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #lt-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #lt-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #lt-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #lt-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #lt-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #lt-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #lt-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #lt-root .grid { grid-template-columns: 1fr; } }
  #lt-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #lt-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #lt-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  #lt-root .steps i.on { background: var(--lk-accent); }
  #lt-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened. */
  #lt-root .row { display: flex; align-items: center; gap: 11px; width: 100%;
               padding: 13px 14px; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #lt-root .row + .row { border-top: 1px solid var(--lk-line); }
  #lt-root .row .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #lt-root .row .value { font-size: 13px; color: var(--lk-muted); text-align: right; }
  #lt-root .row .chev { flex: none; font-size: 15px; color: var(--lk-muted); }
  #lt-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }

  /* The pill switch behind every "Set … too". */
  #lt-root .toggle { display: flex; align-items: center; gap: 11px; width: 100%;
                  padding: 12px 0; min-height: 44px; box-sizing: border-box;
                  background: none; border: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #lt-root .toggle .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #lt-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #lt-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #lt-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #lt-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #lt-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #lt-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #lt-root .slider.warm { background: var(--lk-warm-ramp); }
  #lt-root .slider.bright { background: var(--lk-bright-ramp); }
  #lt-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  #lt-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-muted); margin: 9px 0 0; }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #lt-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 8px; margin: 10px 0; }
  #lt-root .swatch { height: 44px; border-radius: 9px; padding: 0;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  #lt-root .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--lk-surface),
                                                   0 0 0 4px var(--lk-accent); }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #lt-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #lt-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #lt-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #lt-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-ring);
                       box-shadow: var(--lk-handle-shadow); }
  #lt-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #lt-root .clockline { display: flex; justify-content: space-between;
                     font-size: 12px; color: var(--lk-muted); margin-top: 6px; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  #lt-root .search { display: flex; align-items: center; background: var(--lk-flat-bg);
                     border-radius: 11px; padding: 11px 13px; margin-bottom: 14px;
                     min-height: 44px; box-sizing: border-box; }
  #lt-root .search input { border: none; background: none; padding: 0; font-size: 14.5px; }
  #lt-root .search input:focus { outline: none; box-shadow: none; }

  /* An OPEN room: its header, then one row per light. */
  #lt-root .room { background: var(--lk-surface); border: 1px solid var(--lk-line);
                   border-radius: 14px; box-shadow: var(--lk-shadow);
                   overflow: hidden; margin-bottom: 14px; }
  #lt-root .room-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
                        background: var(--lk-raised); border-bottom: 1px solid var(--lk-line);
                        min-height: 44px; box-sizing: border-box; }
  #lt-root .room-head .name { flex: 1; font-size: 13.5px; font-weight: 600; }
  #lt-root .room-head .count { font-size: 12.5px; color: var(--lk-muted); }
  #lt-root .room-head .all { font-size: 13px; font-weight: 600; color: var(--lk-accent-strong);
                             background: none; border: none; padding: 0 0 0 4px;
                             font-family: inherit; cursor: pointer; }
  #lt-root .lights { padding: 0 14px; }

  #lt-root .light { display: flex; align-items: center; gap: 12px; width: 100%;
                    padding: 12px 0; min-height: 44px; box-sizing: border-box;
                    background: none; border: none; border-bottom: 1px solid var(--lk-line);
                    font: inherit; color: inherit; text-align: left; cursor: pointer; }
  #lt-root .light:last-child { border-bottom: none; }
  #lt-root .light .box { flex: none; width: 22px; height: 22px; border-radius: 6px;
                         border: 1.5px solid var(--lk-field); box-sizing: border-box;
                         display: flex; align-items: center; justify-content: center;
                         font-size: 13px; font-weight: 700; color: transparent; }
  #lt-root .light[aria-pressed="true"] .box { background: var(--lk-accent);
                                              border-color: var(--lk-accent);
                                              color: var(--lk-accent-ink); }
  #lt-root .light .text { flex: 1; }
  #lt-root .light .name { font-size: 14.5px; font-weight: 500; }
  #lt-root .light .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 2px; }

  /* The rooms nobody has opened: one tappable line each, with a count. */
  #lt-root .folded { background: var(--lk-surface); border: 1px solid var(--lk-line);
                     border-radius: 14px; box-shadow: var(--lk-shadow);
                     overflow: hidden; margin-bottom: 16px; }

  #lt-root .count-line { font-size: 13px; color: var(--lk-muted); margin: 0 2px 14px; }
</style>

<div class="wrap" id="lt-root">
  <div class="steps" id="lt-steps"></div>
  <h2 data-i18n="lights.title"></h2>
  <!-- One shared file serves all five drivers, so the line that says WHICH
       lights these are has to come from the driver rather than from the markup. -->
  <p class="sub" id="lt-sub" style="display:none;"></p>

  <div id="lt-loadError" class="msg bad" style="display:none;"></div>

  <div id="lt-picker">
    <div class="search">
      <input type="text" id="lt-search" autocomplete="off" />
    </div>
    <div id="lt-open"></div>
    <div class="folded" id="lt-folded"></div>
    <div class="count-line" id="lt-count"></div>
  </div>

  <!--
    The empty state is a STATE of this screen rather than a file of its own.
    It is the one screen in the flow allowed two sentences, because the user's
    model is wrong here: they expect Lightkeeper to FIND lights, and it does not
    — it borrows Homey's.
  -->
  <div id="lt-empty" style="display:none;">
    <div class="msg muted" data-i18n="lights.emptyBody"></div>
    <div class="card" style="padding:0;margin-top:14px;">
      <button class="row" id="lt-again" type="button">
        <span class="label" data-i18n="lights.lookAgain"></span>
        <span class="chev">&rsaquo;</span>
      </button>
    </div>
  </div>

  <button class="btn-primary" id="lt-next" data-i18n="lights.next"></button>
</div>

<script type="text/javascript">
/**
 * Pair views are INJECTED INTO the pairing container's document — they do not
 * get their own iframe, and they must not load homey.js themselves (a second
 * copy overwrites window.Homey with a base object that has no emit/showView).
 *
 * All views of a session share ONE document. That is why every CSS rule here is
 * scoped to this view's root id, and why the boot guard below lives on the root
 * ELEMENT rather than in a global.
 *
 * **This file is shared by all five drivers** (platform §8): Homey will not
 * follow a reference, so `npm run sync:views` copies it from here into every
 * driver that declares it. Anything driver-specific therefore has to arrive in
 * the payload — the subtitle, the step count, and which view comes next.
 */
function __lkBootLt(Homey) {
  var __root = document.getElementById('lt-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var el = {
    steps: document.getElementById('lt-steps'),
    sub: document.getElementById('lt-sub'),
    loadError: document.getElementById('lt-loadError'),
    picker: document.getElementById('lt-picker'),
    search: document.getElementById('lt-search'),
    open: document.getElementById('lt-open'),
    folded: document.getElementById('lt-folded'),
    count: document.getElementById('lt-count'),
    empty: document.getElementById('lt-empty'),
    again: document.getElementById('lt-again'),
    next: document.getElementById('lt-next')
  };

  var state = {
    rooms: [],
    selected: {},
    /** Rooms the user has opened, plus any that arrived with a selection. */
    opened: {},
    query: '',
    nextView: null,
    support: null
  };

  function t(key) { return Homey.__(key); }

  /**
   * Which spec the current ticks amount to.
   *
   * The one piece of judgement on this screen. Ticking every light in exactly
   * one room stores a ZONE target, so a lamp added to that room next month is
   * picked up without anybody re-pairing. Anything else is a plain device list.
   * Unticking one light converts it back, which is invisible here on purpose —
   * the review screen is where it is stated.
   */
  function spec() {
    var ids = Object.keys(state.selected).filter(function (id) { return state.selected[id]; });
    var whole = null;
    var partial = false;

    for (var i = 0; i < state.rooms.length; i++) {
      var room = state.rooms[i];
      var picked = 0;
      for (var j = 0; j < room.lights.length; j++) {
        if (state.selected[room.lights[j].id]) picked += 1;
      }
      if (picked === 0) continue;
      if (picked === room.lights.length && room.lights.length > 0) {
        if (whole) partial = true;
        whole = room;
      } else {
        partial = true;
      }
    }

    if (whole && !partial) {
      return { kind: 'zone', zoneId: whole.zoneId, includeSubzones: false };
    }
    return { kind: 'devices', deviceIds: ids };
  }

  function selectedCount() {
    return Object.keys(state.selected).filter(function (id) { return state.selected[id]; }).length;
  }

  function matches(light) {
    if (!state.query) return true;
    return light.name.toLowerCase().indexOf(state.query) !== -1;
  }

  function capabilityLabel(light) {
    var caps = light.capabilities || [];
    if (caps.indexOf('light_hue') !== -1) return t('lights.capColour');
    if (caps.indexOf('light_temperature') !== -1) return t('lights.capTemperature');
    if (caps.indexOf('dim') !== -1) return t('lights.capBrightness');
    return t('lights.capOnOff');
  }

  function renderRoom(room) {
    var card = node('div', 'room');
    var head = node('div', 'room-head');
    head.appendChild(node('span', 'name', room.zoneName));

    var picked = 0;
    for (var i = 0; i < room.lights.length; i++) {
      if (state.selected[room.lights[i].id]) picked += 1;
    }
    head.appendChild(node('span', 'count', Homey.__('lights.roomCount', {
      picked: picked, total: room.lights.length
    })));

    var all = node('button', 'all', picked === room.lights.length
      ? t('lights.selectNone') : t('lights.selectAll'));
    all.type = 'button';
    all.addEventListener('click', function () {
      var turnOn = picked !== room.lights.length;
      for (var j = 0; j < room.lights.length; j++) {
        state.selected[room.lights[j].id] = turnOn;
      }
      push();
    });
    head.appendChild(all);
    card.appendChild(head);

    var list = node('div', 'lights');
    var shown = 0;
    for (var k = 0; k < room.lights.length; k++) {
      var light = room.lights[k];
      if (!matches(light)) continue;
      shown += 1;
      list.appendChild(renderLight(light));
    }
    if (shown === 0) return null;
    card.appendChild(list);
    return card;
  }

  function renderLight(light) {
    var row = node('button', 'light');
    row.type = 'button';
    row.setAttribute('aria-pressed', state.selected[light.id] ? 'true' : 'false');

    var box = node('div', 'box', '✓');
    row.appendChild(box);

    var text = node('div', 'text');
    text.appendChild(node('div', 'name', light.name));
    var meta = capabilityLabel(light);
    if (light.available === false) meta = t('lights.unavailable');
    else if (light.isLight === false) meta = meta + ' · ' + t('lights.notALight');
    text.appendChild(node('div', 'meta', meta));
    row.appendChild(text);

    row.addEventListener('click', function () {
      state.selected[light.id] = !state.selected[light.id];
      push();
    });
    return row;
  }

  function render() {
    clear(el.open);
    clear(el.folded);

    var openRooms = [];
    var foldedRooms = [];
    for (var i = 0; i < state.rooms.length; i++) {
      var room = state.rooms[i];
      var hasPick = false;
      for (var j = 0; j < room.lights.length; j++) {
        if (state.selected[room.lights[j].id]) { hasPick = true; break; }
      }
      // Searching opens everything that matches: a folded room that contains the
      // light somebody just typed the name of is a search that did nothing.
      if (state.opened[room.zoneId] || hasPick || state.query) openRooms.push(room);
      else foldedRooms.push(room);
    }

    for (var a = 0; a < openRooms.length; a++) {
      var card = renderRoom(openRooms[a]);
      if (card) el.open.appendChild(card);
    }

    for (var b = 0; b < foldedRooms.length; b++) {
      el.folded.appendChild(renderFolded(foldedRooms[b]));
    }
    el.folded.style.display = foldedRooms.length > 0 ? '' : 'none';

    var count = selectedCount();
    el.count.textContent = count === 0
      ? t('lights.noneChosen')
      : Homey.__('lights.chosen', { count: count });
    el.next.disabled = count === 0;
  }

  function renderFolded(room) {
    var row = node('button', 'row');
    row.type = 'button';
    row.appendChild(node('span', 'label', room.zoneName));
    row.appendChild(node('span', 'value', String(room.lights.length)));
    row.addEventListener('click', function () {
      state.opened[room.zoneId] = true;
      render();
    });
    return row;
  }

  /**
   * Every tick pushes the whole selection, guarded by a revision.
   *
   * The driver validates membership against the live catalogue and answers with
   * the capability summary, so a reply that arrives after a later tap would
   * describe a selection the user has already changed.
   */
  var revision = 0;
  function push() {
    render();
    var mine = ++revision;
    emit('selectTargets', spec()).then(function (summary) {
      if (mine !== revision) return;
      state.support = summary && summary.support ? summary.support : null;
    }).catch(function (err) {
      if (mine !== revision) return;
      show(err);
    });
  }

  function show(err) {
    el.loadError.textContent = err && err.message ? err.message : String(err);
    el.loadError.style.display = '';
  }

  function renderSteps(payload) {
    clear(el.steps);
    var total = payload.stepCount || 0;
    if (!total) { el.steps.style.display = 'none'; return; }
    for (var i = 1; i <= total; i++) {
      var dot = node('i', i <= payload.stepIndex ? 'on' : null);
      el.steps.appendChild(dot);
    }
    el.steps.appendChild(node('span', null,
      Homey.__('lights.step', { index: payload.stepIndex, count: total })));
  }

  el.search.addEventListener('input', function () {
    state.query = el.search.value.trim().toLowerCase();
    render();
  });

  el.again.addEventListener('click', function () { load(); });

  el.next.addEventListener('click', function () {
    if (state.nextView) Homey.showView(state.nextView);
  });

  function load() {
    emit('listTargets').then(function (payload) {
      el.loadError.style.display = 'none';
      state.rooms = payload.rooms || [];
      state.nextView = payload.nextView || null;
      state.selected = {};
      state.opened = {};

      var current = payload.current;
      for (var i = 0; i < state.rooms.length; i++) {
        var room = state.rooms[i];
        for (var j = 0; j < room.lights.length; j++) {
          var light = room.lights[j];
          // A repair session arrives with the device's own lights already
          // chosen, whichever of the two shapes it stored them as.
          if (light.selected) state.selected[light.id] = true;
          else if (current && current.kind === 'zone' && current.zoneId === room.zoneId) {
            state.selected[light.id] = true;
          }
        }
      }

      if (payload.subtitle) {
        el.sub.textContent = payload.subtitle;
        el.sub.style.display = '';
      }
      el.search.placeholder = Homey.__('lights.search', { count: payload.total || 0 });
      renderSteps(payload);

      var any = state.rooms.length > 0;
      el.picker.style.display = any ? '' : 'none';
      el.next.style.display = any ? '' : 'none';
      el.empty.style.display = any ? 'none' : '';

      if (any) push();
    }).catch(show);
  }

  load();
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootLt(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('lt-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootLt(ready || window.Homey); };
  waitForHomey();
})();
</script>
