<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     That also means these ~110 lines cannot be de-duplicated into a stylesheet
     — there is nowhere to put one. So the duplication is made safe instead:
     test/unit/pair-view-styles.test.ts compares every copy with the root
     id normalised and fails on any difference. Edit this block in all
     files, or in none of them.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #sch-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #sch-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #sch-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #sch-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #sch-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #sch-root .section { margin-bottom: 18px; }
  #sch-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #sch-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #sch-root .tile:hover { border-color: var(--lk-hover); }
  #sch-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #sch-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #sch-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #sch-root input[type=text], #sch-root input[type=password], #sch-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #sch-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #sch-root input:focus, #sch-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #sch-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #sch-root .btn:hover { border-color: var(--lk-hover); }
  #sch-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #sch-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #sch-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #sch-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #sch-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #sch-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #sch-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }

  #sch-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #sch-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #sch-root .grid { grid-template-columns: 1fr; } }
  #sch-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ==== end shared base ==== */

  #sch-root .rowhead { display: flex; align-items: baseline; justify-content: space-between;
                  margin-bottom: 12px; }
  #sch-root .rowhead .name { font-size: 15px; font-weight: 600; }
  #sch-root .link { background: none; border: none; padding: 4px 0; font-family: inherit;
               font-size: 13px; color: var(--lk-muted); cursor: pointer; }
  #sch-root .link:hover { color: var(--lk-ink); }

  #sch-root .field { margin-bottom: 14px; }
  #sch-root .label { font-size: 12px; font-weight: 600; text-transform: uppercase;
                letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 6px 2px; }

  /* Hour and minute as two selects rather than <input type="time">: the pairing
     webview renders the native picker differently on every platform it runs on,
     and one of those renderings is a 13px field with no touch target. */
  #sch-root .times { display: flex; align-items: center; gap: 6px; }
  #sch-root .times select { width: auto; flex: 1 1 0; min-width: 0; }
  #sch-root .times .sep { font-size: 15px; color: var(--lk-muted); flex: none; }
  #sch-root .times .unit { font-size: 13px; color: var(--lk-muted); flex: none; }

  #sch-root .tabs { display: flex; gap: 6px; margin-bottom: 10px; background: var(--lk-flat-bg);
              padding: 4px; border-radius: 12px; }
  #sch-root .tab { flex: 1; text-align: center; padding: 9px; border-radius: 9px;
             font-size: 13.5px; cursor: pointer; color: var(--lk-flat-ink); }
  #sch-root .tab.on { background: var(--lk-surface); color: var(--lk-ink); font-weight: 600;
                box-shadow: var(--lk-shadow); }

  #sch-root .days { display: flex; gap: 5px; }
  #sch-root .day { flex: 1; text-align: center; padding: 11px 0; border-radius: 10px;
              border: 1.5px solid var(--lk-line); background: var(--lk-surface);
              color: var(--lk-muted); font-size: 12.5px; cursor: pointer; min-height: 44px;
              box-sizing: border-box; font-family: inherit; }
  #sch-root .day.on { border-color: var(--lk-accent); background: var(--lk-accent-tint);
                 color: var(--lk-ink); font-weight: 600; }

  #sch-root .window { font-size: 13px; color: var(--lk-sub); margin-top: 8px; }

  /* `text-transform: none` is not decoration. The pairing container's own
     stylesheet styles bare `label`, and text-transform is one of the few
     properties we never declared — so Homey's `uppercase` won and an option
     read in full caps on a real Homey while every local render showed sentence
     case. The span inside inherits from the label, so stating it here fixes
     both. */
  #sch-root .check { display: flex; align-items: center; gap: 10px; min-height: 44px;
               font-size: 14px; color: var(--lk-body); cursor: pointer;
               text-transform: none; letter-spacing: normal; }
  #sch-root .check input { width: 22px; height: 22px; margin: 0; flex: none;
                      accent-color: var(--lk-accent); cursor: pointer; }

  #sch-root .slider { display: flex; align-items: center; gap: 10px; }
  #sch-root .slider input[type=range] { flex: 1; min-width: 0; accent-color: var(--lk-accent);
                                   height: 28px; }
  #sch-root .slider .value { font-size: 13px; color: var(--lk-sub); flex: none;
                        min-width: 62px; text-align: right; }

  #sch-root .acts { display: flex; gap: 7px; }
  #sch-root .acts .btn { flex: 1; }
  #sch-root .result { font-size: 13px; color: var(--lk-sub); margin-top: 8px; }
  #sch-root .add { width: 100%; }
  /* ==== shared daylight card: identical in every view that carries it ====
     The daylight response is ONE configuration per device, and four of the five
     device types can hold one — a Daylight light, a schedule, a circadian light
     and a Curve light. So this card is four copies of the same screen furniture,
     for the same reason the base above is: all views of a session share one
     document, there is nowhere to put a stylesheet, and Homey will not follow a
     reference.

     Made safe the same way, too: test/unit/pair-view-styles.test.ts slices this
     block out of every view that has it, normalises the root id, and fails on
     any difference. Edit it in all of them, or in none.

     EVERY class is `dl-`prefixed and defined HERE, even where the host view has
     something identical of its own. That is deliberate: the card lands in four
     different stylesheets whose `.help` and `.field` differ in their margins,
     and one of the four defined none of them at all — so a card that borrowed
     them rendered unstyled on that screen and slightly wrong on two others.
     Owning its own furniture is what makes the card the same thing everywhere.

     Every colour is a token from the base. A literal here is a token that is
     missing. */
  #sch-root .dl-card { display: block; }
  #sch-root .dl-card.dl-off { display: none; }

  #sch-root .dl-field { margin-bottom: 14px; }
  #sch-root .dl-field:last-child { margin-bottom: 0; }
  #sch-root .dl-label { font-size: 12px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 6px 2px; }
  #sch-root .dl-help { font-size: 12.5px; line-height: 1.5; color: var(--lk-muted);
                 margin: 2px 0 10px 2px; }
  #sch-root .dl-blocktitle { font-size: 15px; font-weight: 600; color: var(--lk-ink); }
  #sch-root .dl-blockhelp { font-size: 12.5px; line-height: 1.5; color: var(--lk-muted);
                      margin: 4px 0 12px; }
  #sch-root .dl-slider { display: flex; align-items: center; gap: 10px; }
  #sch-root .dl-slider input[type=range] { flex: 1; min-width: 0; accent-color: var(--lk-accent);
                                     height: 28px; }
  #sch-root .dl-value { font-size: 13px; color: var(--lk-sub); flex: none;
                  min-width: 62px; text-align: right; }
  #sch-root .dl-acts { display: flex; gap: 7px; }
  #sch-root .dl-acts .btn { flex: 1; }
  #sch-root .dl-result { font-size: 13px; color: var(--lk-sub); margin-top: 8px; }

  /* The live readout, which sits ABOVE the controls it explains: two numbers
     labelled "dark" and "bright" cannot be chosen without knowing what the room
     currently reads. */
  #sch-root .dl-reading { display: flex; align-items: baseline; justify-content: space-between;
                    gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--lk-line); }
  #sch-root .dl-reading:last-child { border-bottom: none; padding-bottom: 0; }
  #sch-root .dl-reading .dl-what { font-size: 13.5px; color: var(--lk-body); }
  #sch-root .dl-reading .dl-val { font-size: 13.5px; font-weight: 600; color: var(--lk-ink);
                            flex: none; text-align: right; }
  /* An unknown reading is deliberately NOT styled as an error: a Homey with no
     light sensor is the normal case, and the sun answers for it. */
  #sch-root .dl-reading .dl-val.dl-unknown { font-weight: 500; color: var(--lk-muted); }

  /* The lux range: two numbers side by side, because they are one setting. */
  #sch-root .dl-lux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #sch-root .dl-lux input[type=number] { width: 100%; box-sizing: border-box; padding: 12px 13px;
                                   font-size: 15px; border: 1.5px solid var(--lk-field);
                                   border-radius: 11px; background: var(--lk-surface);
                                   color: var(--lk-ink); font-family: inherit;
                                   -webkit-appearance: none; appearance: none; }
  #sch-root .dl-lux input[type=number]:focus { outline: none; border-color: var(--lk-accent);
                                         box-shadow: 0 0 0 3px var(--lk-ring); }

  /* A sensor row carries its current reading, which is what makes the lux range
     above choosable rather than a guess. */
  #sch-root .dl-tile-lux { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; }
  /* ==== end shared daylight card ==== */
</style>

<div class="wrap" id="sch-root">
  <h2 data-i18n="schedule.title"></h2>
  <p class="sub" data-i18n="schedule.subtitle"></p>

  <div id="sch-list"></div>

  <!-- ==== shared daylight card ====
       Byte-identical markup in every view that carries it, for the reason its
       CSS block gives. `dl-off` until something references the response, because
       a screen that already has twelve windows on it should not also carry a
       sensor picker nobody asked for. -->
  <div class="section dl-card dl-off" id="dl-card">
    <div class="section-title" data-i18n="daylight.nowTitle"></div>
    <div class="card" id="dl-now"></div>

    <div class="section-title" data-i18n="daylight.sensorsTitle"></div>
    <p class="dl-help" data-i18n="daylight.sensorsHelp"></p>
    <div id="dl-sensors"></div>

    <div class="section-title" data-i18n="daylight.rangeTitle"></div>
    <div class="card">
      <p class="dl-help" data-i18n="daylight.rangeHelp"></p>
      <div class="dl-lux">
        <div class="dl-field">
          <div class="dl-label" data-i18n="daylight.luxDark"></div>
          <input type="number" id="dl-dark-lux" min="0" step="1" inputmode="numeric">
        </div>
        <div class="dl-field">
          <div class="dl-label" data-i18n="daylight.luxBright"></div>
          <input type="number" id="dl-bright-lux" min="0" step="1" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="section-title" data-i18n="daylight.endsTitle"></div>
    <div class="card">
      <p class="dl-help" data-i18n="daylight.endsHelp"></p>
      <div class="dl-field">
        <div class="dl-label" data-i18n="daylight.endDark"></div>
        <div class="dl-slider">
          <input type="range" id="dl-dark" min="10" max="100" step="5">
          <span class="dl-value" id="dl-dark-value"></span>
        </div>
      </div>
      <div class="dl-field">
        <div class="dl-label" data-i18n="daylight.endBright"></div>
        <div class="dl-slider">
          <input type="range" id="dl-bright" min="10" max="100" step="5">
          <span class="dl-value" id="dl-bright-value"></span>
        </div>
      </div>
    </div>

    <!-- Standalone only: on the other three drivers the surrounding screen owns
         the footer, and two Test buttons doing different things is worse than
         either. -->
    <div class="card" id="dl-preview-card" hidden>
      <div class="dl-blocktitle" data-i18n="daylight.previewTitle"></div>
      <div class="dl-blockhelp" data-i18n="daylight.previewHelp"></div>
      <div class="dl-acts">
        <button class="btn" id="dl-preview" data-i18n="daylight.preview"></button>
      </div>
      <div class="dl-result" id="dl-preview-result"></div>
    </div>
  </div>
  <!-- ==== end shared daylight card ==== -->

  <button class="btn add" id="sch-add">Add another schedule</button>

  <div class="msg muted" id="sch-summary"></div>
  <div class="msg" id="sch-msg" style="display:none;"></div>

  <button id="sch-save" class="btn-primary">Save</button>
</div>

<script type="text/javascript">
/**
 * Pair views are INJECTED INTO the pairing container's document — they do not
 * get their own iframe, and they must not load homey.js themselves (a second
 * copy overwrites window.Homey with a base object that has no emit/showView).
 *
 * The container calls window.onHomeyReady once, at its own page load, long
 * before this view's script exists, so waiting to be called never fires. The
 * container's fully-equipped Homey is already on window by the time this runs,
 * so take it directly — while still accepting onHomeyReady if it does arrive.
 *
 * All views of a session share ONE document. That is why every CSS rule here is
 * scoped to this view's root id, and why the boot guard below lives on the root
 * ELEMENT rather than in a global.
 */
/**
 * The guard lives on the view's root ELEMENT, not in a global. All views
 * share one document, and a global flag survives leaving and re-entering the
 * pairing flow — which silently blocked the second run from ever rendering.
 * A freshly injected root has no marker, so each injection boots exactly once.
 */
function __lkBootSch(Homey) {
  var __root = document.getElementById('sch-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  /**
   * Reserve room for the scrollbar so expanding a section cannot resize the
   * content.
   *
   * When the view grows past the pane height a scrollbar appears, the usable
   * width drops by its thickness, and every percentage-width row re-wraps —
   * text shifts as you expand and collapse. `scrollbar-gutter: stable` keeps
   * the gutter reserved whether or not the bar is showing.
   *
   * The scrolling element belongs to the pairing container, not to us, so find
   * it by walking up rather than guessing a selector.
   */
  (function stabiliseScrollbar() {
    var scroller = null;
    for (var el = __root.parentElement; el && el !== document.documentElement; el = el.parentElement) {
      var overflowY = getComputedStyle(el).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') { scroller = el; break; }
    }
    var targets = scroller ? [scroller] : [document.documentElement, document.body];
    var supported = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');

    targets.forEach(function (el) {
      if (!el) return;
      if (supported) el.style.scrollbarGutter = 'stable';
      // Without gutter support, always showing the track is the stable option.
      else if (el !== document.body) el.style.overflowY = 'scroll';
    });
  })();

  if (typeof Homey.ready === 'function') Homey.ready();

  /**
   * Homey.emit, as a promise that always settles.
   *
   * Both call styles are handled because the pairing bridge has used a callback
   * and a promise at different times, and the 20 s timeout is what keeps a
   * dropped callback from leaving the screen spinning with no message forever.
   *
   * Identical in every pair view, and it has to be: these files cannot import
   * anything. It carried the timeout in the mapping view only until
   * pair-view-styles.test.ts started comparing the copies.
   */
  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
    el.placeholder = Homey.__(el.getAttribute('data-i18n-placeholder'));
  });

  var MINUTES_PER_DAY = 1440;
  var DAY_KEYS = ['schedule.mon', 'schedule.tue', 'schedule.wed', 'schedule.thu',
                  'schedule.fri', 'schedule.sat', 'schedule.sun'];

  var model = { entries: [], support: { dim: 0, light_temperature: 0 }, maxEntries: 12 };
  var listEl = document.getElementById('sch-list');
  var msgEl = document.getElementById('sch-msg');

  function show(cls, text) {
    msgEl.className = 'msg ' + cls;
    msgEl.textContent = text;
    msgEl.style.display = 'block';
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
    return el;
  }

  function escapeHtml(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /**
   * The daylight card: ONE configuration per device, on four different screens.
   *
   * A Daylight light's whole plan IS a daylight response, and a schedule, a
   * circadian light and a Curve light may each carry one for the rows that
   * follow it. That is four copies of the same sensor picker, the same lux range,
   * the same two ends and the same live readout — so it is written once here and
   * copied byte-for-byte, exactly as the shared CSS base above is, and for the
   * same reason: all views of a session share ONE document, there is nowhere to
   * put a module, and Homey will not follow a reference.
   *
   * `test/unit/pair-view-styles.test.ts` asserts this function identical across
   * every view that has it. Edit it in all of them, or in none.
   *
   * It takes NO arguments and closes over the four things every view already
   * has: `Homey`, `emit`, `node` and `clear`. That is what lets the body be
   * identical while the surrounding screen is not.
   *
   * It is self-contained on the wire too: it calls `getDaylight`, `listSensors`
   * and `setDaylight` itself, and all four drivers answer those three. The host
   * screen therefore does not have to thread a response through its own reply,
   * and the card can refresh its own readout without asking the screen first.
   */
  /**
   * The daylight card: ONE configuration per device, on four different screens.
   *
   * A Daylight light's whole plan IS a daylight response, and a schedule, a
   * circadian light and a Curve light may each carry one for the rows that
   * follow it. That is four copies of the same sensor picker, the same lux range,
   * the same two ends and the same live readout — so it is written once here and
   * copied byte-for-byte, exactly as the shared CSS base above is, and for the
   * same reason: all views of a session share ONE document, there is nowhere to
   * put a module, and Homey will not follow a reference.
   *
   * `test/unit/pair-view-styles.test.ts` asserts this function identical across
   * every view that has it. Edit it in all of them, or in none.
   *
   * It takes NO arguments and closes over the four things every view already
   * has: `Homey`, `emit`, `node` and `clear`. That is what lets the body be
   * identical while the surrounding screen is not.
   *
   * It is self-contained on the wire too: it calls `getDaylight`, `listSensors`
   * and `setDaylight` itself, and all four drivers answer those three. The host
   * screen therefore does not have to thread a response through its own reply,
   * and the card can refresh its own readout without asking the screen first.
   */
  function daylightCard() {
    /**
     * Every key this card can render, written out as a LITERAL.
     *
     * Not assembled from a prefix. `Homey.__` is given whatever string it is
     * given, so `'daylight.' + key` works at runtime and is invisible to
     * test/unit/locales.test.ts — which finds keys by scanning the source for
     * quoted `group.key` literals, in BOTH directions. A key referenced only by
     * assembly reads as defined-but-never-rendered; one removed from en.json
     * reads as nothing at all, and the screen would ship showing a raw key.
     */
    var KEYS = {
      nowSky: 'daylight.nowSky',
      nowSkyValue: 'daylight.nowSkyValue',
      nowSkyUnknown: 'daylight.nowSkyUnknown',
      nowSensors: 'daylight.nowSensors',
      nowNoSensors: 'daylight.nowNoSensors',
      nowResult: 'daylight.nowResult',
      nowResultValue: 'daylight.nowResultValue',
      nowUnknown: 'daylight.nowUnknown',
      sourceSensors: 'daylight.sourceSensors',
      sourceSky: 'daylight.sourceSky',
      sensorsNone: 'daylight.sensorsNone',
      sensorsNoneHelp: 'daylight.sensorsNoneHelp',
      sensorLux: 'daylight.sensorLux',
      sensorReading: 'daylight.sensorReading',
      sensorNoReading: 'daylight.sensorNoReading',
      sensorUnavailable: 'daylight.sensorUnavailable',
      ageNow: 'daylight.ageNow',
      ageMinutes: 'daylight.ageMinutes',
      ageHours: 'daylight.ageHours',
      percent: 'daylight.percent',
      preview: 'daylight.preview',
      previewing: 'daylight.previewing',
      previewed: 'daylight.previewed'
    };

    function t(key, tokens) {
      return Homey.__(KEYS[key], tokens || {});
    }

    var el = {
      card: document.getElementById('dl-card'),
      now: document.getElementById('dl-now'),
      sensors: document.getElementById('dl-sensors'),
      darkLux: document.getElementById('dl-dark-lux'),
      brightLux: document.getElementById('dl-bright-lux'),
      dark: document.getElementById('dl-dark'),
      bright: document.getElementById('dl-bright'),
      darkValue: document.getElementById('dl-dark-value'),
      brightValue: document.getElementById('dl-bright-value'),
      previewCard: document.getElementById('dl-preview-card'),
      preview: document.getElementById('dl-preview'),
      previewResult: document.getElementById('dl-preview-result')
    };

    var model = {
      standalone: false,
      response: { sensors: [], darkLux: 5, brightLux: 500, dark: 0.9, bright: 0.25 },
      limits: { minLux: 0.1, maxLux: 100000 },
      now: null,
      sky: null,
      readings: [],
      rooms: [],
      loaded: false
    };

    function percentOf(value) {
      return Math.round(Number(value) * 100);
    }

    /**
     * How long ago a reading arrived, in words.
     *
     * A reading is never treated as stale — many Zigbee sensors report only on
     * change, so a quiet sensor in a stable room is telling the truth — which
     * leaves its AGE as the only thing on screen that can reveal one that has
     * simply stopped.
     */
    function ageText(at) {
      if (at === null || at === undefined) return '';
      var minutes = Math.floor((Date.now() - Number(at)) / 60000);
      if (!isFinite(minutes) || minutes < 1) return t('ageNow');
      if (minutes < 60) return t('ageMinutes', { minutes: String(minutes) });
      return t('ageHours', { hours: String(Math.floor(minutes / 60)) });
    }

    function reading(what, value, unknown) {
      var row = node('div', 'dl-reading');
      row.appendChild(node('span', 'dl-what', what));
      row.appendChild(node('span', unknown ? 'dl-val dl-unknown' : 'dl-val', value));
      return row;
    }

    function readingFor(deviceId) {
      for (var i = 0; i < model.readings.length; i++) {
        if (model.readings[i].deviceId === deviceId) return model.readings[i];
      }
      return null;
    }

    function renderNow() {
      clear(el.now);

      var sky = model.sky || {};
      if (sky.elevation === null || sky.elevation === undefined) {
        el.now.appendChild(reading(t('nowSky'), t('nowSkyUnknown'), true));
      } else {
        el.now.appendChild(reading(t('nowSky'), t('nowSkyValue', {
          degrees: String(Math.round(Number(sky.elevation)))
        }), false));
      }

      var chosen = model.response.sensors || [];
      if (chosen.length === 0) {
        el.now.appendChild(reading(t('nowSensors'), t('nowNoSensors'), true));
      } else {
        for (var i = 0; i < chosen.length; i++) {
          var found = readingFor(chosen[i]);
          var name = found && found.name ? found.name : chosen[i];
          if (!found || !found.available || found.lux === null || found.lux === undefined) {
            el.now.appendChild(reading(name, t('sensorNoReading'), true));
          } else {
            el.now.appendChild(reading(name, t('sensorReading', {
              lux: String(Math.round(Number(found.lux))), age: ageText(found.at)
            }), false));
          }
        }
      }

      if (!model.now || model.now.source === 'none') {
        el.now.appendChild(reading(t('nowResult'), t('nowUnknown'), true));
        return;
      }
      el.now.appendChild(reading(t('nowResult'), t('nowResultValue', {
        percent: String(percentOf(model.now.brightness)),
        source: model.now.source === 'sensors' ? t('sourceSensors') : t('sourceSky')
      }), false));
    }

    /**
     * The sensor list, grouped by room, each row carrying its current reading.
     *
     * Built as NODES rather than as a markup string, so nothing here needs
     * escaping — a device name is user-supplied text and this is the safest
     * shape for it.
     *
     * The empty state is not an error. Most households own no light sensor at
     * all, and the sun answers for them perfectly well, so it says so.
     */
    function renderSensors() {
      clear(el.sensors);

      if (model.rooms.length === 0) {
        var none = node('div', 'card');
        none.appendChild(node('div', 'dl-blocktitle', t('sensorsNone')));
        none.appendChild(node('div', 'dl-blockhelp', t('sensorsNoneHelp')));
        el.sensors.appendChild(none);
        return;
      }

      var chosen = model.response.sensors || [];
      for (var r = 0; r < model.rooms.length; r++) {
        var room = model.rooms[r];
        el.sensors.appendChild(node('div', 'section-title', room.zoneName));
        for (var s = 0; s < room.sensors.length; s++) {
          var sensor = room.sensors[s];
          var tile = node('button', chosen.indexOf(sensor.id) !== -1 ? 'tile sel' : 'tile');
          tile.type = 'button';
          tile.dataset.sensor = sensor.id;
          tile.appendChild(node('div', 'name', sensor.name));
          if (!sensor.available) {
            tile.appendChild(node('div', 'dl-tile-lux', t('sensorUnavailable')));
          } else if (sensor.lux === null || sensor.lux === undefined) {
            tile.appendChild(node('div', 'dl-tile-lux', t('sensorNoReading')));
          } else {
            tile.appendChild(node('div', 'dl-tile-lux', t('sensorLux', {
              lux: String(Math.round(Number(sensor.lux)))
            })));
          }
          el.sensors.appendChild(tile);
        }
      }
    }

    function renderControls() {
      el.darkLux.value = String(model.response.darkLux);
      el.brightLux.value = String(model.response.brightLux);
      el.dark.value = String(percentOf(model.response.dark));
      el.bright.value = String(percentOf(model.response.bright));
      el.darkValue.textContent = t('percent', { value: String(percentOf(model.response.dark)) });
      el.brightValue.textContent = t('percent', { value: String(percentOf(model.response.bright)) });
      el.previewCard.hidden = !model.standalone;
    }

    function render() {
      if (!model.loaded) return;
      renderNow();
      renderSensors();
      renderControls();
    }

    function payload() {
      return {
        sensors: (model.response.sensors || []).slice(),
        darkLux: Number(el.darkLux.value),
        brightLux: Number(el.brightLux.value),
        dark: Number(el.dark.value) / 100,
        bright: Number(el.bright.value) / 100
      };
    }

    /**
     * Push, and take back what the driver made of it.
     *
     * The reply is authoritative rather than an acknowledgement:
     * `sanitiseResponse` corrects per field — an inverted lux range resets both
     * ends, a brightness under the floor comes up to it — and a card that went
     * on showing what the user typed would be a card saving something different
     * from what it says.
     */
    function push() {
      return emit('setDaylight', { response: payload() }).then(function (result) {
        model.response = result.response;
        model.now = result.now;
        model.readings = result.sensorReadings || [];
        render();
        return result;
      });
    }

    /**
     * A push whose failure must not be swallowed by the caller's happy path.
     *
     * Every fire-and-forget site needs its own catch: an unhandled rejection
     * inside the pairing container is a screen that silently stops responding.
     */
    function pushQuietly() {
      push().catch(function (err) {
        el.previewResult.textContent = String(err && err.message ? err.message : err);
      });
    }

    el.sensors.addEventListener('click', function (event) {
      var tile = event.target && event.target.closest ? event.target.closest('.tile') : null;
      if (!tile || !tile.dataset.sensor) return;

      var id = tile.dataset.sensor;
      var chosen = (model.response.sensors || []).slice();
      var at = chosen.indexOf(id);
      if (at === -1) chosen.push(id);
      else chosen.splice(at, 1);
      model.response.sensors = chosen;

      // Rendered before the round trip so the tap feels immediate, and again
      // from the reply, which is the authority.
      render();
      pushQuietly();
    });

    el.dark.addEventListener('input', function () {
      el.darkValue.textContent = t('percent', { value: String(el.dark.value) });
    });
    el.bright.addEventListener('input', function () {
      el.brightValue.textContent = t('percent', { value: String(el.bright.value) });
    });

    // `change` rather than `input` for the push: a slider dragged across its
    // range fires input for every pixel, and each one is a round trip.
    el.dark.addEventListener('change', pushQuietly);
    el.bright.addEventListener('change', pushQuietly);
    el.darkLux.addEventListener('change', pushQuietly);
    el.brightLux.addEventListener('change', pushQuietly);

    el.preview.addEventListener('click', function () {
      el.preview.disabled = true;
      el.preview.textContent = t('previewing');
      el.previewResult.textContent = '';

      push().then(function () {
        return emit('previewNow');
      }).then(function (outcome) {
        el.previewResult.textContent = t('previewed', {
          writes: String((outcome && outcome.writes) || 0)
        });
      }).catch(function (err) {
        el.previewResult.textContent = String(err && err.message ? err.message : err);
      }).then(function () {
        el.preview.disabled = false;
        el.preview.textContent = t('preview');
      });
    });

    return {
      /** Fetch everything this card needs. Two calls, because two handlers. */
      load: function () {
        return Promise.all([emit('getDaylight'), emit('listSensors')]).then(function (replies) {
          var data = replies[0] || {};
          var sensors = replies[1] || {};

          model.standalone = data.standalone === true;
          if (data.response) model.response = data.response;
          if (data.limits) model.limits = data.limits;
          model.now = data.now || null;
          model.sky = data.sky || null;
          model.readings = data.sensorReadings || [];
          model.rooms = sensors.rooms || [];
          model.loaded = true;

          // Bounded by what the driver will actually accept, so a number the
          // sanitiser would clamp cannot be typed in the first place.
          el.darkLux.min = String(model.limits.minLux);
          el.darkLux.max = String(model.limits.maxLux);
          el.brightLux.min = String(model.limits.minLux);
          el.brightLux.max = String(model.limits.maxLux);

          render();
          return data;
        });
      },
      /** Whether this device's own plan IS the response. */
      isStandalone: function () {
        return model.standalone;
      },
      /**
       * Show or hide the card.
       *
       * The host screen decides: a Daylight light always shows it, and the other
       * three show it only once a row actually follows the daylight. A schedule
       * screen that already carries twelve windows should not also carry a
       * sensor picker nobody asked for.
       */
      setUsed: function (used) {
        el.card.className = used ? 'section dl-card' : 'section dl-card dl-off';
      },
      /** Push the current controls, for a host screen saving its own plan. */
      push: push
    };
  }

  function pad(value) { return (value < 10 ? '0' : '') + value; }
  function formatMinutes(minutes) {
    var wrapped = ((Math.round(minutes) % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY;
    return pad(Math.floor(wrapped / 60)) + ':' + pad(wrapped % 60);
  }

  /** Mirrors lib/schedules/schedule-window.ts. The app re-derives it anyway. */
  function offMinuteOf(entry) {
    if (entry.end.kind === 'time') return entry.end.at;
    return (entry.onAt + entry.end.minutes) % MINUTES_PER_DAY;
  }
  function windowLength(entry) {
    if (entry.end.kind === 'duration') return entry.end.minutes;
    var length = (entry.end.at - entry.onAt + MINUTES_PER_DAY) % MINUTES_PER_DAY;
    return length === 0 ? MINUTES_PER_DAY : length;
  }

  function newEntry() {
    // 22:00 for two hours, every day: a defensible evening default that is
    // never an accidentally valid 00:00.
    return { id: 's' + Date.now() + Math.round(Math.random() * 1000),
             onAt: 22 * 60, days: [1, 2, 3, 4, 5, 6, 7], end: { kind: 'duration', minutes: 120 } };
  }

  function options(count, selected, step, labeller) {
    var values = [];
    for (var value = 0; value < count; value += (step || 1)) values.push(value);
    // A plan edited elsewhere can hold a minute this step does not land on — 22:37
    // with a five-minute step. Showing 00 selected while the plan says 37 is the
    // kind of quiet disagreement this app exists to avoid, so the odd value joins
    // the list rather than being rounded behind the user's back.
    if (values.indexOf(selected) === -1 && selected >= 0 && selected < count) {
      values.push(selected);
      values.sort(function (a, b) { return a - b; });
    }
    return values.map(function (value) {
      return '<option value="' + value + '"' + (value === selected ? ' selected' : '') + '>'
        + escapeHtml(labeller ? labeller(value) : pad(value)) + '</option>';
    }).join('');
  }

  function timeSelects(entry, hourAct, minuteAct, minutes) {
    return '<div class="times">'
      + '<select data-act="' + hourAct + '">' + options(24, Math.floor(minutes / 60)) + '</select>'
      + '<span class="sep">:</span>'
      + '<select data-act="' + minuteAct + '">' + options(60, minutes % 60, 5) + '</select>'
      + '</div>';
  }

  function durationSelects(entry) {
    var total = entry.end.kind === 'duration' ? entry.end.minutes : 120;
    return '<div class="times">'
      + '<select data-act="durHours">' + options(24, Math.floor(total / 60), 1, function (v) { return String(v); }) + '</select>'
      + '<span class="unit">' + escapeHtml(Homey.__('schedule.hoursUnit')) + '</span>'
      + '<select data-act="durMinutes">' + options(60, total % 60, 5, function (v) { return String(v); }) + '</select>'
      + '<span class="unit">' + escapeHtml(Homey.__('schedule.minutesUnit')) + '</span>'
      + '</div>';
  }

  function windowText(entry) {
    var off = offMinuteOf(entry);
    var crosses = entry.onAt + windowLength(entry) >= MINUTES_PER_DAY;
    return Homey.__(crosses ? 'schedule.windowNextDay' : 'schedule.window',
      { on: formatMinutes(entry.onAt), off: formatMinutes(off) });
  }

  function brightnessText(entry) {
    return Homey.__('schedule.percent', { percent: Math.round((entry.brightness || 0) * 100) });
  }
  /**
   * Named steps rather than a percentage: nobody measures warmth in percent, and
   * a number here contradicted the handle's position at least half the time.
   *
   * HIGHER IS WARMER. The axis is normalised 0-1 and 1 is the warm end — that is
   * homey-lib's own capability hint ("A higher value means a warmer color"), and
   * this view had it backwards on the first hardware run: a schedule set to
   * "Warmest" wrote 0 and lit the room cold white.
   */
  function temperatureText(entry) {
    var value = entry.temperature === undefined ? 0.8 : entry.temperature;
    if (value >= 0.9) return Homey.__('schedule.warmthWarmest');
    if (value >= 0.65) return Homey.__('schedule.warmthWarm');
    if (value >= 0.35) return Homey.__('schedule.warmthNeutral');
    if (value >= 0.1) return Homey.__('schedule.warmthCool');
    return Homey.__('schedule.warmthCoolest');
  }

  function entryHtml(entry, index) {
    var isDuration = entry.end.kind === 'duration';
    var offMinutes = entry.end.kind === 'time' ? entry.end.at : offMinuteOf(entry);

    var html = '<div class="card" data-id="' + escapeHtml(entry.id) + '">'
      + '<div class="rowhead"><div class="name">'
      + escapeHtml(Homey.__('schedule.number', { number: index + 1 }))
      + '</div><button class="link" data-act="remove">'
      + escapeHtml(Homey.__('schedule.remove')) + '</button></div>'

      + '<div class="field"><div class="label">'
      + escapeHtml(Homey.__('schedule.onAt')) + '</div>'
      + timeSelects(entry, 'onHour', 'onMinute', entry.onAt) + '</div>'

      + '<div class="field"><div class="label">'
      + escapeHtml(Homey.__('schedule.offLabel')) + '</div>'
      + '<div class="tabs">'
      + '<div class="tab' + (isDuration ? ' on' : '') + '" data-act="endKind" data-kind="duration">'
      + escapeHtml(Homey.__('schedule.afterDuration')) + '</div>'
      + '<div class="tab' + (isDuration ? '' : ' on') + '" data-act="endKind" data-kind="time">'
      + escapeHtml(Homey.__('schedule.atTime')) + '</div>'
      + '</div>'
      + (isDuration ? durationSelects(entry) : timeSelects(entry, 'offHour', 'offMinute', offMinutes))
      + '<div class="window" data-role="window">' + escapeHtml(windowText(entry)) + '</div>'
      + '</div>'

      + '<div class="field"><div class="label">'
      + escapeHtml(Homey.__('schedule.days')) + '</div><div class="days">';

    for (var day = 1; day <= 7; day += 1) {
      var on = entry.days.indexOf(day) !== -1;
      html += '<button class="day' + (on ? ' on' : '') + '" data-act="day" data-day="' + day + '">'
        + escapeHtml(Homey.__(DAY_KEYS[day - 1])) + '</button>';
    }
    html += '</div></div>';

    if (model.support.dim > 0) {
      html += '<div class="field">'
        + '<label class="check"><input type="checkbox" data-act="useBrightness"'
        + (entry.brightness !== undefined ? ' checked' : '') + ' /> <span>'
        + escapeHtml(Homey.__('schedule.setBrightness')) + '</span></label>'
        // BEFORE the slider, not after it: the slider's meaning depends on the
        // mode — fixed value or fallback — so a mode underneath it is a mode
        // read second. The two ends screen puts it in the same place.
        + windowDaylightChoice(entry)
        + '<div class="slider" data-role="brightnessSlider"'
        + (entry.brightness === undefined ? ' style="display:none;"' : '') + '>'
        + '<input type="range" min="10" max="100" step="5" data-act="brightness" value="'
        + Math.round((entry.brightness === undefined ? 0.6 : entry.brightness) * 100) + '" />'
        + '<span class="value" data-role="brightnessValue">' + escapeHtml(brightnessText(entry))
        + '</span></div>'
        + '</div>';
    }

    if (model.support.light_temperature > 0) {
      html += '<div class="field">'
        + '<label class="check"><input type="checkbox" data-act="useTemperature"'
        + (entry.temperature !== undefined ? ' checked' : '') + ' /> <span>'
        + escapeHtml(Homey.__('schedule.setWarmth')) + '</span></label>'
        + '<div class="slider" data-role="temperatureSlider"'
        + (entry.temperature === undefined ? ' style="display:none;"' : '') + '>'
        + '<input type="range" min="0" max="100" step="5" data-act="temperature" value="'
        // Defaults warm, because a schedule that sets warmth at all is usually an
        // evening one. The handle sits to the right, which is the warm end.
        + Math.round((entry.temperature === undefined ? 0.8 : entry.temperature) * 100) + '" />'
        + '<span class="value" data-role="temperatureValue">' + escapeHtml(temperatureText(entry))
        + '</span></div></div>';
    }

    html += '<div class="acts">'
      + '<button class="btn" data-act="testOn">' + escapeHtml(Homey.__('schedule.testOn')) + '</button>'
      + '<button class="btn" data-act="testOff">' + escapeHtml(Homey.__('schedule.testOff')) + '</button>'
      + '</div><div class="result" data-role="result"></div>';

    return html + '</div>';
  }

  /**
   * The shared daylight card, as a SECTION of this screen rather than a screen.
   *
   * Named `dlCard` rather than `card` because this view already uses `card` for
   * a window's own row in `entryOf`, and shadowing that would be a bug nobody
   * would see until the second window failed to update.
   */
  var dlCard = daylightCard();

  /**
   * "Set a brightness" or "Follow the daylight", for one window, as MARKUP.
   *
   * Markup rather than a node because this view builds its rows as strings — see
   * entryHtml — and every interpolated value goes through escapeHtml for exactly
   * that reason. The two option values are literals rather than user-supplied,
   * so only the labels need it.
   *
   * A window is the one case where following the daylight comes with a caveat
   * worth printing on the screen: a schedule fires AT a time, so it samples the
   * daylight once at its boundary and does not follow it afterwards. Somebody
   * who wanted following wants a Daylight light, and had better be told here
   * rather than after a fortnight of evenings.
   */
  function windowDaylightChoice(entry) {
    var following = entry.fromDaylight === true;
    return '<select data-act="daylight" data-role="daylightChoice"'
      + (entry.brightness === undefined ? ' style="display:none;"' : '') + '>'
      + '<option value="fixed"' + (following ? '' : ' selected') + '>'
      + escapeHtml(Homey.__('daylight.modeFixed')) + '</option>'
      + '<option value="daylight"' + (following ? ' selected' : '') + '>'
      + escapeHtml(Homey.__('daylight.modeDaylight')) + '</option>'
      + '</select>'
      + '<p class="help" data-role="daylightNote"'
      + (following && entry.brightness !== undefined ? '' : ' style="display:none;"') + '>'
      + escapeHtml(Homey.__('daylight.atBoundaryHelp')) + '</p>';
  }

  /** Whether any window follows the daylight, which is what shows the card. */
  function anyFollowsDaylight() {
    for (var i = 0; i < model.entries.length; i += 1) {
      var entry = model.entries[i];
      if (entry.brightness !== undefined && entry.fromDaylight === true) return true;
    }
    return false;
  }

  function summary() {
    document.getElementById('sch-summary').textContent = Homey.__('schedule.summary', {
      count: model.entries.length,
      flows: model.entries.length * 2,
    });
    document.getElementById('sch-add').disabled = model.entries.length >= model.maxEntries;
  }

  function render() {
    listEl.innerHTML = model.entries.map(entryHtml).join('');
    summary();
    // The card is a section of this screen and only earns its space once a
    // window actually follows the daylight — a screen that already carries
    // twelve windows should not also carry a sensor picker nobody asked for.
    dlCard.setUsed(anyFollowsDaylight());
  }

  function entryOf(element) {
    var card = element.closest('.card');
    if (!card) return null;
    var id = card.getAttribute('data-id');
    for (var i = 0; i < model.entries.length; i += 1) {
      if (model.entries[i].id === id) return { entry: model.entries[i], card: card };
    }
    return null;
  }

  /**
   * Values change in place; only structure re-renders. Re-rendering the whole
   * list on a slider drag would drop the pointer capture mid-gesture, which
   * reads as a slider that fights you.
   */
  function refreshDerived(found) {
    var window_ = found.card.querySelector('[data-role="window"]');
    if (window_) window_.textContent = windowText(found.entry);
  }

  /**
   * Show the boundary caveat only where it applies, in place.
   *
   * In place rather than through a re-render for the same reason the sliders
   * update in place: re-rendering the list mid-interaction drops the dropdown's
   * own focus. The card's visibility is recomputed here too, because that is one
   * class on one element rather than the whole list.
   */
  function syncDaylightNote(found) {
    var note = found.card.querySelector('[data-role="daylightNote"]');
    if (note) {
      note.style.display = found.entry.fromDaylight === true
        && found.entry.brightness !== undefined ? '' : 'none';
    }
    dlCard.setUsed(anyFollowsDaylight());
  }

  listEl.addEventListener('click', function (event) {
    var target = event.target.closest('[data-act]');
    if (!target) return;
    var act = target.getAttribute('data-act');
    var found = entryOf(target);
    if (!found) return;

    if (act === 'remove') {
      model.entries = model.entries.filter(function (e) { return e.id !== found.entry.id; });
      render();
      return;
    }

    if (act === 'day') {
      var day = Number(target.getAttribute('data-day'));
      var index = found.entry.days.indexOf(day);
      // Never allow an empty day set: a schedule with no days is a row that
      // looks configured and can never fire.
      if (index === -1) found.entry.days.push(day);
      else if (found.entry.days.length > 1) found.entry.days.splice(index, 1);
      found.entry.days.sort(function (a, b) { return a - b; });
      target.className = 'day' + (found.entry.days.indexOf(day) !== -1 ? ' on' : '');
      return;
    }

    if (act === 'endKind') {
      var kind = target.getAttribute('data-kind');
      if (kind === found.entry.end.kind) return;
      found.entry.end = kind === 'duration'
        ? { kind: 'duration', minutes: Math.max(5, windowLength(found.entry)) }
        : { kind: 'time', at: offMinuteOf(found.entry) };
      render();
      return;
    }

    if (act === 'testOn' || act === 'testOff') {
      runTest(found, act === 'testOn' ? 'on' : 'off', target);
    }
  });

  listEl.addEventListener('change', function (event) {
    var target = event.target.closest('[data-act]');
    if (!target) return;
    var found = entryOf(target);
    if (!found) return;
    var act = target.getAttribute('data-act');
    var value = Number(target.value);

    if (act === 'onHour') found.entry.onAt = value * 60 + (found.entry.onAt % 60);
    else if (act === 'onMinute') found.entry.onAt = Math.floor(found.entry.onAt / 60) * 60 + value;
    else if (act === 'offHour') found.entry.end = { kind: 'time', at: value * 60 + (found.entry.end.at % 60) };
    else if (act === 'offMinute') found.entry.end = { kind: 'time', at: Math.floor(found.entry.end.at / 60) * 60 + value };
    else if (act === 'durHours' || act === 'durMinutes') {
      var hours = Number(found.card.querySelector('[data-act="durHours"]').value);
      var minutes = Number(found.card.querySelector('[data-act="durMinutes"]').value);
      // A zero-length window cannot be what anyone meant, and the app would
      // drop the row on save — so it is corrected here, visibly.
      found.entry.end = { kind: 'duration', minutes: Math.max(5, hours * 60 + minutes) };
    } else if (act === 'useBrightness') {
      var slider = found.card.querySelector('[data-role="brightnessSlider"]');
      var choice = found.card.querySelector('[data-role="daylightChoice"]');
      if (target.checked) {
        found.entry.brightness = Number(slider.querySelector('input').value) / 100;
        slider.style.display = '';
        if (choice) choice.style.display = '';
      } else {
        // The flag goes with the brightness, because that brightness IS the
        // fallback — the sanitiser drops it server-side for the same reason, and
        // a row that kept it would show a mode for a control that is not there.
        delete found.entry.brightness;
        delete found.entry.fromDaylight;
        slider.style.display = 'none';
        if (choice) choice.style.display = 'none';
      }
      syncDaylightNote(found);
      found.card.querySelector('[data-role="brightnessValue"]').textContent = brightnessText(found.entry);
    } else if (act === 'daylight') {
      if (target.value === 'daylight') found.entry.fromDaylight = true;
      else delete found.entry.fromDaylight;
      syncDaylightNote(found);
    } else if (act === 'useTemperature') {
      var tempSlider = found.card.querySelector('[data-role="temperatureSlider"]');
      if (target.checked) {
        found.entry.temperature = Number(tempSlider.querySelector('input').value) / 100;
        tempSlider.style.display = '';
      } else {
        delete found.entry.temperature;
        tempSlider.style.display = 'none';
      }
      found.card.querySelector('[data-role="temperatureValue"]').textContent = temperatureText(found.entry);
    }

    refreshDerived(found);
  });

  listEl.addEventListener('input', function (event) {
    var target = event.target.closest('[data-act]');
    if (!target) return;
    var found = entryOf(target);
    if (!found) return;
    var act = target.getAttribute('data-act');

    if (act === 'brightness') {
      found.entry.brightness = Number(target.value) / 100;
      found.card.querySelector('[data-role="brightnessValue"]').textContent = brightnessText(found.entry);
    } else if (act === 'temperature') {
      found.entry.temperature = Number(target.value) / 100;
      found.card.querySelector('[data-role="temperatureValue"]').textContent = temperatureText(found.entry);
    }
  });

  /**
   * Test drives the real lights before anything is saved, so the schedules have
   * to reach the driver first — the ephemeral runtime is built from what the
   * driver holds, not from what the screen holds.
   */
  function runTest(found, boundary, button) {
    var result = found.card.querySelector('[data-role="result"]');
    button.disabled = true;
    result.textContent = Homey.__('schedule.testing');

    emit('setSchedules', model.entries)
      .then(function () { return emit('test', { entryId: found.entry.id, boundary: boundary }); })
      .then(function (outcome) {
        result.textContent = Homey.__('schedule.tested', {
          writes: outcome.writes, targets: outcome.targets,
        });
      })
      .catch(function (err) { result.textContent = err.message || String(err); })
      .then(function () { button.disabled = false; });
  }

  document.getElementById('sch-add').addEventListener('click', function () {
    if (model.entries.length >= model.maxEntries) {
      return show('bad', Homey.__('schedule.atMost', { max: model.maxEntries }));
    }
    model.entries.push(newEntry());
    render();
  });

  document.getElementById('sch-save').addEventListener('click', function () {
    var button = document.getElementById('sch-save');
    if (model.entries.length === 0) return show('bad', Homey.__('schedule.needOne'));

    button.disabled = true;
    show('muted', Homey.__('schedule.saving'));

    emit('setSchedules', model.entries)
      .then(function (result) {
        if (result.dropped && result.dropped.length > 0) {
          // Named rather than silently corrected: the user is looking at the row.
          //
          // An overlap gets its own sentence because it is the one drop reason
          // where the row itself looks complete — two windows over the same
          // lights fight, and "check the times" would read as a typo hunt.
          var overlapping = result.dropped.filter(function (drop) {
            return String(drop.reason || '').indexOf('overlaps') === 0;
          });
          throw new Error(overlapping.length > 0
            ? Homey.__('schedule.droppedOverlap', { count: overlapping.length })
            : Homey.__('schedule.droppedSome', { count: result.dropped.length }));
        }
        return emit('save', '');
      })
      .then(function (result) {
        if (!result.created) { Homey.done(); return; }
        // createDevice alone does NOT add the device — the view must also emit
        // 'add_device' with the device data.
        return Homey.createDevice(result.device)
          .then(function (deviceData) {
            return emit('add_device', deviceData || result.device)
              .catch(function () { /* some SDK builds add it for us */ });
          })
          .then(function () { Homey.done(); });
      })
      .catch(function (err) {
        button.disabled = false;
        show('bad', err.message || String(err));
      });
  });

  document.getElementById('sch-add').textContent = Homey.__('schedule.add') || 'Add another schedule';
  document.getElementById('sch-save').textContent = Homey.__('schedule.save') || 'Save';

  emit('getSchedule').then(function (data) {
    model.support = data.support || model.support;
    model.maxEntries = data.maxEntries || model.maxEntries;
    model.entries = (data.entries || []).map(function (entry) {
      // Stored days are null for "every day"; the chips are always explicit.
      return {
        id: entry.id,
        onAt: entry.onAt,
        days: entry.days === null || entry.days === undefined ? [1, 2, 3, 4, 5, 6, 7] : entry.days,
        end: entry.end,
        brightness: entry.brightness,
        // Absent stays absent: the plan's shape is "fixed, or following", and
        // `false` would be a third state for the sanitiser to interpret.
        ...(entry.fromDaylight === true ? { fromDaylight: true } : {}),
        temperature: entry.temperature,
      };
    });

    // Pairing starts with one row already open: an empty screen with an "add"
    // button makes the user do a step the app could have done for them.
    if (model.entries.length === 0) model.entries.push(newEntry());
    render();

    if (data.timezone) {
      show('muted', Homey.__('schedule.timezone', { zone: data.timezone }));
    }

    /**
     * The daylight card loads itself, AFTER the windows are on screen.
     *
     * Its own two round trips rather than fields threaded through `getSchedule`,
     * which is what lets the card be byte-identical on four screens. Chained
     * rather than parallel so the windows never wait on a sensor list, and it
     * re-renders after: `setUsed` is decided by the windows, and the card's own
     * `load` does not know about them.
     */
    return dlCard.load().then(render);
  }).catch(function (err) {
    show('bad', err.message || String(err));
  });

}

window.onHomeyReady = __lkBootSch;

(function waitForHomey(attempt) {
  if (window.Homey && typeof window.Homey.emit === 'function') return __lkBootSch(window.Homey);
  if ((attempt || 0) > 100) {
    // The one literal-colour exception in this file, and the reason the style
    // test only inspects <style>: this banner has to render when nothing else
    // in the view has booted, tokens included.
    document.body.insertAdjacentHTML('afterbegin', '<div style="padding:12px;background:#fdeceb;color:#8f1d18;font-size:13px;">'
      + 'Lightkeeper could not reach Homey from this screen. Close it and try again.</div>');
    return;
  }
  setTimeout(function () { waitForHomey((attempt || 0) + 1); }, 50);
})(0);
</script>
