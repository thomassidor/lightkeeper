<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     That also means these ~110 lines cannot be de-duplicated into a stylesheet
     — there is nowhere to put one. So the duplication is made safe instead:
     test/unit/pair-view-styles.test.ts compares every copy with the root
     id normalised and fails on any difference. Edit this block in all
     files, or in none of them.

     Colours are tokens so that the dark scheme below restates values only,
     never rules. A colour written as a literal anywhere past this block is a
     token that is missing. */
  #tg-root {
    /* Brand. The violet is the manifest brandColor and the ground of the logo —
       93% of its pixels — and the lavender is the logo's mark. Both are read
       out of docs/artwork/masters/logo-bitmap-original.png by
       `export-assets.py --palette`, so the UI cannot drift from the artwork.
       The tints and lines are derived: the logo itself has no mid-tones. */
    --lk-accent: #180e32;
    --lk-accent-ink: #ffffff;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #2b1a52;
    --lk-ring: rgba(24, 14, 50, .16);

    --lk-ink: #16181d;
    --lk-sub: #6b7280;
    --lk-body: #4b5563;
    --lk-muted: #8b929e;
    --lk-faint: #9aa1ac;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it in light mode would flatten every card against it. The
       dark scheme does claim it, because a white card on a dark container is
       the one combination that reads as broken rather than merely plain. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* Values only. Note the accent inverts: #180e32 is nearly black and cannot
     carry white text on a dark ground, so dark mode promotes the logo's own
     lavender to the accent and darkens the ink on top of it. */
  @media (prefers-color-scheme: dark) {
    #tg-root {
      --lk-accent: #ccb0f3;
      --lk-accent-ink: #1b1230;
      --lk-accent-tint: #251b40;
      --lk-accent-wash: #1b1626;
      --lk-accent-line: #4a3a75;
      --lk-accent-strong: #e2d4fb;
      --lk-ring: rgba(204, 176, 243, .28);

      --lk-ink: #f2f3f5;
      --lk-sub: #a6adb8;
      --lk-body: #c3c9d2;
      --lk-muted: #8b929e;
      --lk-faint: #7c8390;

      --lk-page: #16181b;
      --lk-surface: #1f2126;
      --lk-raised: #262a31;
      --lk-line: #2c3037;
      --lk-field: #3a3f48;
      --lk-hover: #4a5160;
      --lk-shadow: 0 1px 2px rgba(0, 0, 0, .4);

      --lk-ok-bg: #14301f;   --lk-ok-ink: #7ddba4;
      --lk-bad-bg: #3a1a19;  --lk-bad-ink: #f7a49e;
      --lk-flat-bg: #262a31; --lk-flat-ink: #aeb5c0;
    }
  }

  #tg-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #tg-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #tg-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #tg-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #tg-root .section { margin-bottom: 18px; }
  #tg-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #tg-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #tg-root .tile:hover { border-color: var(--lk-hover); }
  #tg-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #tg-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #tg-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #tg-root input[type=text], #tg-root input[type=password], #tg-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #8b929e is --lk-muted, which is the one
     token with the same value in both schemes, and a data URI cannot read a
     custom property. */
  #tg-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238b929e' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #tg-root input:focus, #tg-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #tg-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #tg-root .btn:hover { border-color: var(--lk-hover); }
  #tg-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #tg-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #tg-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #tg-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #tg-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #tg-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #tg-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }

  #tg-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #tg-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #tg-root .grid { grid-template-columns: 1fr; } }
  #tg-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ==== end shared base ==== */

  #tg-root .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--lk-flat-bg);
              padding: 4px; border-radius: 12px; }
  #tg-root .tab { flex: 1; text-align: center; padding: 10px; border-radius: 9px;
             font-size: 14px; cursor: pointer; color: var(--lk-flat-ink); }
  #tg-root .tab.on { background: var(--lk-surface); color: var(--lk-ink); font-weight: 600;
                box-shadow: var(--lk-shadow); }
  #tg-root .count { font-weight: 600; margin: 14px 0 0; font-size: 14px; }
  #tg-root .line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }

  /* The sub-zone toggle was the one form control left native and unstyled, at a
     13px label with no touch target. accent-color keeps the real checkbox — and
     its keyboard and screen-reader behaviour — while taking the brand colour. */
  #tg-root .check { display: flex; align-items: center; gap: 10px; margin-top: 10px;
               min-height: 44px; font-size: 14px; color: var(--lk-body); cursor: pointer; }
  #tg-root .check input { width: 22px; height: 22px; margin: 0; flex: none;
                     accent-color: var(--lk-accent); cursor: pointer; }

  #tg-root .support { margin-top: 14px; }
  #tg-root .support-title { font-weight: 600; margin-bottom: 6px; }
</style>

<div class="wrap" id="tg-root">
  <h2 data-i18n="targets.title"></h2>

  <!-- Zone selection sits at equal prominence with multi-select. -->
  <div class="tabs">
    <div class="tab on" data-mode="devices" data-i18n="targets.pickLights"></div>
    <div class="tab" data-mode="zone" data-i18n="targets.useZone"></div>
  </div>

  <div id="tg-devicesPane">
    <div id="tg-loadError" class="msg bad" style="display:none;"></div>
    <div id="tg-rooms"></div>
  </div>

  <div id="tg-zonePane" style="display:none;">
    <select id="tg-zone"></select>
    <label class="check">
      <input type="checkbox" id="tg-subzones" checked /> <span data-i18n="targets.includeSubzones"></span>
    </label>
  </div>

  <div class="count" id="tg-count"></div>

  <div class="card support">
    <div class="support-title" data-i18n="targets.supportTitle"></div>
    <div class="line"><span data-i18n="targets.onoff"></span><span id="tg-s-onoff"></span></div>
    <div class="line"><span data-i18n="targets.brightness"></span><span id="tg-s-dim"></span></div>
    <div class="line"><span data-i18n="targets.temperature"></span><span id="tg-s-temp"></span></div>
  </div>
</div>

<script type="text/javascript">
/**
 * Pair views are INJECTED INTO the pairing container's document — they do not
 * get their own iframe, and they must not load homey.js themselves (a second
 * copy overwrites window.Homey with a base object that has no emit/showView).
 *
 * The container calls window.onHomeyReady once, at its own page load, long
 * before this view's script exists, so waiting to be called never fires. The
 * container's fully-equipped Homey is already on window by the time this runs,
 * so take it directly — while still accepting onHomeyReady if it does arrive.
 *
 * All views of a session share ONE document. That is why every CSS rule here is
 * scoped to this view's root id, and why the boot guard below lives on the root
 * ELEMENT rather than in a global.
 */
/**
 * The guard lives on the view's root ELEMENT, not in a global. All views
 * share one document, and a global flag survives leaving and re-entering the
 * pairing flow — which silently blocked the second run from ever rendering.
 * A freshly injected root has no marker, so each injection boots exactly once.
 */
function __llBootTg(Homey) {
  var __root = document.getElementById('tg-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  /**
   * Reserve room for the scrollbar so expanding a section cannot resize the
   * content.
   *
   * When the view grows past the pane height a scrollbar appears, the usable
   * width drops by its thickness, and every percentage-width row re-wraps —
   * text shifts as you expand and collapse. `scrollbar-gutter: stable` keeps
   * the gutter reserved whether or not the bar is showing.
   *
   * The scrolling element belongs to the pairing container, not to us, so find
   * it by walking up rather than guessing a selector.
   */
  (function stabiliseScrollbar() {
    var scroller = null;
    for (var el = __root.parentElement; el && el !== document.documentElement; el = el.parentElement) {
      var overflowY = getComputedStyle(el).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') { scroller = el; break; }
    }
    var targets = scroller ? [scroller] : [document.documentElement, document.body];
    var supported = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');

    targets.forEach(function (el) {
      if (!el) return;
      if (supported) el.style.scrollbarGutter = 'stable';
      // Without gutter support, always showing the track is the stable option.
      else if (el !== document.body) el.style.overflowY = 'scroll';
    });
  })();

  if (typeof Homey.ready === 'function') Homey.ready();

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      // A call that never comes back must not leave a blank screen.
      var timer = setTimeout(function () { finish(new Error('Homey did not respond to "' + event + '"')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
    el.placeholder = Homey.__(el.getAttribute('data-i18n-placeholder'));
  });

  var mode = 'devices';
  var selected = new Set();

  function escapeHtml(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function spec() {
    return mode === 'devices'
      ? { kind: 'devices', deviceIds: Array.from(selected) }
      : {
        kind: 'zone',
        zoneId: document.getElementById('tg-zone').value,
        includeSubzones: document.getElementById('tg-subzones').checked,
      };
  }

  function refresh() {
    if (mode === 'devices' && selected.size === 0) {
      document.getElementById('tg-count').textContent = Homey.__('targets.selected', { count: 0 });
      setSummary({ onoff: 0, dim: 0, light_temperature: 0, total: 0 });
      // Keep the session's target spec in step even when empty, so moving
      // forward with nothing selected fails loudly on the next screen.
      emit('selectTargets', spec()).catch(function () { });
      return;
    }

    emit('selectTargets', spec()).then(function (result) {
      document.getElementById('tg-count').textContent = Homey.__('targets.selected', { count: result.count });
      setSummary(result.support);
    });
  }

  function setSummary(support) {
    document.getElementById('tg-s-onoff').textContent = Homey.__('targets.ofTotal', { count: support.onoff, total: support.total });
    document.getElementById('tg-s-dim').textContent = Homey.__('targets.ofTotal', { count: support.dim, total: support.total });
    document.getElementById('tg-s-temp').textContent = Homey.__('targets.ofTotal', { count: support.light_temperature, total: support.total });
  }

  var CAP_LABEL = {
    onoff: Homey.__('targets.capOnOff'),
    dim: Homey.__('targets.capBrightness'),
    light_temperature: Homey.__('targets.capTemperature')
  };

  function fail(text) {
    var el = document.getElementById('tg-loadError');
    el.textContent = text;
    el.style.display = 'block';
  }

  emit('listTargets').then(function (data) {
    var container = document.getElementById('tg-rooms');
    container.innerHTML = '';

    var rooms = (data && data.rooms) || [];
    if (!rooms.length) {
      fail(Homey.__('targets.noLights'));
      return;
    }

    // Grouped per room — a flat grid of every light in the house is unusable.
    rooms.forEach(function (room) {
      var section = document.createElement('div');
      section.className = 'section';

      var heading = document.createElement('div');
      heading.className = 'section-title';
      heading.textContent = room.zoneName;
      section.appendChild(heading);

      var grid = document.createElement('div');
      grid.className = 'grid';

      room.lights.forEach(function (light) {
        if (light.selected) selected.add(light.id);
        var el = document.createElement('div');
        el.className = 'tile' + (light.selected ? ' sel' : '');
        // Showing what each light supports here explains the "2 of 3" notes on
        // the next screen before they appear.
        var caps = (light.capabilities || []).map(function (c) { return CAP_LABEL[c] || c; }).join(', ');
        el.innerHTML = '<div class="name">' + escapeHtml(light.name) + '</div>'
          + '<div class="meta">' + escapeHtml(caps)
          + (light.available === false ? ' &middot; ' + escapeHtml(Homey.__('targets.unavailable')) : '') + '</div>';
        el.addEventListener('click', function () {
          if (selected.has(light.id)) { selected.delete(light.id); el.classList.remove('sel'); }
          else { selected.add(light.id); el.classList.add('sel'); }
          refresh();
        });
        grid.appendChild(el);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });

    var zoneSelect = document.getElementById('tg-zone');
    zoneSelect.innerHTML = '';
    (data.zones || []).forEach(function (zone) {
      var option = document.createElement('option');
      option.value = zone.id;
      option.textContent = zone.name;
      zoneSelect.appendChild(option);
    });

    if (data.current && data.current.kind === 'zone') {
      switchMode('zone');
      zoneSelect.value = data.current.zoneId;
      document.getElementById('tg-subzones').checked = data.current.includeSubzones;
    }
    refresh();
  }).catch(function (err) {
    fail(Homey.__('targets.loadFailed'));
  });

  function switchMode(next) {
    mode = next;
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.classList.toggle('on', tab.getAttribute('data-mode') === next);
    });
    document.getElementById('tg-devicesPane').style.display = next === 'devices' ? 'block' : 'none';
    document.getElementById('tg-zonePane').style.display = next === 'zone' ? 'block' : 'none';
    refresh();
  }

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () { switchMode(tab.getAttribute('data-mode')); });
  });
  document.getElementById('tg-zone').addEventListener('change', refresh);
  document.getElementById('tg-subzones').addEventListener('change', refresh);
}

window.onHomeyReady = __llBootTg;

(function waitForHomey(attempt) {
  if (window.Homey && typeof window.Homey.emit === 'function') return __llBootTg(window.Homey);
  // Homey never arrived, so Homey.__ does not exist and this one string cannot
  // go through a locale key: the failure mode IS "no Homey on the page". It is
  // also inserted into document.body, outside the view root, so the tokens
  // scoped to that root cannot reach it either — hence the literal colours,
  // which are the pair-view error palette rather than the settings one.
  if ((attempt || 0) > 100) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:12px;background:#fdeceb;color:#8f1d18;font-size:13px;">'
      + 'Lightkeeper could not reach the Homey pairing API on this page.</div>');
    return;
  }
  setTimeout(function () { waitForHomey((attempt || 0) + 1); }, 50);
})(0);
</script>
