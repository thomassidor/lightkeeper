<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #jb-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-line: #d9cbf5;
    /* Between the accent and its line. The middle of the three listening dots,
       and the only place a mid-tone is needed: the logo has none. */
    --lk-accent-mid: #9f81dc;
    /* A block on the schedule timeline that is not the one being edited. It
       borrowed --lk-accent-line, which is the edge of a numbered badge and a
       step too pale to hold a 52px bar: four of them across a grey track read
       as a smudge rather than as the day's other windows. */
    --lk-block: #b9a6e4;
    /* And a block on a timeline where NOTHING is selected — the review's
       picture of the finished day. Deeper than the one above because the pale
       violet only exists to recede behind a selected block, and on a review
       there is nothing for it to recede behind: four faint bars on a grey
       track read as a chart that had failed to load. */
    --lk-block-settled: #7a57c8;
    --lk-accent-strong: #3b2279;
    /* Two more steps down the same violet, for the three-bar level picture: it
       is a LEVEL rather than a direction, so only the tallest bar is at full
       strength and the two under it fall away. Derived from the accent the same
       way the tints are — the logo has no mid-tones to read them out of. */
    --lk-level-mid: #7a62c0;
    --lk-level-low: #c4b8e4;

    /* Drawn ON the accent tint rather than on white, and that is the whole
       reason these three exist. A grey hairline on #f3eefc is the one place in
       this palette where a neutral reads as dirty, and --lk-muted on it reads
       as faded rather than as secondary. So the tint gets its own edge, its own
       rule and its own second ink, all violet-shifted to match the ground they
       sit on. */
    --lk-tint-line: #e2d8f6;
    --lk-tint-rule: #f0ecfa;
    --lk-tint-ink: #5a4d80;
    --lk-ring: rgba(42, 25, 88, .16);
    /* The edge of a handle nobody has selected. It is NOT --lk-ring: at .16 a
       26px circle on an orange strip had no edge at all, and the second
       boundary looked like a smudge rather than something to drag. */
    --lk-handle-edge: rgba(42, 25, 88, .45);

    /* The ink ladder: THREE greys, and the design canvas has no fourth.

       It had five. --lk-sub (#5f6672) and --lk-faint (#6f7683) sat either side
       of --lk-muted and were never a step anybody could see — #6f7683 against
       #6a7180 is a difference of five in one channel, which is not a decision,
       it is a drift. Both are gone and their consumers took the neighbour the
       canvas actually draws: an end-caption and the midnight/noon line are
       --lk-body, everything else that was faint is --lk-muted.

       All three clear WCAG AA (4.5:1) against --lk-surface, because all three
       are used between 10.5px and 15px. Collapsing --lk-faint RAISED the
       contrast of every caption that used it, from 4.6:1 to 4.9:1. What
       separates the steps is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;

    /* THREE BORDER ROLES, and they do not overlap. This is the rule the design
       system is strictest about, and the one this app had most wrong: --lk-line
       was drawing card edges AND the dividers inside them, so a card's outline
       and the hairlines between its rows were the same weight of grey and the
       card had no edge at all at arm's length.

         --lk-edge  every card and control BOX, at 1px or 1.5px
         --lk-line  ONLY a 1px divider inside a card — never a box
         --lk-box   ONLY the 22px checkbox and radio

       --lk-edge also serves as the disabled fill, which is what the system's
       own Disabled specimen draws — see .btn:disabled. */
    --lk-edge: #dfe3e9;
    --lk-line: #eceef2;
    /* The edge of an UNTICKED box or radio, and only that. A shade darker than
       --lk-edge because an empty checkbox has to read as a control somebody
       has not used yet; at the card-edge grey it reads as a gap in the row. */
    --lk-box: #d4d8e0;
    /* Dashed only: "nothing here yet, and that is expected" — empty states and
       add-slots. It is never a solid edge and never mixed with one. */
    --lk-hover: #c9d2e0;
    /* A chevron is an affordance, not a value: lighter than the text it sits
       beside, so a list of rows reads as labels rather than as arrows.

       #a8aeb9 took that too far. A non-text UI component still owes 3:1, and
       at #a8aeb9 the chevron was 2.4:1 — an affordance nobody has to read is
       still one somebody has to SEE. The canvas's #8f97a3 is 3.2:1 and is
       still visibly lighter than every ink in the ladder above. */
    --lk-chev: #8f97a3;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-knob-shadow-warm: 0 0 0 2.5px #ffffff, 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The ring around a knob drawn at icon scale, where the full
       --lk-slider-knob-shadow is two shadows on a 4px mark and comes out as a
       smudge. One ring, half a pixel thinner than the real control's. */
    --lk-knob-edge: rgba(22, 24, 29, .5);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #f3eefc);
    /* How light it is OUTSIDE, pale to deep — the third axis this app draws,
       and the only one that runs dark at the TOP of its range rather than the
       bottom. It is the week grid's scale, and its six stops are the same six
       the cells are quantised to: `SHADES` in views/shared/week-grid.js, which
       cannot read a custom property and so carries them again. Change one and
       change the other; `pair-view-styles.test.ts` checks that they agree.

       FIVE steps, not six. The sixth was --lk-accent-strong, one step past the
       point where two cells could be told apart at 11px tall, and the design
       system fixes the heatmap at five. */
    --lk-lux-ramp: linear-gradient(90deg, #f4f2fa, #e0d6f6, #c4b0ec,
                                   #9f81dc, #6b48bc);
    /* The same stops the other way round, for the sun's own height.
       Reversed on purpose: the lux ramp measures HOW MUCH LIGHT there is, so
       more light is more ink, while this one is a picture of the DAY — and the
       dark end of a day is the night. The two never meet on screen, because a
       Room-sensing Light has a sensor or it has the sun. */
    --lk-sun-ramp: linear-gradient(90deg, #3b2279, #6b48bc, #9f81dc,
                                   #c4b0ec, #f4f2fa);
    /* The hours of a "when does this room get its sun?" tile: the ones that
       ARE this room's sun, and the ones that are the day going on around it. */
    --lk-peak-on: #4b2ea0;
    --lk-peak-off: #dfd4f4;
    /* The two ENDS of the warmth axis, for the two tiles that nudge along it
       rather than setting it. The whole ramp draws the same picture on both,
       which is no picture at all, so each of these runs from the middle of
       --lk-warm-ramp out to one end of it.
       The cool end is DEEPER than that ramp's own #dbe8fb: at 30x12px on white
       the real end of the axis is a chip with no edge, so the tile that said
       "cooler" showed nothing at all. Deepened to where it reads, and no
       further — it is a picture of a direction, not a colour to match. */
    --lk-warmer-ramp: linear-gradient(90deg, #f2e6d6, #e8892c);
    --lk-cooler-ramp: linear-gradient(90deg, #f2e6d6, #9fc0f0);
    /* A lamp that is ON, drawn rather than named: the one warm accent in an
       interface that is otherwise entirely violet, because "on" is a picture of
       light and the brand colour is a picture of the app. */
    --lk-lamp-lit: #f4c24a;
    --lk-lamp-glow: rgba(244, 194, 74, .32);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    /* The halo round a SELECTED block on the schedule timeline, and round a
       selected swatch. Softer than --lk-ring is used for elsewhere, because it
       is drawn against the accent itself rather than against white. */
    --lk-select-halo: 0 0 0 3px rgba(42, 25, 88, .18);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    /* The two-hour cell a sensor reported NOTHING in, drawn as a hatch. Its own
       two colours because nothing else in the app is a hatch: the pale stripe
       has to sit above --lk-line without becoming white (a white stripe made
       the cell read as missing from the grid rather than as empty in it), and
       the edge has to hold the cell's rectangle at 11px tall, which the stripes
       alone do not. */
    --lk-hatch-pale: #f7f8fa;
    --lk-hatch-edge: #dfe3e9;
    --lk-day-mark: rgba(22, 24, 29, .4);
    /* The curve chart's own "you are editing this point" line. Accent rather
       than ink, because on that chart it marks a SELECTION; on the day strip
       the dashed lines mark sunrise and sunset, which are facts. */
    --lk-curve-mark: rgba(42, 25, 88, .55);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    /* Success is a DOT, never a ground. There is no green banner in this
       system: a tinted block is for a finding somebody has to act on, and
       "that worked" is not one. The green appears at 8px beside the sentence
       and nowhere else. */
    --lk-ok-dot: #5aa86b;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    /* A key the Homey accepted and then refused to build a Flow with. Its own
       colour rather than --lk-bad-ink, and a full step lighter, because it is
       drawn as an EDGE round a field and as a 16px badge — at #8f1d18 a
       1.5px border round a white field read as damage, and the message beside
       it says the key itself is fine. */
    --lk-reject: #c05a3e;
    --lk-flat-bg: #f4f5f7;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 16px under a heading, which is the gap the design draws on every screen
     that puts a control straight below one. It used to be 4px, and at 4px a
     title read as a label ON the first card rather than as the name of the
     screen.

     `text-wrap: balance` is for the titles that do not fit on one line, and the
     longest is the sensor picker's: measured at 311px — a 390px phone, less
     Homey's gutter, our padding and the scrollbar gutter — it breaks 295px +
     54px, which leaves `from?` alone on the second line. Balanced it is
     163 + 185. Not a workaround for a title that is too long: at 20px it needs
     354px, and even 18px needs 319px, so there is no size that holds it on one
     line at phone width without shrinking every other title in the app by an
     eighth. A one-line title is unaffected, so this costs the other screens
     nothing, and a browser without it wraps exactly as before. */
  #jb-root h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
             text-wrap: balance; }
  #jb-root .sub { font-size: 15px; line-height: 1.5; color: var(--lk-body); margin: 0 0 18px; }
  /* A blurb belongs TO its heading — 6px between them, not 16. Written as a
     pull on the blurb rather than as `h2:has(+ .sub)` on the heading because
     the pairing container's webview is not somewhere to find out whether
     `:has()` landed. */
  #jb-root h2 + .sub { margin-top: -10px; }
  #jb-root p { font-size: 15px; line-height: 1.5; color: var(--lk-body); }

  #jb-root .card { background: var(--lk-surface); border: 1px solid var(--lk-edge);
              border-radius: 16px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #jb-root .section { margin-bottom: 18px; }
  /* The label over a group — "Does", "To", "When does this room get its sun?".
     It is a .control-title with nothing on its right: the same 16/600 ink,
     sentence case. It used to be 12px uppercase small-caps in the faintest
     grey, which made the two words holding the job screen's sentence together
     read as filing-cabinet labels rather than as the sentence's own verbs.

     16 is the CONTROL size — group headings and every button share it, which is
     why it sits so close to body 15. */
  #jb-root .section-title { font-size: 16px; font-weight: 600; line-height: 1.2;
                       color: var(--lk-ink); margin: 0 0 9px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #jb-root .tile { display: block; width: 100%; text-align: start; background: var(--lk-surface);
              border: 1.5px solid var(--lk-edge); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #jb-root .tile:hover { border-color: var(--lk-hover); }
  #jb-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #jb-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #jb-root .tile .meta { font-size: 13px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #jb-root input[type=text], #jb-root input[type=password], #jb-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-edge); border-radius: 12px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #jb-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-inline-end: 34px; }
  /* Arabic reads right to left, so the chevron sits on the other end — where
     `padding-inline-end` has already made room for it. */
  #jb-root[dir="rtl"] select { background-position: left 13px center; }
  #jb-root input:focus, #jb-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  /* EVERY in-app button is the same shape: 16/600, 48px, radius 12, full
     width. Three variants and nothing else — solid accent to commit, accent
     outline for a reversible action, edge outline to dismiss. The blue pill in
     the pairing footer is Homey's own chrome and is never ours to draw.

     This used to be four shapes at three sizes (14/500 at 40px here, 16/600 at
     50px on `.wide`, 15/500 at 48px on `.wide.accent`), which is how a set of
     buttons stops reading as a set. */
  #jb-root .btn { font-family: inherit; font-size: 16px; font-weight: 600; padding: 14px;
             border-radius: 12px; border: 1.5px solid var(--lk-edge);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 48px; box-sizing: border-box; }
  #jb-root .btn:hover { border-color: var(--lk-hover); }
  /* Disabled is a COLOUR change, never an opacity change. Dropping opacity
     takes the label under 4.5:1 and fades the button's own edge with it, so the
     control stops reading as a control at all rather than as an unavailable
     one. Fill goes to the divider grey, ink and border to the furniture grey. */
  #jb-root .btn:disabled { border-color: var(--lk-line); color: var(--lk-chev);
                        cursor: not-allowed; }
  /* The same button across the width of the screen. What a secondary action
     looks like when it is the only one on a pushed screen — "Close" — where a
     primary button would claim the choice was made. */
  #jb-root .btn.wide { display: block; width: 100%; margin-top: 16px; }
  /* And the same button when it is the SECOND of two, under a primary — "Stop
     preview" — or the one secondary action inside a card, as "Test my lights"
     is on the review screen. It borrows the primary's outline rather than the field grey,
     because the pair is one decision offered twice ("show me" / "undo that")
     and a grey partner reads as the disabled twin of the button above it.
     Lighter than the primary in weight and height, never in hue. */
  #jb-root .btn.wide.accent { border-color: var(--lk-accent); color: var(--lk-accent); }
  #jb-root .btn-primary { display: block; width: 100%; font-size: 16px; font-weight: 600;
                     padding: 14px; box-sizing: border-box;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 48px;
                     margin-top: 16px; font-family: inherit; }
  /* A button in flight keeps its exact size and takes the disabled fill; its
     LABEL is what says it is working, swapped to the present participle of its
     own verb by the view. There is no spinner in this system because there is
     no icon set. */
  #jb-root .btn-primary:disabled { background: var(--lk-line); color: var(--lk-chev);
                                cursor: progress; }

  /* An inline text action inside a card — "Show more colours", "Test it on my
     lights". Not a button shape: it is a link that happens to be a <button>,
     because it changes what is on the screen rather than committing anything.

     SHARED because it was defined four times, and the fourth had drifted to
     13px in the wrong violet and left-aligned as a block — which is how a
     control that should be one thing becomes two. */
  #jb-root .morelink { display: flex; align-items: center; min-height: 44px;
                    box-sizing: border-box; margin-top: 9px; padding: 0;
                    background: none; border: none; font-family: inherit;
                    font-size: 15px; font-weight: 500;
                    color: var(--lk-accent-strong); cursor: pointer; }
  #jb-root .morelink:disabled { color: var(--lk-chev); cursor: progress; }

  /* An add-slot: a dashed frame where a thing is not yet. The dashed edge means
     "nothing here yet, and that is expected" — the same edge the empty states
     use, and never mixed with a solid one on the same element. */
  #jb-root .add { display: flex; align-items: center; justify-content: center;
               width: 100%; min-height: 48px; box-sizing: border-box;
               margin-bottom: 16px; padding: 13px; border-radius: 12px;
               border: 1.5px dashed var(--lk-hover); background: none;
               font-family: inherit; font-size: 15px; font-weight: 500;
               line-height: 1; color: var(--lk-accent-strong); cursor: pointer; }

  /* And the destructive text row that closes an editing card. Centred under a
     rule, because it acts on the card it sits in rather than on the screen —
     and in the one colour this system reserves for damage. */
  #jb-root .remove { display: flex; align-items: center; justify-content: center;
                  width: 100%; min-height: 44px; box-sizing: border-box;
                  margin-top: 13px; padding: 13px 0 0;
                  background: none; border: none;
                  border-top: 1px solid var(--lk-line);
                  font-family: inherit; font-size: 15px; font-weight: 500;
                  line-height: 1; color: var(--lk-bad-ink); cursor: pointer; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #jb-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 12px; font-size: 13px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-ink); }
  /* SUCCESS IS A DOT, NOT A GROUND. A tinted block is for a finding somebody
     has to act on; "that worked" is not one, and a green panel gave the same
     weight to "Key accepted." as to a sensor that has stopped reporting. The
     ground stays neutral and an 8px dot carries the good news. */
  #jb-root .ok { display: flex; align-items: baseline; gap: 8px; }
  #jb-root .ok::before { content: ''; flex: none; width: 8px; height: 8px;
                      border-radius: 50%; background: var(--lk-ok-dot); }
  #jb-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #jb-root .muted { background: var(--lk-flat-bg); color: var(--lk-ink); }
  #jb-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #jb-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #jb-root ol { font-size: 15px; line-height: 1.75; padding-inline-start: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #jb-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #jb-root .grid { grid-template-columns: 1fr; } }
  #jb-root .empty { font-size: 15px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #jb-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #jb-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-edge); }
  /* Four steps, narrower dots: the run keeps the same overall width whether a
     flow has three or four, so the header does not visibly grow between two
     device types. */
  #jb-root .steps.tight i { width: 16px; }
  #jb-root .steps i.on { background: var(--lk-accent); }
  #jb-root .steps span { margin-inline-start: 4px; font-size: 13px; color: var(--lk-muted); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened.

     The row carries NO horizontal padding, and its card carries it instead
     (`.card.rows` below). That is what insets the hairline between two rows
     from the card's own edge — a rule that runs corner to corner reads as the
     card being cut in half, and every list the design draws insets it. */
  #jb-root .row { display: flex; align-items: center; gap: 10px; width: 100%;
               padding: 13px 0; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: start; cursor: pointer; }
  #jb-root .row + .row { border-top: 1px solid var(--lk-line); }
  #jb-root .row .label { flex: 1; font-size: 15px; }
  #jb-root .row .value { font-size: 15px; color: var(--lk-muted); text-align: end; }
  #jb-root .row .chev { flex: none; font-size: 16px; color: var(--lk-chev); }
  #jb-root .row .sub { font-size: 13px; color: var(--lk-muted); margin: 2px 0 0; }
  /* The card a list of rows lives in. 4px top and bottom rather than 14:
     a row's own 13px is already the space above the first label, and adding
     the card's to it put a visible step between the card's edge and its
     first line that no other card has. */
  #jb-root .card.rows { padding: 4px 14px; }

  /* The pill switch behind every "Set … too".
     It carries a rule above it, always: a toggle is a new decision inside a
     card that was until then about one thing, and without the rule it read as
     the last line of the control above it. */
  #jb-root .toggle { display: flex; align-items: center; gap: 10px; width: 100%;
                  border-top: 1px solid var(--lk-line);
                  margin-top: 14px; padding: 13px 0 0;
                  min-height: 44px; box-sizing: border-box;
                  background: none; border-left: none; border-right: none;
                  border-bottom: none; font: inherit; color: inherit;
                  text-align: start; cursor: pointer; }
  #jb-root .toggle .label { flex: 1; font-size: 15px; }
  #jb-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-line);
                         transition: background .15s ease; }
  #jb-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #jb-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #jb-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #jb-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 16px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #jb-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-line); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #jb-root .slider.warm { background: var(--lk-warm-ramp); box-shadow: none; }
  #jb-root .slider.bright { background: var(--lk-bright-ramp); }
  #jb-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 999px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  /* The two ramps take OPPOSITE knobs, and that is not a slip: the warmth ramp
     is light from end to end, so a white knob on it is invisible; the
     brightness ramp starts at near-black, so a dark one is. Each knob is the
     colour its own track is not. */
  #jb-root .slider.warm .knob { background: var(--lk-ink);
                             box-shadow: var(--lk-slider-knob-shadow-warm); }
  #jb-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-body); margin: 9px 0 0; }

  /* An aside under a control: "there is a device type that does this for you".
     Deliberately NOT a .msg — a message has a coloured ground and is about
     something that just happened, and this is a pointer nobody has to read to
     finish the screen. So no ground, the muted ink, italic, and nothing else.

     It USED to carry a drawn circled "i". That mark is gone: it was the only
     serif and the only drawn icon in the whole product, and this system has no
     icon set at all — five text glyphs and nothing more. The italic is what
     marks these lines as an aside, on all four screens that carry one.

     It sits directly under the control it qualifies rather than at the foot of
     the card, because three of the four screens carry a second control below
     it and an aside that floated to the bottom would read as belonging to
     that one instead. */
  #jb-root .tip { display: flex; align-items: flex-start; gap: 7px;
               margin: 13px 0 0; font-size: 13px; line-height: 1.45;
               font-style: italic; color: var(--lk-muted); }

  /* The swatches a colour is chosen from, five across, EVERYWHERE.
     Two rows by default — whites, then one of each colour — and five more
     that fold out below, one hue family a row. Five and not eight: at 390px
     eight is 34px of width a swatch, under the touch minimum and too small to
     judge a colour by; five is still a comfortable target at 34px tall.

     7px under every grid, which the margins between block siblings collapse
     to: 7px from the default rows to the fold-out, as the design draws it, and
     the link under the last grid keeps its own 9px. */
  #jb-root .swatches { display: grid; grid-template-columns: repeat(5, 1fr);
                    gap: 7px; margin: 0 0 7px; }
  /* min-height as well as height: the container's own stylesheet is not ours
     to read, and a swatch whose height is overridden away is a coloured line
     rather than a colour anybody can judge. */
  #jb-root .swatch { height: 34px; min-height: 34px; border-radius: 8px; padding: 0;
                  box-sizing: border-box;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  /* The chosen colour, and it has to survive being ON a colour: a ring drawn
     in the accent with a soft halo outside it reads against every swatch in
     the palette, which a white gap did not against the pale ones. */
  #jb-root .swatch[aria-pressed="true"] { border: 2.5px solid var(--lk-accent);
                                       box-shadow: 0 0 0 3px var(--lk-ring); }
  /* The twenty-five that fold out: the SAME grid, same size, same gap.

     It used to be a second grid of smaller swatches, eight across, 18px below —
     and the space and the smaller size were what told the two sets apart. The
     2026-09-23 design makes it one grid that simply grows: the fold-out rows
     are hue families, deep to pale, and read as rows of one palette because
     they are. So `.more` carries nothing of its own any more; the class stays
     as the hook the views show and hide. */

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #jb-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #jb-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #jb-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 11px; font-weight: 600; letter-spacing: .08em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 8px; }
  #jb-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-handle-edge); z-index: 1;
                       box-shadow: var(--lk-handle-shadow); }
  #jb-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #jb-root .clockline { display: flex; justify-content: space-between;
                     font-size: 11px; color: var(--lk-body); margin: 8px 2px 4px; }

  /* The three or four decisions a flow is about to ask for, numbered.

     SHARED rather than intro-only: the credential gate draws the same rows for
     the four steps of minting a key, and it used to draw an <ol> instead — a
     browser list with a browser's numerals, inside a screen where every other
     number is a filled circle. Two places, one shape.

     Spaced, not ruled. A hairline between two decisions turns a promise about
     what is coming into a settings list, and the numbers already say these are
     three of one thing. */
  #jb-root .plan { display: flex; flex-direction: column; gap: 14px;
                margin: 0 0 22px; }
  #jb-root .decision { display: flex; align-items: flex-start; gap: 12px; }
  #jb-root .decision .n { flex: none; width: 26px; height: 26px; border-radius: 50%;
                       box-sizing: border-box;
                       background: var(--lk-accent-tint); color: var(--lk-accent-strong);
                       border: 1.5px solid var(--lk-accent-line);
                       font-size: 13px; font-weight: 700;
                       display: flex; align-items: center; justify-content: center; }
  #jb-root .decision .what { font-size: 16px; font-weight: 600; line-height: 26px; }
  #jb-root .decision .why { font-size: 13px; color: var(--lk-muted); margin-top: 2px;
                         line-height: 1.45; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  /* ON - WITH LIGHTKEEPER: a card, above the grid, and not a tenth tile.

     It is the only job that carries three further decisions — where the colour
     comes from, where the level comes from, and what a second press does — and
     a 100px grid cell cannot hold any of them. Above the nine rather than below
     because it is the job most of these buttons want and the grid is what you
     fall back to; "Do nothing" is below for the mirror-image reason.

     It is the base's `.tile`, so its chosen state is the same border and the
     same tint as every other "this is the one you picked" in the app, and
     `renderGrid` finds it by its preset kind rather than by position. */
  #jb-root .lk { padding: 0; overflow: hidden; margin-bottom: 7px; }
  #jb-root .lk .head { display: flex; align-items: flex-start; gap: 11px;
                       width: 100%; padding: 13px 14px; box-sizing: border-box;
                       background: none; border: none; font: inherit; color: inherit;
                       text-align: start; cursor: pointer; }
  #jb-root .lk .head .what { flex: 1; }
  #jb-root .lk .head .sub { display: block; font-size: 13px; color: var(--lk-muted);
                            margin-top: 3px; line-height: 1.35; }
  /* Chosen, the head sits on the accent tint, so its two lines take the inks
     that were mixed for that ground rather than the neutrals that were mixed
     for white. */
  #jb-root .lk.sel .head .name { font-weight: 600; }
  #jb-root .lk.sel .head .sub { color: var(--lk-tint-ink); }

  /* The three decisions, revealed under the head once the job is chosen. They
     are INSIDE the card rather than under it — a `.preset` block below the grid
     would put them past nine tiles from the thing they belong to.

     And on a white card of their own, inside the tinted one. Laid straight on
     the tint they were three rules drawn across a coloured panel, which read as
     the tile still going rather than as a second thing beginning; a surface
     under them says these are settings ON the job above. Its edge and its own
     hairlines are a violet-tinted pair rather than the app's greys, because a
     grey line on the accent tint is the one place in the palette where a
     neutral looks dirty. */
  #jb-root .lk .rows { background: var(--lk-surface); border: 1px solid var(--lk-tint-line);
                       border-radius: 12px; padding: 2px 12px; margin: 0 14px 14px; }
  #jb-root .lk .row { display: flex; align-items: center; gap: 10px; width: 100%;
                      padding: 11px 0; min-height: 44px; box-sizing: border-box;
                      background: none; border: none; border-top: 1px solid var(--lk-tint-rule);
                      font: inherit; color: inherit; text-align: start; cursor: pointer; }
  #jb-root .lk .rows > :first-child { border-top: none; }
  #jb-root .lk .row .label { flex: none; font-size: 13px; }
  /* The chosen setup's NAME, at the end of the line and in the accent, because
     it is the answer rather than a caption. Truncated rather than wrapped: a
     device called "Evening curve, upstairs landing" must not make this row two
     lines taller than the one below it. */
  #jb-root .lk .row .value { flex: 1; text-align: end; font-size: 13px;
                             font-weight: 500;
                             color: var(--lk-accent-strong); overflow: hidden;
                             text-overflow: ellipsis; white-space: nowrap; }
  #jb-root .lk .row .chev { flex: none; color: var(--lk-chev); font-size: 16px; }
  /* The base's own switch, minus the rule it draws above itself — this row
     already has one of its own, and two hairlines read as a gap. */
  #jb-root .lk .toggle { margin-top: 0; padding: 11px 0; gap: 10px;
                         border-top: 1px solid var(--lk-tint-rule); }

  /* Icons here lead their line rather than centring over a label, exactly as
     they do on the "Do nothing" row. */
  #jb-root .lk .ico { margin: 0; flex: none; width: 22px; }


  /* NINE JOBS AS A GRID, and the grid is the grouping.

     They were a stack of full-width rows, which is the right shape for a list
     of unlike things and the wrong one for a set with structure: power,
     brightness and colour across three rows, and "up, down, set a value" down
     the three columns. Position says which family a job belongs to, so no group
     headings are needed and none are drawn — and the third column reads the
     same way in all three rows, which is what makes a nine-item grid
     scannable where a nine-item list is not.

     A tile is the base's `.tile`, so the chosen one is bordered and tinted the
     way every other "this is the one you picked" in the app is. */
  #jb-root .grid { display: grid; grid-template-columns: repeat(3, 1fr);
                   gap: 7px; margin: 0 0 7px; }
  #jb-root .grid .tile { margin: 0; padding: 11px 6px 10px; text-align: center; }
  #jb-root .grid .name { font-size: 13px; font-weight: 500; line-height: 1.25; }
  /* The value, and ONLY once its tile is chosen. "60%" printed on an unchosen
     tile read as the only brightness on offer rather than as this button's. */
  #jb-root .grid .meta { font-size: 11px; color: var(--lk-muted); margin-top: 3px; }

  /* Do nothing sits APART, full width, below the grid: it is the absence of a
     job rather than a tenth kind of one, and it is what an unmapped button
     already says. Same tile, same chosen state, different shape. */
  #jb-root .none { display: flex; align-items: center; gap: 11px; margin: 0 0 16px;
                   text-align: start; }
  /* The grid centres its own icons with `margin: auto`, which in a row pushes
     the label to the far end. Here the icon leads the line. */
  #jb-root .none .ico { margin: 0; }
  /* Dashed, where the Off TILE's identical ring is solid. Off is a job: it
     switches the lights off. This is the absence of one, and it is marked the
     way "Add a time" and the empty-lights panel are — an outline round
     something that is not there. */
  #jb-root .none .ico-off .lamp { border-style: dashed; }
  #jb-root .none .name { flex: 1; font-size: 15px; font-weight: 500; }

  /* ---- the picture on each tile ------------------------------------------

     Every tile carries a picture of its EFFECT rather than a number or a glyph:
     bars that climb for brighter and fall for dimmer, a track that runs dark to
     light for a set brightness, the warm and the cool end of the same ramp, and
     three dots for a colour. Drawn in CSS from the palette's own tokens — an
     icon file would be a second place the brand lives, and an inline SVG would
     mean building markup from a string, which no view in this app does. */
  #jb-root .ico { height: 22px; margin: 1px auto 7px; display: flex;
                  align-items: flex-end; justify-content: center; gap: 3px; }
  #jb-root .ico span { display: block; }

  /* Power. A lit lamp, an unlit one, and the two of them side by side. */
  #jb-root .ico-on, #jb-root .ico-off, #jb-root .ico-toggle { align-items: center; }
  #jb-root .ico-on .lamp { width: 20px; height: 20px; border-radius: 50%;
                           background: var(--lk-lamp-lit);
                           box-shadow: 0 0 0 3px var(--lk-lamp-glow); }
  #jb-root .ico-off .lamp { width: 20px; height: 20px; border-radius: 50%;
                            border: 2px solid var(--lk-hover); box-sizing: border-box; }
  #jb-root .ico-toggle .lamp { width: 14px; height: 14px; border-radius: 50%;
                               background: var(--lk-lamp-lit); }
  #jb-root .ico-toggle .lamp.out { background: none;
                                   border: 2px solid var(--lk-hover); box-sizing: border-box; }

  /* Brightness. Three bars, climbing — and the same three reversed for down,
     because a dimmer is not a different picture, it is the same one read the
     other way. */
  #jb-root .ico-up .bar, #jb-root .ico-down .bar { width: 4px; border-radius: 2px;
                                                   background: var(--lk-accent); }
  #jb-root .ico-up .bar:nth-child(1), #jb-root .ico-down .bar:nth-child(3) { height: 7px; }
  #jb-root .ico-up .bar:nth-child(2), #jb-root .ico-down .bar:nth-child(2) { height: 13px; }
  #jb-root .ico-up .bar:nth-child(3), #jb-root .ico-down .bar:nth-child(1) { height: 20px; }

  /* The three that SET a value are tracks, not steps: the whole axis, with the
     value living somewhere along it. */
  /* Pill-shaped and wider than they were: at 30px a track with a knob on it
     was a grey lozenge, and the two warmth tiles — which are a track and
     NOTHING else — had no room to show a direction at all. The level track
     carries a knob, so it is the shorter of the two heights. */
  #jb-root .ico-level .track { position: relative; width: 38px; height: 12px;
                               border-radius: 999px; box-sizing: border-box;
                               border: 1px solid var(--lk-hairline);
                               background: var(--lk-bright-ramp); }
  #jb-root .ico-level .track::after { content: ''; position: absolute; left: 58%;
                                      top: -3px; bottom: -3px; width: 4px;
                                      margin-left: -2px; border-radius: 2px;
                                      background: var(--lk-surface);
                                      box-shadow: 0 0 0 1.5px var(--lk-knob-edge); }
  #jb-root .ico-warm .track, #jb-root .ico-cool .track { width: 38px; height: 14px;
                              border-radius: 999px; box-sizing: border-box;
                              border: 1px solid var(--lk-hairline); }
  #jb-root .ico-warm .track { background: var(--lk-warmer-ramp); }
  #jb-root .ico-cool .track { background: var(--lk-cooler-ramp); }
  #jb-root .ico-colour { gap: 3px; align-items: center; }
  #jb-root .ico-colour .dot { width: 12px; height: 12px; border-radius: 50%; }

  /* The composed job: the ON dot, inside a Lightkeeper arc.

     It was a lamp lit down one side, which is a picture of "half on" — the
     wrong idea entirely, since this job turns the light fully on and takes only
     its VALUES from elsewhere. The arc is the qualifier: the same switching
     family as the On tile, with something of ours drawn around it. Two of the
     four borders are transparent and the square is rotated, which is how a
     quarter of a circle is drawn without an SVG. */
  #jb-root .ico-lk { align-items: center; position: relative; }
  #jb-root .ico-lk .lamp { width: 16px; height: 16px; border-radius: 50%;
                           background: var(--lk-lamp-lit); }
  #jb-root .ico-lk::after { content: ''; position: absolute; width: 24px; height: 24px;
                            left: 50%; top: 50%; margin: -12px 0 0 -12px;
                            box-sizing: border-box; border-radius: 50%;
                            border: 2px solid var(--lk-accent);
                            border-right-color: transparent;
                            border-bottom-color: transparent;
                            transform: rotate(45deg); }
  /* Press-again-to-turn-off: the same two dots the Toggle tile carries, at row
     scale. The row had no picture at all while the two above it did, which read
     as a setting that had wandered in from somewhere else rather than as the
     third of three decisions. */
  #jb-root .ico-pair { align-items: center; gap: 3px; }
  #jb-root .ico-pair .lamp { width: 7px; height: 7px; border-radius: 50%;
                             background: var(--lk-lamp-lit); }
  #jb-root .ico-pair .lamp.out { background: none; box-sizing: border-box;
                                 border: 1.5px solid var(--lk-hover); }
  #jb-root .ico-swatch { align-items: center; }
  #jb-root .ico-swatch .chip { width: 18px; height: 18px; border-radius: 8px;
                               background: var(--lk-warmer-ramp); }
  /* The level picture at row scale, and its two lower bars are PALER than the
     top one — the same three-step climb the Brighter tile draws, read here as a
     level rather than as a direction, so the tallest bar is the only one at
     full strength. */
  #jb-root .ico-level-row { align-items: flex-end; gap: 2px; height: 17px; }
  #jb-root .ico-level-row .bar { width: 3.5px; border-radius: 2px;
                                 background: var(--lk-accent); }
  #jb-root .ico-level-row .bar:nth-child(1) { height: 6px; background: var(--lk-level-low); }
  #jb-root .ico-level-row .bar:nth-child(2) { height: 11px; background: var(--lk-level-mid); }
  #jb-root .ico-level-row .bar:nth-child(3) { height: 17px; }

  /* ---- what a job is set to ---------------------------------------------- */

  /* Only ever under the tile that needs one. */
  #jb-root .preset { background: var(--lk-flat-bg); border-radius: 12px;
                     padding: 12px 14px; margin: 0 0 16px; }
  #jb-root #jb-warmBlock { margin-top: 13px; }
  /* The swatch grids keep the BASE's own margins, and this is a rule about not
     writing one. `#jb-root .preset .swatches { margin: 0 }` was here to tighten
     the card, and it silently took the 14px the base puts above the fold-out
     set with it: same specificity as `#jb-root .swatches.more`, further down
     the file, so it won. The gap between the featured eight and the sixteen
     below them went back to looking like one grid of twenty-four. */
  #jb-root .preset .chosen-name { font-size: 13px; color: var(--lk-muted);
                                  margin: 9px 0 0; }

  /* ---- and to which lights ----------------------------------------------- */

  /* The second half of the sentence. Same checklist the light picker draws,
     because it is the same question asked of a shorter list — and "all of them"
     is a row of its own rather than a state you reach by ticking everything:
     ticked individually, the set would freeze against today's lights, while the
     row means INHERIT and goes on following a room that gains a lamp. */
  #jb-root .pick { display: flex; align-items: center; gap: 12px; width: 100%;
                   padding: 12px 0; min-height: 44px; box-sizing: border-box;
                   background: none; border: none; border-bottom: 1px solid var(--lk-line);
                   font: inherit; color: inherit; text-align: start; cursor: pointer; }
  #jb-root .pick:last-child { border-bottom: none; }
  #jb-root .pick .box { flex: none; width: 20px; height: 20px; border-radius: 8px;
                        border: 1.5px solid var(--lk-box); box-sizing: border-box;
                        display: flex; align-items: center; justify-content: center;
                        font-size: 13px; font-weight: 700; color: transparent; }
  #jb-root .pick[aria-pressed="true"] .box { background: var(--lk-accent);

  function layoutOf(payload, colours) {
    if (payload.layout && payload.layout.featured) return payload.layout;
    var ids = [];
    for (var i = 0; i < colours.length; i++) {
      if (!colours[i].hidden) ids.push(colours[i].id);
    }
    return { featured: ids.slice(0, 10), more: ids.slice(10) };
  }

  function swatchFor(colour) {
    var swatch = node('button', 'swatch');
    swatch.type = 'button';
    swatch.style.background = colour.swatch;
    swatch.title = colour.label;
    swatch.setAttribute('aria-label', colour.label);
    swatch.setAttribute('aria-pressed', state.colour === colour.id ? 'true' : 'false');
    swatch.addEventListener('click', function () {
      state.colour = colour.id;
      renderColours();
      renderGrid();
      push();
    });
    return swatch;
  }

  function colourById(id) {
    for (var i = 0; i < state.colors.length; i++) {
      if (state.colors[i].id === id) return state.colors[i];
    }
    return null;
  }

  function render() {
    renderLightkeeper();
    renderGrid();
    renderPreset();
    renderLights();
    /**
     * Nothing to try when the answer is "do nothing", and a Test that ran the
     * absence of a job would be a control with nothing to prove.
     *
     * The composed job counts as unanswered until a source is chosen, for the
     * same reason: nothing has been saved yet, so a Test would demonstrate the
     * DEGRADATION — the lamps coming on at whatever they were — under a card
     * that promises the level and the warmth.
     */
    el.tryCard.style.display = state.chosen === null
      || (state.presetKind === 'lightkeeper' && !lightkeeperAnswered()) ? 'none' : '';
  }

  /**
   * The nine, and ONLY the nine.
   *
   * `state.jobs` is what the driver offers, in the order `availableFunctions`
   * yields — and the composed job trails it rather than sitting in it, because
   * it is drawn as the card above. Filtered on the preset KIND rather than on
   * the id, so the screen never carries a second list of function names to keep
   * in step with the engine's.
   */
  function renderGrid() {
    clear(el.grid);
    for (var i = 0; i < state.jobs.length; i++) {
      if (state.jobs[i].preset === 'lightkeeper') continue;
      el.grid.appendChild(renderJob(state.jobs[i]));
    }
    el.none.setAttribute('aria-pressed', state.chosen === null ? 'true' : 'false');
    el.none.className = state.chosen === null ? 'tile none sel' : 'tile none';
  }

  function renderJob(job) {
    var tile = node('button', state.chosen === job.id ? 'tile sel' : 'tile');
    tile.type = 'button';
    tile.setAttribute('aria-pressed', state.chosen === job.id ? 'true' : 'false');

    tile.appendChild(iconFor(job.id));
    tile.appendChild(node('div', 'name', job.label));

    /**
     * The value belongs to the CHOSEN tile and to no other.
     *
     * It used to read "60%" on the row whether or not that row was the answer,
     * which made one brightness look like the only brightness on offer rather
     * than like this button's own.
     */
    var value = state.chosen === job.id ? valueText(job) : '';
    if (value) tile.appendChild(node('div', 'meta', value));

    tile.addEventListener('click', function () { choose(job); });
    return tile;
  }

  function valueText(job) {
    if (job.preset === 'brightness') {
      var parts = [lk.percent(Math.round(state.brightness.brightness * 100))];
      if (state.brightness.temperature !== undefined) {
        parts.push(lk.t(warmthKey(state.brightness.temperature)));
      }
      return lk.list(parts);
    }
    if (job.preset === 'colour') {
      var colour = colourById(state.colour);
      return colour ? colour.label : '';
    }
    return '';
  }

  /**
   * A job with no value chosen yet is never SENT with no value.
   *
   * The driver refuses a "set a brightness" carrying no brightness, and rightly
   * — so the first tap fills one in rather than pushing something that will be
   * dropped and reported as an error under a tile the user has just chosen.
   */
  function choose(job) {
    state.chosen = job === null ? null : job.id;
    state.presetKind = job === null ? 'none' : job.preset;
    if (state.presetKind === 'colour' && !state.colour && state.colors.length) {
      state.colour = state.colors[0].id;
    }
    render();
    push();
  }

  /**
   * Whether the composed job has been answered at all.
   *
   * A `lightkeeper_on` naming NEITHER source is refused by the driver and by
   * the stored-plan validator alike — it is plain "On" wearing a name that
   * promises the level and the warmth as well. So the screen does not send one:
   * tapping the card opens the two rows, and the job is saved by the first
   * source that answers one of them.
   *
   * The colour job is seeded instead of waited on, and the difference is where
   * the answer lives: a palette is on this screen, so the first swatch is a
   * defensible guess. Which of somebody's Lightkeeper devices a button should
   * follow is not something this screen may guess at.
   */
  function lightkeeperAnswered() {
    return state.lightkeeper.colourSource !== 'none'
      || state.lightkeeper.brightnessSource !== 'none';
  }

  el.none.addEventListener('click', function () { choose(null); });

  function renderLights() {
    // One light and there is no second question: this button drives it, and a
    // checklist of one is a control with nothing to choose.
    var many = state.lights.length > 1;
    el.toTitle.style.display = many ? '' : 'none';
    el.lights.style.display = many ? '' : 'none';
    if (!many) return;

    clear(el.lights);
    el.lights.appendChild(pickRow(null, state.allLabel, state.chosenLights === null));
    for (var i = 0; i < state.lights.length; i++) {
      var light = state.lights[i];
      el.lights.appendChild(pickRow(
        light.id,
        light.name,
        state.chosenLights !== null && state.chosenLights.indexOf(light.id) !== -1
      ));
    }
  }

  function pickRow(id, name, ticked) {
    var row = node('button', 'pick');
    row.type = 'button';
    row.setAttribute('aria-pressed', ticked ? 'true' : 'false');
    if (id !== null) row.dataset.id = id;
    row.appendChild(node('span', 'box', '✓'));
    row.appendChild(node('span', 'name', name));
    row.addEventListener('click', function () {
      if (id === null) state.chosenLights = null;
      else toggleLight(id);
      renderLights();
      push();
    });
    return row;
  }

  /**
   * Ticking every light is the same answer as "all of them", and is STORED as
   * that answer.
   *
   * The two are not equivalent underneath: a list of ids freezes the rule
   * against the lights that existed when it was saved, while "all of them"
   * follows the device — so a room that gains a lamp gains it on this button
   * too. Two ways to say one thing, one of which quietly stops being true, is
   * worth collapsing. Clearing the last box collapses the same way, because a
   * button aimed at no lights at all is not an answer.
   */
  function toggleLight(id) {
    var chosen = state.chosenLights === null ? [] : state.chosenLights.slice();
    var at = chosen.indexOf(id);
    if (at === -1) chosen.push(id);
    else chosen.splice(at, 1);
    state.chosenLights = (chosen.length === 0 || chosen.length === state.lights.length)
      ? null
      : chosen;
  }

  el.try.addEventListener('click', function () {
    el.msg.style.display = 'none';
    emit('test', { func: state.chosen, deviceIds: state.chosenLights }).then(function (result) {
      el.msg.className = 'msg ok';
      el.msg.textContent = lk.t('job.tried', { count: result.writes });
      el.msg.style.display = '';
    }).catch(function (err) {
      el.msg.className = 'msg bad';
      el.msg.textContent = err && err.message ? err.message : String(err);
      el.msg.style.display = '';
    });
  });

  /**
   * A warmth as the WORD the rest of the app uses for it, not a number.
   *
   * The same five bands `warmthKey()` in lib/pairing/flow-screens.ts draws, and
   * the same caution: HIGH is warm (platform §6).
   */
  function warmthKey(value) {
    if (value >= 0.82) return 'warmth.deepAmber';
    if (value >= 0.62) return 'warmth.warm';
    if (value >= 0.44) return 'warmth.softWarm';
    if (value >= 0.24) return 'warmth.softWhite';
    return 'warmth.coolWhite';
  }

  function presetOrNull() {
    if (state.presetKind === 'brightness') {
      var preset = { brightness: state.brightness.brightness };
      if (state.brightness.temperature !== undefined) {
        preset.temperature = state.brightness.temperature;
      }
      return preset;
    }
    if (state.presetKind === 'colour' && state.colour) return { color: state.colour };
    if (state.presetKind === 'lightkeeper') {
      return {
        colourSource: state.lightkeeper.colourSource,
        brightnessSource: state.lightkeeper.brightnessSource,
        pressAgainOff: state.lightkeeper.pressAgainOff,
      };
    }
    return null;
  }

  function fail(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  /**
   * The choice is COMMITTED on every change, not held for a Done button.
   *
   * Homey's own chrome is the way back from a pushed screen, and it does not
   * ask this view anything on the way — so a job held until a button at the
   * bottom of the page was pressed was a job silently lost by anybody who used
   * the back arrow instead. Every tap, every slider and every switch pushes.
   *
   * Nothing jumps back to the buttons screen on a tap any more, and that is
   * this screen's own doing: it asks TWO questions now, and returning after the
   * first would put the second — which lights — out of reach of anybody who
   * answered them in the order they are written.
   */
  var pushing = 0;
  function push() {
    // See `lightkeeperAnswered`: an unanswered composed job is not yet a job,
    // and sending one would put the driver's refusal under a card the user has
    // just this moment tapped.
    if (state.presetKind === 'lightkeeper' && !lightkeeperAnswered()) {
      return Promise.resolve(true);
    }
    var mine = ++pushing;
    return emit('setGesture', {
      job: state.chosen,
      preset: presetOrNull(),
      lights: state.chosenLights,
    })
      .then(function () { el.error.style.display = 'none'; return true; })
      .catch(function (err) { if (mine === pushing) fail(err); return false; });
  }

  emit('getGesture').then(function (payload) {
    el.title.textContent = payload.title;
    state.jobs = payload.jobs || [];
    state.chosen = payload.chosen;
    state.presetKind = payload.presetKind || 'none';
    state.colors = payload.colors || [];
    state.layout = layoutOf(payload, state.colors);
    state.lights = payload.lights || [];
    state.allLabel = payload.allLabel || '';
    state.chosenLights = payload.chosenLights || null;
    state.sourceNames = payload.sourceNames || { colour: '', brightness: '' };
    state.sourceWarnings = payload.sourceWarnings || { colour: null, brightness: null };
    state.lkJob = null;
    for (var j = 0; j < state.jobs.length; j++) {
      if (state.jobs[j].preset === 'lightkeeper') state.lkJob = state.jobs[j];
    }
    /**
     * Which stored preset this is, by the field only that kind has.
     *
     * Three kinds now, so the old two-arm `color ? … : …` would have read a
     * composed preset as a brightness and put its two device ids on the
     * brightness slider. Discriminated in the same order and on the same fields
     * as `isLightkeeperPreset`/`isColorPreset` do one layer down.
     */
    if (payload.preset && payload.preset.colourSource !== undefined) {
      state.lightkeeper = {
        colourSource: payload.preset.colourSource,
        brightnessSource: payload.preset.brightnessSource,
        pressAgainOff: payload.preset.pressAgainOff !== false
      };
    } else if (payload.preset && payload.preset.color) state.colour = payload.preset.color;
    else if (payload.preset) state.brightness = payload.preset;
    render();
  }).catch(fail);
}
(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootJb(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('jb-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootJb(ready || window.Homey); };
  waitForHomey();
})();
</script>
