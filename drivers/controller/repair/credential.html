<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #cr-wrap {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-line: #d9cbf5;
    /* Between the accent and its line. The middle of the three listening dots,
       and the only place a mid-tone is needed: the logo has none. */
    --lk-accent-mid: #9f81dc;
    /* A block on the schedule timeline that is not the one being edited. It
       borrowed --lk-accent-line, which is the edge of a numbered badge and a
       step too pale to hold a 52px bar: four of them across a grey track read
       as a smudge rather than as the day's other windows. */
    --lk-block: #b9a6e4;
    /* And a block on a timeline where NOTHING is selected — the review's
       picture of the finished day. Deeper than the one above because the pale
       violet only exists to recede behind a selected block, and on a review
       there is nothing for it to recede behind: four faint bars on a grey
       track read as a chart that had failed to load. */
    --lk-block-settled: #7a57c8;
    --lk-accent-strong: #3b2279;
    /* Two more steps down the same violet, for the three-bar level picture: it
       is a LEVEL rather than a direction, so only the tallest bar is at full
       strength and the two under it fall away. Derived from the accent the same
       way the tints are — the logo has no mid-tones to read them out of. */
    --lk-level-mid: #7a62c0;
    --lk-level-low: #c4b8e4;

    /* Drawn ON the accent tint rather than on white, and that is the whole
       reason these three exist. A grey hairline on #f3eefc is the one place in
       this palette where a neutral reads as dirty, and --lk-muted on it reads
       as faded rather than as secondary. So the tint gets its own edge, its own
       rule and its own second ink, all violet-shifted to match the ground they
       sit on. */
    --lk-tint-line: #e2d8f6;
    --lk-tint-rule: #f0ecfa;
    --lk-tint-ink: #5a4d80;
    --lk-ring: rgba(42, 25, 88, .16);
    /* The edge of a handle nobody has selected. It is NOT --lk-ring: at .16 a
       26px circle on an orange strip had no edge at all, and the second
       boundary looked like a smudge rather than something to drag. */
    --lk-handle-edge: rgba(42, 25, 88, .45);

    /* The ink ladder: THREE greys, and the design canvas has no fourth.

       It had five. --lk-sub (#5f6672) and --lk-faint (#6f7683) sat either side
       of --lk-muted and were never a step anybody could see — #6f7683 against
       #6a7180 is a difference of five in one channel, which is not a decision,
       it is a drift. Both are gone and their consumers took the neighbour the
       canvas actually draws: an end-caption and the midnight/noon line are
       --lk-body, everything else that was faint is --lk-muted.

       All three clear WCAG AA (4.5:1) against --lk-surface, because all three
       are used between 10.5px and 15px. Collapsing --lk-faint RAISED the
       contrast of every caption that used it, from 4.6:1 to 4.9:1. What
       separates the steps is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;

    /* THREE BORDER ROLES, and they do not overlap. This is the rule the design
       system is strictest about, and the one this app had most wrong: --lk-line
       was drawing card edges AND the dividers inside them, so a card's outline
       and the hairlines between its rows were the same weight of grey and the
       card had no edge at all at arm's length.

         --lk-edge  every card and control BOX, at 1px or 1.5px
         --lk-line  ONLY a 1px divider inside a card — never a box
         --lk-box   ONLY the 22px checkbox and radio

       --lk-edge also serves as the disabled fill, which is what the system's
       own Disabled specimen draws — see .btn:disabled. */
    --lk-edge: #dfe3e9;
    --lk-line: #eceef2;
    /* The edge of an UNTICKED box or radio, and only that. A shade darker than
       --lk-edge because an empty checkbox has to read as a control somebody
       has not used yet; at the card-edge grey it reads as a gap in the row. */
    --lk-box: #d4d8e0;
    /* Dashed only: "nothing here yet, and that is expected" — empty states and
       add-slots. It is never a solid edge and never mixed with one. */
    --lk-hover: #c9d2e0;
    /* A chevron is an affordance, not a value: lighter than the text it sits
       beside, so a list of rows reads as labels rather than as arrows.

       #a8aeb9 took that too far. A non-text UI component still owes 3:1, and
       at #a8aeb9 the chevron was 2.4:1 — an affordance nobody has to read is
       still one somebody has to SEE. The canvas's #8f97a3 is 3.2:1 and is
       still visibly lighter than every ink in the ladder above. */
    --lk-chev: #8f97a3;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-knob-shadow-warm: 0 0 0 2.5px #ffffff, 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The ring around a knob drawn at icon scale, where the full
       --lk-slider-knob-shadow is two shadows on a 4px mark and comes out as a
       smudge. One ring, half a pixel thinner than the real control's. */
    --lk-knob-edge: rgba(22, 24, 29, .5);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #f3eefc);
    /* How light it is OUTSIDE, pale to deep — the third axis this app draws,
       and the only one that runs dark at the TOP of its range rather than the
       bottom. It is the week grid's scale, and its six stops are the same six
       the cells are quantised to: `SHADES` in views/shared/week-grid.js, which
       cannot read a custom property and so carries them again. Change one and
       change the other; `pair-view-styles.test.ts` checks that they agree.

       FIVE steps, not six. The sixth was --lk-accent-strong, one step past the
       point where two cells could be told apart at 11px tall, and the design
       system fixes the heatmap at five. */
    --lk-lux-ramp: linear-gradient(90deg, #f4f2fa, #e0d6f6, #c4b0ec,
                                   #9f81dc, #6b48bc);
    /* The same stops the other way round, for the sun's own height.
       Reversed on purpose: the lux ramp measures HOW MUCH LIGHT there is, so
       more light is more ink, while this one is a picture of the DAY — and the
       dark end of a day is the night. The two never meet on screen, because a
       Room-sensing Light has a sensor or it has the sun. */
    --lk-sun-ramp: linear-gradient(90deg, #3b2279, #6b48bc, #9f81dc,
                                   #c4b0ec, #f4f2fa);
    /* The hours of a "when does this room get its sun?" tile: the ones that
       ARE this room's sun, and the ones that are the day going on around it. */
    --lk-peak-on: #4b2ea0;
    --lk-peak-off: #dfd4f4;
    /* The two ENDS of the warmth axis, for the two tiles that nudge along it
       rather than setting it. The whole ramp draws the same picture on both,
       which is no picture at all, so each of these runs from the middle of
       --lk-warm-ramp out to one end of it.
       The cool end is DEEPER than that ramp's own #dbe8fb: at 30x12px on white
       the real end of the axis is a chip with no edge, so the tile that said
       "cooler" showed nothing at all. Deepened to where it reads, and no
       further — it is a picture of a direction, not a colour to match. */
    --lk-warmer-ramp: linear-gradient(90deg, #f2e6d6, #e8892c);
    --lk-cooler-ramp: linear-gradient(90deg, #f2e6d6, #9fc0f0);
    /* A lamp that is ON, drawn rather than named: the one warm accent in an
       interface that is otherwise entirely violet, because "on" is a picture of
       light and the brand colour is a picture of the app. */
    --lk-lamp-lit: #f4c24a;
    --lk-lamp-glow: rgba(244, 194, 74, .32);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    /* The halo round a SELECTED block on the schedule timeline, and round a
       selected swatch. Softer than --lk-ring is used for elsewhere, because it
       is drawn against the accent itself rather than against white. */
    --lk-select-halo: 0 0 0 3px rgba(42, 25, 88, .18);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    /* The two-hour cell a sensor reported NOTHING in, drawn as a hatch. Its own
       two colours because nothing else in the app is a hatch: the pale stripe
       has to sit above --lk-line without becoming white (a white stripe made
       the cell read as missing from the grid rather than as empty in it), and
       the edge has to hold the cell's rectangle at 11px tall, which the stripes
       alone do not. */
    --lk-hatch-pale: #f7f8fa;
    --lk-hatch-edge: #dfe3e9;
    --lk-day-mark: rgba(22, 24, 29, .4);
    /* The curve chart's own "you are editing this point" line. Accent rather
       than ink, because on that chart it marks a SELECTION; on the day strip
       the dashed lines mark sunrise and sunset, which are facts. */
    --lk-curve-mark: rgba(42, 25, 88, .55);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    /* Success is a DOT, never a ground. There is no green banner in this
       system: a tinted block is for a finding somebody has to act on, and
       "that worked" is not one. The green appears at 8px beside the sentence
       and nowhere else. */
    --lk-ok-dot: #5aa86b;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    /* A key the Homey accepted and then refused to build a Flow with. Its own
       colour rather than --lk-bad-ink, and a full step lighter, because it is
       drawn as an EDGE round a field and as a 16px badge — at #8f1d18 a
       1.5px border round a white field read as damage, and the message beside
       it says the key itself is fine. */
    --lk-reject: #c05a3e;
    --lk-flat-bg: #f4f5f7;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 16px under a heading, which is the gap the design draws on every screen
     that puts a control straight below one. It used to be 4px, and at 4px a
     title read as a label ON the first card rather than as the name of the
     screen.

     `text-wrap: balance` is for the titles that do not fit on one line, and the
     longest is the sensor picker's: measured at 311px — a 390px phone, less
     Homey's gutter, our padding and the scrollbar gutter — it breaks 295px +
     54px, which leaves `from?` alone on the second line. Balanced it is
     163 + 185. Not a workaround for a title that is too long: at 20px it needs
     354px, and even 18px needs 319px, so there is no size that holds it on one
     line at phone width without shrinking every other title in the app by an
     eighth. A one-line title is unaffected, so this costs the other screens
     nothing, and a browser without it wraps exactly as before. */
  #cr-wrap h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
             text-wrap: balance; }
  #cr-wrap .sub { font-size: 15px; line-height: 1.5; color: var(--lk-body); margin: 0 0 18px; }
  /* A blurb belongs TO its heading — 6px between them, not 16. Written as a
     pull on the blurb rather than as `h2:has(+ .sub)` on the heading because
     the pairing container's webview is not somewhere to find out whether
     `:has()` landed. */
  #cr-wrap h2 + .sub { margin-top: -10px; }
  #cr-wrap p { font-size: 15px; line-height: 1.5; color: var(--lk-body); }

  #cr-wrap .card { background: var(--lk-surface); border: 1px solid var(--lk-edge);
              border-radius: 16px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #cr-wrap .section { margin-bottom: 18px; }
  /* The label over a group — "Does", "To", "When does this room get its sun?".
     It is a .control-title with nothing on its right: the same 16/600 ink,
     sentence case. It used to be 12px uppercase small-caps in the faintest
     grey, which made the two words holding the job screen's sentence together
     read as filing-cabinet labels rather than as the sentence's own verbs.

     16 is the CONTROL size — group headings and every button share it, which is
     why it sits so close to body 15. */
  #cr-wrap .section-title { font-size: 16px; font-weight: 600; line-height: 1.2;
                       color: var(--lk-ink); margin: 0 0 9px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #cr-wrap .tile { display: block; width: 100%; text-align: start; background: var(--lk-surface);
              border: 1.5px solid var(--lk-edge); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #cr-wrap .tile:hover { border-color: var(--lk-hover); }
  #cr-wrap .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #cr-wrap .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #cr-wrap .tile .meta { font-size: 13px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #cr-wrap input[type=text], #cr-wrap input[type=password], #cr-wrap select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-edge); border-radius: 12px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #cr-wrap select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-inline-end: 34px; }
  /* Arabic reads right to left, so the chevron sits on the other end — where
     `padding-inline-end` has already made room for it. */
  #cr-wrap[dir="rtl"] select { background-position: left 13px center; }
  #cr-wrap input:focus, #cr-wrap select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  /* EVERY in-app button is the same shape: 16/600, 48px, radius 12, full
     width. Three variants and nothing else — solid accent to commit, accent
     outline for a reversible action, edge outline to dismiss. The blue pill in
     the pairing footer is Homey's own chrome and is never ours to draw.

     This used to be four shapes at three sizes (14/500 at 40px here, 16/600 at
     50px on `.wide`, 15/500 at 48px on `.wide.accent`), which is how a set of
     buttons stops reading as a set. */
  #cr-wrap .btn { font-family: inherit; font-size: 16px; font-weight: 600; padding: 14px;
             border-radius: 12px; border: 1.5px solid var(--lk-edge);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 48px; box-sizing: border-box; }
  #cr-wrap .btn:hover { border-color: var(--lk-hover); }
  /* Disabled is a COLOUR change, never an opacity change. Dropping opacity
     takes the label under 4.5:1 and fades the button's own edge with it, so the
     control stops reading as a control at all rather than as an unavailable
     one. Fill goes to the divider grey, ink and border to the furniture grey. */
  #cr-wrap .btn:disabled { border-color: var(--lk-line); color: var(--lk-chev);
                        cursor: not-allowed; }
  /* The same button across the width of the screen. What a secondary action
     looks like when it is the only one on a pushed screen — "Close" — where a
     primary button would claim the choice was made. */
  #cr-wrap .btn.wide { display: block; width: 100%; margin-top: 16px; }
  /* And the same button when it is the SECOND of two, under a primary — "Stop
     preview" — or the one secondary action inside a card, as "Test my lights"
     is on the review screen. It borrows the primary's outline rather than the field grey,
     because the pair is one decision offered twice ("show me" / "undo that")
     and a grey partner reads as the disabled twin of the button above it.
     Lighter than the primary in weight and height, never in hue. */
  #cr-wrap .btn.wide.accent { border-color: var(--lk-accent); color: var(--lk-accent); }
  #cr-wrap .btn-primary { display: block; width: 100%; font-size: 16px; font-weight: 600;
                     padding: 14px; box-sizing: border-box;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 48px;
                     margin-top: 16px; font-family: inherit; }
  /* A button in flight keeps its exact size and takes the disabled fill; its
     LABEL is what says it is working, swapped to the present participle of its
     own verb by the view. There is no spinner in this system because there is
     no icon set. */
  #cr-wrap .btn-primary:disabled { background: var(--lk-line); color: var(--lk-chev);
                                cursor: progress; }

  /* An inline text action inside a card — "Show more colours", "Test it on my
     lights". Not a button shape: it is a link that happens to be a <button>,
     because it changes what is on the screen rather than committing anything.

     SHARED because it was defined four times, and the fourth had drifted to
     13px in the wrong violet and left-aligned as a block — which is how a
     control that should be one thing becomes two. */
  #cr-wrap .morelink { display: flex; align-items: center; min-height: 44px;
                    box-sizing: border-box; margin-top: 9px; padding: 0;
                    background: none; border: none; font-family: inherit;
                    font-size: 15px; font-weight: 500;
                    color: var(--lk-accent-strong); cursor: pointer; }
  #cr-wrap .morelink:disabled { color: var(--lk-chev); cursor: progress; }

  /* An add-slot: a dashed frame where a thing is not yet. The dashed edge means
     "nothing here yet, and that is expected" — the same edge the empty states
     use, and never mixed with a solid one on the same element. */
  #cr-wrap .add { display: flex; align-items: center; justify-content: center;
               width: 100%; min-height: 48px; box-sizing: border-box;
               margin-bottom: 16px; padding: 13px; border-radius: 12px;
               border: 1.5px dashed var(--lk-hover); background: none;
               font-family: inherit; font-size: 15px; font-weight: 500;
               line-height: 1; color: var(--lk-accent-strong); cursor: pointer; }

  /* And the destructive text row that closes an editing card. Centred under a
     rule, because it acts on the card it sits in rather than on the screen —
     and in the one colour this system reserves for damage. */
  #cr-wrap .remove { display: flex; align-items: center; justify-content: center;
                  width: 100%; min-height: 44px; box-sizing: border-box;
                  margin-top: 13px; padding: 13px 0 0;
                  background: none; border: none;
                  border-top: 1px solid var(--lk-line);
                  font-family: inherit; font-size: 15px; font-weight: 500;
                  line-height: 1; color: var(--lk-bad-ink); cursor: pointer; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #cr-wrap .msg { margin-top: 14px; padding: 12px 13px; border-radius: 12px; font-size: 13px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-ink); }
  /* SUCCESS IS A DOT, NOT A GROUND. A tinted block is for a finding somebody
     has to act on; "that worked" is not one, and a green panel gave the same
     weight to "Key accepted." as to a sensor that has stopped reporting. The
     ground stays neutral and an 8px dot carries the good news. */
  #cr-wrap .ok { display: flex; align-items: baseline; gap: 8px; }
  #cr-wrap .ok::before { content: ''; flex: none; width: 8px; height: 8px;
                      border-radius: 50%; background: var(--lk-ok-dot); }
  #cr-wrap .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #cr-wrap .muted { background: var(--lk-flat-bg); color: var(--lk-ink); }
  #cr-wrap .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #cr-wrap .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #cr-wrap ol { font-size: 15px; line-height: 1.75; padding-inline-start: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #cr-wrap .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #cr-wrap .grid { grid-template-columns: 1fr; } }
  #cr-wrap .empty { font-size: 15px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */

   * way round — the state says what happened, and clearing it is the user's
   * move, not the screen's.

    flag.style.display = 'none';
    field.style.display = '';
    field.value = '';
    field.focus();

  shown.addEventListener('click', reset);

  function reject(status) {
    flag.textContent = failureText(status);
    flag.style.display = '';
    document.getElementById('cr-msg').style.display = 'none';
  }

   *
   * `status.hint` is produced by describeFailure() in lib/credential-service.ts
   * and is always English — lib/ has no access to Homey.__. The failure CODE is
   * what carries the translation, so prefer it and keep the hint as a fallback.
   * Mirrors credentialFailureKey() on the app side.

    if (!status) return lk.t('credential.failed');
    switch (status.failure) {
      case 'malformed': return lk.t('credential.malformed');
      case 'session_expired': return lk.t('credential.expired');
      case 'insufficient_scope': return lk.t('credential.noScope');
      case 'unknown': return lk.t('credential.unreachable');
      default: return status.hint || lk.t('credential.failed');

    var el = document.getElementById('cr-msg');
    el.className = 'msg ' + cls;
    el.textContent = text;
    el.style.display = 'block';
  }

  // driver that needs an API key — the remote controller goes on to pick a
  // remote, a light schedule goes straight to picking lights — and a pair view
  // cannot read the driver manifest, so the DRIVER says which view is next and
  // this stays identical in both. The fallback is the controller's, for the
  // case where an older driver has not been told to answer — and it has to be a
  // view id that EXISTS, because showView() on an unknown id draws an empty
  // screen instead of failing. It read 'source' until the pairing rewrite
  // renamed that view to 'remote'.

  // Kept hidden until we know whether it is needed, so a user who already has
  // a key never sees a setup screen flash past.

    if (status && status.nextView) nextView = status.nextView;
    var alreadyHave = status && (status.valid || (status.present && !status.failure));

    if (status && status.present && status.failure) reject(status);

    show('bad', err.message || String(err));

     * success, which is why this is a named function rather than a line in the
     * happy path.
     *
     * Every pair view of a session is injected into ONE document (platform §8),
     * and that document also renders third-party device and zone names on the
     * next screen. Leaving a plaintext Personal API Key in an input there is not
     * a live vulnerability — no view assigns `innerHTML` at all any more, so
     * there is no markup path for one of those names to escape through — but it
     * is the thing the whole webview perimeter exists to make unnecessary, and
     * `settings/index.html` already clears its own field.
     *
     * `webview-safety.test.ts`'s "no view reads the API key" asserts something
     * adjacent, not this: that no view names the SETTINGS STORAGE KEY the token
     * is filed under. (Not quoting that name here on purpose — the same test
     * would flag this comment for it.) Retaining a pasted key was uncovered.
     */
    var forget = function () { field.value = ''; };

  /**
   * A button in flight says so on its own face.
   *
   * It keeps its exact size and takes the disabled fill; only the LABEL
   * changes, to the present participle of the verb it already had — Save
   * becomes Saving…, Show becomes Showing… — so the word never jumps to
   * something unrelated and the button never resizes under the thumb.
   *
   * There is no spinner anywhere in this app, because there is no icon set:
   * five text glyphs and nothing else.
   */

    var was = button.textContent;
    button.disabled = true;
    button.textContent = lk.t(key);
    return function () {
      button.disabled = false;
      button.textContent = was;
    };
  }

    // The button was never disabled here, so a slow Homey invited a second and
    // a third tap on a key that was already being checked.
    var done = inFlight(document.getElementById('cr-save'), 'credential.saving');
    show('muted', lk.t('credential.checking'));
    emit('setCredential', key).then(function (status) {
      forget();
      done();
      if (status && status.valid) {
        show('ok', lk.t('credential.accepted'));
        Homey.showView(nextView);
        return;
      }
      // The key was read and refused. Mask it, drop the original, and let the
      // masked copy stand in for the field until the user taps it.
      shown.textContent = mask(key);
      field.style.display = 'none';
      shown.style.display = '';
      reject(status);
    }).catch(function (err) {
      forget();
      done();
      show('bad', err.message || String(err));
    });
  });
