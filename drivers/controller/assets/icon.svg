<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <title>Remote-to-light controller</title>
  <desc>A handheld remote with a rotary wheel above three buttons.</desc>

  <!-- Delivered as a CSS mask painted with a theme colour, fetched from Athom's
       icon CDN by this file's MD5 — see ../../../assets/icon.svg for the whole
       mechanism, including why a CLI-installed app correctly shows no icon at
       all and why colour inside an icon is discarded. -->

  <!-- Line art, for the reasons recorded in ../../../assets/icon.svg: guideline
       1.6 asks for "a clean, vector-based drawing… drawn using lines and shapes",
       transparent, full canvas, and Homey renders icons white in several
       surfaces, where a filled body loses every internal detail.

       The wheel is what distinguishes this device from any other remote, so it
       takes the top third at a diameter no smaller than the body allows. Three
       buttons rather than the two the old filled mark used: as outlines they stay
       separate at 32 px, where filled dots merged into a bar. -->
  <g stroke="#000" fill="none" fill-rule="evenodd" stroke-width="40"
     stroke-linejoin="round" stroke-linecap="round">
    <rect x="270" y="90" width="420" height="780" rx="140"/>
    <circle cx="480" cy="315" r="135"/>
    <circle cx="480" cy="580" r="58"/>
    <circle cx="480" cy="700" r="58"/>
    <circle cx="480" cy="820" r="58"/>
  </g>
</svg>
