<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <title>Remote-to-light controller</title>
  <desc>A handheld controller with a rotary wheel above three buttons.</desc>

  <!-- Solid body rather than a 52 px outline: in a device list this renders
       small enough that an outline and its interior read as a single shape,
       so the outline buys nothing and costs contrast. -->
  <rect x="250" y="80" width="460" height="800" rx="150" fill="#1F3A5F"/>

  <!-- The wheel is what distinguishes this device, so it takes the amber and
       most of the upper body. The eight tick marks that used to ring it were
       invisible below ~64 px and only added noise above it. -->
  <circle cx="480" cy="300" r="150" fill="none" stroke="#F2A93B" stroke-width="76"/>

  <circle cx="480" cy="575" r="40" fill="#F2A93B"/>
  <circle cx="480" cy="685" r="40" fill="#F2A93B"/>
  <circle cx="480" cy="795" r="40" fill="#F2A93B"/>
</svg>
