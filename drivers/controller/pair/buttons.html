<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #bt-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    /* Between the accent and its line. The middle of the three listening dots,
       and the only place a mid-tone is needed: the logo has none. */
    --lk-accent-mid: #9f81dc;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);
    /* The edge of a handle nobody has selected. It is NOT --lk-ring: at .16 a
       26px circle on an orange strip had no edge at all, and the second
       boundary looked like a smudge rather than something to drag. */
    --lk-handle-edge: rgba(42, 25, 88, .45);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    /* The edge of an UNTICKED box or radio, and only that. A shade darker than
       --lk-field because an empty checkbox has to read as a control somebody
       has not used yet; at the field grey it reads as a gap in the row. */
    --lk-box: #d4d8e0;
    --lk-hover: #c9d2e0;
    /* A chevron is an affordance, not a value: lighter than the text it sits
       beside, so a list of rows reads as labels rather than as arrows. */
    --lk-chev: #a8aeb9;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-knob-shadow-warm: 0 0 0 2.5px #ffffff, 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    /* The two ENDS of the warmth axis, for the two tiles that nudge along it
       rather than setting it. The whole ramp draws the same picture on both,
       which is no picture at all, so each of these runs from the middle of
       --lk-warm-ramp out to one end of it.
       The cool end is DEEPER than that ramp's own #dbe8fb: at 30x12px on white
       the real end of the axis is a chip with no edge, so the tile that said
       "cooler" showed nothing at all. Deepened to where it reads, and no
       further — it is a picture of a direction, not a colour to match. */
    --lk-warmer-ramp: linear-gradient(90deg, #f7efe3, #e8892c);
    --lk-cooler-ramp: linear-gradient(90deg, #f7efe3, #7ba7e0);
    /* A lamp that is ON, drawn rather than named: the one warm accent in an
       interface that is otherwise entirely violet, because "on" is a picture of
       light and the brand colour is a picture of the app. */
    --lk-lamp-lit: #f0b429;
    --lk-lamp-glow: rgba(240, 180, 41, .22);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    /* A small mark lifted off whatever it is drawn ON — the curve chart's
       selected point, which sits on top of a bar of any colour. */
    --lk-mark-shadow: 0 1px 4px rgba(16, 24, 40, .3);
    /* The halo round a SELECTED block on the schedule timeline, and round a
       selected swatch. Softer than --lk-ring is used for elsewhere, because it
       is drawn against the accent itself rather than against white. */
    --lk-select-halo: 0 0 0 3px rgba(42, 25, 88, .18);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    /* The curve chart's own "you are editing this point" line. Accent rather
       than ink, because on that chart it marks a SELECTION; on the day strip
       the dashed lines mark sunrise and sunset, which are facts. */
    --lk-curve-mark: rgba(42, 25, 88, .55);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 16px under a heading, which is the gap the design draws on every screen
     that puts a control straight below one. It used to be 4px, and at 4px a
     title read as a label ON the first card rather than as the name of the
     screen.

     `text-wrap: balance` is for the titles that do not fit on one line, and the
     longest is the sensor picker's: measured at 311px — a 390px phone, less
     Homey's gutter, our padding and the scrollbar gutter — it breaks 295px +
     54px, which leaves `from?` alone on the second line. Balanced it is
     163 + 185. Not a workaround for a title that is too long: at 20px it needs
     354px, and even 18px needs 319px, so there is no size that holds it on one
     line at phone width without shrinking every other title in the app by an
     eighth. A one-line title is unaffected, so this costs the other screens
     nothing, and a browser without it wraps exactly as before. */
  #bt-root h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
             text-wrap: balance; }
  #bt-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-body); margin: 0 0 18px; }
  /* A blurb belongs TO its heading — 6px between them, not 16. Written as a
     pull on the blurb rather than as `h2:has(+ .sub)` on the heading because
     the pairing container's webview is not somewhere to find out whether
     `:has()` landed. */
  #bt-root h2 + .sub { margin-top: -10px; }
  #bt-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #bt-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #bt-root .section { margin-bottom: 18px; }
  #bt-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #bt-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #bt-root .tile:hover { border-color: var(--lk-hover); }
  #bt-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #bt-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #bt-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #bt-root input[type=text], #bt-root input[type=password], #bt-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #bt-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #bt-root input:focus, #bt-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #bt-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #bt-root .btn:hover { border-color: var(--lk-hover); }
  #bt-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  /* The same button across the width of the screen. What a secondary action
     looks like when it is the only one on a pushed screen — "Stop listening",
     "Close" — where a primary button would claim the choice was made. */
  #bt-root .btn.wide { display: block; width: 100%; font-size: 16px; font-weight: 600;
                    padding: 14px; border-radius: 12px; min-height: 50px;
                    box-sizing: border-box; margin-top: 16px; }
  #bt-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #bt-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #bt-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #bt-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #bt-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #bt-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #bt-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #bt-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #bt-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #bt-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #bt-root .grid { grid-template-columns: 1fr; } }
  #bt-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #bt-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #bt-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  /* Four steps, narrower dots: the run keeps the same overall width whether a
     flow has three or four, so the header does not visibly grow between two
     device types. */
  #bt-root .steps.tight i { width: 16px; }
  #bt-root .steps i.on { background: var(--lk-accent); }
  #bt-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened.

     The row carries NO horizontal padding, and its card carries it instead
     (`.card.rows` below). That is what insets the hairline between two rows
     from the card's own edge — a rule that runs corner to corner reads as the
     card being cut in half, and every list the design draws insets it. */
  #bt-root .row { display: flex; align-items: center; gap: 10px; width: 100%;
               padding: 13px 0; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #bt-root .row + .row { border-top: 1px solid var(--lk-line); }
  #bt-root .row .label { flex: 1; font-size: 14.5px; }
  #bt-root .row .value { font-size: 14px; color: var(--lk-muted); text-align: right; }
  #bt-root .row .chev { flex: none; font-size: 15px; color: var(--lk-chev); }
  #bt-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }
  /* The card a list of rows lives in. 4px top and bottom rather than 14:
     a row's own 13px is already the space above the first label, and adding
     the card's to it put a visible step between the card's edge and its
     first line that no other card has. */
  #bt-root .card.rows { padding: 4px 14px; }

  /* The pill switch behind every "Set … too".
     It carries a rule above it, always: a toggle is a new decision inside a
     card that was until then about one thing, and without the rule it read as
     the last line of the control above it. */
  #bt-root .toggle { display: flex; align-items: center; gap: 10px; width: 100%;
                  border-top: 1px solid var(--lk-line);
                  margin-top: 14px; padding: 13px 0 0;
                  min-height: 44px; box-sizing: border-box;
                  background: none; border-left: none; border-right: none;
                  border-bottom: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #bt-root .toggle .label { flex: 1; font-size: 14.5px; }
  #bt-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #bt-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #bt-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #bt-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #bt-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #bt-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #bt-root .slider.warm { background: var(--lk-warm-ramp); box-shadow: none; }
  #bt-root .slider.bright { background: var(--lk-bright-ramp); }
  #bt-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  /* The two ramps take OPPOSITE knobs, and that is not a slip: the warmth ramp
     is light from end to end, so a white knob on it is invisible; the
     brightness ramp starts at near-black, so a dark one is. Each knob is the
     colour its own track is not. */
  #bt-root .slider.warm .knob { background: var(--lk-ink);
                             box-shadow: var(--lk-slider-knob-shadow-warm); }
  #bt-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-faint); margin: 9px 0 0; }

  /* An aside under a control: "there is a device type that does this for you".
     Deliberately NOT a .msg — a message has a coloured ground and is about
     something that just happened, and this is a pointer nobody has to read to
     finish the screen. So no ground, the faint ink, italic, and one mark in
     front of every one of them so they read as the same kind of thing on four
     different screens.

     It sits directly under the control it qualifies rather than at the foot of
     the card, because three of the four screens carry a second control below
     it and an aside that floated to the bottom would read as belonging to
     that one instead. */
  #bt-root .tip { display: flex; align-items: flex-start; gap: 7px;
               margin: 13px 0 0; font-size: 12px; line-height: 1.45;
               font-style: italic; color: var(--lk-faint); }
  /* The circled i, DRAWN rather than set. A glyph that the phone's font does
     not carry renders as a box, which is why the one other mark this design
     puts inside text — the row chevron — is an entity rather than an icon; a
     circle and a letter need no font at all. Upright inside the italic line,
     because a sloped circle reads as a smudge at 15px. `line-height` is the
     content box (15px less two 1.2px borders), which is what centres the
     letter without a second flex container.

     A pseudo-element rather than a span, so a view's whole tip is one element
     whose text `data-i18n` fills: Homey's own i18n pass writes the element's
     text, and a mark written as a child would be written over. */
  #bt-root .tip::before { content: "i"; flex: none; box-sizing: border-box;
                       width: 15px; height: 15px; margin-top: 1px;
                       border: 1.2px solid var(--lk-chev); border-radius: 50%;
                       font-size: 10px; font-weight: 700; font-style: normal;
                       line-height: 12.6px; text-align: center;
                       color: var(--lk-chev); }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #bt-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 7px; margin: 0 0 11px; }
  /* min-height as well as height: the container's own stylesheet is not ours
     to read, and a swatch whose height is overridden away is a coloured line
     rather than a colour anybody can judge. */
  #bt-root .swatch { height: 34px; min-height: 34px; border-radius: 9px; padding: 0;
                  box-sizing: border-box;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  /* The chosen colour, and it has to survive being ON a colour: a ring drawn
     in the accent with a soft halo outside it reads against every swatch in
     the palette, which a white gap did not against the pale ones. */
  #bt-root .swatch[aria-pressed="true"] { border: 2.5px solid var(--lk-accent);
                                       box-shadow: 0 0 0 3px var(--lk-ring); }
  /* The sixteen that fold out: same set, half the size, eight across.

     18px above them, not the 7px between the featured rows: at the same gap the
     fold-out read as two more rows of the grid above it rather than as the set
     that had just been opened, and the eye had to measure swatch sizes to find
     where one group ended. The space is what separates them; both sets are
     still the same palette, so nothing stronger than space is wanted. */
  #bt-root .swatches.more { grid-template-columns: repeat(8, 1fr); gap: 6px;
                         margin: 18px 0 0; }
  #bt-root .swatches.more .swatch { height: 28px; min-height: 28px; border-radius: 7px; }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #bt-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #bt-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #bt-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #bt-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-handle-edge); z-index: 1;
                       box-shadow: var(--lk-handle-shadow); }
  #bt-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #bt-root .clockline { display: flex; justify-content: space-between;
                     font-size: 11px; color: var(--lk-faint); margin: 8px 2px 4px; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  /* THE NAMES ON THIS SCREEN ARE NOT FREE, and that is what was wrong with it.

     A pair view is injected into the pairing container's OWN document (see the
     script header), so a class name is shared with whatever the container
     styles under the same name. This screen's rows called their two lines
     `.button` and `.action` and their value `.job` — names that describe
     exactly what they are, and that a UI framework is likely to have spent
     already. On a real Homey every gesture's name came out inside the
     container's grey pill, with its own padding and its own ink, while the
     local render — one view alone on a white page, nothing else in the
     document — drew the design. A render cannot show this class of defect at
     all; only hardware can.

     So the rows are built from the base's own `label · value · chevron`
     vocabulary instead, which every other list in the app already uses and
     which is the shape the design draws here. What is left below is the three
     things this list does differently, and nothing else. */

  #bt-root .gesture .what { flex: 1; }

  /* WHAT IS SET AND WHAT IS NOT, before a word of the row is read.

     A dot at the head of the row: filled in the app's own violet where the
     button has a job, an empty ring where it has none. The state used to be
     carried by the value alone — one grey word against four dark ones, at the
     far end of the row from the name it belongs to — and counting what was
     left to do meant reading the right-hand column downwards. A mark in the
     margin makes the same list answer it at a glance, and the two marks differ
     in FILL rather than in colour, so the answer survives a glance, a small
     screen and a colour-blind reader.

     It is aligned to the first line rather than to the row, because the row is
     two lines high and a dot centred between them points at neither. */
  #bt-root .gesture .mark { flex: none; width: 9px; height: 9px; border-radius: 50%;
                            align-self: flex-start; margin-top: 5px;
                            box-sizing: border-box; background: var(--lk-accent); }
  #bt-root .gesture.unset .mark { background: none; border: 1.5px solid var(--lk-box); }

  /* A job reads as a VALUE on the row, not as a link: the whole row is the
     target and colouring the value accent made it look like the only tappable
     part of it. It carries the weight instead — the name and its job are the
     two things this screen is a list OF, and the gesture's second line is what
     they are read against. */
  #bt-root .gesture .label,
  #bt-root .gesture .value { font-weight: 600; color: var(--lk-ink); }
  /* The job and its lights, as one line under the button's name. It takes the
     base's row sub — 12.5px, muted — and only needs saying here because it may
     be the longer of the two lines and must not wrap into the value. */
  #bt-root .gesture .sub { line-height: 1.35; }
  /* A gesture with no job is not a warning, so an unset row recedes rather than
     alerting: no red, no badge, nothing to clear. A four-button remote where
     two buttons do nothing is a remote somebody set up exactly as they meant
     to, and this row says so quietly enough to be left alone. */
  #bt-root .gesture.unset .label,
  #bt-root .gesture.unset .value { font-weight: 400; color: var(--lk-muted); }

  /* The row a real press landed on. It is the only feedback that the press was
     heard AT ALL on a screen that may be scrolled well away from it, and it
     used to be a class the JS added and no rule drew. */
  #bt-root .gesture.sel { background: var(--lk-accent-tint); border-radius: 8px; }

  /* In a card of its own, with the indicator on the right where an indicator
     goes. Loose on the page it read as a caption on the list above it. */
  #bt-root .hint { display: flex; align-items: center; gap: 10px;
                   background: var(--lk-flat-bg); border-radius: 12px;
                   padding: 13px 14px; font-size: 13.5px; color: var(--lk-body);
                   margin: 0 0 14px; min-height: 44px; box-sizing: border-box; }
  #bt-root .hint span:first-child { flex: 1; }
  #bt-root .hint .dot { flex: none; width: 8px; height: 8px; border-radius: 50%;
                        background: var(--lk-accent-line); }
  #bt-root .hint .dot.live { background: var(--lk-accent); }

<div class="wrap" id="bt-root">
  <div class="steps" id="bt-steps"></div>
  <h2 data-i18n="buttons.title"></h2>

  <div id="bt-error" class="msg bad" style="display:none;"></div>

  <!--
    Listening runs while this screen is open: press a button on the remote and
    the row it belongs to is scrolled to and highlighted. It is an accelerant,
    never the only path — a card-only remote is never heard (platform §4), and
    every row is tappable regardless.

    ABOVE the list, because it is an instruction for using the list and not a
    footnote about it: below, it was read after the decision it was offering to
    speed up, and on a remote with more rows than fit a screen it was never read
    at all.
  -->
  <div class="hint">
    <span data-i18n="buttons.pressToJump"></span>
    <span class="dot" id="bt-dot"></span>
  </div>

  <div class="card rows" id="bt-list"></div>

</div>

<script type="text/javascript">
/**
 * What each button does — one row per thing the remote can do.
 *
 * **The grid is inverted, and that is the whole change.** It used to be seven
 * lighting functions each with a dropdown of the remote's events, nested in
 * per-light accordions. The user is holding the remote and thinking "what should
 * THIS button do", so the screen asked the question backwards — and
 * "Not assigned" five times over read as unfinished work rather than as a remote
 * with five buttons and two jobs.
 *
 * So: the remote's own gestures are the rows, in the order the buttons sit on
 * the device, each saying in a word what it does. Tapping one pushes `job.html`,
 * which is where the choosing happens. This screen only ever shows.
 *
 * One rule per gesture is enforced three times over — here, in `setRules`, and
 * by `dedupeByInputKey` — because a gesture assigned twice leaves a row that
 * looks configured and does nothing, which is the exact failure this app exists
 * to prevent. Here it is structural: a gesture IS a row, so it cannot have two.
 */
function __lkBootBt(Homey) {
  var __root = document.getElementById('bt-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  (function stabiliseScrollbar() {
    /**
     * Reserve room for the scrollbar so growing the view cannot re-wrap it.
     *
     * GENERATED. Spliced into every pair view by `npm run sync:views` from
     * views/shared/stabilise-scrollbar.js. **Edit that file, not this one.**
     *
     * When the content grows past the pane height a scrollbar appears, the
     * usable width drops by its thickness, and every line of text re-measures —
     * so a heading that sat on one line before a list was expanded sits on two
     * afterwards, and the whole screen shifts under the tap that expanded it.
     * `scrollbar-gutter: stable` keeps the gutter reserved whether or not the
     * bar is showing, which makes the width one number for the life of the
     * session instead of two.
     *
     * It runs in EVERY view, not only the ones that grow, because the scroller
     * belongs to the pairing container and outlives each screen: a flow whose
     * first screen reserved the gutter is stable throughout, and a flow whose
     * first screen did not is stable nowhere. That asymmetry is exactly how
     * this was found — the two device types with a credential screen stabilised
     * on step 1 and the three without it never did, so the sensor picker
     * re-wrapped its heading the moment the sensor list unfolded.
     *
     * The scrolling element belongs to the pairing container, not to us, so
     * find it by walking up rather than guessing a selector.
     */
    var scroller = null;
    for (var el = __root.parentElement; el && el !== document.documentElement; el = el.parentElement) {
      var overflowY = getComputedStyle(el).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') { scroller = el; break; }
    }
    var targets = scroller ? [scroller] : [document.documentElement, document.body];
    var supported = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');

    targets.forEach(function (el) {
      if (!el) return;
      if (supported) el.style.scrollbarGutter = 'stable';
      // Without gutter support, always showing the track is the stable option.
      else if (el !== document.body) el.style.overflowY = 'scroll';
    });
  })();

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var el = {
    steps: document.getElementById('bt-steps'),
    error: document.getElementById('bt-error'),
    list: document.getElementById('bt-list'),
    dot: document.getElementById('bt-dot'),
  };

  var state = { gestures: [], jobs: {} };

  function renderSteps() {
    clear(el.steps);
    // Four steps get narrower dots, so the run is the same width whether a
    // flow has three or four of them.
    el.steps.className = 'steps tight';
    for (var i = 1; i <= 4; i++) el.steps.appendChild(node('i', i <= 3 ? 'on' : null));
    el.steps.appendChild(node('span', null, Homey.__('buttons.step', { index: 3, count: 4 })));
  }

  function render() {
    clear(el.list);
    for (var i = 0; i < state.gestures.length; i++) {
      el.list.appendChild(renderGesture(state.gestures[i]));
    }
  }

  function renderGesture(gesture) {
    var job = state.jobs[gesture.key];

    // The row carries the state, not one span inside it: the dot, the name and
    // the value all say the same thing, and they say it from one class.
    var row = node('button', 'row gesture' + (job ? '' : ' unset'));
    row.type = 'button';
    row.dataset.key = gesture.key;

    row.appendChild(node('span', 'mark'));

    /**
     * The button on top, what it does UNDER it — job and lights in one line.
     *
     * The gesture used to take both lines ("Top" over "Pressed") and the job sat
     * at the right-hand end as a value. That left nowhere to say which lights a
     * button drives, and a per-button target that can only be found by opening a
     * row is a feature nobody discovers: a remote whose top button dims the
     * floor lamp reads exactly like one that dims everything.
     */
    var what = node('div', 'what');
    what.appendChild(node('div', 'label', gesture.label));
    if (job) what.appendChild(node('div', 'sub', job.detail));
    row.appendChild(what);

    // Only an unset row carries a word on the right. A set one has said what it
    // does on its own second line, and repeating it there was the same answer
    // twice.
    if (!job) row.appendChild(node('span', 'value', Homey.__('buttons.notSet')));
    row.appendChild(node('span', 'chev', '›'));

    row.addEventListener('click', function () {
      // The pushed editor needs to know WHICH row it is editing, and a pair
      // session has no query string — so the driver is told first and the view
      // asks it back. One source of truth, and a reload of `job.html` cannot
      // land on the wrong gesture.
      emit('editGesture', gesture.key).then(function () {
        Homey.showView('job');
      }).catch(fail);
    });
    return row;
  }

  function fail(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  /**
   * A press on the real remote scrolls to its row and marks it.
   *
   * `heard` is pushed by the driver while this screen is open. It is the same
   * event surface the runtime listens to, so a gesture that cannot be heard here
   * is one that would never have fired either — which makes this a diagnostic as
   * much as a convenience.
   */
  Homey.on('heard', function (key) {
    el.dot.className = 'dot live';
    setTimeout(function () { el.dot.className = 'dot'; }, 600);

    var row = el.list.querySelector('[data-key="' + String(key).replace(/"/g, '') + '"]');
    if (!row) return;
    if (row.scrollIntoView) row.scrollIntoView({ block: 'center' });
    row.classList.add('sel');
    setTimeout(function () { row.classList.remove('sel'); }, 1200);
  });


  renderSteps();

  emit('getButtons').then(function (payload) {
    state.gestures = payload.gestures || [];
    state.jobs = payload.jobs || {};
    render();
  }).catch(fail);
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootBt(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('bt-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootBt(ready || window.Homey); };
  waitForHomey();
})();
</script>
