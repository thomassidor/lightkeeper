<style>
  /* Scoped to this view's root: all four pair views share ONE document, so
     unscoped class names bleed between screens. */
  #cr-wrap { padding: 18px 16px 24px; font-family: -apple-system, BlinkMacSystemFont,
           "Segoe UI", Roboto, "Helvetica Neue", sans-serif; color: #16181d;
           -webkit-font-smoothing: antialiased; }
  #cr-wrap h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #cr-wrap .sub { font-size: 14px; line-height: 1.5; color: #6b7280; margin: 0 0 18px; }
  #cr-wrap p { font-size: 14px; line-height: 1.55; color: #4b5563; }

  #cr-wrap .card { background: #fff; border: 1px solid #eceef2; border-radius: 14px;
                 box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 14px; margin-bottom: 10px; }

  #cr-wrap .section { margin-bottom: 18px; }
  #cr-wrap .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                          letter-spacing: .06em; color: #9aa1ac; margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #cr-wrap .tile { display: block; width: 100%; text-align: left; background: #fff;
                 border: 1.5px solid #eceef2; border-radius: 12px; padding: 13px 14px;
                 margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
                 transition: border-color .12s ease, background .12s ease; }
  #cr-wrap .tile:hover { border-color: #c9d2e0; }
  #cr-wrap .tile.sel { border-color: #2f6fed; background: #f3f7ff; }
  #cr-wrap .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #cr-wrap .tile .meta { font-size: 12.5px; color: #8b929e; margin-top: 3px; line-height: 1.35; }

  #cr-wrap input[type=text], #cr-wrap input[type=password], #cr-wrap select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid #e3e6ec; border-radius: 11px; background: #fff; color: #16181d;
    font-family: inherit; -webkit-appearance: none; appearance: none; }
  #cr-wrap select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238b929e' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
                  background-repeat: no-repeat; background-position: right 13px center;
                  background-size: 11px; padding-right: 34px; }
  #cr-wrap input:focus, #cr-wrap select:focus { outline: none; border-color: #2f6fed;
                                            box-shadow: 0 0 0 3px rgba(47,111,237,.12); }

  #cr-wrap .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
                border-radius: 10px; border: 1.5px solid #e3e6ec; background: #fff;
                color: #16181d; cursor: pointer; min-height: 40px; }
  #cr-wrap .btn:hover { border-color: #c9d2e0; }
  #cr-wrap .btn:disabled { opacity: .45; cursor: not-allowed; }
  #cr-wrap .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                        border-radius: 12px; border: none; background: #2f6fed; color: #fff;
                        cursor: pointer; min-height: 50px; margin-top: 16px; font-family: inherit; }
  #cr-wrap .btn-primary:disabled { opacity: .5; cursor: progress; }

  #cr-wrap .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
                line-height: 1.5; }
  #cr-wrap .ok { background: #eaf7ef; color: #10633a; }
  #cr-wrap .bad { background: #fdeceb; color: #8f1d18; }
  #cr-wrap .muted { background: #f4f5f7; color: #5b616e; }

  #cr-wrap ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px; color: #4b5563; }
  #cr-wrap .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #cr-wrap .grid { grid-template-columns: 1fr; } }
</style>

<div class="wrap" id="cr-wrap" style="visibility:hidden;">
  <h2 data-i18n="credential.title"></h2>
  <p>
    <span data-i18n="credential.why"></span>
  </p>

  <ol>
    <li data-i18n="credential.step1"></li>
    <li data-i18n="credential.step2"></li>
    <li data-i18n="credential.step3"></li>
    <li data-i18n="credential.step4"></li>
  </ol>
  <input id="cr-key" type="password" data-i18n-placeholder="credential.placeholder" autocomplete="off" spellcheck="false" />
  <button id="cr-save" class="btn-primary">Save and continue</button>

  <div id="cr-msg" class="msg muted" style="display:none;"></div>
</div>

<script type="text/javascript">
/**
 * Pair views are INJECTED INTO the pairing container's document — they do not
 * get their own iframe, and they must not load homey.js themselves (a second
 * copy overwrites window.Homey with a base object that has no emit/showView).
 *
 * The container calls window.onHomeyReady once, at its own page load, long
 * before this view's script exists. So waiting to be called never fires. The
 * container's fully-equipped Homey is already on window by the time this runs,
 * so take it directly — while still accepting onHomeyReady if it does arrive.
 */
/**
 * The guard lives on the view's root ELEMENT, not in a global. All four views
 * share one document, and a global flag survives leaving and re-entering the
 * pairing flow — which silently blocked the second run from ever rendering.
 * A freshly injected root has no marker, so each injection boots exactly once.
 */
function __llBootCr(Homey) {
  var __root = document.getElementById('cr-wrap');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  /**
   * Reserve room for the scrollbar so expanding a section cannot resize the
   * content.
   *
   * When the view grows past the pane height a scrollbar appears, the usable
   * width drops by its thickness, and every percentage-width row re-wraps —
   * text shifts as you expand and collapse. `scrollbar-gutter: stable` keeps
   * the gutter reserved whether or not the bar is showing.
   *
   * The scrolling element belongs to the pairing container, not to us, so find
   * it by walking up rather than guessing a selector.
   */
  (function stabiliseScrollbar() {
    var scroller = null;
    for (var el = __root.parentElement; el && el !== document.documentElement; el = el.parentElement) {
      var overflowY = getComputedStyle(el).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') { scroller = el; break; }
    }
    var targets = scroller ? [scroller] : [document.documentElement, document.body];
    var supported = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');

    targets.forEach(function (el) {
      if (!el) return;
      if (supported) el.style.scrollbarGutter = 'stable';
      // Without gutter support, always showing the track is the stable option.
      else if (el !== document.body) el.style.overflowY = 'scroll';
    });
  })();

  if (typeof Homey.ready === 'function') Homey.ready();

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      try {
        var returned = Homey.emit(event, data, function (err, result) { finish(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { finish(null, r); }, function (e) { finish(e); });
        }
      } catch (err) { finish(err); }
    });
  }

  document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
    el.placeholder = Homey.__(el.getAttribute('data-i18n-placeholder'));
  });

  document.getElementById('cr-save').textContent = Homey.__('credential.save') || 'Save and continue';

  /**
   * Translate a credential failure.
   *
   * `status.hint` is produced by describeFailure() in lib/credential-service.ts
   * and is always English — lib/ has no access to Homey.__. The failure CODE is
   * what carries the translation, so prefer it and keep the hint as a fallback.
   * Mirrors credentialFailureKey() on the app side.
   */
  function failureText(status) {
    if (!status) return Homey.__('credential.failed');
    switch (status.failure) {
      case 'malformed': return Homey.__('credential.malformed');
      case 'session_expired': return Homey.__('credential.expired');
      case 'insufficient_scope': return Homey.__('credential.noScope');
      case 'unknown': return Homey.__('credential.unreachable');
      default: return status.hint || Homey.__('credential.failed');
    }
  }

  function show(cls, text) {
    var el = document.getElementById('cr-msg');
    el.className = 'msg ' + cls;
    el.textContent = text;
    el.style.display = 'block';
  }

  // Kept hidden until we know whether it is needed, so a user who already has
  // a key never sees a setup screen flash past.
  emit('getCredentialStatus').then(function (status) {
    var alreadyHave = status && (status.valid || (status.present && !status.failure));
    if (alreadyHave) return Homey.showView('source');

    document.getElementById('cr-wrap').style.visibility = 'visible';
    if (status && status.present && status.failure) show('bad', failureText(status));
  }).catch(function (err) {
    document.getElementById('cr-wrap').style.visibility = 'visible';
    show('bad', err.message || String(err));
  });

  document.getElementById('cr-save').addEventListener('click', function () {
    var key = document.getElementById('cr-key').value.trim();
    if (!key) return show('bad', Homey.__('credential.pasteFirst'));

    show('muted', Homey.__('credential.checking'));
    emit('setCredential', key).then(function (status) {
      if (status && status.valid) {
        show('ok', Homey.__('credential.accepted'));
        Homey.showView('source');
      } else {
        show('bad', failureText(status));
      }
    }).catch(function (err) {
      show('bad', err.message || String(err));
    });
  });

}

window.onHomeyReady = __llBootCr;

(function waitForHomey(attempt) {
  if (window.Homey && typeof window.Homey.emit === 'function') return __llBootCr(window.Homey);
  if ((attempt || 0) > 100) {
    document.getElementById('cr-wrap').style.visibility = 'visible';
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:12px;background:#fdeaea;color:#7f1d1d;font-size:13px;">'
      + 'Light Link could not reach the Homey pairing API on this page.</div>');
    return;
  }
  setTimeout(function () { waitForHomey((attempt || 0) + 1); }, 50);
})(0);
</script>
