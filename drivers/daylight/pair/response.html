<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #rs-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-line: #d9cbf5;
    /* Between the accent and its line. The middle of the three listening dots,
       and the only place a mid-tone is needed: the logo has none. */
    --lk-accent-mid: #9f81dc;
    /* A block on the schedule timeline that is not the one being edited. It
       borrowed --lk-accent-line, which is the edge of a numbered badge and a
       step too pale to hold a 52px bar: four of them across a grey track read
       as a smudge rather than as the day's other windows. */
    --lk-block: #b9a6e4;
    /* And a block on a timeline where NOTHING is selected — the review's
       picture of the finished day. Deeper than the one above because the pale
       violet only exists to recede behind a selected block, and on a review
       there is nothing for it to recede behind: four faint bars on a grey
       track read as a chart that had failed to load. */
    --lk-block-settled: #7a57c8;
    --lk-accent-strong: #3b2279;
    /* Two more steps down the same violet, for the three-bar level picture: it
       is a LEVEL rather than a direction, so only the tallest bar is at full
       strength and the two under it fall away. Derived from the accent the same
       way the tints are — the logo has no mid-tones to read them out of. */
    --lk-level-mid: #7a62c0;
    --lk-level-low: #c4b8e4;

    /* Drawn ON the accent tint rather than on white, and that is the whole
       reason these three exist. A grey hairline on #f3eefc is the one place in
       this palette where a neutral reads as dirty, and --lk-muted on it reads
       as faded rather than as secondary. So the tint gets its own edge, its own
       rule and its own second ink, all violet-shifted to match the ground they
       sit on. */
    --lk-tint-line: #e2d8f6;
    --lk-tint-rule: #f0ecfa;
    --lk-tint-ink: #5a4d80;
    --lk-ring: rgba(42, 25, 88, .16);
    /* The edge of a handle nobody has selected. It is NOT --lk-ring: at .16 a
       26px circle on an orange strip had no edge at all, and the second
       boundary looked like a smudge rather than something to drag. */
    --lk-handle-edge: rgba(42, 25, 88, .45);

    /* The ink ladder: THREE greys, and the design canvas has no fourth.

       It had five. --lk-sub (#5f6672) and --lk-faint (#6f7683) sat either side
       of --lk-muted and were never a step anybody could see — #6f7683 against
       #6a7180 is a difference of five in one channel, which is not a decision,
       it is a drift. Both are gone and their consumers took the neighbour the
       canvas actually draws: an end-caption and the midnight/noon line are
       --lk-body, everything else that was faint is --lk-muted.

       All three clear WCAG AA (4.5:1) against --lk-surface, because all three
       are used between 10.5px and 15px. Collapsing --lk-faint RAISED the
       contrast of every caption that used it, from 4.6:1 to 4.9:1. What
       separates the steps is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;

    /* THREE BORDER ROLES, and they do not overlap. This is the rule the design
       system is strictest about, and the one this app had most wrong: --lk-line
       was drawing card edges AND the dividers inside them, so a card's outline
       and the hairlines between its rows were the same weight of grey and the
       card had no edge at all at arm's length.

         --lk-edge  every card and control BOX, at 1px or 1.5px
         --lk-line  ONLY a 1px divider inside a card — never a box
         --lk-box   ONLY the 22px checkbox and radio

       --lk-edge also serves as the disabled fill, which is what the system's
       own Disabled specimen draws — see .btn:disabled. */
    --lk-edge: #dfe3e9;
    --lk-line: #eceef2;
    /* The edge of an UNTICKED box or radio, and only that. A shade darker than
       --lk-edge because an empty checkbox has to read as a control somebody
       has not used yet; at the card-edge grey it reads as a gap in the row. */
    --lk-box: #d4d8e0;
    /* Dashed only: "nothing here yet, and that is expected" — empty states and
       add-slots. It is never a solid edge and never mixed with one. */
    --lk-hover: #c9d2e0;
    /* A chevron is an affordance, not a value: lighter than the text it sits
       beside, so a list of rows reads as labels rather than as arrows.

       #a8aeb9 took that too far. A non-text UI component still owes 3:1, and
       at #a8aeb9 the chevron was 2.4:1 — an affordance nobody has to read is
       still one somebody has to SEE. The canvas's #8f97a3 is 3.2:1 and is
       still visibly lighter than every ink in the ladder above. */
    --lk-chev: #8f97a3;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-knob-shadow-warm: 0 0 0 2.5px #ffffff, 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The ring around a knob drawn at icon scale, where the full
       --lk-slider-knob-shadow is two shadows on a 4px mark and comes out as a
       smudge. One ring, half a pixel thinner than the real control's. */
    --lk-knob-edge: rgba(22, 24, 29, .5);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #f3eefc);
    /* How light it is OUTSIDE, pale to deep — the third axis this app draws,
       and the only one that runs dark at the TOP of its range rather than the
       bottom. It is the week grid's scale, and its six stops are the same six
       the cells are quantised to: `SHADES` in views/shared/week-grid.js, which
       cannot read a custom property and so carries them again. Change one and
       change the other; `pair-view-styles.test.ts` checks that they agree.

       FIVE steps, not six. The sixth was --lk-accent-strong, one step past the
       point where two cells could be told apart at 11px tall, and the design
       system fixes the heatmap at five. */
    --lk-lux-ramp: linear-gradient(90deg, #f4f2fa, #e0d6f6, #c4b0ec,
                                   #9f81dc, #6b48bc);
    /* The same stops the other way round, for the sun's own height.
       Reversed on purpose: the lux ramp measures HOW MUCH LIGHT there is, so
       more light is more ink, while this one is a picture of the DAY — and the
       dark end of a day is the night. The two never meet on screen, because a
       Room-sensing Light has a sensor or it has the sun. */
    --lk-sun-ramp: linear-gradient(90deg, #3b2279, #6b48bc, #9f81dc,
                                   #c4b0ec, #f4f2fa);
    /* The hours of a "when does this room get its sun?" tile: the ones that
       ARE this room's sun, and the ones that are the day going on around it. */
    --lk-peak-on: #4b2ea0;
    --lk-peak-off: #dfd4f4;
    /* The two ENDS of the warmth axis, for the two tiles that nudge along it
       rather than setting it. The whole ramp draws the same picture on both,
       which is no picture at all, so each of these runs from the middle of
       --lk-warm-ramp out to one end of it.
       The cool end is DEEPER than that ramp's own #dbe8fb: at 30x12px on white
       the real end of the axis is a chip with no edge, so the tile that said
       "cooler" showed nothing at all. Deepened to where it reads, and no
       further — it is a picture of a direction, not a colour to match. */
    --lk-warmer-ramp: linear-gradient(90deg, #f2e6d6, #e8892c);
    --lk-cooler-ramp: linear-gradient(90deg, #f2e6d6, #9fc0f0);
    /* A lamp that is ON, drawn rather than named: the one warm accent in an
       interface that is otherwise entirely violet, because "on" is a picture of
       light and the brand colour is a picture of the app. */
    --lk-lamp-lit: #f4c24a;
    --lk-lamp-glow: rgba(244, 194, 74, .32);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    /* The halo round a SELECTED block on the schedule timeline, and round a
       selected swatch. Softer than --lk-ring is used for elsewhere, because it
       is drawn against the accent itself rather than against white. */
    --lk-select-halo: 0 0 0 3px rgba(42, 25, 88, .18);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    /* The two-hour cell a sensor reported NOTHING in, drawn as a hatch. Its own
       two colours because nothing else in the app is a hatch: the pale stripe
       has to sit above --lk-line without becoming white (a white stripe made
       the cell read as missing from the grid rather than as empty in it), and
       the edge has to hold the cell's rectangle at 11px tall, which the stripes
       alone do not. */
    --lk-hatch-pale: #f7f8fa;
    --lk-hatch-edge: #dfe3e9;
    --lk-day-mark: rgba(22, 24, 29, .4);
    /* The curve chart's own "you are editing this point" line. Accent rather
       than ink, because on that chart it marks a SELECTION; on the day strip
       the dashed lines mark sunrise and sunset, which are facts. */
    --lk-curve-mark: rgba(42, 25, 88, .55);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    /* Success is a DOT, never a ground. There is no green banner in this
       system: a tinted block is for a finding somebody has to act on, and
       "that worked" is not one. The green appears at 8px beside the sentence
       and nowhere else. */
    --lk-ok-dot: #5aa86b;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    /* A key the Homey accepted and then refused to build a Flow with. Its own
       colour rather than --lk-bad-ink, and a full step lighter, because it is
       drawn as an EDGE round a field and as a 16px badge — at #8f1d18 a
       1.5px border round a white field read as damage, and the message beside
       it says the key itself is fine. */
    --lk-reject: #c05a3e;
    --lk-flat-bg: #f4f5f7;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 16px under a heading, which is the gap the design draws on every screen
     that puts a control straight below one. It used to be 4px, and at 4px a
     title read as a label ON the first card rather than as the name of the
     screen.

     `text-wrap: balance` is for the titles that do not fit on one line, and the
     longest is the sensor picker's: measured at 311px — a 390px phone, less
     Homey's gutter, our padding and the scrollbar gutter — it breaks 295px +
     54px, which leaves `from?` alone on the second line. Balanced it is
     163 + 185. Not a workaround for a title that is too long: at 20px it needs
     354px, and even 18px needs 319px, so there is no size that holds it on one
     line at phone width without shrinking every other title in the app by an
     eighth. A one-line title is unaffected, so this costs the other screens
     nothing, and a browser without it wraps exactly as before. */
  #rs-root h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
             text-wrap: balance; }
  #rs-root .sub { font-size: 15px; line-height: 1.5; color: var(--lk-body); margin: 0 0 18px; }
  /* A blurb belongs TO its heading — 6px between them, not 16. Written as a
     pull on the blurb rather than as `h2:has(+ .sub)` on the heading because
     the pairing container's webview is not somewhere to find out whether
     `:has()` landed. */
  #rs-root h2 + .sub { margin-top: -10px; }
  #rs-root p { font-size: 15px; line-height: 1.5; color: var(--lk-body); }

  #rs-root .card { background: var(--lk-surface); border: 1px solid var(--lk-edge);
              border-radius: 16px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #rs-root .section { margin-bottom: 18px; }
  /* The label over a group — "Does", "To", "When does this room get its sun?".
     It is a .control-title with nothing on its right: the same 16/600 ink,
     sentence case. It used to be 12px uppercase small-caps in the faintest
     grey, which made the two words holding the job screen's sentence together
     read as filing-cabinet labels rather than as the sentence's own verbs.

     16 is the CONTROL size — group headings and every button share it, which is
     why it sits so close to body 15. */
  #rs-root .section-title { font-size: 16px; font-weight: 600; line-height: 1.2;
                       color: var(--lk-ink); margin: 0 0 9px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #rs-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-edge); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #rs-root .tile:hover { border-color: var(--lk-hover); }
  #rs-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #rs-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #rs-root .tile .meta { font-size: 13px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #rs-root input[type=text], #rs-root input[type=password], #rs-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-edge); border-radius: 12px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #rs-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #rs-root input:focus, #rs-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  /* EVERY in-app button is the same shape: 16/600, 48px, radius 12, full
     width. Three variants and nothing else — solid accent to commit, accent
     outline for a reversible action, edge outline to dismiss. The blue pill in
     the pairing footer is Homey's own chrome and is never ours to draw.

     This used to be four shapes at three sizes (14/500 at 40px here, 16/600 at
     50px on `.wide`, 15/500 at 48px on `.wide.accent`), which is how a set of
     buttons stops reading as a set. */
  #rs-root .btn { font-family: inherit; font-size: 16px; font-weight: 600; padding: 14px;
             border-radius: 12px; border: 1.5px solid var(--lk-edge);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 48px; box-sizing: border-box; }
  #rs-root .btn:hover { border-color: var(--lk-hover); }
  /* Disabled is a COLOUR change, never an opacity change. Dropping opacity
     takes the label under 4.5:1 and fades the button's own edge with it, so the
     control stops reading as a control at all rather than as an unavailable
     one. Fill goes to the divider grey, ink and border to the furniture grey. */
  #rs-root .btn:disabled { border-color: var(--lk-line); color: var(--lk-chev);
                        cursor: not-allowed; }
  /* The same button across the width of the screen. What a secondary action
     looks like when it is the only one on a pushed screen — "Close" — where a
     primary button would claim the choice was made. */
  #rs-root .btn.wide { display: block; width: 100%; margin-top: 16px; }
  /* And the same button when it is the SECOND of two, under a primary — "Stop
     preview" — or the one secondary action inside a card, as "Test my lights"
     is on the review screen. It borrows the primary's outline rather than the field grey,
     because the pair is one decision offered twice ("show me" / "undo that")
     and a grey partner reads as the disabled twin of the button above it.
     Lighter than the primary in weight and height, never in hue. */
  #rs-root .btn.wide.accent { border-color: var(--lk-accent); color: var(--lk-accent); }
  #rs-root .btn-primary { display: block; width: 100%; font-size: 16px; font-weight: 600;
                     padding: 14px; box-sizing: border-box;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 48px;
                     margin-top: 16px; font-family: inherit; }
  /* A button in flight keeps its exact size and takes the disabled fill; its
     LABEL is what says it is working, swapped to the present participle of its
     own verb by the view. There is no spinner in this system because there is
     no icon set. */
  #rs-root .btn-primary:disabled { background: var(--lk-line); color: var(--lk-chev);
                                cursor: progress; }

  /* An inline text action inside a card — "Show more colours", "Test it on my
     lights". Not a button shape: it is a link that happens to be a <button>,
     because it changes what is on the screen rather than committing anything.

     SHARED because it was defined four times, and the fourth had drifted to
     13px in the wrong violet and left-aligned as a block — which is how a
     control that should be one thing becomes two. */
  #rs-root .morelink { display: flex; align-items: center; min-height: 44px;
                    box-sizing: border-box; margin-top: 9px; padding: 0;
                    background: none; border: none; font-family: inherit;
                    font-size: 15px; font-weight: 500;
                    color: var(--lk-accent-strong); cursor: pointer; }
  #rs-root .morelink:disabled { color: var(--lk-chev); cursor: progress; }

  /* An add-slot: a dashed frame where a thing is not yet. The dashed edge means
     "nothing here yet, and that is expected" — the same edge the empty states
     use, and never mixed with a solid one on the same element. */
  #rs-root .add { display: flex; align-items: center; justify-content: center;
               width: 100%; min-height: 48px; box-sizing: border-box;
               margin-bottom: 16px; padding: 13px; border-radius: 12px;
               border: 1.5px dashed var(--lk-hover); background: none;
               font-family: inherit; font-size: 15px; font-weight: 500;
               line-height: 1; color: var(--lk-accent-strong); cursor: pointer; }

  /* And the destructive text row that closes an editing card. Centred under a
     rule, because it acts on the card it sits in rather than on the screen —
     and in the one colour this system reserves for damage. */
  #rs-root .remove { display: flex; align-items: center; justify-content: center;
                  width: 100%; min-height: 44px; box-sizing: border-box;
                  margin-top: 13px; padding: 13px 0 0;
                  background: none; border: none;
                  border-top: 1px solid var(--lk-line);
                  font-family: inherit; font-size: 15px; font-weight: 500;
                  line-height: 1; color: var(--lk-bad-ink); cursor: pointer; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #rs-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 12px; font-size: 13px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-ink); }
  /* SUCCESS IS A DOT, NOT A GROUND. A tinted block is for a finding somebody
     has to act on; "that worked" is not one, and a green panel gave the same
     weight to "Key accepted." as to a sensor that has stopped reporting. The
     ground stays neutral and an 8px dot carries the good news. */
  #rs-root .ok { display: flex; align-items: baseline; gap: 8px; }
  #rs-root .ok::before { content: ''; flex: none; width: 8px; height: 8px;
                      border-radius: 50%; background: var(--lk-ok-dot); }
  #rs-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #rs-root .muted { background: var(--lk-flat-bg); color: var(--lk-ink); }
  #rs-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #rs-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #rs-root ol { font-size: 15px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #rs-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #rs-root .grid { grid-template-columns: 1fr; } }
  #rs-root .empty { font-size: 15px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #rs-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #rs-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-edge); }
  /* Four steps, narrower dots: the run keeps the same overall width whether a
     flow has three or four, so the header does not visibly grow between two
     device types. */
  #rs-root .steps.tight i { width: 16px; }
  #rs-root .steps i.on { background: var(--lk-accent); }
  #rs-root .steps span { margin-left: 4px; font-size: 13px; color: var(--lk-muted); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened.

     The row carries NO horizontal padding, and its card carries it instead
     (`.card.rows` below). That is what insets the hairline between two rows
     from the card's own edge — a rule that runs corner to corner reads as the
     card being cut in half, and every list the design draws insets it. */
  #rs-root .row { display: flex; align-items: center; gap: 10px; width: 100%;
               padding: 13px 0; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #rs-root .row + .row { border-top: 1px solid var(--lk-line); }
  #rs-root .row .label { flex: 1; font-size: 15px; }
  #rs-root .row .value { font-size: 15px; color: var(--lk-muted); text-align: right; }
  #rs-root .row .chev { flex: none; font-size: 16px; color: var(--lk-chev); }
  #rs-root .row .sub { font-size: 13px; color: var(--lk-muted); margin: 2px 0 0; }
  /* The card a list of rows lives in. 4px top and bottom rather than 14:
     a row's own 13px is already the space above the first label, and adding
     the card's to it put a visible step between the card's edge and its
     first line that no other card has. */
  #rs-root .card.rows { padding: 4px 14px; }

  /* The pill switch behind every "Set … too".
     It carries a rule above it, always: a toggle is a new decision inside a
     card that was until then about one thing, and without the rule it read as
     the last line of the control above it. */
  #rs-root .toggle { display: flex; align-items: center; gap: 10px; width: 100%;
                  border-top: 1px solid var(--lk-line);
                  margin-top: 14px; padding: 13px 0 0;
                  min-height: 44px; box-sizing: border-box;
                  background: none; border-left: none; border-right: none;
                  border-bottom: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #rs-root .toggle .label { flex: 1; font-size: 15px; }
  #rs-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-line);
                         transition: background .15s ease; }
  #rs-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #rs-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #rs-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #rs-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 16px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #rs-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-line); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #rs-root .slider.warm { background: var(--lk-warm-ramp); box-shadow: none; }
  #rs-root .slider.bright { background: var(--lk-bright-ramp); }
  #rs-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 999px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  /* The two ramps take OPPOSITE knobs, and that is not a slip: the warmth ramp
     is light from end to end, so a white knob on it is invisible; the
     brightness ramp starts at near-black, so a dark one is. Each knob is the
     colour its own track is not. */
  #rs-root .slider.warm .knob { background: var(--lk-ink);
                             box-shadow: var(--lk-slider-knob-shadow-warm); }
  #rs-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-body); margin: 9px 0 0; }

  /* An aside under a control: "there is a device type that does this for you".
     Deliberately NOT a .msg — a message has a coloured ground and is about
     something that just happened, and this is a pointer nobody has to read to
     finish the screen. So no ground, the muted ink, italic, and nothing else.

     It USED to carry a drawn circled "i". That mark is gone: it was the only
     serif and the only drawn icon in the whole product, and this system has no
     icon set at all — five text glyphs and nothing more. The italic is what
     marks these lines as an aside, on all four screens that carry one.

     It sits directly under the control it qualifies rather than at the foot of
     the card, because three of the four screens carry a second control below
     it and an aside that floated to the bottom would read as belonging to
     that one instead. */
  #rs-root .tip { display: flex; align-items: flex-start; gap: 7px;
               margin: 13px 0 0; font-size: 13px; line-height: 1.45;
               font-style: italic; color: var(--lk-muted); }

  /* The swatches a colour is chosen from, five across, EVERYWHERE.
     Two rows by default — whites, then one of each colour — and five more
     that fold out below, one hue family a row. Five and not eight: at 390px
     eight is 34px of width a swatch, under the touch minimum and too small to
     judge a colour by; five is still a comfortable target at 34px tall.

     7px under every grid, which the margins between block siblings collapse
     to: 7px from the default rows to the fold-out, as the design draws it, and
     the link under the last grid keeps its own 9px. */
  #rs-root .swatches { display: grid; grid-template-columns: repeat(5, 1fr);
                    gap: 7px; margin: 0 0 7px; }
  /* min-height as well as height: the container's own stylesheet is not ours
     to read, and a swatch whose height is overridden away is a coloured line
     rather than a colour anybody can judge. */
  #rs-root .swatch { height: 34px; min-height: 34px; border-radius: 8px; padding: 0;
                  box-sizing: border-box;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  /* The chosen colour, and it has to survive being ON a colour: a ring drawn
     in the accent with a soft halo outside it reads against every swatch in
     the palette, which a white gap did not against the pale ones. */
  #rs-root .swatch[aria-pressed="true"] { border: 2.5px solid var(--lk-accent);
                                       box-shadow: 0 0 0 3px var(--lk-ring); }
  /* The twenty-five that fold out: the SAME grid, same size, same gap.

     It used to be a second grid of smaller swatches, eight across, 18px below —
     and the space and the smaller size were what told the two sets apart. The
     2026-09-23 design makes it one grid that simply grows: the fold-out rows
     are hue families, deep to pale, and read as rows of one palette because
     they are. So `.more` carries nothing of its own any more; the class stays
     as the hook the views show and hide. */

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #rs-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #rs-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #rs-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 11px; font-weight: 600; letter-spacing: .08em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 8px; }
  #rs-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-handle-edge); z-index: 1;
                       box-shadow: var(--lk-handle-shadow); }
  #rs-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #rs-root .clockline { display: flex; justify-content: space-between;
                     font-size: 11px; color: var(--lk-body); margin: 8px 2px 4px; }

  /* The three or four decisions a flow is about to ask for, numbered.

     SHARED rather than intro-only: the credential gate draws the same rows for
     the four steps of minting a key, and it used to draw an <ol> instead — a
     browser list with a browser's numerals, inside a screen where every other
     number is a filled circle. Two places, one shape.

     Spaced, not ruled. A hairline between two decisions turns a promise about
     what is coming into a settings list, and the numbers already say these are
     three of one thing. */
  #rs-root .plan { display: flex; flex-direction: column; gap: 14px;
                margin: 0 0 22px; }
  #rs-root .decision { display: flex; align-items: flex-start; gap: 12px; }
  #rs-root .decision .n { flex: none; width: 26px; height: 26px; border-radius: 50%;
                       box-sizing: border-box;
                       background: var(--lk-accent-tint); color: var(--lk-accent-strong);
                       border: 1.5px solid var(--lk-accent-line);
                       font-size: 13px; font-weight: 700;
                       display: flex; align-items: center; justify-content: center; }
  #rs-root .decision .what { font-size: 16px; font-weight: 600; line-height: 26px; }
  #rs-root .decision .why { font-size: 13px; color: var(--lk-muted); margin-top: 2px;
                         line-height: 1.45; }

  /* ==== end shared base ==== */
/* ==== shared transition card: identical wherever it appears ====
   GENERATED. Spliced by `npm run sync:views` from views/shared/transition.css,
   where ROOT-ID stands in for each view's own root element id. **Edit that
   file, not this one.**

   "Transition": how a value moves between two points, as three single-select
   rows with a picture of each curve at the end. The rows are the review
   screen's control choice in shape — a 22px round mark, a 15/500 title and a
   13px line under it — because a single choice from a short list is one thing
   in this system, wherever it is drawn. Prefixed `tr-` because `.pick` and
   `.box` already mean other things on the screens that carry it. */
#rs-root .tr-card { background: var(--lk-surface); border: 1px solid var(--lk-edge);
                 border-radius: 16px; box-shadow: var(--lk-shadow);
                 padding: 0 14px; margin-bottom: 16px; }
#rs-root .tr-row + .tr-row { border-top: 1px solid var(--lk-line); }
#rs-root .tr-pick { display: flex; align-items: center; gap: 12px; width: 100%;
                 padding: 12px 0; min-height: 44px; box-sizing: border-box;
                 background: none; border: none; font: inherit; color: inherit;
                 text-align: left; cursor: pointer; }
#rs-root .tr-box { flex: none; width: 22px; height: 22px; border-radius: 50%;
                border: 1.5px solid var(--lk-box); box-sizing: border-box;
                display: flex; align-items: center; justify-content: center;
                font-size: 13px; font-weight: 700; color: transparent; }
#rs-root .tr-pick[aria-checked="true"] .tr-box { background: var(--lk-accent);
                                              border-color: var(--lk-accent);
                                              color: var(--lk-accent-ink); }
#rs-root .tr-text { flex: 1; min-width: 0; }
#rs-root .tr-what { font-size: 15px; font-weight: 500; line-height: 22px; }
#rs-root .tr-why { font-size: 13px; color: var(--lk-muted); line-height: 1.45;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The curve itself, high on the left and low on the right — a value moving
   from one point to the next, which is the one thing the three words cannot
   show. Drawn by transitionCard() from the same maths the engine uses. */
#rs-root .tr-thumb { flex: none; width: 64px; height: 40px; border-radius: 8px;
                  background: var(--lk-flat-bg); display: block; }
#rs-root .tr-line { fill: none; stroke: var(--lk-accent); stroke-width: 2;
                 stroke-linecap: round; stroke-linejoin: round; }
/* ==== end shared transition card ==== */

          /* ==== shared week grid: identical wherever it appears ====
   GENERATED. Spliced by `npm run sync:views` from views/shared/week-grid.css,
   where ROOT-ID stands in for each view's own root element id. **Edit that
   file, not this one.**

   A sensor's own last week, as 7 rows of 12 two-hour cells. It appears on the
   response screen, above the two lux numbers it is the evidence for. */
#rs-root .week { background: var(--lk-surface); border: 1px solid var(--lk-edge);
              border-radius: 16px; box-shadow: var(--lk-shadow);
              padding: 14px; margin-bottom: 14px; }
/* Name over span, with a rule under both: the header is a caption on the
   picture below it rather than a row of two unrelated readings. */
#rs-root .week-head { padding-bottom: 12px; margin-bottom: 14px;
                   border-bottom: 1px solid var(--lk-line); }
#rs-root .week-head .name { font-size: 15px; font-weight: 600; }
#rs-root .week-head .span { display: block; font-size: 13px; color: var(--lk-muted);
                         margin-top: 2px; }

#rs-root .week-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
/* `week-day`, not `day`. The shared base already styles `.day` as the day STRIP
   — 104px tall with its own overflow — and a label that borrowed the name
   inherited all of it: the first render put every weekday in a 104px block and
   pushed its own row off to the side. Scoping protects one view from another;
   inside a view, only the name does. */
#rs-root .week-row .week-day { flex: none; width: 26px; font-size: 11px; color: var(--lk-body); }
#rs-root .week-row i { flex: 1; height: 11px; border-radius: 2px; }

/* A cell with no reading is HATCHED, never dark. A gap has to read as "no
   reading" rather than as "pitch dark" — the sensor that stopped on Saturday
   lunchtime is the case this exists for, and drawing it black would argue for
   a dark threshold the room never actually met. */
#rs-root .week-row i.gap {
  background: repeating-linear-gradient(135deg,
    var(--lk-line) 0 3px,
    var(--lk-hatch-pale) 3px 6px);
  box-shadow: inset 0 0 0 1px var(--lk-edge);
}

/* The scale the cells are quantised to, spelled out. Five steps and two
   words: a heatmap whose colours mean something has to say what, and the two
   lux numbers at either end of the bar answer a different question (where the
   thresholds sit) from this one (which cell is busier than which). */
#rs-root .week-key { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
#rs-root .week-key span { font-size: 11px; font-weight: 600; letter-spacing: .08em;
                       text-transform: uppercase; color: var(--lk-muted); }
#rs-root .week-key i { flex: none; width: 22px; height: 11px; border-radius: 2px; }

/* What the hatch MEANS, said once, and only when there is a hatched cell to
   explain. A legend on every week would be a line of furniture on the screen
   whose whole job is the two lux numbers; a legend that appears exactly when a
   sensor has stopped reporting is the sentence that screen is missing. */
#rs-root .week-legend { display: flex; align-items: center; gap: 8px; margin-top: 10px;
                     font-size: 13px; color: var(--lk-body); }
#rs-root .week-legend i { flex: none; width: 22px; height: 11px; border-radius: 2px;
  background: repeating-linear-gradient(135deg,
    var(--lk-line) 0 3px,
    var(--lk-hatch-pale) 3px 6px);
  box-shadow: inset 0 0 0 1px var(--lk-edge); }

#rs-root .week-hours { display: flex; justify-content: space-between;
                    font-size: 11px; color: var(--lk-body);
                    margin: 7px 0 0 32px; }

/* The live reading, ticked on the same scale the cells are drawn on, so the
   two lux numbers below are never abstract. */
/* 28px of air above it, not 12: the tick's own label is drawn ABOVE the bar
   (`top: -20px`), so at 12px it collided with the hours line and the live
   reading overprinted the axis it was being read against. */
#rs-root .week-scale { display: flex; align-items: center; gap: 7px;
                    margin-top: 28px; font-size: 11px; color: var(--lk-body); }
/* The scale runs PALE to DEEP, the same direction the cells do. It used to run
   the other way — accent at 0 lx fading to the accent line at the top — which
   drew a dark left end under a grid whose dark cells were the bright hours, so
   the one picture argued against the other. */
#rs-root .week-scale .bar { flex: 1; position: relative; height: 8px; border-radius: 999px;
                         background: var(--lk-lux-ramp); }
#rs-root .week-scale .tick { position: absolute; top: -5px; bottom: -5px; width: 4px;
                          margin-left: -2px; border-radius: 2px;
                          background: var(--lk-ink);
                          box-shadow: 0 0 0 2px var(--lk-surface); }
#rs-root .week-scale .tickLabel { position: absolute; top: -20px; transform: translateX(-50%);
                               font-size: 11px; font-weight: 600; color: var(--lk-ink);
                               white-space: nowrap; }

#rs-root .week-verdict { font-size: 13px; line-height: 1.45; color: var(--lk-ink);
                      margin-top: 11px; }
#rs-root .week-verdict b { color: var(--lk-ink); }
/* The flat and the quiet week, drawn as a block where the verdict line would
   be. The design pads it a pixel wider than a plain .msg, so the two lines sit
   level with the card's own text. */
#rs-root .week-finding { padding: 13px 14px; }
/* ==== end shared week grid ==== */

  /* ---- this view only ---------------------------------------------------- */

  /* The end being edited, with the accent border that says which of the two it
     is: the other one is a row in the card below, and this is that row opened.
     The same shape the circadian day, the curve and the schedule use. */
  #rs-root .end { background: var(--lk-surface); border: 1.5px solid var(--lk-accent);
                  border-radius: 16px; padding: 14px; margin-bottom: 8px; }
  #rs-root .end-head { display: flex; align-items: baseline;
                       justify-content: space-between; gap: 10px; margin-bottom: 13px; }
  #rs-root .end-head .name { flex: 1; font-size: 15px; font-weight: 600; }
  #rs-root .end-head .which { font-size: 13px; color: var(--lk-muted); }

  #rs-root .threshold { display: flex; align-items: center; gap: 10px;
                        background: var(--lk-flat-bg); border-radius: 12px;
                        padding: 9px 11px;
                        margin-bottom: 13px; min-height: 44px; box-sizing: border-box; }
  #rs-root .threshold .cap { flex: 1; font-size: 13px; color: var(--lk-body); }
  #rs-root .threshold .val { font-size: 15px; font-weight: 600; min-width: 88px;
                             text-align: center; }
  /* A bare glyph, not a bordered box — the same stepper every other screen in
     the flow uses. */
  #rs-root .threshold button { width: 22px; height: 30px; flex: none; border: none;
                               background: none; padding: 0;
                               font-size: 20px; line-height: 30px; color: var(--lk-muted);
                               cursor: pointer; }


  /* "When does this room get its sun?" — four answers, each drawn as the shape
     it produces, so the choice is made by recognising a picture rather than by
     trusting a word. Only ever shown when following the sun. */
  /* The question and its four answers are ONE card. The title used to float
     above them as a bare section label, which made the four tiles read as a
     control the screen had started with rather than as the answer to something
     asked — and the blurb under it then belonged to neither. */
  #rs-root .sunask { margin-bottom: 16px; }
  #rs-root .sunask .ask { font-size: 13px; font-weight: 600; line-height: 1.2;
                          color: var(--lk-ink); margin: 0 0 4px; }
  #rs-root .sunask .why { font-size: 13px; color: var(--lk-muted); margin: 0 0 12px;
                          line-height: 1.4; }
  #rs-root .peaks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  #rs-root .peak { padding: 9px 8px; border-radius: 12px; background: var(--lk-surface);
                   border: 1.5px solid var(--lk-edge); cursor: pointer;
                   font: inherit; color: inherit; min-height: 44px; box-sizing: border-box; }
  #rs-root .peak[aria-pressed="true"] { border-color: var(--lk-accent);
                                        background: var(--lk-accent-tint); }
  #rs-root .peak .shape { display: flex; align-items: flex-end; gap: 2px; height: 30px;
                          margin-bottom: 6px; }
  /* Two-tone, and that is what makes these four pictures readable at 90px
     wide. A tile drawn in one colour is a silhouette the eye has to measure;
     picking out the hours the sun is actually ON this room says which part of
     the day the shape is about, which is the entire question. */
  #rs-root .peak .shape i { flex: 1; border-radius: 2px 2px 0 0;
                            background: var(--lk-peak-off); }
  #rs-root .peak .shape i.lit { background: var(--lk-peak-on); }
  #rs-root .peak .hours { display: flex; justify-content: space-between;
                          font-size: 11px; color: var(--lk-body); margin-bottom: 6px; }
  #rs-root .peak .name { font-size: 13px; color: var(--lk-body); text-align: center; }
  #rs-root .peak[aria-pressed="true"] .name { font-weight: 600; color: var(--lk-ink); }

  /* What following the sun MEANS, when there is no sensor's week to mean it.
     Same anatomy as the week card above it — a heading, a scale with the live
     reading ticked on it, and a sentence — because it answers the same question
     with the one instrument the household has left. */
  #rs-root .sunnow .head { padding-bottom: 12px; margin-bottom: 26px;
                           border-bottom: 1px solid var(--lk-line); }
  #rs-root .sunnow .head .name { font-size: 15px; font-weight: 600; }
  #rs-root .sunnow .head .span { display: block; font-size: 13px;
                                 color: var(--lk-muted); margin-top: 2px; }
  #rs-root .sunnow .scale { display: flex; align-items: center; gap: 8px;
                            font-size: 11px; color: var(--lk-body); }
  /* Deep at NIGHT and pale at midday, which is the reverse of the lux scale on
     the sensor path — and deliberately so. That scale measures how much light
     there is, so more light is more ink; this one is a picture of the day, and
     the dark end of a day is the night. The two never appear on screen
     together: a device has a sensor or it has the sun. */
  #rs-root .sunnow .bar { flex: 1; position: relative; height: 8px;
                          border-radius: 999px; background: var(--lk-sun-ramp); }
  #rs-root .sunnow .tick { position: absolute; top: -5px; bottom: -5px; width: 4px;
                           margin-left: -2px; border-radius: 2px;
                           background: var(--lk-ink);
                           box-shadow: 0 0 0 2px var(--lk-surface); }
  #rs-root .sunnow .tickLabel { position: absolute; top: -25px; transform: translateX(-50%);
                                font-size: 11px; font-weight: 600; color: var(--lk-ink);
                                white-space: nowrap; }
  #rs-root .sunnow .means { font-size: 13px; line-height: 1.45; color: var(--lk-ink);
                            margin-top: 13px; }

  #rs-root .others { background: var(--lk-surface); border: 1px solid var(--lk-edge);
                     border-radius: 16px; box-shadow: var(--lk-shadow);
                     padding: 4px 14px; margin-bottom: 16px; }
  #rs-root .others .sw { flex: none; width: 26px; height: 26px; border-radius: 8px;
                         border: 1px solid var(--lk-hairline); }
  #rs-root .others .text { flex: 1; }
  #rs-root .others .text .end-name { font-size: 15px; }
  #rs-root .others .row { gap: 11px; padding: 12px 0; }
  #rs-root .others .row .sub { font-size: 13px; }
  #rs-root .others .row .value { font-size: 13px; }
</style>

<div class="wrap" id="rs-root">
  <div class="steps" id="rs-steps"></div>
  <h2 data-i18n="response.title"></h2>

  <div id="rs-error" class="msg bad" style="display:none;"></div>

  <!-- Following the sun: the question no other field can reach. -->
  <div id="rs-sunBlock" style="display:none;">
    <div class="card sunask">
      <div class="ask" data-i18n="response.whenSun"></div>
      <div class="why" data-i18n="response.whenSunWhy"></div>
      <div class="peaks" id="rs-peaks"></div>
    </div>
    <!--
      And what that adds up to today. Without a sensor this is the only evidence
      the screen has, so it says where the sun is right now on its own scale and
      what the lamps will do about it — the same job the sensor's week does two
      lines up, with the one instrument a household without sensors still has.
    -->
    <div class="card sunnow" id="rs-sunNow" style="display:none;">
      <div class="head">
        <div class="name" data-i18n="response.followingSun"></div>
        <div class="span" id="rs-sunSpan"></div>
      </div>
      <div class="scale">
        <span data-i18n="response.scaleNight"></span>
        <span class="bar" id="rs-sunBar"></span>
        <span data-i18n="response.scaleMidday"></span>
      </div>
      <div class="means" data-i18n="response.followingSunMeans"></div>
    </div>
  </div>

  <!-- With a sensor: its own week, which is the evidence for the two numbers. -->
  <div class="week" id="rs-week" style="display:none;"></div>

  <div class="end" id="rs-editor">
    <div class="end-head">
      <span class="name" id="rs-endName"></span>
      <span class="which" id="rs-endWhich"></span>
    </div>

    <div class="threshold">
      <span class="cap" id="rs-thresholdCap"></span>
      <button type="button" id="rs-thresholdDown">&minus;</button>
      <span class="val" id="rs-thresholdVal"></span>
      <button type="button" id="rs-thresholdUp">+</button>
    </div>

    <div class="control-title"><span data-i18n="response.brightness"></span> <span id="rs-pct"></span></div>
    <div class="slider bright" id="rs-bright">
      <div class="knob" id="rs-brightKnob"></div>
    </div>
    <div class="ends">
      <span data-i18n="response.off"></span>
      <span data-i18n="response.full"></span>
    </div>
  </div>

  <div class="others" id="rs-others"></div>

  <!-- How the brightness moves between the two ends. views/shared/transition-card.js. -->
  <div id="rs-transition"></div>

  <div class="card rows">
    <button class="row" id="rs-try" type="button">
      <span class="label" data-i18n="response.tryIt"></span>
      <span class="chev">&rsaquo;</span>
    </button>
  </div>

  <div id="rs-msg" class="msg" style="display:none;"></div>

</div>

<script type="text/javascript">
/**
 * How bright the lamps should be, at each end of what the room does.
 *
 * **There is no chart of the response any more.** The two cards state both ends,
 * so a picture of two numbers was redundant. What is left is the EVIDENCE: the
 * sensor's own week, with the live reading ticked on its own scale, which is
 * what makes "under 8 lx" a judgement somebody can actually make.
 *
 * **Both thresholds are pre-filled from that week**, and that is the fix for
 * `brightLux = 500` being a kitchen number: of four sensors measured in one
 * house, only one wanted anything near 500 and the other three wanted 20, 50 and
 * 200 (platform §16).
 *
 * **Following the sun gives the same screen in degrees.** Identical anatomy,
 * identical controls, one unit swapped — plus the one question a resident can
 * answer better than any map: when does this room get its sun. Elevation alone
 * is symmetric about noon, so nothing else can tell an east-facing room from a
 * west-facing one.
 */
function __lkBootRs(Homey) {
  var __root = document.getElementById('rs-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  (function stabiliseScrollbar() {
    /**
     * Reserve room for the scrollbar so growing the view cannot re-wrap it.
     *
     * GENERATED. Spliced into every pair view by `npm run sync:views` from
     * views/shared/stabilise-scrollbar.js. **Edit that file, not this one.**
     *
     * When the content grows past the pane height a scrollbar appears, the
     * usable width drops by its thickness, and every line of text re-measures —
     * so a heading that sat on one line before a list was expanded sits on two
     * afterwards, and the whole screen shifts under the tap that expanded it.
     * `scrollbar-gutter: stable` keeps the gutter reserved whether or not the
     * bar is showing, which makes the width one number for the life of the
     * session instead of two.
     *
     * It runs in EVERY view, not only the ones that grow, because the scroller
     * belongs to the pairing container and outlives each screen: a flow whose
     * first screen reserved the gutter is stable throughout, and a flow whose
     * first screen did not is stable nowhere. That asymmetry is exactly how
     * this was found — the two device types with a credential screen stabilised
     * on step 1 and the three without it never did, so the sensor picker
     * re-wrapped its heading the moment the sensor list unfolded.
     *
     * The scrolling element belongs to the pairing container, not to us, so
     * find it by walking up rather than guessing a selector.
     */
    var scroller = null;
    for (var el = __root.parentElement; el && el !== document.documentElement; el = el.parentElement) {
      var overflowY = getComputedStyle(el).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') { scroller = el; break; }
    }
    var targets = scroller ? [scroller] : [document.documentElement, document.body];
    var supported = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');

    targets.forEach(function (el) {
      if (!el) return;
      if (supported) el.style.scrollbarGutter = 'stable';
      // Without gutter support, always showing the track is the stable option.
      else if (el !== document.body) el.style.overflowY = 'scroll';
    });
  })();

  function emit(event, data) {
    /**
     * Homey.emit, as a promise that always settles.
     *
     * GENERATED. Spliced into every pair view by `npm run sync:views` from
     * views/shared/emit.js. **Edit that file, not this one.**
     *
     * Both call styles are handled because the pairing bridge has used a
     * callback and a promise at different times, and the 20 s timeout is what
     * keeps a dropped callback from leaving the screen spinning with no message
     * forever.
     *
     * Inside the function, like `stabiliseScrollbar()`'s, and that is not a
     * style choice: `spliceFunction` matches from the `function` keyword, so a
     * docblock above one is never replaced — it is prepended again on every
     * sync. Four stale copies of the week grid's reached the shipped archive
     * that way. It also means this explanation now appears in all 54 views
     * rather than in the two credential screens that happened to carry it.
     */
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function weekGrid(host, payload) {
    /**
     * A sensor's own last week, drawn into an element.
     *
     * GENERATED. Spliced into every carrier by `npm run sync:views` from
     * views/shared/week-grid.js. **Edit that file, not this one.**
     *
     * It takes no arguments beyond the element and the payload, and it closes
     * over the `node` every carrier already has — the same trick the daylight
     * card used. One carrier today, the response screen: the detail screen a
     * sensor row used to push is gone, and with it the two refusals it drew —
     * see the verdict at the foot of this function.
     *
     * The grid IS the argument for the two lux thresholds. Nobody can judge
     * "under 8 lx" in the abstract; anybody can judge it against a week that
     * visibly has a night and a day in it. It is also what makes the two
     * refusals honest — a cupboard sensor that reports faithfully and says
     * nothing, and a sensor that stopped on Saturday — because the picture shows
     * both in a glance and no wording has to be trusted.
     */
    var DAY_KEYS = ['week.mon', 'week.tue', 'week.wed', 'week.thu',
      'week.fri', 'week.sat', 'week.sun'];

    while (host.firstChild) host.removeChild(host.firstChild);
    if (!payload || !payload.week) {
      // No readable history is not an error — the screen falls back to the
      // defaults, which is exactly what every screen did before this existed.
      host.appendChild(node('div', 'week-verdict', Homey.__('week.noHistory')));
      return;
    }

    var week = payload.week;

    var head = node('div', 'week-head');
    // The name only where the surrounding screen has not already said it: the
    // detail screen is titled with the sensor, and repeating it directly under
    // its own heading reads as two different sensors.
    if (payload.sensorName) head.appendChild(node('div', 'name', payload.sensorName));
    head.appendChild(node('span', 'span', Homey.__('week.lastSevenDays')));
    host.appendChild(head);

    /**
     * A cell's colour, on a log scale between the week's own 5th and 95th
     * percentiles.
     *
     * Logarithmic because illuminance is perceived that way and the range is
     * enormous — the same reason `levelFromLux` interpolates on log10 — and on
     * the week's OWN range rather than a fixed one, because a room that never
     * passes 40 lx would otherwise be a uniform dark grid with nothing to read.
     */
    var low = Math.max(0.1, week.low || 0.1);
    var high = Math.max(low * 2, week.high || 1);
    function shade(lux) {
      if (lux === null || lux === undefined) return null;
      var f = (Math.log10(Math.max(0.1, lux)) - Math.log10(low))
        / (Math.log10(high) - Math.log10(low));
      return Math.max(0, Math.min(1, f));
    }

    /**
     * Six steps of the app's own violet, dark to light, rather than a
     * continuous ramp.
     *
     * Stepped because the grid is read as a PATTERN — where the nights are,
     * where the days are — and six distinguishable shades make that pattern
     * legible where 84 nearly-identical ones do not. Light is bright and dark
     * is dark, which is the way round somebody expects a picture of light.
     */
    var SHADES = ['#6b48bc', '#9f81dc', '#c4b0ec', '#e0d6f6', '#f4f2fa'];
    function cellColour(value) {
      return SHADES[Math.min(SHADES.length - 1, Math.floor((1 - value) * SHADES.length))];
    }

    function round(lux) {
      return lux >= 10 ? Math.round(lux) : Math.round(lux * 10) / 10;
    }

    var anyGap = false;
    for (var row = 0; row < week.cells.length; row++) {
      var line = node('div', 'week-row');
      line.appendChild(node('span', 'week-day', Homey.__(DAY_KEYS[(week.days[row] || 1) - 1])));
      for (var column = 0; column < week.cells[row].length; column++) {
        var value = shade(week.cells[row][column]);
        var cell = node('i', value === null ? 'gap' : null);
        if (value === null) anyGap = true;
        else cell.style.background = cellColour(value);
        line.appendChild(cell);
      }
      host.appendChild(line);
    }

    var hours = node('div', 'week-hours');
    var LABELS = ['00', '06', '12', '18', '24'];
    for (var h = 0; h < LABELS.length; h++) hours.appendChild(node('span', null, LABELS[h]));
    host.appendChild(hours);

    var scale = node('div', 'week-scale');
    scale.appendChild(node('span', null, Homey.__('week.lux', { lux: round(low) })));
    var bar = node('span', 'bar');
    // No "now" tick on a sensor that has stopped: its last reading is hours
    // old, and a tick labelled "now" would be the one false thing on a card
    // whose whole job is to show that nothing has arrived since.
    var quiet = payload.staleFor !== null && payload.staleFor !== undefined;
    if (!quiet && payload.nowLux !== null && payload.nowLux !== undefined) {
      var at = shade(payload.nowLux);
      var tick = node('span', 'tick');
      tick.style.left = (at * 100) + '%';
      bar.appendChild(tick);
      var label = node('span', 'tickLabel', Homey.__('week.nowLux', { lux: round(payload.nowLux) }));
      label.style.left = (at * 100) + '%';
      bar.appendChild(label);
    }
    scale.appendChild(bar);
    scale.appendChild(node('span', null, Homey.__('week.lux', { lux: round(high) })));
    host.appendChild(scale);

    /**
     * What the hatch means, and only when there is one.
     *
     * A hatched cell is the difference between "pitch dark" and "nothing
     * arrived", and that difference is the whole argument of the stopped-sensor
     * screen — but it is a distinction nobody can be expected to read out of a
     * pattern. So it gets a line, on the weeks that have a gap in them, and no
     * line at all on the ones that do not.
     */
    /**
     * The scale, as five chips between two words.
     *
     * Drawn from the same array the cells are, reversed, so the key cannot
     * disagree with the grid above it — which is the one thing a legend must
     * never do.
     */
    var key = node('div', 'week-key');
    key.appendChild(node('span', null, Homey.__('week.less')));
    for (var k = SHADES.length - 1; k >= 0; k--) {
      var chip = node('i');
      chip.style.background = SHADES[k];
      key.appendChild(chip);
    }
    key.appendChild(node('span', null, Homey.__('week.more')));
    host.appendChild(key);

    if (anyGap) {
      var legend = node('div', 'week-legend');
      legend.appendChild(node('i'));
      legend.appendChild(node('span', null, Homey.__('week.nothingReported')));
      host.appendChild(legend);
    }

    /**
     * What this week is worth, in a sentence with the numbers in it — or, for
     * the two weeks that argue against using the sensor at all, a block.
     *
     * Those two used to be screens of their own ("A sensor not worth using",
     * "Sensor has gone quiet"), each with a list of three ways out. The
     * 2026-09-23 design folds both into this card, where the ways out are the
     * screen's own chrome: Previous picks another sensor or the sun, Next uses
     * it anyway. So the finding has to be impossible to miss IN the card, which
     * is what a tinted block is for in this system — a finding somebody has to
     * act on. Quiet is the error ground, flat the warning one: a stopped sensor
     * will hold the lights at one brightness, a flat one merely has nothing to
     * say.
     *
     * Quiet is decided by the SCREEN's `staleFor`, not by the week's verdict:
     * the live reading can be newer than the Insights history, and the driver
     * has already taken the newer of the two.
     */
    var verdict = week.verdict || { kind: 'nothing' };

    if (quiet) {
      host.appendChild(finding('msg bad',
        Homey.__('week.quiet', { name: payload.sensorName || '', hours: payload.staleFor }),
        Homey.__('week.quietMeans', { when: payload.lastReport || '' })));
      return;
    }
    if (verdict.kind === 'flat') {
      host.appendChild(finding('msg warn',
        Homey.__('week.flat'),
        Homey.__('week.flatDetail', { low: round(verdict.low), high: round(verdict.high) })));
      return;
    }

    var sentence = node('div', 'week-verdict');
    if (verdict.kind === 'usable') {
      sentence.appendChild(node('b', null, Homey.__('week.usable')));
      sentence.appendChild(document.createTextNode(' ' + Homey.__('week.usableDetail', {
        night: round(verdict.nightLux), noon: round(verdict.noonLux)
      })));
    } else if (verdict.kind === 'stopped') {
      sentence.appendChild(node('b', null, Homey.__('week.stopped')));
      sentence.appendChild(document.createTextNode(' ' + Homey.__('week.stoppedDetail', {
        when: new Date(verdict.lastAt).toLocaleString()
      })));
    } else {
      sentence.appendChild(node('b', null, Homey.__('week.nothing')));
    }
    host.appendChild(sentence);

    function finding(className, lead, body) {
      // What happened, then what it means — one block, the shape every other
      // message on these screens takes.
      var block = node('div', className + ' week-finding');
      block.appendChild(node('div', 'lead', lead));
      block.appendChild(node('div', null, body));
      return block;
    }
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function transitionShape(kind, t) {
    /**
     * How far a value has moved at fraction `t` of the way between two points.
     *
     * GENERATED. Spliced into every carrier by `npm run sync:views` from
     * views/shared/transition-shape.js. **Edit that file, not this one.**
     *
     * The same maths as `shape()` in lib/support/interpolate.ts, which a pair
     * view cannot import: Gradual is linear, Balanced and Quick are a logistic
     * normalised so that 0 → 0 and 1 → 1, with k = 6 and k = 16. Change one,
     * change both.
     */
    var x = Math.max(0, Math.min(1, t));
    if (kind === 'gradual') return x;
    var k = kind === 'quick' ? 16 : 6;
    var s = function (v) { return 1 / (1 + Math.exp(-k * (v - 0.5))); };
    return (s(x) - s(0)) / (s(1) - s(0));
  }

  function transitionCard(host, selected, onChoose) {
    /**
     * The "Transition" heading and card, drawn into an element.
     *
     * GENERATED. Spliced into every carrier by `npm run sync:views` from
     * views/shared/transition-card.js. **Edit that file, not this one.**
     *
     * Nodes only, never markup: no view assigns innerHTML. It closes over the
     * `node` and `transitionShape` every carrier already has, and calls
     * `onChoose(kind)` when a row is tapped — the carrier owns what that
     * changes and how it reaches the driver. The locale keys are written out
     * literally so locales.test.ts sees them used.
     */
    var KINDS = [
      { kind: 'gradual', what: 'transition.gradual', why: 'transition.gradualWhy' },
      { kind: 'balanced', what: 'transition.balanced', why: 'transition.balancedWhy' },
      { kind: 'quick', what: 'transition.quick', why: 'transition.quickWhy' },
    ];
    var SVG = 'http://www.w3.org/2000/svg';

    while (host.firstChild) host.removeChild(host.firstChild);
    host.appendChild(node('div', 'section-title', Homey.__('transition.title')));
    var card = node('div', 'tr-card');
    card.setAttribute('role', 'radiogroup');

    KINDS.forEach(function (option) {
      var row = node('div', 'tr-row');
      var pick = node('button', 'tr-pick');
      pick.type = 'button';
      pick.setAttribute('role', 'radio');
      pick.setAttribute('data-transition', option.kind);
      pick.setAttribute('aria-checked', option.kind === selected ? 'true' : 'false');
      pick.appendChild(node('span', 'tr-box', '✓'));
      var text = node('span', 'tr-text');
      text.appendChild(node('div', 'tr-what', Homey.__(option.what)));
      text.appendChild(node('div', 'tr-why', Homey.__(option.why)));
      pick.appendChild(text);

      // 64 x 40, the curve inset 8px from the sides and 9px from the top and
      // bottom so a round cap never touches the edge of its tile.
      var svg = document.createElementNS(SVG, 'svg');
      svg.setAttribute('class', 'tr-thumb');
      svg.setAttribute('viewBox', '0 0 64 40');
      svg.setAttribute('aria-hidden', 'true');
      var coords = [];
      for (var i = 0; i <= 24; i++) {
        var t = i / 24;
        coords.push((8 + t * 48).toFixed(1) + ',' + (9 + transitionShape(option.kind, t) * 22).toFixed(1));
      }
      var line = document.createElementNS(SVG, 'polyline');
      line.setAttribute('class', 'tr-line');
      line.setAttribute('points', coords.join(' '));
      svg.appendChild(line);
      pick.appendChild(svg);

      pick.addEventListener('click', function () { onChoose(option.kind); });
      row.appendChild(pick);
      card.appendChild(row);
    });
    host.appendChild(card);
  }

  var el = {
    steps: document.getElementById('rs-steps'),
    error: document.getElementById('rs-error'),
    sunBlock: document.getElementById('rs-sunBlock'),
    sunNow: document.getElementById('rs-sunNow'),
    sunSpan: document.getElementById('rs-sunSpan'),
    sunBar: document.getElementById('rs-sunBar'),
    peaks: document.getElementById('rs-peaks'),
    week: document.getElementById('rs-week'),
    endName: document.getElementById('rs-endName'),
    endWhich: document.getElementById('rs-endWhich'),
    thresholdCap: document.getElementById('rs-thresholdCap'),
    thresholdVal: document.getElementById('rs-thresholdVal'),
    thresholdUp: document.getElementById('rs-thresholdUp'),
    thresholdDown: document.getElementById('rs-thresholdDown'),
    pct: document.getElementById('rs-pct'),
    bright: document.getElementById('rs-bright'),
    brightKnob: document.getElementById('rs-brightKnob'),
    others: document.getElementById('rs-others'),
    transition: document.getElementById('rs-transition'),
    try: document.getElementById('rs-try'),
    msg: document.getElementById('rs-msg'),
  };

  /** The four answers, each with the shape it produces. */
  /**
   * The four answers, each with the shape it produces and the hours that shape
   * is ABOUT.
   *
   * `lit` is which of the eight bars are this room's own sun rather than the
   * day going on around it. Two colours per tile is what makes the four
   * readable side by side at 90px: in one colour they are four humps that have
   * to be measured against each other, and the whole point is that the answer
   * is recognised rather than compared.
   *
   * Heights are percentages, not a scale to divide: they are drawn to be told
   * apart, and "hardly any" has to stay visibly a curve rather than collapsing
   * to a flat line — a room with no direct sun still brightens and darkens with
   * the day, just less.
   */
  var PEAKS = [
    { id: 'morning', nameKey: 'response.peakMorning', sentenceKey: 'response.peaksMorning',
      lit: [0, 1, 2], shape: [62, 96, 88, 52, 26, 14, 10, 8] },
    { id: 'midday', nameKey: 'response.peakMidday', sentenceKey: 'response.peaksMidday',
      lit: [3, 4], shape: [8, 18, 46, 92, 96, 58, 22, 8] },
    { id: 'afternoon', nameKey: 'response.peakAfternoon', sentenceKey: 'response.peaksAfternoon',
      lit: [5, 6, 7], shape: [8, 10, 16, 30, 60, 94, 96, 56] },
    { id: 'flat', nameKey: 'response.peakFlat', sentenceKey: 'response.peaksFlat',
      lit: [], shape: [14, 18, 22, 26, 26, 22, 18, 14] }
  ];

  var state = {
    response: null,
    usingSensor: false,
    // Today's sun, for the card that stands in for the sensor's week. Null with
    // a sensor, and null when the Homey has never been told where it is — in
    // which case the card simply is not drawn, because there is nothing true to
    // put on it.
    sun: null,
    selected: 'dark',
    week: null,
    now: null,
    // Hours since the sensor last reported, once that is half a day or more,
    // and when that was — for the week card's "has not reported" block.
    staleFor: null,
    lastReport: null
  };

  function fail(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  function renderSteps() {
    clear(el.steps);
    // Four steps get narrower dots, so the run is the same width whether a
    // flow has three or four of them.
    el.steps.className = 'steps tight';
    for (var i = 1; i <= 4; i++) el.steps.appendChild(node('i', i <= 3 ? 'on' : null));
    el.steps.appendChild(node('span', null, Homey.__('response.step', { index: 3, count: 4 })));
  }

  /**
   * Where the sun is now, on the day's own range.
   *
   * Scaled between astronomical twilight and TODAY's own peak rather than a
   * fixed pair of angles: 20° is most of a December day and barely mid-morning
   * in June, so a scale fixed at the solstice would put every winter reading in
   * the same left-hand inch and say nothing.
   */
  function renderSunNow() {
    clear(el.sunBar);
    if (!state.sun) { el.sunNow.style.display = 'none'; return; }
    el.sunNow.style.display = '';

    var bits = [];
    for (var p = 0; p < PEAKS.length; p++) {
      if (PEAKS[p].id === state.response.sunPeak) bits.push(Homey.__(PEAKS[p].sentenceKey));
    }
    if (state.sun.sunset) bits.push(Homey.__('response.andSunset', { time: state.sun.sunset }));
    el.sunSpan.textContent = bits.join(' · ');

    var floor = -18;
    var ceiling = Math.max(state.sun.peak, floor + 1);
    var at = Math.max(0, Math.min(1, (state.sun.elevation - floor) / (ceiling - floor)));

    var tick = node('span', 'tick');
    tick.style.left = (at * 100) + '%';
    el.sunBar.appendChild(tick);
    var label = node('span', 'tickLabel', Homey.__('response.nowAt', { time: state.sun.now }));
    label.style.left = (at * 100) + '%';
    el.sunBar.appendChild(label);
  }

  function renderPeaks() {
    clear(el.peaks);
    for (var i = 0; i < PEAKS.length; i++) {
      el.peaks.appendChild(peakTile(PEAKS[i]));
    }
  }

  function peakTile(peak) {
    var tile = node('button', 'peak');
    tile.type = 'button';
    tile.setAttribute('aria-pressed', state.response.sunPeak === peak.id ? 'true' : 'false');

    var shape = node('div', 'shape');
    for (var i = 0; i < peak.shape.length; i++) {
      var bar = node('i', peak.lit.indexOf(i) === -1 ? null : 'lit');
      bar.style.height = peak.shape[i] + '%';
      shape.appendChild(bar);
    }
    tile.appendChild(shape);

    var hours = node('div', 'hours');
    hours.appendChild(node('span', null, Homey.__('response.sixAm')));
    hours.appendChild(node('span', null, Homey.__('response.sixPm')));
    tile.appendChild(hours);

    tile.appendChild(node('div', 'name', Homey.__(peak.nameKey)));

    tile.addEventListener('click', function () {
      state.response.sunPeak = peak.id;
      render();
      push();
    });
    return tile;
  }

  function thresholdOf(which) {
    if (state.usingSensor) {
      return which === 'dark' ? state.response.darkLux : state.response.brightLux;
    }
    return which === 'dark' ? state.response.darkElevation : state.response.brightElevation;
  }

  function thresholdText(which) {
    var value = thresholdOf(which);
    if (state.usingSensor) {
      return Homey.__(which === 'dark' ? 'response.underLux' : 'response.overLux', {
        lux: value >= 10 ? Math.round(value) : Math.round(value * 10) / 10
      });
    }
    /**
     * An elevation, labelled with the clock time it happens TODAY.
     *
     * "−3°" is not a thing anybody can picture; "around 20:18 today" is. The
