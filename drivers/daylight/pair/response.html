<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #rs-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #rs-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #rs-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #rs-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #rs-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #rs-root .section { margin-bottom: 18px; }
  #rs-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #rs-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #rs-root .tile:hover { border-color: var(--lk-hover); }
  #rs-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #rs-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #rs-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #rs-root input[type=text], #rs-root input[type=password], #rs-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #rs-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #rs-root input:focus, #rs-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #rs-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #rs-root .btn:hover { border-color: var(--lk-hover); }
  #rs-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #rs-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #rs-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #rs-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #rs-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #rs-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #rs-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #rs-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #rs-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #rs-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #rs-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #rs-root .grid { grid-template-columns: 1fr; } }
  #rs-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #rs-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #rs-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  #rs-root .steps i.on { background: var(--lk-accent); }
  #rs-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened. */
  #rs-root .row { display: flex; align-items: center; gap: 11px; width: 100%;
               padding: 13px 14px; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #rs-root .row + .row { border-top: 1px solid var(--lk-line); }
  #rs-root .row .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #rs-root .row .value { font-size: 13px; color: var(--lk-muted); text-align: right; }
  #rs-root .row .chev { flex: none; font-size: 15px; color: var(--lk-muted); }
  #rs-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }

  /* The pill switch behind every "Set … too". */
  #rs-root .toggle { display: flex; align-items: center; gap: 11px; width: 100%;
                  padding: 12px 0; min-height: 44px; box-sizing: border-box;
                  background: none; border: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #rs-root .toggle .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #rs-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #rs-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #rs-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #rs-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #rs-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #rs-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #rs-root .slider.warm { background: var(--lk-warm-ramp); }
  #rs-root .slider.bright { background: var(--lk-bright-ramp); }
  #rs-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  #rs-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-muted); margin: 9px 0 0; }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #rs-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 8px; margin: 10px 0; }
  #rs-root .swatch { height: 44px; border-radius: 9px; padding: 0;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  #rs-root .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--lk-surface),
                                                   0 0 0 4px var(--lk-accent); }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #rs-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #rs-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #rs-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #rs-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-ring);
                       box-shadow: var(--lk-handle-shadow); }
  #rs-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #rs-root .clockline { display: flex; justify-content: space-between;
                     font-size: 12px; color: var(--lk-muted); margin-top: 6px; }

  /* ==== end shared base ==== */

          /* ==== shared week grid: identical wherever it appears ====
   GENERATED. Spliced by `npm run sync:views` from views/shared/week-grid.css,
   where ROOT-ID stands in for each view's own root element id. **Edit that
   file, not this one.**

   A sensor's own last week, as 7 rows of 12 two-hour cells. It appears on the
   response screen, under the two lux numbers it is the evidence for, and on
   the detail screen a sensor row pushes. Both draw the same picture, so both
   splice the same block. */
#rs-root .week { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow);
              padding: 14px; margin-bottom: 14px; }
/* Name over span, with a rule under both: the header is a caption on the
   picture below it rather than a row of two unrelated readings. */
#rs-root .week-head { padding-bottom: 12px; margin-bottom: 14px;
                   border-bottom: 1px solid var(--lk-line); }
#rs-root .week-head .name { font-size: 15px; font-weight: 600; }
#rs-root .week-head .span { display: block; font-size: 12.5px; color: var(--lk-muted);
                         margin-top: 2px; }

#rs-root .week-row { display: flex; align-items: center; gap: 3px; margin-bottom: 3px; }
/* `week-day`, not `day`. The shared base already styles `.day` as the day STRIP
   — 104px tall with its own overflow — and a label that borrowed the name
   inherited all of it: the first render put every weekday in a 104px block and
   pushed its own row off to the side. Scoping protects one view from another;
   inside a view, only the name does. */
#rs-root .week-row .week-day { flex: none; width: 26px; font-size: 10px; color: var(--lk-faint); }
#rs-root .week-row i { flex: 1; height: 11px; border-radius: 2px; }

/* A cell with no reading is HATCHED, never dark. A gap has to read as "no
   reading" rather than as "pitch dark" — the sensor that stopped on Saturday
   lunchtime is the case this exists for, and drawing it black would argue for
   a dark threshold the room never actually met. */
#rs-root .week-row i.gap {
  background: repeating-linear-gradient(45deg,
    var(--lk-line) 0, var(--lk-line) 2px,
    var(--lk-surface) 2px, var(--lk-surface) 4px);
}

#rs-root .week-hours { display: flex; justify-content: space-between;
                    font-size: 11px; color: var(--lk-muted);
                    margin: 6px 0 0 29px; }

/* The live reading, ticked on the same scale the cells are drawn on, so the
   two lux numbers below are never abstract. */
#rs-root .week-scale { display: flex; align-items: center; gap: 8px;
                    margin-top: 12px; font-size: 11.5px; color: var(--lk-muted); }
#rs-root .week-scale .bar { flex: 1; position: relative; height: 8px; border-radius: 999px;
                         background: linear-gradient(90deg,
                           var(--lk-accent) 0%, var(--lk-accent-line) 100%); }
#rs-root .week-scale .tick { position: absolute; top: -5px; bottom: -5px; width: 2px;
                          margin-left: -1px; background: var(--lk-ink); }
#rs-root .week-scale .tickLabel { position: absolute; top: -20px; transform: translateX(-50%);
                               font-size: 11px; font-weight: 600; color: var(--lk-ink);
                               white-space: nowrap; }

#rs-root .week-verdict { font-size: 13px; line-height: 1.5; color: var(--lk-body);
                      margin-top: 14px; }
#rs-root .week-verdict b { color: var(--lk-ink); }
/* ==== end shared week grid ==== */

  /* ---- this view only ---------------------------------------------------- */

  #rs-root .end { background: var(--lk-surface); border: 1px solid var(--lk-line);
                  border-radius: 14px; box-shadow: var(--lk-shadow);
                  padding: 14px; margin-bottom: 14px; }
  #rs-root .end-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  #rs-root .end-head .name { flex: 1; font-size: 16px; font-weight: 700; }
  #rs-root .end-head .which { font-size: 12.5px; color: var(--lk-muted); }

  #rs-root .threshold { display: flex; align-items: center; gap: 8px;
                        background: var(--lk-flat-bg); border-radius: 10px; padding: 6px 8px;
                        margin-bottom: 14px; min-height: 44px; box-sizing: border-box; }
  #rs-root .threshold .cap { flex: 1; font-size: 13px; color: var(--lk-body); }
  #rs-root .threshold .val { font-size: 14px; font-weight: 600; min-width: 104px;
                             text-align: center; }
  #rs-root .threshold button { width: 34px; height: 34px; flex: none; border-radius: 8px;
                               border: 1.5px solid var(--lk-field); background: var(--lk-surface);
                               font: 600 18px/1 inherit; color: var(--lk-ink); cursor: pointer; }


  /* "When does this room get its sun?" — four answers, each drawn as the shape
     it produces, so the choice is made by recognising a picture rather than by
     trusting a word. Only ever shown when following the sun. */
  #rs-root .peaks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  #rs-root .peak { padding: 10px; border-radius: 12px; background: var(--lk-surface);
                   border: 1.5px solid var(--lk-line); cursor: pointer;
                   font: inherit; color: inherit; min-height: 44px; }
  #rs-root .peak[aria-pressed="true"] { border-color: var(--lk-accent);
                                        background: var(--lk-accent-tint); }
  #rs-root .peak .shape { display: flex; align-items: flex-end; gap: 2px; height: 32px; }
  #rs-root .peak .shape i { flex: 1; border-radius: 2px 2px 0 0; background: var(--lk-accent-line); }
  #rs-root .peak .hours { display: flex; justify-content: space-between;
                          font-size: 10px; color: var(--lk-muted); margin-top: 3px; }
  #rs-root .peak .name { font-size: 13px; font-weight: 600; margin-top: 4px; }

  #rs-root .others { background: var(--lk-surface); border: 1px solid var(--lk-line);
                     border-radius: 14px; box-shadow: var(--lk-shadow);
                     overflow: hidden; margin-bottom: 14px; }
</style>

<div class="wrap" id="rs-root">
  <div class="steps" id="rs-steps"></div>
  <h2 data-i18n="response.title"></h2>

  <div id="rs-error" class="msg bad" style="display:none;"></div>

  <!--
    The one warning that stays inside pairing, because a frozen sensor makes the
    whole device a no-op. Half a day of silence is the threshold, not an hour: a
    still room legitimately goes quiet for hours (platform §16).
  -->
  <div id="rs-stale" class="msg bad" style="display:none;"></div>

  <!-- Following the sun: the question no other field can reach. -->
  <div id="rs-sunBlock" style="display:none;">
    <div class="section-title" data-i18n="response.whenSun"></div>
    <p class="sub" data-i18n="response.whenSunWhy"></p>
    <div class="peaks" id="rs-peaks"></div>
  </div>

  <!-- With a sensor: its own week, which is the evidence for the two numbers. -->
  <div class="week" id="rs-week" style="display:none;"></div>

  <div class="end" id="rs-editor">
    <div class="end-head">
      <span class="name" id="rs-endName"></span>
      <span class="which" id="rs-endWhich"></span>
    </div>

    <div class="threshold">
      <span class="cap" id="rs-thresholdCap"></span>
      <button type="button" id="rs-thresholdDown">&minus;</button>
      <span class="val" id="rs-thresholdVal"></span>
      <button type="button" id="rs-thresholdUp">+</button>
    </div>

    <div class="control-title"><span data-i18n="response.brightness"></span> <span id="rs-pct"></span></div>
    <div class="slider bright" id="rs-bright">
      <div class="knob" id="rs-brightKnob"></div>
    </div>
    <div class="ends">
      <span data-i18n="response.off"></span>
      <span data-i18n="response.full"></span>
    </div>
  </div>

  <div class="others" id="rs-others"></div>

  <div class="card" style="padding:0;">
    <button class="row" id="rs-try" type="button">
      <span class="label" data-i18n="response.tryIt"></span>
      <span class="chev">&rsaquo;</span>
    </button>
  </div>

  <div id="rs-msg" class="msg" style="display:none;"></div>

  <button class="btn-primary" id="rs-next" data-i18n="response.next"></button>
</div>

<script type="text/javascript">
/**
 * How bright the lamps should be, at each end of what the room does.
 *
 * **There is no chart of the response any more.** The two cards state both ends,
 * so a picture of two numbers was redundant. What is left is the EVIDENCE: the
 * sensor's own week, with the live reading ticked on its own scale, which is
 * what makes "under 8 lx" a judgement somebody can actually make.
 *
 * **Both thresholds are pre-filled from that week**, and that is the fix for
 * `brightLux = 500` being a kitchen number: of four sensors measured in one
 * house, only one wanted anything near 500 and the other three wanted 20, 50 and
 * 200 (platform §16).
 *
 * **Following the sun gives the same screen in degrees.** Identical anatomy,
 * identical controls, one unit swapped — plus the one question a resident can
 * answer better than any map: when does this room get its sun. Elevation alone
 * is symmetric about noon, so nothing else can tell an east-facing room from a
 * west-facing one.
 */
function __lkBootRs(Homey) {

  __root.dataset.llBooted = '1';

    return new Promise(function (resolve, reject) {

      var done = function (err, result) { clearTimeout(timer); finish(err, result); };

        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {

        }
      } catch (err) { done(err); }
    });
  }

    /**
   * A sensor's own last week, drawn into an element.
   *
   * GENERATED. Spliced into every carrier by `npm run sync:views` from
   * views/shared/week-grid.js. **Edit that file, not this one.**
   *
   * It takes NO arguments beyond the element and the payload: everything it
   * needs is in the payload, and everything it renders it renders itself — so
   * the body can be byte-identical on the response screen and on the detail
   * screen, whose surroundings have nothing else in common.
   *
   * The grid IS the argument for the two lux thresholds. Nobody can judge
   * "under 8 lx" in the abstract; anybody can judge it against a week that
   * visibly has a night and a day in it. It is also what makes the two refusals
   * honest — a cupboard sensor that reports faithfully and says nothing, and a
   * sensor that stopped on Saturday — because the picture shows both in a glance
   * and no wording has to be trusted.
   */
    /**
   * A sensor's own last week, drawn into an element.
   *
   * GENERATED. Spliced into every carrier by `npm run sync:views` from
   * views/shared/week-grid.js. **Edit that file, not this one.**
   *
   * It takes NO arguments beyond the element and the payload: everything it
   * needs is in the payload, and everything it renders it renders itself — so
   * the body can be byte-identical on the response screen and on the detail
   * screen, whose surroundings have nothing else in common.
   *
   * The grid IS the argument for the two lux thresholds. Nobody can judge
   * "under 8 lx" in the abstract; anybody can judge it against a week that

   * honest — a cupboard sensor that reports faithfully and says nothing, and a
   * sensor that stopped on Saturday — because the picture shows both in a glance
   * and no wording has to be trusted.
   */
    /**
   * A sensor's own last week, drawn into an element.
   *
   * GENERATED. Spliced into every carrier by `npm run sync:views` from
   * views/shared/week-grid.js. **Edit that file, not this one.**
   *
   * It takes NO arguments beyond the element and the payload: everything it
   * needs is in the payload, and everything it renders it renders itself — so
   * the body can be byte-identical on the response screen and on the detail
   * screen, whose surroundings have nothing else in common.
   *
   * The grid IS the argument for the two lux thresholds. Nobody can judge
   * "under 8 lx" in the abstract; anybody can judge it against a week that
   * visibly has a night and a day in it. It is also what makes the two refusals
   * honest — a cupboard sensor that reports faithfully and says nothing, and a
   * sensor that stopped on Saturday — because the picture shows both in a glance
   * and no wording has to be trusted.
   */
    /**
   * A sensor's own last week, drawn into an element.
   *
   * GENERATED. Spliced into every carrier by `npm run sync:views` from
   * views/shared/week-grid.js. **Edit that file, not this one.**
   *
   * It takes NO arguments beyond the element and the payload: everything it
   * needs is in the payload, and everything it renders it renders itself — so
   * the body can be byte-identical on the response screen and on the detail
   * screen, whose surroundings have nothing else in common.
   *
   * The grid IS the argument for the two lux thresholds. Nobody can judge
   * "under 8 lx" in the abstract; anybody can judge it against a week that
   * visibly has a night and a day in it. It is also what makes the two refusals
   * honest — a cupboard sensor that reports faithfully and says nothing, and a
   * sensor that stopped on Saturday — because the picture shows both in a glance
   * and no wording has to be trusted.
   */
  function weekGrid(host, payload) {
    /**
     * A sensor's own last week, drawn into an element.
     *
     * GENERATED. Spliced into every carrier by `npm run sync:views` from
     * views/shared/week-grid.js. **Edit that file, not this one.**
     *
     * It takes no arguments beyond the element and the payload, and it closes
     * over the `node` every carrier already has — the same trick the daylight
     * card used, and what lets the body be byte-identical on the response screen
     * and on the detail screen, whose surroundings have nothing else in common.
     *
     * The grid IS the argument for the two lux thresholds. Nobody can judge
     * "under 8 lx" in the abstract; anybody can judge it against a week that
     * visibly has a night and a day in it. It is also what makes the two
     * refusals honest — a cupboard sensor that reports faithfully and says
     * nothing, and a sensor that stopped on Saturday — because the picture shows
     * both in a glance and no wording has to be trusted.
     */
    var DAY_KEYS = ['week.mon', 'week.tue', 'week.wed', 'week.thu',
      'week.fri', 'week.sat', 'week.sun'];

    while (host.firstChild) host.removeChild(host.firstChild);
    if (!payload || !payload.week) {
      // No readable history is not an error — the screen falls back to the
      // defaults, which is exactly what every screen did before this existed.
      host.appendChild(node('div', 'week-verdict', Homey.__('week.noHistory')));
      return;
    }

    var week = payload.week;

    var head = node('div', 'week-head');
    // The name only where the surrounding screen has not already said it: the
    // detail screen is titled with the sensor, and repeating it directly under
    // its own heading reads as two different sensors.
    if (payload.sensorName) head.appendChild(node('div', 'name', payload.sensorName));
    head.appendChild(node('span', 'span', Homey.__('week.lastSevenDays')));
    host.appendChild(head);

    /**
     * A cell's colour, on a log scale between the week's own 5th and 95th
     * percentiles.
     *
     * Logarithmic because illuminance is perceived that way and the range is
     * enormous — the same reason `levelFromLux` interpolates on log10 — and on
     * the week's OWN range rather than a fixed one, because a room that never
     * passes 40 lx would otherwise be a uniform dark grid with nothing to read.
     */
    var low = Math.max(0.1, week.low || 0.1);
    var high = Math.max(low * 2, week.high || 1);
    function shade(lux) {
      if (lux === null || lux === undefined) return null;
      var f = (Math.log10(Math.max(0.1, lux)) - Math.log10(low))
        / (Math.log10(high) - Math.log10(low));
      return Math.max(0, Math.min(1, f));
    }

    /**
     * Six steps of the app's own violet, dark to light, rather than a
     * continuous ramp.
     *
     * Stepped because the grid is read as a PATTERN — where the nights are,
     * where the days are — and six distinguishable shades make that pattern
     * legible where 84 nearly-identical ones do not. Light is bright and dark
     * is dark, which is the way round somebody expects a picture of light.
     */
    var SHADES = ['#3b2279', '#6b48bc', '#9f81dc', '#c4b0ec', '#e0d6f6', '#f4f2fa'];
    function cellColour(value) {
      return SHADES[Math.min(SHADES.length - 1, Math.floor((1 - value) * SHADES.length))];
    }

    function round(lux) {
      return lux >= 10 ? Math.round(lux) : Math.round(lux * 10) / 10;
    }

    for (var row = 0; row < week.cells.length; row++) {
      var line = node('div', 'week-row');
      line.appendChild(node('span', 'week-day', Homey.__(DAY_KEYS[(week.days[row] || 1) - 1])));
      for (var column = 0; column < week.cells[row].length; column++) {
        var value = shade(week.cells[row][column]);
        var cell = node('i', value === null ? 'gap' : null);
        if (value !== null) cell.style.background = cellColour(value);
        line.appendChild(cell);
      }
      host.appendChild(line);
    }

    var hours = node('div', 'week-hours');
    var LABELS = ['00', '06', '12', '18', '24'];
    for (var h = 0; h < LABELS.length; h++) hours.appendChild(node('span', null, LABELS[h]));
    host.appendChild(hours);

    var scale = node('div', 'week-scale');
    scale.appendChild(node('span', null, Homey.__('week.lux', { lux: round(low) })));
    var bar = node('span', 'bar');
    if (payload.nowLux !== null && payload.nowLux !== undefined) {
      var at = shade(payload.nowLux);
      var tick = node('span', 'tick');
      tick.style.left = (at * 100) + '%';
      bar.appendChild(tick);
      var label = node('span', 'tickLabel', Homey.__('week.nowLux', { lux: round(payload.nowLux) }));
      label.style.left = (at * 100) + '%';
      bar.appendChild(label);
    }
    scale.appendChild(bar);
    scale.appendChild(node('span', null, Homey.__('week.lux', { lux: round(high) })));
    host.appendChild(scale);

    /**
     * What this week is worth, in a sentence with the numbers in it.
     *
     * Four verdicts, and the order they are decided in matters: a sensor that
     * stopped a month ago also looks flat, and "it stopped on Saturday" is the
     * far more useful thing to say.
     */
    var verdict = week.verdict || { kind: 'nothing' };
    var sentence = node('div', 'week-verdict');

    if (verdict.kind === 'usable') {
      sentence.appendChild(node('b', null, Homey.__('week.usable')));
      sentence.appendChild(document.createTextNode(' ' + Homey.__('week.usableDetail', {
        night: round(verdict.nightLux), noon: round(verdict.noonLux)
      })));
    } else if (verdict.kind === 'flat') {
      sentence.appendChild(node('b', null, Homey.__('week.flat')));
      sentence.appendChild(document.createTextNode(' ' + Homey.__('week.flatDetail', {
        low: round(verdict.low), high: round(verdict.high)
      })));
    } else if (verdict.kind === 'stopped') {
      sentence.appendChild(node('b', null, Homey.__('week.stopped')));
      sentence.appendChild(document.createTextNode(' ' + Homey.__('week.stoppedDetail', {
        when: new Date(verdict.lastAt).toLocaleString()
      })));
    } else {

    }

  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var el = {
    steps: document.getElementById('rs-steps'),
    error: document.getElementById('rs-error'),
    stale: document.getElementById('rs-stale'),
    sunBlock: document.getElementById('rs-sunBlock'),
    peaks: document.getElementById('rs-peaks'),
    week: document.getElementById('rs-week'),
    endName: document.getElementById('rs-endName'),
    endWhich: document.getElementById('rs-endWhich'),
    thresholdCap: document.getElementById('rs-thresholdCap'),
    thresholdVal: document.getElementById('rs-thresholdVal'),
    thresholdUp: document.getElementById('rs-thresholdUp'),
    thresholdDown: document.getElementById('rs-thresholdDown'),
    pct: document.getElementById('rs-pct'),
    bright: document.getElementById('rs-bright'),
    brightKnob: document.getElementById('rs-brightKnob'),
    others: document.getElementById('rs-others'),
    try: document.getElementById('rs-try'),
    msg: document.getElementById('rs-msg'),
    next: document.getElementById('rs-next')
  };

  /** The four answers, each with the shape it produces. */
  var PEAKS = [
    { id: 'morning', nameKey: 'response.peakMorning', shape: [3, 6, 9, 8, 6, 4, 2, 1] },
    { id: 'midday', nameKey: 'response.peakMidday', shape: [1, 3, 6, 9, 9, 6, 3, 1] },
    { id: 'afternoon', nameKey: 'response.peakAfternoon', shape: [1, 2, 4, 6, 8, 9, 6, 3] },
    { id: 'flat', nameKey: 'response.peakFlat', shape: [2, 3, 4, 4, 4, 4, 3, 2] }
  ];

  var state = {
    response: null,
    usingSensor: false,
    selected: 'dark',
    week: null,
    now: null
  };

  function fail(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  function renderSteps() {
    clear(el.steps);
    for (var i = 1; i <= 4; i++) el.steps.appendChild(node('i', i <= 3 ? 'on' : null));
    el.steps.appendChild(node('span', null, Homey.__('response.step', { index: 3, count: 4 })));
  }

  function renderPeaks() {
    clear(el.peaks);

  function peakTile(peak) {

    var shape = node('div', 'shape');
    for (var i = 0; i < peak.shape.length; i++) {
      var bar = node('i');
      bar.style.height = (peak.shape[i] / 9) * 100 + '%';
      shape.appendChild(bar);
    }
    tile.appendChild(shape);

    var hours = node('div', 'hours');
    hours.appendChild(node('span', null, Homey.__('response.sixAm')));
    hours.appendChild(node('span', null, Homey.__('response.sixPm')));
    tile.appendChild(hours);

    tile.appendChild(node('div', 'name', Homey.__(peak.nameKey)));

  function thresholdOf(which) {
    if (state.usingSensor) {
      return which === 'dark' ? state.response.darkLux : state.response.brightLux;
    }
    return which === 'dark' ? state.response.darkElevation : state.response.brightElevation;
  }

  function thresholdText(which) {
    var value = thresholdOf(which);
    if (state.usingSensor) {
      return Homey.__(which === 'dark' ? 'response.underLux' : 'response.overLux', {
        lux: value >= 10 ? Math.round(value) : Math.round(value * 10) / 10

    }
    /**
     * An elevation, labelled with the clock time it happens TODAY.
     *
     * "−3°" is not a thing anybody can picture; "around 20:18 today" is. The
     * stored value is still the angle, because an angle is the same all year and
     * a time is not — which is exactly why the label says "today".

  }

  /**
   * "1st", "2nd", "3rd", "22nd" — the suffix from the locale, never a literal.
   *
   * 11 to 13 are the exception every implementation of this gets wrong once:
   * they take "th" despite ending in 1, 2 and 3.

      else if (n % 10 === 2) key = 'ordinal.nd';
      else if (n % 10 === 3) key = 'ordinal.rd';
    }
    return n + Homey.__(key);
  }

  function render() {
    el.sunBlock.style.display = state.usingSensor ? 'none' : '';
    el.week.style.display = state.usingSensor ? '' : 'none';
    if (!state.usingSensor) renderPeaks();
    else weekGrid(el.week, { week: state.week, sensorName: state.sensorName, nowLux: state.nowLux });

    var which = state.selected;
    el.endName.textContent = Homey.__(which === 'dark'
      ? (state.usingSensor ? 'response.whenDark' : 'response.afterDark')
      : (state.usingSensor ? 'response.whenBright' : 'response.middleOfDay'));
    el.endWhich.textContent = Homey.__('response.which', {
      index: ordinal(which === 'dark' ? 1 : 2), count: 2
    });

    el.thresholdCap.textContent = Homey.__(which === 'dark'
      ? (state.usingSensor ? 'response.darkMeans' : 'response.darkFrom')
      : (state.usingSensor ? 'response.brightMeans' : 'response.brightFrom'));
    el.thresholdVal.textContent = thresholdText(which);

    var brightness = which === 'dark' ? state.response.dark : state.response.bright;
    el.pct.textContent = Math.round(brightness * 100) + '%';
    setSlider(el.brightKnob, brightness);

    renderOther();
  }

  function renderOther() {
    clear(el.others);
    var other = state.selected === 'dark' ? 'bright' : 'dark';
    var row = node('button', 'row');
    row.type = 'button';

    var text = node('div');
    text.style.flex = '1';
    text.appendChild(node('div', null, Homey.__(other === 'dark'
      ? (state.usingSensor ? 'response.whenDark' : 'response.afterDark')
      : (state.usingSensor ? 'response.whenBright' : 'response.middleOfDay'))));
    text.appendChild(node('div', 'sub', thresholdText(other)));
    row.appendChild(text);

    var brightness = other === 'dark' ? state.response.dark : state.response.bright;
    row.appendChild(node('span', 'value', Math.round(brightness * 100) + '%'));
    row.appendChild(node('span', 'chev', '›'));

    row.addEventListener('click', function () {
      state.selected = other;
      render();
    });
    el.others.appendChild(row);
  }

  function setSlider(knob, value) {
    // The track carries the range; the knob is the only thing that moves.
    knob.style.left = (Math.max(0, Math.min(1, value)) * 100) + '%';
  }

  function stepThreshold(direction) {
    var which = state.selected;
    if (state.usingSensor) {
      // Stepped multiplicatively, because lux is perceived logarithmically and
      // a fixed step would be enormous at the dark end and invisible at the
      // bright one.
      var key = which === 'dark' ? 'darkLux' : 'brightLux';
      var next = state.response[key] * (direction > 0 ? 1.25 : 0.8);
      state.response[key] = Math.max(0.1, Math.round(next * 10) / 10);
    } else {
      var angleKey = which === 'dark' ? 'darkElevation' : 'brightElevation';
      state.response[angleKey] = Math.max(-18, Math.min(60, state.response[angleKey] + direction));
    }
    render();
    push();
  }

  el.thresholdUp.addEventListener('click', function () { stepThreshold(1); });
  el.thresholdDown.addEventListener('click', function () { stepThreshold(-1); });

  (function () {
    var dragging = false;
    function fractionOf(event) {
      var rect = el.bright.getBoundingClientRect();
      return Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    }
    el.bright.addEventListener('pointerdown', function (event) {
      dragging = true;
      if (el.bright.setPointerCapture) el.bright.setPointerCapture(event.pointerId);
      apply(fractionOf(event));
    });
    el.bright.addEventListener('pointermove', function (event) {
      if (dragging) apply(fractionOf(event));
    });
    function end() { if (dragging) { dragging = false; push(); } }
    el.bright.addEventListener('pointerup', end);
    el.bright.addEventListener('pointercancel', end);

    function apply(fraction) {
      if (state.selected === 'dark') state.response.dark = fraction;
      else state.response.bright = fraction;
      render();
    }
  })();

  el.try.addEventListener('click', function () {
    el.msg.style.display = 'none';
    emit('previewNow').then(function (outcome) {
      el.msg.className = 'msg ok';
      el.msg.textContent = Homey.__('response.tried', { writes: outcome.writes });
      el.msg.style.display = '';
    }).catch(function (err) {
      el.msg.className = 'msg bad';
      el.msg.textContent = err && err.message ? err.message : String(err);
      el.msg.style.display = '';
    });
  });

  el.next.addEventListener('click', function () { Homey.showView('review'); });

  function push() {
    emit('setDaylight', { response: state.response }).then(function (reply) {
      state.response = reply.response;
      state.atDark = reply.atDark;
      state.atBright = reply.atBright;
      render();
    }).catch(fail);
  }

  renderSteps();

  emit('getResponse').then(function (payload) {
    state.response = payload.response;
    state.usingSensor = payload.response.sensor !== null;
    state.week = payload.week;
    state.sensorName = payload.sensorName;
    state.nowLux = payload.nowLux;
    state.atDark = payload.atDark;
    state.atBright = payload.atBright;

    if (payload.staleFor) {
      el.stale.textContent = Homey.__('response.stale', {
        name: payload.sensorName, hours: payload.staleFor
      });
      el.stale.style.display = '';
    }

    render();
  }).catch(fail);
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootRs(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('rs-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootRs(ready || window.Homey); };
  waitForHomey();
})();
</script>
