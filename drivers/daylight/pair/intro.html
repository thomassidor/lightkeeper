<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #in-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #in-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #in-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #in-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #in-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #in-root .section { margin-bottom: 18px; }
  #in-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #in-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #in-root .tile:hover { border-color: var(--lk-hover); }
  #in-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #in-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #in-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #in-root input[type=text], #in-root input[type=password], #in-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #in-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #in-root input:focus, #in-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #in-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #in-root .btn:hover { border-color: var(--lk-hover); }
  #in-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #in-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #in-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #in-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #in-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #in-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #in-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #in-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #in-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #in-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #in-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #in-root .grid { grid-template-columns: 1fr; } }
  #in-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #in-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #in-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  #in-root .steps i.on { background: var(--lk-accent); }
  #in-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened. */
  #in-root .row { display: flex; align-items: center; gap: 11px; width: 100%;
               padding: 13px 14px; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #in-root .row + .row { border-top: 1px solid var(--lk-line); }
  #in-root .row .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #in-root .row .value { font-size: 13px; color: var(--lk-muted); text-align: right; }
  #in-root .row .chev { flex: none; font-size: 15px; color: var(--lk-muted); }
  #in-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }

  /* The pill switch behind every "Set … too". */
  #in-root .toggle { display: flex; align-items: center; gap: 11px; width: 100%;
                  padding: 12px 0; min-height: 44px; box-sizing: border-box;
                  background: none; border: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #in-root .toggle .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #in-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #in-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #in-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #in-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #in-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #in-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #in-root .slider.warm { background: var(--lk-warm-ramp); }
  #in-root .slider.bright { background: var(--lk-bright-ramp); }
  #in-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  #in-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-muted); margin: 9px 0 0; }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #in-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 8px; margin: 10px 0; }
  #in-root .swatch { height: 44px; border-radius: 9px; padding: 0;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  #in-root .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--lk-surface),
                                                   0 0 0 4px var(--lk-accent); }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #in-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #in-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #in-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #in-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-ring);
                       box-shadow: var(--lk-handle-shadow); }
  #in-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #in-root .clockline { display: flex; justify-content: space-between;
                     font-size: 12px; color: var(--lk-muted); margin-top: 6px; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  /* The hero. Five small renderers share this frame, because what each device
     type does is easier to show than to say: a day of colour, a curve, a lux
     ramp, blocks on a timeline, a remote's rows. */
  #in-root .hero { height: 56px; border-radius: 12px; overflow: hidden;
                   margin: 4px 0 18px; display: flex; align-items: flex-end; gap: 3px;
                   padding: 0; background: var(--lk-flat-bg); }
  #in-root .hero.strip { display: block; }
  #in-root .hero i { flex: 1; border-radius: 3px 3px 0 0; }
  #in-root .hero .block { position: absolute; top: 14px; bottom: 14px;
                          border-radius: 6px; background: var(--lk-accent); }
  #in-root .hero.timeline { position: relative; display: block; background: var(--lk-flat-bg); }

  #in-root .press { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
                    border-bottom: 1px solid var(--lk-line); font-size: 13px; }
  #in-root .press:last-child { border-bottom: none; }
  #in-root .press .key { font-weight: 600; }
  #in-root .press .act { flex: 1; color: var(--lk-muted); }
  #in-root .press .job { color: var(--lk-accent-strong); font-weight: 600; }

  /* The three or four decisions the flow is about to ask for. Naming them up
     front is the whole job of this screen: a user who knows what is coming can
     press Next through the defaults, and one who does not cannot. */
  #in-root .plan { margin: 4px 0 8px; }
  #in-root .decision { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; }
  #in-root .decision + .decision { border-top: 1px solid var(--lk-line); }
  #in-root .decision .n { flex: none; width: 24px; height: 24px; border-radius: 50%;
                          background: var(--lk-accent-tint); color: var(--lk-accent-strong);
                          font-size: 12.5px; font-weight: 700;
                          display: flex; align-items: center; justify-content: center; }
  #in-root .decision .what { font-size: 14.5px; font-weight: 500; }
  #in-root .decision .why { font-size: 12.5px; color: var(--lk-muted); margin-top: 2px;
                            line-height: 1.4; }
</style>

<div class="wrap" id="in-root">
  <h2 id="in-title"></h2>
  <p class="sub" id="in-blurb"></p>

  <div class="hero" id="in-hero"></div>

  <div class="plan" id="in-plan"></div>

  <div id="in-error" class="msg bad" style="display:none;"></div>

  <button class="btn-primary" id="in-start" data-i18n="intro.start"></button>
</div>

<script type="text/javascript">
/**
 * The unnumbered screen at the head of every flow.
 *
 * It says what the device does and NAMES the decisions the numbered steps will
 * ask for — which is what lets every one of those steps be finished by pressing
 * Next, because the user already knows what they are pressing past. The steps it
 * promises are exactly the ones that carry a dot; this screen carries none.
 *
 * **One file, five drivers** (platform §8). Everything specific arrives in the
 * `getIntro` payload: the title, the one sentence, which hero to draw, the list
 * of decisions, and which view comes next. The five hero renderers live here
 * rather than in each driver because they are pictures of the device types, and
 * the alternative is five nearly-identical view files.
 *
 * Pair views are INJECTED INTO the pairing container's document — they do not
 * get their own iframe, and they must not load homey.js themselves. All views of
 * a session share ONE document, which is why every rule here is scoped to this
 * view's root id and the boot guard lives on the root ELEMENT.
 */
function __lkBootIn(Homey) {
  var __root = document.getElementById('in-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var el = {
    title: document.getElementById('in-title'),
    blurb: document.getElementById('in-blurb'),
    hero: document.getElementById('in-hero'),
    plan: document.getElementById('in-plan'),
    error: document.getElementById('in-error'),
    start: document.getElementById('in-start')
  };

  var nextView = null;

  /** A warm-to-cool day, as the circadian light would run it. */
  function heroDay() {
    el.hero.className = 'hero strip';
    var stops = [
      '#efa658 0%', '#efa658 20%', '#f4c68a 30%', '#eaf0fb 46%',
      '#e6edfb 60%', '#f4c68a 72%', '#efa658 82%', '#efa658 100%'
    ];
    el.hero.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
  }

  /** Bars of colour at different heights: brightness and colour per point. */
  function heroCurve() {
    var colours = ['#efa658', '#f2d3a0', '#e8eefb', '#dfe8fb', '#e6edfb',
      '#f4c68a', '#ef9d6e', '#e87d5a', '#c26a9b', '#8e6ac2'];
    var heights = [38, 52, 74, 88, 92, 80, 66, 54, 40, 30];
    for (var i = 0; i < colours.length; i++) {
      var bar = node('i');
      bar.style.background = colours[i];
      bar.style.height = heights[i] + '%';
      el.hero.appendChild(bar);
    }
  }

  /** A ramp: the lamps filling in whatever the daylight is not doing. */
  function heroDaylight() {
    for (var i = 0; i < 10; i++) {
      var bar = node('i');
      bar.style.background = i < 5 ? 'var(--lk-accent)' : 'var(--lk-accent-line)';
      bar.style.height = (92 - i * 8) + '%';
      el.hero.appendChild(bar);
    }
  }

  /** Blocks on a day: the hours the lights are on. */
  function heroSchedule() {
    el.hero.className = 'hero timeline';
    var spans = [[6, 14], [30, 12], [62, 10], [82, 14]];
    for (var i = 0; i < spans.length; i++) {
      var block = node('div', 'block');
      block.style.left = spans[i][0] + '%';
      block.style.width = spans[i][1] + '%';
      el.hero.appendChild(block);
    }
  }

  /** One row per thing a remote can do, which is the mapping screen in miniature. */
  function heroRemote() {
    el.hero.className = 'hero timeline';
    el.hero.style.background = 'var(--lk-surface)';
    el.hero.style.border = '1px solid var(--lk-line)';
    var rows = [
      ['intro.remoteTop', 'intro.remotePressed', 'intro.remoteToggle'],
      ['intro.remoteTop', 'intro.remoteHeld', 'intro.remoteBrighter'],
      ['intro.remoteLeft', 'intro.remotePressed', 'intro.remoteNothing']
    ];
    for (var i = 0; i < rows.length; i++) {
      var row = node('div', 'press');
      row.appendChild(node('span', 'key', Homey.__(rows[i][0])));
      row.appendChild(node('span', 'act', Homey.__(rows[i][1])));
      row.appendChild(node('span', 'job', Homey.__(rows[i][2])));
      el.hero.appendChild(row);
    }
  }

  var HEROES = {
    day: heroDay,
    curve: heroCurve,
    daylight: heroDaylight,
    schedule: heroSchedule,
    remote: heroRemote
  };

  function renderDecisions(decisions) {
    clear(el.plan);
    for (var i = 0; i < decisions.length; i++) {
      var row = node('div', 'decision');
      row.appendChild(node('div', 'n', String(i + 1)));
      var text = node('div');
      text.appendChild(node('div', 'what', decisions[i].what));
      text.appendChild(node('div', 'why', decisions[i].why));
      row.appendChild(text);
      el.plan.appendChild(row);
    }
  }

  el.start.addEventListener('click', function () {
    if (nextView) Homey.showView(nextView);
  });

  emit('getIntro').then(function (payload) {
    el.title.textContent = payload.title;
    el.blurb.textContent = payload.blurb;
    nextView = payload.nextView || null;

    var hero = HEROES[payload.hero];
    if (hero) hero();
    else el.hero.style.display = 'none';

    renderDecisions(payload.decisions || []);
  }).catch(function (err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  });
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootIn(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('in-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootIn(ready || window.Homey); };
  waitForHomey();
})();
</script>
