<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #sn-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    /* Between the accent and its line. The middle of the three listening dots,
       and the only place a mid-tone is needed: the logo has none. */
    --lk-accent-mid: #9f81dc;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);
    /* The edge of a handle nobody has selected. It is NOT --lk-ring: at .16 a
       26px circle on an orange strip had no edge at all, and the second
       boundary looked like a smudge rather than something to drag. */
    --lk-handle-edge: rgba(42, 25, 88, .45);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    /* The edge of an UNTICKED box or radio, and only that. A shade darker than
       --lk-field because an empty checkbox has to read as a control somebody
       has not used yet; at the field grey it reads as a gap in the row. */
    --lk-box: #d4d8e0;
    --lk-hover: #c9d2e0;
    /* A chevron is an affordance, not a value: lighter than the text it sits
       beside, so a list of rows reads as labels rather than as arrows. */
    --lk-chev: #a8aeb9;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-knob-shadow-warm: 0 0 0 2.5px #ffffff, 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    /* The two ENDS of the warmth axis, for the two tiles that nudge along it
       rather than setting it. The whole ramp draws the same picture on both,
       which is no picture at all, so each of these runs from the middle of
       --lk-warm-ramp out to one end of it.
       The cool end is DEEPER than that ramp's own #dbe8fb: at 30x12px on white
       the real end of the axis is a chip with no edge, so the tile that said
       "cooler" showed nothing at all. Deepened to where it reads, and no
       further — it is a picture of a direction, not a colour to match. */
    --lk-warmer-ramp: linear-gradient(90deg, #f7efe3, #e8892c);
    --lk-cooler-ramp: linear-gradient(90deg, #f7efe3, #7ba7e0);
    /* A lamp that is ON, drawn rather than named: the one warm accent in an
       interface that is otherwise entirely violet, because "on" is a picture of
       light and the brand colour is a picture of the app. */
    --lk-lamp-lit: #f0b429;
    --lk-lamp-glow: rgba(240, 180, 41, .22);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    /* A small mark lifted off whatever it is drawn ON — the curve chart's
       selected point, which sits on top of a bar of any colour. */
    --lk-mark-shadow: 0 1px 4px rgba(16, 24, 40, .3);
    /* The halo round a SELECTED block on the schedule timeline, and round a
       selected swatch. Softer than --lk-ring is used for elsewhere, because it
       is drawn against the accent itself rather than against white. */
    --lk-select-halo: 0 0 0 3px rgba(42, 25, 88, .18);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    /* The curve chart's own "you are editing this point" line. Accent rather
       than ink, because on that chart it marks a SELECTION; on the day strip
       the dashed lines mark sunrise and sunset, which are facts. */
    --lk-curve-mark: rgba(42, 25, 88, .55);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 16px under a heading, which is the gap the design draws on every screen
     that puts a control straight below one. It used to be 4px, and at 4px a
     title read as a label ON the first card rather than as the name of the
     screen. */
  #sn-root h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #sn-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-body); margin: 0 0 18px; }
  /* A blurb belongs TO its heading — 6px between them, not 16. Written as a
     pull on the blurb rather than as `h2:has(+ .sub)` on the heading because
     the pairing container's webview is not somewhere to find out whether
     `:has()` landed. */
  #sn-root h2 + .sub { margin-top: -10px; }
  #sn-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #sn-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #sn-root .section { margin-bottom: 18px; }
  #sn-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #sn-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #sn-root .tile:hover { border-color: var(--lk-hover); }
  #sn-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #sn-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #sn-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #sn-root input[type=text], #sn-root input[type=password], #sn-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #sn-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #sn-root input:focus, #sn-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #sn-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #sn-root .btn:hover { border-color: var(--lk-hover); }
  #sn-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  /* The same button across the width of the screen. What a secondary action
     looks like when it is the only one on a pushed screen — "Stop listening",
     "Close" — where a primary button would claim the choice was made. */
  #sn-root .btn.wide { display: block; width: 100%; font-size: 16px; font-weight: 600;
                    padding: 14px; border-radius: 12px; min-height: 50px;
                    box-sizing: border-box; margin-top: 16px; }
  #sn-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #sn-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #sn-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #sn-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #sn-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #sn-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #sn-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #sn-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #sn-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #sn-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #sn-root .grid { grid-template-columns: 1fr; } }
  #sn-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #sn-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #sn-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  /* Four steps, narrower dots: the run keeps the same overall width whether a
     flow has three or four, so the header does not visibly grow between two
     device types. */
  #sn-root .steps.tight i { width: 16px; }
  #sn-root .steps i.on { background: var(--lk-accent); }
  #sn-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened.

     The row carries NO horizontal padding, and its card carries it instead
     (`.card.rows` below). That is what insets the hairline between two rows
     from the card's own edge — a rule that runs corner to corner reads as the
     card being cut in half, and every list the design draws insets it. */
  #sn-root .row { display: flex; align-items: center; gap: 10px; width: 100%;
               padding: 13px 0; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #sn-root .row + .row { border-top: 1px solid var(--lk-line); }
  #sn-root .row .label { flex: 1; font-size: 14.5px; }
  #sn-root .row .value { font-size: 14px; color: var(--lk-muted); text-align: right; }
  #sn-root .row .chev { flex: none; font-size: 15px; color: var(--lk-chev); }
  #sn-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }
  /* The card a list of rows lives in. 4px top and bottom rather than 14:
     a row's own 13px is already the space above the first label, and adding
     the card's to it put a visible step between the card's edge and its
     first line that no other card has. */
  #sn-root .card.rows { padding: 4px 14px; }

  /* The pill switch behind every "Set … too".
     It carries a rule above it, always: a toggle is a new decision inside a
     card that was until then about one thing, and without the rule it read as
     the last line of the control above it. */
  #sn-root .toggle { display: flex; align-items: center; gap: 10px; width: 100%;
                  border-top: 1px solid var(--lk-line);
                  margin-top: 14px; padding: 13px 0 0;
                  min-height: 44px; box-sizing: border-box;
                  background: none; border-left: none; border-right: none;
                  border-bottom: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #sn-root .toggle .label { flex: 1; font-size: 14.5px; }
  #sn-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #sn-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #sn-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #sn-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #sn-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #sn-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #sn-root .slider.warm { background: var(--lk-warm-ramp); box-shadow: none; }
  #sn-root .slider.bright { background: var(--lk-bright-ramp); }
  #sn-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  /* The two ramps take OPPOSITE knobs, and that is not a slip: the warmth ramp
     is light from end to end, so a white knob on it is invisible; the
     brightness ramp starts at near-black, so a dark one is. Each knob is the
     colour its own track is not. */
  #sn-root .slider.warm .knob { background: var(--lk-ink);
                             box-shadow: var(--lk-slider-knob-shadow-warm); }
  #sn-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-faint); margin: 9px 0 0; }

  /* An aside under a control: "there is a device type that does this for you".
     Deliberately NOT a .msg — a message has a coloured ground and is about
     something that just happened, and this is a pointer nobody has to read to
     finish the screen. So no ground, the faint ink, italic, and one mark in
     front of every one of them so they read as the same kind of thing on four
     different screens.

     It sits directly under the control it qualifies rather than at the foot of
     the card, because three of the four screens carry a second control below
     it and an aside that floated to the bottom would read as belonging to
     that one instead. */
  #sn-root .tip { display: flex; align-items: flex-start; gap: 7px;
               margin: 13px 0 0; font-size: 12px; line-height: 1.45;
               font-style: italic; color: var(--lk-faint); }
  /* The circled i, DRAWN rather than set. A glyph that the phone's font does
     not carry renders as a box, which is why the one other mark this design
     puts inside text — the row chevron — is an entity rather than an icon; a
     circle and a letter need no font at all. Upright inside the italic line,
     because a sloped circle reads as a smudge at 15px. `line-height` is the
     content box (15px less two 1.2px borders), which is what centres the
     letter without a second flex container.

     A pseudo-element rather than a span, so a view's whole tip is one element
     whose text `data-i18n` fills: Homey's own i18n pass writes the element's
     text, and a mark written as a child would be written over. */
  #sn-root .tip::before { content: "i"; flex: none; box-sizing: border-box;
                       width: 15px; height: 15px; margin-top: 1px;
                       border: 1.2px solid var(--lk-chev); border-radius: 50%;
                       font-size: 10px; font-weight: 700; font-style: normal;
                       line-height: 12.6px; text-align: center;
                       color: var(--lk-chev); }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #sn-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 7px; margin: 0 0 11px; }
  /* min-height as well as height: the container's own stylesheet is not ours
     to read, and a swatch whose height is overridden away is a coloured line
     rather than a colour anybody can judge. */
  #sn-root .swatch { height: 34px; min-height: 34px; border-radius: 9px; padding: 0;
                  box-sizing: border-box;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  /* The chosen colour, and it has to survive being ON a colour: a ring drawn
     in the accent with a soft halo outside it reads against every swatch in
     the palette, which a white gap did not against the pale ones. */
  #sn-root .swatch[aria-pressed="true"] { border: 2.5px solid var(--lk-accent);
                                       box-shadow: 0 0 0 3px var(--lk-ring); }
  /* The sixteen that fold out: same set, half the size, eight across.

     18px above them, not the 7px between the featured rows: at the same gap the
     fold-out read as two more rows of the grid above it rather than as the set
     that had just been opened, and the eye had to measure swatch sizes to find
     where one group ended. The space is what separates them; both sets are
     still the same palette, so nothing stronger than space is wanted. */
  #sn-root .swatches.more { grid-template-columns: repeat(8, 1fr); gap: 6px;
                         margin: 18px 0 0; }
  #sn-root .swatches.more .swatch { height: 28px; min-height: 28px; border-radius: 7px; }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #sn-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #sn-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #sn-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #sn-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-handle-edge); z-index: 1;
                       box-shadow: var(--lk-handle-shadow); }
  #sn-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #sn-root .clockline { display: flex; justify-content: space-between;
                     font-size: 11px; color: var(--lk-faint); margin: 8px 2px 4px; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  /* The real choice is sensors OR the sun, so both are offered as peers at the
     top. Picking no sensor is not a failure — it is the sun, and the option
     says so rather than the screen warning about an absence. */
  #sn-root .choices { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  #sn-root .choice { display: block; width: 100%; text-align: left; padding: 14px;
                     border-radius: 12px; box-sizing: border-box;
                     border: 1.5px solid var(--lk-line); background: var(--lk-surface);
                     font: inherit; color: inherit; cursor: pointer; min-height: 44px; }
  #sn-root .choice[aria-pressed="true"] { border-color: var(--lk-accent);
                                          background: var(--lk-accent-tint); }
  /* Name on the left, what it reads right now on the right of the same line:
     the reading is what tells the two options apart, so it sits beside the name
     rather than under it. */
  #sn-root .choice .head { display: flex; align-items: baseline; gap: 10px; }
  /* The chosen one is the heavier of the two, and its own supporting text
     darkens with it: two cards at one weight left a screen whose whole job is a
     choice with nothing saying which had been made. */
  #sn-root .choice .what { flex: 1; font-size: 15px; font-weight: 500; }
  #sn-root .choice[aria-pressed="true"] .what { font-weight: 600; }
  #sn-root .choice .now { font-size: 12.5px; color: var(--lk-muted); text-align: right; }
  #sn-root .choice .why { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px;
                          line-height: 1.4; }
  #sn-root .choice[aria-pressed="true"] .now,
  #sn-root .choice[aria-pressed="true"] .why { color: var(--lk-body); }

  /* The room name is a HEADER on the card of sensors, not a label floating above
     it — the same shape the light picker's rooms take, so two screens that list
     the household by room list it the same way. */
  #sn-root .sensors { background: var(--lk-surface); border: 1px solid var(--lk-line);
                      border-radius: 14px; box-shadow: var(--lk-shadow);
                      overflow: hidden; margin-bottom: 14px; }
  #sn-root .sensors .room-title { font-size: 13.5px; font-weight: 600; line-height: 1.2;
                                  color: var(--lk-ink); background: var(--lk-raised);
                                  padding: 12px 14px; min-height: 44px; box-sizing: border-box;
                                  display: flex; align-items: center;
                                  border-bottom: 1px solid var(--lk-line); }
  /* The rows are inset by the CARD, so the hairline between two sensors stops
     short of its edge rather than cutting it in half. Same shape as the light
     picker's open room, because the two screens list the same household. */
  #sn-root .sensors .list { padding: 0 14px; }
  #sn-root .sensor { gap: 12px; padding: 12px 0; }
  #sn-root .sensor .box { flex: none; width: 22px; height: 22px; border-radius: 50%;
                          border: 1.5px solid var(--lk-box); box-sizing: border-box;
                          display: flex; align-items: center; justify-content: center;
                          font-size: 12px; font-weight: 700; color: transparent; }
  #sn-root .sensor[aria-pressed="true"] .box { background: var(--lk-accent);
                                               border-color: var(--lk-accent);
                                               color: var(--lk-accent-ink); }
  #sn-root .sensor .text { flex: 1; }
  #sn-root .sensor .text .sensor-name { font-size: 14.5px; font-weight: 500; }
  #sn-root .sensor .text .sub { font-size: 12.5px; }
  /* A sensor that is not responding stays VISIBLE and greyed rather than
     hidden: a dead sensor somebody expects to see is then explained rather
     than missing. Its box is filled rather than empty, so it does not read as
     one waiting to be ticked. */
  #sn-root .sensor.dead .text { color: var(--lk-muted); }
  #sn-root .sensor.dead .box { border-color: var(--lk-field);
                               background: var(--lk-flat-bg); }

  /* The rooms with no sensor at all: one line each, saying so. Which rooms have
     NO sensor is half of what this screen answers. */
  #sn-root .folded { background: var(--lk-surface); border: 1px solid var(--lk-line);
                     border-radius: 14px; box-shadow: var(--lk-shadow);
                     overflow: hidden; padding: 0 14px; margin-bottom: 16px; }
  #sn-root .folded .row .label { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  #sn-root .folded .row .value { font-size: 12.5px; }
  #sn-root .folded .row.empty-room .label,
  #sn-root .folded .row.unzoned .label { color: var(--lk-muted); }
</style>

<div class="wrap" id="sn-root">
  <div class="steps" id="sn-steps"></div>
  <h2 data-i18n="sensor.title"></h2>

  <div id="sn-error" class="msg bad" style="display:none;"></div>

  <div class="choices">
    <button class="choice" id="sn-useSensor" type="button" aria-pressed="false">
      <span class="head">
        <span class="what" data-i18n="sensor.aSensor"></span>
        <span class="now" id="sn-sensorNow"></span>
      </span>
      <span class="why" data-i18n="sensor.aSensorWhy"></span>
    </button>
    <button class="choice" id="sn-useSun" type="button" aria-pressed="false">
      <span class="head">
        <span class="what" data-i18n="sensor.theSun"></span>
        <span class="now" id="sn-sunNow"></span>
      </span>
      <span class="why" data-i18n="sensor.theSunWhy"></span>
    </button>
  </div>

  <div id="sn-list"></div>
  <div class="folded" id="sn-folded"></div>
  <div class="empty" id="sn-none" style="display:none;" data-i18n="sensor.noneFound"></div>
</div>

<script type="text/javascript">
/**
 * Where the reading comes from.
 *
 * **One sensor, not several.** A radio list grouped by room, because a hall
 * sensor is a legitimate reading for a room with none of its own. Averaging
 * several was a power-user answer to a question most homes do not have — a room
 * has the sensor it has — and it made "which sensor is wrong" unanswerable.
 *
 * **The sun is a peer, not a fallback.** Following the sun is a choice made
 * here, so the next screen says "Following the sun" rather than "no sensor
 * picked", and a home with no sensors at all lands there and never sees a
 * warning about it.
 *
 * Every row shows its reading and when it last reported. "1400 lx · just now" is
 * the one that would ruin the device — a sensor pointed at a window measures the
 * window — and the age is the only thing on screen that can reveal a sensor
 * which has stopped, since a reading is never treated as stale (platform §16).
 */
function __lkBootSn(Homey) {
  var __root = document.getElementById('sn-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var el = {
    steps: document.getElementById('sn-steps'),
    error: document.getElementById('sn-error'),
    useSensor: document.getElementById('sn-useSensor'),
    sensorNow: document.getElementById('sn-sensorNow'),
    useSun: document.getElementById('sn-useSun'),
    sunNow: document.getElementById('sn-sunNow'),
    list: document.getElementById('sn-list'),
    folded: document.getElementById('sn-folded'),
    none: document.getElementById('sn-none')
  };

  var state = { rooms: [], chosen: null, sky: null, anySensors: false };

  function t(key) { return Homey.__(key); }

  function fail(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  function renderSteps() {
    clear(el.steps);
    // Four steps get narrower dots, so the run is the same width whether a
    // flow has three or four of them.
    el.steps.className = 'steps tight';
    for (var i = 1; i <= 4; i++) el.steps.appendChild(node('i', i <= 2 ? 'on' : null));
    el.steps.appendChild(node('span', null, Homey.__('sensor.step', { index: 2, count: 4 })));
  }

  /**
   * How long ago a reading arrived, in words.
   *
   * Load-bearing rather than decorative: a frozen sensor is indistinguishable
   * from a genuinely constant room by anything except this, and half the sensors
   * in one measured house were frozen while Homey reported them available
   * (platform §16).
   */
  function ageOf(at) {
    if (at === null || at === undefined) return Homey.__('sensor.neverReported');
    var minutes = Math.round((Date.now() - at) / 60000);
    if (minutes < 2) return Homey.__('sensor.justNow');
    if (minutes < 60) return Homey.__('sensor.minutesAgo', { minutes: minutes });
    var hours = Math.round(minutes / 60);
    if (hours < 48) return Homey.__('sensor.hoursAgo', { hours: hours });
    return Homey.__('sensor.daysAgo', { days: Math.round(hours / 24) });
  }

  function render() {
    var usingSensor = state.chosen !== null;
    var chosen = chosenSensor();

    // Which sensor, and what it reads — not how many exist. By the time anybody
    // looks at this line the option has been chosen, and "4 found" then answers
    // a question nobody is still asking. Re-rendered on every pick, because
    // picking a different sensor changes it.
    el.sensorNow.textContent = chosen
      ? Homey.__('sensor.chosenNow', {
        name: chosen.name, lux: chosen.lux === null ? '—' : chosen.lux
      })
      : (state.anySensors
        ? Homey.__('sensor.countAvailable', { count: countSensors() })
        : Homey.__('sensor.noneAvailable'));

    el.useSensor.setAttribute('aria-pressed', usingSensor ? 'true' : 'false');
    el.useSun.setAttribute('aria-pressed', usingSensor ? 'false' : 'true');
    el.useSensor.disabled = !state.anySensors;

    clear(el.list);
    clear(el.folded);
    var empties = 0;
    for (var i = 0; i < state.rooms.length; i++) {
      var room = state.rooms[i];
      /**
       * EVERY sensor is drawn, and none of them is behind a tap.
       *
       * A room used to open only if it held the chosen sensor or had been
       * tapped, on the argument that a house of eleven rooms has to fold to fit
       * a 390px screen. What that actually produced was a screen saying "4
       * found" above a list showing one, with the other three behind rooms
       * nobody had a reason to tap: the count was the only evidence they
       * existed, and a count is not a list. Sensors are rare — the folding was
       * sized for the LIGHT picker's problem, where a house has forty — so
       * showing all of them costs a short scroll and removes the one thing this
       * screen got wrong.
       *
       * The rooms with no sensor stay one line each, saying so. That half was
       * right: leaving them out makes the house look smaller than it is, and
       * "this room has none" is half the answer to where the reading should
       * come from.
       */
      if (room.sensors.length > 0) {
        el.list.appendChild(openRoom(room));
      } else {
        empties += 1;
        el.folded.appendChild(foldedRoom(room));
      }
    }
    /**
     * The room list belongs to the SENSOR option, all of it.
     *
     * Only the open rooms used to be hidden when the sun was picked, and the
     * folded ones stayed — so a house whose rooms had been expanded while
     * browsing showed "4 found" over a list of one, the other three having been
     * drawn into the hidden container. A room list under "the sun" answers a
     * question nobody is still asking, so both halves go together.
     */
    el.list.style.display = usingSensor ? '' : 'none';
    el.folded.style.display = usingSensor && empties > 0 ? '' : 'none';
  }

  function openRoom(room) {
    var card = node('div', 'sensors');
    card.appendChild(node('div', 'room-title',
      room.unzoned ? t('lights.noRoom') : room.zoneName));
    var list = node('div', 'list');
    for (var j = 0; j < room.sensors.length; j++) {
      list.appendChild(renderSensor(room.sensors[j]));
    }
    card.appendChild(list);
    return card;
  }

  /**
   * A room with no sensor: one line, saying so, and nothing to tap.
   *
   * It takes no click handler because a room only reaches this list by having
   * nothing in it — there is no longer any such thing as a room folded over
   * sensors it is hiding.
   */
  function foldedRoom(room) {
    var row = node('button', 'row empty-room' + (room.unzoned ? ' unzoned' : ''));
    row.type = 'button';
    row.disabled = true;
    row.appendChild(node('span', 'label',
      room.unzoned ? t('lights.noRoom') : room.zoneName));
    row.appendChild(node('span', 'value', t('sensor.noneHere')));
    return row;
  }

  function renderSensor(sensor) {
    var dead = sensor.available === false || sensor.lux === null;
    var row = node('button', 'row sensor' + (dead ? ' dead' : ''));
    row.type = 'button';
    row.setAttribute('aria-pressed', state.chosen === sensor.id ? 'true' : 'false');
    row.appendChild(node('div', 'box', '✓'));

    var text = node('div', 'text');
    text.appendChild(node('div', 'sensor-name', sensor.name));
    text.appendChild(node('div', 'sub', sensor.available === false
      ? Homey.__('sensor.notResponding')
      : Homey.__('sensor.reading', { lux: Math.round(sensor.lux || 0) }) + ' · ' + ageOf(sensor.at)));
    row.appendChild(text);
    row.appendChild(node('span', 'chev', '›'));

    /**
     * Tapping a row opens its WEEK before committing to it.
     *
     * The whole argument for the sensor choice is what that sensor has actually
     * been reading, and a lux number on one line cannot carry it. Selecting is
     * what the detail screen does on the way back, so a tap here is "show me"
     * rather than "choose".
     */
    row.addEventListener('click', function () {
      emit('inspectSensor', sensor.id).then(function () {
        Homey.showView('sensordetail');
      }).catch(fail);
    });
    return row;
  }

  el.useSun.addEventListener('click', function () {
    state.chosen = null;
    push();
  });

  el.useSensor.addEventListener('click', function () {
    // Picking the first sensor rather than none, because "a light sensor" with
    // nothing chosen is the same as the sun and the two buttons would then do
    // the same thing.
    for (var i = 0; i < state.rooms.length; i++) {
      if (state.rooms[i].sensors.length > 0) {
        state.chosen = state.rooms[i].sensors[0].id;
        break;
      }
    }
    push();
  });


  function push() {
    emit('setSensor', { sensor: state.chosen }).then(function (reply) {
      state.chosen = reply.sensor;
      render();
    }).catch(fail);
  }

  renderSteps();

  emit('listSensors').then(function (payload) {
    state.rooms = payload.rooms || [];
    state.chosen = (payload.selected && payload.selected[0]) || null;
    state.sky = payload.sky || null;
    state.anySensors = false;
    for (var i = 0; i < state.rooms.length; i++) {
      if (state.rooms[i].sensors.length > 0) state.anySensors = true;
    }

    el.none.style.display = state.anySensors ? 'none' : '';
    el.sunNow.textContent = payload.sunsetAt
      ? Homey.__('sensor.sunsetAt', { time: payload.sunsetAt })
      : Homey.__('sensor.noPosition');

    render();
  }).catch(fail);

  /** The sensor currently picked, or null while the sun is the answer. */
  function chosenSensor() {
    for (var i = 0; i < state.rooms.length; i++) {
      for (var j = 0; j < state.rooms[i].sensors.length; j++) {
        if (state.rooms[i].sensors[j].id === state.chosen) return state.rooms[i].sensors[j];
      }
    }
    return null;
  }

  function countSensors() {
    var total = 0;
    for (var i = 0; i < state.rooms.length; i++) total += state.rooms[i].sensors.length;
    return total;
  }
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootSn(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('sn-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootSn(ready || window.Homey); };
  waitForHomey();
})();
</script>
