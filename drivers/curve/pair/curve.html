<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #cv-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #cv-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #cv-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #cv-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #cv-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #cv-root .section { margin-bottom: 18px; }
  #cv-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #cv-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #cv-root .tile:hover { border-color: var(--lk-hover); }
  #cv-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #cv-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #cv-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #cv-root input[type=text], #cv-root input[type=password], #cv-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #cv-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #cv-root input:focus, #cv-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #cv-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #cv-root .btn:hover { border-color: var(--lk-hover); }
  #cv-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #cv-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #cv-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #cv-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #cv-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #cv-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #cv-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #cv-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #cv-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #cv-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #cv-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #cv-root .grid { grid-template-columns: 1fr; } }
  #cv-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #cv-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #cv-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  #cv-root .steps i.on { background: var(--lk-accent); }
  #cv-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened. */
  #cv-root .row { display: flex; align-items: center; gap: 11px; width: 100%;
               padding: 13px 14px; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #cv-root .row + .row { border-top: 1px solid var(--lk-line); }
  #cv-root .row .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #cv-root .row .value { font-size: 13px; color: var(--lk-muted); text-align: right; }
  #cv-root .row .chev { flex: none; font-size: 15px; color: var(--lk-muted); }
  #cv-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }

  /* The pill switch behind every "Set … too". */
  #cv-root .toggle { display: flex; align-items: center; gap: 11px; width: 100%;
                  padding: 12px 0; min-height: 44px; box-sizing: border-box;
                  background: none; border: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #cv-root .toggle .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #cv-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #cv-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #cv-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #cv-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #cv-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #cv-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #cv-root .slider.warm { background: var(--lk-warm-ramp); }
  #cv-root .slider.bright { background: var(--lk-bright-ramp); }
  #cv-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  #cv-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-muted); margin: 9px 0 0; }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #cv-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 8px; margin: 10px 0; }
  #cv-root .swatch { height: 44px; border-radius: 9px; padding: 0;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  #cv-root .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--lk-surface),
                                                   0 0 0 4px var(--lk-accent); }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #cv-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #cv-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #cv-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #cv-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-ring);
                       box-shadow: var(--lk-handle-shadow); }
  #cv-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #cv-root .clockline { display: flex; justify-content: space-between;
                     font-size: 12px; color: var(--lk-muted); margin-top: 6px; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  /* The chart: bar HEIGHT is brightness, bar COLOUR is the colour. With
     brightness switched off — the default — every bar is full height and the
     chart is purely a day of colour, which is what the device is for. */
  #cv-root .chart { display: flex; align-items: flex-end; gap: 2px; height: 110px;
                    border-radius: 12px; background: var(--lk-flat-bg);
                    position: relative; padding: 0 2px; box-sizing: border-box; }
  /* A gutter for the Off and Full captions, only when there are captions to
     put in it: with brightness switched off every bar is full height and the
     chart is purely a day of colour, so the axis is not there to be labelled. */
  #cv-root .chart { --gutter: 2px; }
  #cv-root .chart.axed { padding-left: 34px; --gutter: 34px; }
  #cv-root .chart i { flex: 1; border-radius: 2px 2px 0 0; }
  #cv-root .chart .at { position: absolute; top: 0; bottom: 0; width: 0;
                        border-left: 1.5px dashed var(--lk-day-mark); }
  /* Every point gets a handle, because the chart is the only place the SHAPE
     is visible: a list of times says when, and nothing says what the day looks
     like between them. The selected one is filled so tapping a row and looking
     up answers "which of these am I editing". */
  #cv-root .chart .dot { position: absolute; width: 11px; height: 11px;
                         margin: -6px 0 0 -6px; border-radius: 50%;
                         background: var(--lk-surface);
                         border: 2px solid var(--lk-accent); box-sizing: border-box; }
  #cv-root .chart .dot.sel { background: var(--lk-accent); }
  /* Off and Full, on the chart itself. Bar height means brightness only once
     somebody has been told which way up the axis runs. */
  #cv-root .chart .cap { position: absolute; left: 8px; font-size: 11px;
                         color: var(--lk-muted); }
  #cv-root .chart .cap.top { top: 6px; }
  #cv-root .chart .cap.bottom { bottom: 6px; }
  #cv-root .axis { display: flex; justify-content: space-between;
                   font-size: 11.5px; color: var(--lk-muted); margin: 4px 2px 0; }

  #cv-root .point { background: var(--lk-surface); border: 1px solid var(--lk-line);
                    border-radius: 14px; box-shadow: var(--lk-shadow);
                    padding: 14px; margin: 14px 0; }
  #cv-root .point-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #cv-root .point-head .sw { flex: none; width: 26px; height: 26px; border-radius: 7px;
                             border: 1px solid var(--lk-hairline); }
  #cv-root .point-head .name { flex: 1; font-size: 16px; font-weight: 700; }
  #cv-root .point-head .which { font-size: 12.5px; color: var(--lk-muted); }

  #cv-root .timeset { display: flex; align-items: center; gap: 8px;
                      background: var(--lk-flat-bg); border-radius: 10px; padding: 6px 8px;
                      margin-bottom: 12px; min-height: 44px; box-sizing: border-box; }
  #cv-root .timeset .cap { flex: 1; font-size: 13px; color: var(--lk-body); }
  #cv-root .timeset .val { font-size: 16px; font-weight: 700; min-width: 66px; text-align: center; }
  #cv-root .timeset button { width: 34px; height: 34px; flex: none; border-radius: 8px;
                             border: 1.5px solid var(--lk-field); background: var(--lk-surface);
                             font: 600 18px/1 inherit; color: var(--lk-ink); cursor: pointer; }


  #cv-root .more { font-size: 13px; font-weight: 600; color: var(--lk-accent-strong);
                   background: none; border: none; padding: 4px 0 10px;
                   font-family: inherit; cursor: pointer; min-height: 44px; }

  #cv-root .others { background: var(--lk-surface); border: 1px solid var(--lk-line);
                     border-radius: 14px; box-shadow: var(--lk-shadow);
                     overflow: hidden; margin-bottom: 14px; }
  #cv-root .others .sw { flex: none; width: 26px; height: 26px; border-radius: 7px;
                         border: 1px solid var(--lk-hairline); }
  #cv-root .others .text { flex: 1; }

  #cv-root .add { width: 100%; min-height: 44px; border-radius: 12px; margin-bottom: 16px;
                  border: 1.5px dashed var(--lk-field); background: none;
                  font: 600 14px/1 inherit; color: var(--lk-accent-strong); cursor: pointer; }

  #cv-root .remove { font-size: 13px; font-weight: 600; color: var(--lk-bad-ink);
                     background: none; border: none; padding: 12px 0 0;
                     font-family: inherit; cursor: pointer; min-height: 44px; }
</style>

<div class="wrap" id="cv-root">
  <div class="steps" id="cv-steps"></div>
  <h2 data-i18n="curve.title"></h2>

  <div id="cv-error" class="msg bad" style="display:none;"></div>

  <div class="chart" id="cv-chart"></div>
  <div class="axis">
    <span data-i18n="curve.midnight"></span>
    <span data-i18n="curve.noon"></span>
    <span data-i18n="curve.midnight"></span>
  </div>

  <div class="point" id="cv-editor">
    <div class="point-head">
      <span class="sw" id="cv-pointSwatch"></span>
      <span class="name" id="cv-pointName"></span>
      <span class="which" id="cv-pointWhich"></span>
    </div>

    <div class="timeset">
      <span class="cap" data-i18n="curve.at"></span>
      <button type="button" id="cv-timeDown">&minus;</button>
      <span class="val" id="cv-time"></span>
      <button type="button" id="cv-timeUp">+</button>
    </div>

    <div class="control-title" data-i18n="curve.colour"></div>
    <div class="swatches" id="cv-featured"></div>
    <div class="swatches" id="cv-rest" style="display:none;"></div>
    <!--
      Sixteen more colours fold out IN PLACE, never onto a second screen. A set
      is a decision; a continuous picker is a tuning session, and a set of
      twenty-four shown at once is a tuning session with extra steps.
    -->
    <button class="more" id="cv-more" type="button"></button>

    <button class="toggle" id="cv-brightToggle" type="button" aria-checked="false">
      <span class="label" data-i18n="curve.alsoBrightness"></span>
      <span class="track"><span class="knob"></span></span>
    </button>
    <div id="cv-brightBlock" style="display:none;">
      <div class="control-title"><span data-i18n="curve.brightness"></span> <span id="cv-brightPct"></span></div>
      <div class="slider bright" id="cv-bright">
        <div class="knob" id="cv-brightKnob"></div>
      </div>
      <div class="ends">
        <span data-i18n="curve.off"></span>
        <span data-i18n="curve.full"></span>
      </div>
    </div>

    <button class="remove" id="cv-remove" data-i18n="curve.remove"></button>
  </div>

  <div class="others" id="cv-others"></div>
  <button class="add" id="cv-add" data-i18n="curve.add"></button>

  <button class="btn-primary" id="cv-next" data-i18n="curve.next"></button>
</div>

<script type="text/javascript">
/**
 * Your colours through the day.
 *
 * **Every point is an absolute clock time.** This device is for "cool at 09:00,
 * ember at 22:30", which is a routine rather than a sun position — sun-relative
 * belongs to the circadian light, and giving both device types the same anchors
 * would make them the same product with different defaults.
 *
 * **Colour is a closed set, never a picker.** Eight named colours are shown and
 * sixteen more fold out in place. Hue 0.08 at saturation 0.62 is a pair of
 * numbers somebody landed on once and can never reproduce; "Warm amber" is a
 * decision that survives being read back on a settings page a year later.
 *
 * **The card edits the selected point in place.** There is no pushed editor and
 * no presets: a first curve starts from the default five points, which are
 * deliberately not all whites, and is changed from here.

function __lkBootCv(Homey) {
  var __root = document.getElementById('cv-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;

        settled = true;

      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {

    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function pad(value) { return (value < 10 ? '0' : '') + value; }
  function clock(minutes) { return pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60); }

  var el = {
    steps: document.getElementById('cv-steps'),
    error: document.getElementById('cv-error'),
    chart: document.getElementById('cv-chart'),
    editor: document.getElementById('cv-editor'),
    pointSwatch: document.getElementById('cv-pointSwatch'),
    pointName: document.getElementById('cv-pointName'),
    pointWhich: document.getElementById('cv-pointWhich'),
    time: document.getElementById('cv-time'),
    timeUp: document.getElementById('cv-timeUp'),
    timeDown: document.getElementById('cv-timeDown'),
    featured: document.getElementById('cv-featured'),
    rest: document.getElementById('cv-rest'),
    more: document.getElementById('cv-more'),
    brightToggle: document.getElementById('cv-brightToggle'),
    brightBlock: document.getElementById('cv-brightBlock'),
    brightPct: document.getElementById('cv-brightPct'),
    bright: document.getElementById('cv-bright'),
    brightKnob: document.getElementById('cv-brightKnob'),
    remove: document.getElementById('cv-remove'),
    others: document.getElementById('cv-others'),
    add: document.getElementById('cv-add'),
    next: document.getElementById('cv-next')
  };

  var state = {
    points: [],
    palette: [],
    featuredCount: 8,
    adjustBrightness: false,
    preStage: false,
    selected: 0,
    showMore: false,
    minPoints: 2,
    maxPoints: 8

  function fail(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  function minuteOf(point) {
    return point.anchor && point.anchor.kind === 'clock' ? point.anchor.at : 0;
  }

  function colourOf(id) {
    for (var i = 0; i < state.palette.length; i++) {

  /** Homey's normalised hue/saturation as something a browser will paint. */
  function css(colour) {

      Math.round(colour.saturation * 100) + '%,' +
      // Lightness falls as saturation rises, so a fully saturated hue reads as
      // a colour rather than as a pastel. A near-white swatch stays near white.

  function sorted() {
    return state.points.slice().sort(function (a, b) { return minuteOf(a) - minuteOf(b); });
  }

  function renderSteps() {
    clear(el.steps);
    for (var i = 1; i <= 3; i++) el.steps.appendChild(node('i', i <= 2 ? 'on' : null));
    el.steps.appendChild(node('span', null, Homey.__('curve.step', { index: 2, count: 3 })));
  }

  /**
   * The chart: one bar per ten minutes of the day.
   *
   * Bar colour is the interpolated colour at that minute and bar height is the
   * interpolated brightness — so with brightness off every bar is full height
   * and the picture is a day of colour, which is the honest drawing of what the
   * device will then do.
   */
  /**
   * "1st", "2nd", "3rd", "22nd" — the suffix from the locale, never a literal.
   *

   * they take "th" despite ending in 1, 2 and 3.

    if (points.length === 0) return;

     * can actually show.
     *

     * gap ate most of that — the chart read as hatching rather than as a day.
     * Twenty-four blocks lose the smoothness of the interpolation and keep the
     * thing the chart is for: what colour the room is at a glance.

        ? Math.max(6, at.brightness * 100) + '%'
        : '100%';

    }

    if (state.adjustBrightness) {
      el.chart.appendChild(node('span', 'cap top', Homey.__('curve.full')));
      el.chart.appendChild(node('span', 'cap bottom', Homey.__('curve.off')));
    }

      var point = state.points[i];
      var height = state.adjustBrightness && point.brightness !== undefined

      // is measured from the border edge, and the captions take a gutter out
      // of the left of it.

      dot.style.bottom = height + '%';

   *
   * A colour is held FLAT across a segment rather than blended, which is what
   * the engine does when only one end of a segment carries one: blending two
   * palette colours on screen would draw a hue that is no palette entry, and the
   * chart would then show colours nobody could have chosen.

  function renderEditor() {

    el.remove.style.display = state.points.length > state.minPoints ? '' : 'none';
    if (!point) return;

    var colour = colourOf(point.color);
    el.pointSwatch.style.background = css(colour);
    el.pointName.textContent = colour ? colour.label : Homey.__('curve.noColour');

  function otherRow(point) {

    }

        el.error.textContent = Homey.__('curve.dropped', { reason: reply.dropped[0].reason });
        el.error.style.display = '';

      }

    state.points = payload.points || [];
    state.palette = payload.palette || [];
    state.featuredCount = payload.featuredColors || 8;
    state.adjustBrightness = payload.adjustBrightness;
    state.preStage = payload.preStage;
    state.minPoints = payload.minPoints || 2;
    state.maxPoints = payload.maxPoints || 8;
    render();
  }).catch(fail);

(function () {

    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootCv(window.Homey); return; }
    if (++tries > 100) {

        banner.textContent = 'This screen could not reach Homey. Close it and try again.';

  waitForHomey();
