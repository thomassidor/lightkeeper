<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #cv-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    /* Between the accent and its line. The middle of the three listening dots,
       and the only place a mid-tone is needed: the logo has none. */
    --lk-accent-mid: #9f81dc;
    /* A block on the schedule timeline that is not the one being edited. It
       borrowed --lk-accent-line, which is the edge of a numbered badge and a
       step too pale to hold a 52px bar: four of them across a grey track read
       as a smudge rather than as the day's other windows. */
    --lk-block: #b9a6e4;
    /* And a block on a timeline where NOTHING is selected — the review's
       picture of the finished day. Deeper than the one above because the pale
       violet only exists to recede behind a selected block, and on a review
       there is nothing for it to recede behind: four faint bars on a grey
       track read as a chart that had failed to load. */
    --lk-block-settled: #7a57c8;
    --lk-accent-strong: #3b2279;
    /* Two more steps down the same violet, for the three-bar level picture: it
       is a LEVEL rather than a direction, so only the tallest bar is at full
       strength and the two under it fall away. Derived from the accent the same
       way the tints are — the logo has no mid-tones to read them out of. */
    --lk-level-mid: #7a62c0;
    --lk-level-low: #c4b8e4;

    /* Drawn ON the accent tint rather than on white, and that is the whole
       reason these three exist. A grey hairline on #f3eefc is the one place in
       this palette where a neutral reads as dirty, and --lk-muted on it reads
       as faded rather than as secondary. So the tint gets its own edge, its own
       rule and its own second ink, all violet-shifted to match the ground they
       sit on. */
    --lk-tint-line: #e2d8f6;
    --lk-tint-rule: #f0ecfa;
    --lk-tint-ink: #5a4d80;
    --lk-ring: rgba(42, 25, 88, .16);
    /* The edge of a handle nobody has selected. It is NOT --lk-ring: at .16 a
       26px circle on an orange strip had no edge at all, and the second
       boundary looked like a smudge rather than something to drag. */
    --lk-handle-edge: rgba(42, 25, 88, .45);

    /* The ink ladder: THREE greys, and the design canvas has no fourth.

       It had five. --lk-sub (#5f6672) and --lk-faint (#6f7683) sat either side
       of --lk-muted and were never a step anybody could see — #6f7683 against
       #6a7180 is a difference of five in one channel, which is not a decision,
       it is a drift. Both are gone and their consumers took the neighbour the
       canvas actually draws: an end-caption and the midnight/noon line are
       --lk-body, everything else that was faint is --lk-muted.

       All three clear WCAG AA (4.5:1) against --lk-surface, because all three
       are used between 10.5px and 15px. Collapsing --lk-faint RAISED the
       contrast of every caption that used it, from 4.6:1 to 4.9:1. What
       separates the steps is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    /* The edge of an UNTICKED box or radio, and only that. A shade darker than
       --lk-field because an empty checkbox has to read as a control somebody
       has not used yet; at the field grey it reads as a gap in the row. */
    --lk-box: #d4d8e0;
    --lk-hover: #c9d2e0;
    /* A chevron is an affordance, not a value: lighter than the text it sits
       beside, so a list of rows reads as labels rather than as arrows.

       #a8aeb9 took that too far. A non-text UI component still owes 3:1, and
       at #a8aeb9 the chevron was 2.4:1 — an affordance nobody has to read is
       still one somebody has to SEE. The canvas's #8f97a3 is 3.2:1 and is
       still visibly lighter than every ink in the ladder above. */
    --lk-chev: #8f97a3;
    /* The circled "i" on a .tip. Its own grey rather than the chevron's,
       because it is a ring drawn around a LETTER: the ring may sit at the
       chevron's weight, the letter inside it may not (it is text, and owes
       4.5:1), so the two are named separately and only the ring is light. */
    --lk-tip-edge: #8a919e;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-knob-shadow-warm: 0 0 0 2.5px #ffffff, 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The ring around a knob drawn at icon scale, where the full
       --lk-slider-knob-shadow is two shadows on a 4px mark and comes out as a
       smudge. One ring, half a pixel thinner than the real control's. */
    --lk-knob-edge: rgba(22, 24, 29, .5);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    /* How light it is OUTSIDE, pale to deep — the third axis this app draws,
       and the only one that runs dark at the TOP of its range rather than the
       bottom. It is the week grid's scale, and its six stops are the same six
       the cells are quantised to: `SHADES` in views/shared/week-grid.js, which
       cannot read a custom property and so carries them again. Change one and
       change the other; `pair-view-styles.test.ts` checks that they agree. */
    --lk-lux-ramp: linear-gradient(90deg, #f4f2fa, #e0d6f6, #c4b0ec,
                                   #9f81dc, #6b48bc, #3b2279);
    /* The same six stops, the other way round, for the sun's own height.
       Reversed on purpose: the lux ramp measures HOW MUCH LIGHT there is, so
       more light is more ink, while this one is a picture of the DAY — and the
       dark end of a day is the night. The two never meet on screen, because a
       Room-sensing Light has a sensor or it has the sun. */
    --lk-sun-ramp: linear-gradient(90deg, #3b2279, #6b48bc, #9f81dc,
                                   #c4b0ec, #f4f2fa);
    /* The hours of a "when does this room get its sun?" tile: the ones that
       ARE this room's sun, and the ones that are the day going on around it. */
    --lk-peak-on: #4b2ea0;
    --lk-peak-off: #dfd4f4;
    /* The two ENDS of the warmth axis, for the two tiles that nudge along it
       rather than setting it. The whole ramp draws the same picture on both,
       which is no picture at all, so each of these runs from the middle of
       --lk-warm-ramp out to one end of it.
       The cool end is DEEPER than that ramp's own #dbe8fb: at 30x12px on white
       the real end of the axis is a chip with no edge, so the tile that said
       "cooler" showed nothing at all. Deepened to where it reads, and no
       further — it is a picture of a direction, not a colour to match. */
    --lk-warmer-ramp: linear-gradient(90deg, #f2e6d6, #e8892c);
    --lk-cooler-ramp: linear-gradient(90deg, #f2e6d6, #9fc0f0);
    /* A lamp that is ON, drawn rather than named: the one warm accent in an
       interface that is otherwise entirely violet, because "on" is a picture of
       light and the brand colour is a picture of the app. */
    --lk-lamp-lit: #f4c24a;
    --lk-lamp-glow: rgba(244, 194, 74, .32);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    /* A small mark lifted off whatever it is drawn ON — the curve chart's
       selected point, which sits on top of a bar of any colour. */
    --lk-mark-shadow: 0 1px 4px rgba(16, 24, 40, .3);
    /* The halo round a SELECTED block on the schedule timeline, and round a
       selected swatch. Softer than --lk-ring is used for elsewhere, because it
       is drawn against the accent itself rather than against white. */
    --lk-select-halo: 0 0 0 3px rgba(42, 25, 88, .18);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    /* The two-hour cell a sensor reported NOTHING in, drawn as a hatch. Its own
       two colours because nothing else in the app is a hatch: the pale stripe
       has to sit above --lk-line without becoming white (a white stripe made
       the cell read as missing from the grid rather than as empty in it), and
       the edge has to hold the cell's rectangle at 11px tall, which the stripes
       alone do not. */
    --lk-hatch-pale: #f7f8fa;
    --lk-hatch-edge: #dfe3e9;
    --lk-day-mark: rgba(22, 24, 29, .4);
    /* The curve chart's own "you are editing this point" line. Accent rather
       than ink, because on that chart it marks a SELECTION; on the day strip
       the dashed lines mark sunrise and sunset, which are facts. */
    --lk-curve-mark: rgba(42, 25, 88, .55);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    /* A key the Homey accepted and then refused to build a Flow with. Its own
       colour rather than --lk-bad-ink, and a full step lighter, because it is
       drawn as an EDGE round a field and as a 16px badge — at #8f1d18 a
       1.5px border round a white field read as damage, and the message beside
       it says the key itself is fine. */
    --lk-reject: #c05a3e;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 16px under a heading, which is the gap the design draws on every screen
     that puts a control straight below one. It used to be 4px, and at 4px a
     title read as a label ON the first card rather than as the name of the
     screen.

     `text-wrap: balance` is for the titles that do not fit on one line, and the
     longest is the sensor picker's: measured at 311px — a 390px phone, less
     Homey's gutter, our padding and the scrollbar gutter — it breaks 295px +
     54px, which leaves `from?` alone on the second line. Balanced it is
     163 + 185. Not a workaround for a title that is too long: at 20px it needs
     354px, and even 18px needs 319px, so there is no size that holds it on one
     line at phone width without shrinking every other title in the app by an
     eighth. A one-line title is unaffected, so this costs the other screens
     nothing, and a browser without it wraps exactly as before. */
  #cv-root h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
             text-wrap: balance; }
  #cv-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-body); margin: 0 0 18px; }
  /* A blurb belongs TO its heading — 6px between them, not 16. Written as a
     pull on the blurb rather than as `h2:has(+ .sub)` on the heading because
     the pairing container's webview is not somewhere to find out whether
     `:has()` landed. */
  #cv-root h2 + .sub { margin-top: -10px; }
  #cv-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #cv-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #cv-root .section { margin-bottom: 18px; }
  /* The label over a group — "Does", "To", "When does this room get its sun?".
     It is a .control-title with nothing on its right: the same 13.5px/600 ink,
     sentence case. It used to be 12px uppercase small-caps in the faintest
     grey, which made the two words holding the job screen's sentence together
     read as filing-cabinet labels rather than as the sentence's own verbs. */
  #cv-root .section-title { font-size: 13.5px; font-weight: 600; line-height: 1.2;
                       color: var(--lk-ink); margin: 0 0 9px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #cv-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #cv-root .tile:hover { border-color: var(--lk-hover); }
  #cv-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #cv-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #cv-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #cv-root input[type=text], #cv-root input[type=password], #cv-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 12px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #cv-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #cv-root input:focus, #cv-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #cv-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #cv-root .btn:hover { border-color: var(--lk-hover); }
  #cv-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  /* The same button across the width of the screen. What a secondary action
     looks like when it is the only one on a pushed screen — "Close" — where a
     primary button would claim the choice was made. */
  #cv-root .btn.wide { display: block; width: 100%; font-size: 16px; font-weight: 600;
                    padding: 14px; border-radius: 12px; min-height: 50px;
                    box-sizing: border-box; margin-top: 16px; }
  /* And the same button when it is the SECOND of two, under a primary — "Put
     them back". It borrows the primary's outline rather than the field grey,
     because the pair is one decision offered twice ("show me" / "undo that")
     and a grey partner reads as the disabled twin of the button above it.
     Lighter than the primary in weight and height, never in hue. */
  #cv-root .btn.wide.accent { border-color: var(--lk-accent); color: var(--lk-accent);
                           font-size: 15px; font-weight: 500; padding: 13px;
                           min-height: 48px; }
  #cv-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #cv-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #cv-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 12px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #cv-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #cv-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #cv-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #cv-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #cv-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #cv-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #cv-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #cv-root .grid { grid-template-columns: 1fr; } }
  #cv-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #cv-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #cv-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  /* Four steps, narrower dots: the run keeps the same overall width whether a
     flow has three or four, so the header does not visibly grow between two
     device types. */
  #cv-root .steps.tight i { width: 16px; }
  #cv-root .steps i.on { background: var(--lk-accent); }
  #cv-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-muted); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened.

     The row carries NO horizontal padding, and its card carries it instead
     (`.card.rows` below). That is what insets the hairline between two rows
     from the card's own edge — a rule that runs corner to corner reads as the
     card being cut in half, and every list the design draws insets it. */
  #cv-root .row { display: flex; align-items: center; gap: 10px; width: 100%;
               padding: 13px 0; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #cv-root .row + .row { border-top: 1px solid var(--lk-line); }
  #cv-root .row .label { flex: 1; font-size: 14.5px; }
  #cv-root .row .value { font-size: 14px; color: var(--lk-muted); text-align: right; }
  #cv-root .row .chev { flex: none; font-size: 15px; color: var(--lk-chev); }
  #cv-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }
  /* The card a list of rows lives in. 4px top and bottom rather than 14:
     a row's own 13px is already the space above the first label, and adding
     the card's to it put a visible step between the card's edge and its
     first line that no other card has. */
  #cv-root .card.rows { padding: 4px 14px; }

  /* The pill switch behind every "Set … too".
     It carries a rule above it, always: a toggle is a new decision inside a
     card that was until then about one thing, and without the rule it read as
     the last line of the control above it. */
  #cv-root .toggle { display: flex; align-items: center; gap: 10px; width: 100%;
                  border-top: 1px solid var(--lk-line);
                  margin-top: 14px; padding: 13px 0 0;
                  min-height: 44px; box-sizing: border-box;
                  background: none; border-left: none; border-right: none;
                  border-bottom: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #cv-root .toggle .label { flex: 1; font-size: 14.5px; }
  #cv-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #cv-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #cv-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #cv-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #cv-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The

  }

  function minuteOf(point) {
    return point.anchor && point.anchor.kind === 'clock' ? point.anchor.at : 0;
  }

  function colourOf(id) {
    for (var i = 0; i < state.palette.length; i++) {
      if (state.palette[i].id === id) return state.palette[i];
    }
    return null;
  }

  /**
   * Homey's normalised hue/saturation as something a browser will paint.
   *
   * DUPLICATED from `colourSwatch()` in lib/pairing/flow-screens.ts, which is
   * where the two curves are explained — lightness falls as saturation rises,
   * and saturation is lifted off zero so a near-white HUE is a tint rather than
   * a grey. This copy exists because the chart is repainted on every drag and
   * cannot ask the driver. Change one and change the other.
   */
  function css(colour) {
    if (!colour) return 'var(--lk-flat-bg)';
    return 'hsl(' + Math.round(colour.hue * 360) + ',' +
      Math.round((0.25 + colour.saturation * 0.55) * 100) + '%,' +
      Math.round(86 - colour.saturation * 36) + '%)';
  }

  function sorted() {
    return state.points.slice().sort(function (a, b) { return minuteOf(a) - minuteOf(b); });
  }

  function renderSteps() {
    clear(el.steps);
    for (var i = 1; i <= 3; i++) el.steps.appendChild(node('i', i <= 2 ? 'on' : null));
    el.steps.appendChild(node('span', null, Homey.__('curve.step', { index: 2, count: 3 })));
  }

  /**
   * The chart: one bar per ten minutes of the day.
   *
   * Bar colour is the interpolated colour at that minute and bar height is the
   * interpolated brightness — so with brightness off every bar is full height
   * and the picture is a day of colour, which is the honest drawing of what the
   * device will then do.
   */
  /**
   * "1st", "2nd", "3rd", "22nd" — the suffix from the locale, never a literal.
   *
   * 11 to 13 are the exception every implementation of this gets wrong once:
   * they take "th" despite ending in 1, 2 and 3.
   */
  function ordinal(n) {
    var tens = n % 100;
    var key = 'ordinal.th';
    if (tens < 11 || tens > 13) {
      if (n % 10 === 1) key = 'ordinal.st';
      else if (n % 10 === 2) key = 'ordinal.nd';
      else if (n % 10 === 3) key = 'ordinal.rd';
    }
    return n + Homey.__(key);
  }

  function renderChart() {
    clear(el.chart);
    var points = sorted();
    if (points.length === 0) return;

    /**
     * One bar an hour, which is what the design draws and what a 390px screen
     * can actually show.
     *
     * Ten-minute bars gave 144 of them at under three pixels each, and the 2px
     * gap ate most of that — the chart read as hatching rather than as a day.
     * Twenty-four blocks lose the smoothness of the interpolation and keep the
     * thing the chart is for: what colour the room is at a glance.
     */
    for (var minute = 0; minute < 1440; minute += 60) {
      var bar = node('i');
      var at = valueAt(points, minute);
      bar.style.background = css(at.color);
      bar.style.height = state.adjustBrightness
        ? Math.max(6, at.brightness * 100) + '%'
        : '100%';
      el.chart.appendChild(bar);
    }

    // Full and Off label an axis that only exists while bar height carries
    // brightness. Without it the captions would be labelling nothing.
    el.gutter.style.display = state.adjustBrightness ? '' : 'none';
    el.axis.className = 'axis' + (state.adjustBrightness ? ' axed' : '');

    var selectedPoint = state.points[state.selected];
    if (selectedPoint) {
      var mark = node('div', 'at');
      mark.style.left = (minuteOf(selectedPoint) / 1440 * 100).toFixed(4) + '%';
      el.chart.appendChild(mark);
    }
  }

  /**
   * Two palette colours blended, ACROSS the disc rather than round the rim.
   *
   * DUPLICATED from `mixColors()` in lib/circadian/palette.ts, which is where
   * the argument lives: half the palette's pairs are more than a quarter-turn
   * apart, and an arc between two of those runs through hues nobody chose —
   * ember to ocean went backwards through rose, magenta and violet. Fading
   * through pale is the honest answer, because pale is what both ends have in
   * common. This copy exists for the same reason `css()` above is one: the chart
   * is repainted on every edit and cannot ask the driver. Change one and change
   * the other.
   *
   * A segment with a colour at only ONE end holds that colour flat, which is
   * also the engine's rule (`colorOf()`): there is nothing to blend towards,
   * because a colour temperature is a point on a different axis.
   */
  function blend(from, to, fraction) {
    if (!from) return to || null;
    if (!to) return from;
    if (fraction <= 0) return from;
    if (fraction >= 1) return to;

    var turn = Math.PI * 2;
    var fromX = from.saturation * Math.cos(turn * from.hue);
    var fromY = from.saturation * Math.sin(turn * from.hue);
    var toX = to.saturation * Math.cos(turn * to.hue);
    var toY = to.saturation * Math.sin(turn * to.hue);

    var x = fromX + (toX - fromX) * fraction;
    var y = fromY + (toY - fromY) * fraction;
    var saturation = Math.sqrt(x * x + y * y);

    // At the middle of the disc there is no angle to read — atan2(0, 0) is red —
    // so a pair whose line passes close to white would swing through it. Held at
    // whichever end is nearer instead; it is unsaturated there anyway.
    if (saturation < 0.02) {
      return { hue: fraction < 0.5 ? from.hue : to.hue, saturation: saturation };
    }
    return { hue: ((Math.atan2(y, x) / turn % 1) + 1) % 1, saturation: saturation };
  }

  /**
   * The value at a minute, cyclically.
   *
   * The colour is BLENDED between the two bracketing points, because that is
   * what the engine does with it. It used to be held flat and snapped at the
   * halfway mark, on the argument that a blended hue is no palette entry and the
   * chart should not show a colour nobody could have chosen — but the chart's
   * job is to show what the ROOM will do, and the room is blended. A picture
   * that disagreed with the engine drew five bands of colour where the lights
   * fade through the shades between them.
   */
  function valueAt(points, minute) {
    var before = points[points.length - 1];
    var after = points[0];
    for (var i = 0; i < points.length; i++) {
      if (minuteOf(points[i]) <= minute) before = points[i];
    }
    for (var j = 0; j < points.length; j++) {
      if (minuteOf(points[j]) > minute) { after = points[j]; break; }
    }
    var span = ((minuteOf(after) - minuteOf(before)) + 1440) % 1440 || 1440;
    var elapsed = ((minute - minuteOf(before)) + 1440) % 1440;
    var fraction = Math.min(1, elapsed / span);
    var eased = 0.5 - 0.5 * Math.cos(Math.PI * fraction);

    var fromB = before.brightness === undefined ? 1 : before.brightness;
    var toB = after.brightness === undefined ? 1 : after.brightness;
    return {
      // Eased, not linear, and the same eased fraction the brightness uses:
      // the engine mixes its colours on `ease(fraction)` too, so a screen that
      // blended linearly would put every mid-segment shade in the wrong place.
      color: blend(colourOf(before.color), colourOf(after.color), eased),
      brightness: fromB + (toB - fromB) * eased
    };
  }

  function renderEditor() {
    var point = state.points[state.selected];
    el.editor.style.display = point ? '' : 'none';
    el.remove.style.display = state.points.length > state.minPoints ? '' : 'none';
    if (!point) return;

    var colour = colourOf(point.color);
    el.pointSwatch.style.background = css(colour);
    el.pointName.textContent = colour ? colour.label : Homey.__('curve.noColour');

    var order = sorted();
    var index = 0;
    for (var i = 0; i < order.length; i++) if (order[i] === point) index = i;
    el.pointWhich.textContent = Homey.__('curve.which', {
      index: ordinal(index + 1), count: order.length
    });

    el.time.textContent = clock(minuteOf(point));

    renderSwatches();

    el.brightToggle.setAttribute('aria-checked', state.adjustBrightness ? 'true' : 'false');
    el.brightBlock.style.display = state.adjustBrightness ? '' : 'none';
    if (state.adjustBrightness) {
      var brightness = point.brightness === undefined ? 0.8 : point.brightness;
      el.brightPct.textContent = Math.round(brightness * 100) + '%';
      setSlider(el.brightKnob, brightness);
    }
  }

  function renderSwatches() {
    clear(el.featured);
    clear(el.rest);
    var point = state.points[state.selected];

    for (var i = 0; i < state.palette.length; i++) {
      var swatch = swatchFor(state.palette[i], point);
      if (i < state.featuredCount) el.featured.appendChild(swatch);
      else el.rest.appendChild(swatch);
    }

    el.rest.style.display = state.showMore ? '' : 'none';
    el.more.textContent = Homey.__(state.showMore ? 'curve.fewerColours' : 'curve.moreColours');
    el.more.style.display = state.palette.length > state.featuredCount ? '' : 'none';
  }

  function swatchFor(colour, point) {
    var swatch = node('button', 'swatch');
    swatch.type = 'button';
    swatch.title = colour.label;
    swatch.style.background = css(colour);
    swatch.setAttribute('aria-pressed', point && point.color === colour.id ? 'true' : 'false');
    swatch.addEventListener('click', function () {
      if (!point) return;
      point.color = colour.id;
      // `warmth` stays alongside the colour, because it is what a lamp with no
      // colour capability is written instead — and what the neighbouring
      // temperature segments interpolate towards. Derived from the colour's own
      // hue so the two never describe different days.
      point.warmth = warmthFor(colour);
      render();
      push();
    });
    return swatch;
  }

  /**
   * The warmth a colour stands in for, on a lamp that cannot take a colour.
   *
   * Hue 0 to 0.15 is the warm end of the spectrum and 0.5 to 0.7 the cool end,
   * so this is that mapping and nothing cleverer. A near-white swatch lands near
   * the middle, which is what a white should be.
   */
  function warmthFor(colour) {
    var hue = colour.hue;
    var warmish = hue < 0.2 || hue > 0.9;
    var base = warmish ? 0.9 : 0.25;
    return base * colour.saturation + 0.5 * (1 - colour.saturation);
  }

  function setSlider(knob, value) {
    // The track carries the range; the knob is the only thing that moves.
    knob.style.left = (Math.max(0, Math.min(1, value)) * 100) + '%';
  }

  function renderOthers() {
    clear(el.others);
    var order = sorted();
    for (var i = 0; i < order.length; i++) {
      if (order[i] === state.points[state.selected]) continue;
      el.others.appendChild(otherRow(order[i]));
    }
  }

  function otherRow(point) {
    var row = node('button', 'row');
    row.type = 'button';

    var swatch = node('span', 'sw');
    swatch.style.background = css(colourOf(point.color));
    row.appendChild(swatch);

    var colour = colourOf(point.color);
    var text = node('div', 'text');
    text.appendChild(node('div', 'at-time', clock(minuteOf(point))));
    text.appendChild(node('div', 'sub', colour ? colour.label : ''));
    row.appendChild(text);

    if (state.adjustBrightness && point.brightness !== undefined) {
      row.appendChild(node('span', 'value', Math.round(point.brightness * 100) + '%'));
    }
    row.appendChild(node('span', 'chev', '›'));

    row.addEventListener('click', function () {
      for (var i = 0; i < state.points.length; i++) {
        if (state.points[i] === point) state.selected = i;
      }
      render();
    });
    return row;
  }

  function render() {
    renderChart();
    renderEditor();
    renderOthers();
    renderPreStage();
    el.add.style.display = state.points.length < state.maxPoints ? '' : 'none';
  }

  /**
   * PRE-STAGING IS HIDDEN, AND NOTHING ELSE ABOUT IT HAS CHANGED.
   *
   * The design canvas draws no pre-staging control on any pairing screen, and
   * where the setting should live is still an open question. So the UI is
   * switched off here and the whole mechanism is left standing: the plan still
   * carries `preStage`, a NEW device still pairs with it on
   * (`DEFAULT_SIMPLE_PLAN`, and the curve driver's session seed), a device
   * paired before 0.6.5 still has it off because `lib/validation/plans.ts`
   * reads an absent key as "no", the `testPreStage` handler is still
   * registered, and `verifyStayedOff()` still disables the whole thing
   * device-wide the first time a lamp comes on from a pre-stage write.
   *
   * The markup and the strings stay for the same reason: turning this back on
   * is one line, and `locales.test.ts` would otherwise start failing on every
   * `preStage.*` key the moment the block was deleted — which is exactly the
   * pressure that would turn "hidden for now" into "gone".
   *
   * What a user loses meanwhile is the ability to answer the question against
   * their own lamps, which platform §6 says only their own lamps can answer.
   * That is the cost of hiding it, and it is why this is a flag rather than a
   * deletion.
   */
  var SHOW_PRE_STAGE = false;
  if (!SHOW_PRE_STAGE) {
    el.preToggle.style.display = 'none';
    el.preTip.style.display = 'none';
  }

  function renderPreStage() {
    el.preToggle.setAttribute('aria-checked', state.preStage ? 'true' : 'false');
    el.preBlock.style.display = (SHOW_PRE_STAGE && state.preStage) ? '' : 'none';
  }

  /**
   * One line saying what this household's own lamps did, which is the only
   * authority there is on the question (platform §6).
   *
   * Built as nodes and set through textContent like every other view: nothing
   * here assigns innerHTML, and the integration's own sentence is the one piece
   * of text on this screen that did not come from our locale file.
   */
  function showPreStageResult(className, text) {
    clear(el.preResult);
    el.preResult.className = 'msg ' + className;
    el.preResult.appendChild(node('span', null, text));
    el.preResult.style.display = '';
  }

  function stepTime(delta) {
    var point = state.points[state.selected];
    if (!point) return;
    var minute = ((minuteOf(point) + delta * 15) % 1440 + 1440) % 1440;
    // Two points at one minute is a zero-length segment: a division by zero
    // dressed up as a preference. The sanitiser drops the second; refusing the
    // step is the kinder half of the same rule.
    for (var i = 0; i < state.points.length; i++) {
      if (state.points[i] !== point && minuteOf(state.points[i]) === minute) return;
    }
    point.anchor = { kind: 'clock', at: minute };
    render();
    push();
  }

  el.timeUp.addEventListener('click', function () { stepTime(1); });
  el.timeDown.addEventListener('click', function () { stepTime(-1); });

  el.more.addEventListener('click', function () {
    state.showMore = !state.showMore;
    renderSwatches();
  });

  el.brightToggle.addEventListener('click', function () {
    state.adjustBrightness = !state.adjustBrightness;
    // All or nothing: the engine interpolates brightness only where BOTH
    // bracketing points carry one, so a half-dimmed curve would have to invent
    // the missing segments.
    //
    // Switching it off REMEMBERS what each point held, because the default curve
    // arrives with a shape — 44% at dawn up to 94% in the evening — and one
    // accidental tap used to replace all five with a flat 80% with no way back
    // inside the session.
    for (var i = 0; i < state.points.length; i++) {
      var point = state.points[i];
      if (state.adjustBrightness) {
        var kept = remembered[point.id];
        point.brightness = point.brightness === undefined
          ? (kept === undefined ? 0.8 : kept)
          : point.brightness;
      } else {
        if (point.brightness !== undefined) remembered[point.id] = point.brightness;
        point.brightness = undefined;
      }
    }
    render();
    push();
  });

  el.preToggle.addEventListener('click', function () {
    state.preStage = !state.preStage;
    // The last answer described the setting as it was, and it is no longer
    // that. Leaving it up under a toggle that has moved is how a screen comes
    // to assert something it never tested.
    el.preResult.style.display = 'none';
    render();
    push();
  });

  el.preTest.addEventListener('click', function () {
    el.preTest.disabled = true;
    showPreStageResult('muted', Homey.__('preStage.testing'));
    /**
     * Whatever this returns, the setting is NOT changed for the user. A test
     * that switched pre-staging off on their behalf would be the screen making
     * a decision from one lamp out of five, and platform §6 measured that a
     * household's lamps differ from each other — roughly half a Hue household
     * declines while the rest stage happily. The runtime's own self-disable is
     * the thing allowed to act on evidence, because it watches every lamp on
     * every pass rather than one lamp once.
     */
    emit('testPreStage').then(function (outcome) {
      el.preTest.disabled = false;
      if (!outcome || outcome.deviceId === null) {
        showPreStageResult('muted', Homey.__('preStage.nothingOff'));
        return;
      }
      var name = outcome.name || '';
      if (outcome.stayedOff) {
        showPreStageResult('ok', Homey.__('preStage.worksHere', { name: name }));
      } else if (outcome.restored) {
        showPreStageResult('bad', Homey.__('preStage.cameOn', { name: name }));
      } else if (outcome.reason) {
        // The integration's own words, kept rather than replaced: "soft off" is
        // what a Hue Bridge says, and a reader searching for that sentence finds
        // the same one in the diagnostics dump.
        showPreStageResult('bad', Homey.__('preStage.declined', { name: name }) + ' ' + outcome.reason);
      } else {
        showPreStageResult('bad', Homey.__('preStage.cameOnStuck', { name: name }));
      }
    }, function () {
      el.preTest.disabled = false;
      showPreStageResult('bad', Homey.__('preStage.failed'));
    });
  });

  (function () {
    var dragging = false;
    function fractionOf(event) {
      var rect = el.bright.getBoundingClientRect();
      return Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    }
    el.bright.addEventListener('pointerdown', function (event) {
      dragging = true;
      if (el.bright.setPointerCapture) el.bright.setPointerCapture(event.pointerId);
      apply(fractionOf(event));
    });
    el.bright.addEventListener('pointermove', function (event) {
      if (dragging) apply(fractionOf(event));
    });
    function end() { if (dragging) { dragging = false; push(); } }
    el.bright.addEventListener('pointerup', end);
    el.bright.addEventListener('pointercancel', end);

    function apply(fraction) {
      var point = state.points[state.selected];
      if (!point) return;
      point.brightness = fraction;
      render();
    }
  })();

  el.remove.addEventListener('click', function () {
    state.points.splice(state.selected, 1);
    state.selected = Math.max(0, state.selected - 1);
    render();
    push();
  });

  el.add.addEventListener('click', function () {
    var taken = {};
    for (var i = 0; i < state.points.length; i++) taken[minuteOf(state.points[i])] = true;
    var minute = 12 * 60;
    while (taken[minute] && minute < 1440) minute += 15;

    state.points.push({
      id: 'p' + Date.now().toString(36),
      anchor: { kind: 'clock', at: minute % 1440 },
      warmth: 0.5,
      color: state.palette[0] ? state.palette[0].id : undefined,
      brightness: state.adjustBrightness ? 0.8 : undefined
    });
    state.selected = state.points.length - 1;
    render();
    push();
  });


  function push() {
    emit('setCurve', {
      points: state.points,
      adjustBrightness: state.adjustBrightness,
      preStage: state.preStage
    }).then(function (reply) {
      if (reply.dropped && reply.dropped.length > 0) {
        el.error.textContent = Homey.__('curve.dropped', { reason: reply.dropped[0].reason });
        el.error.style.display = '';
      } else {
        el.error.style.display = 'none';
      }
    }).catch(fail);
  }

  renderSteps();

  emit('getCurve').then(function (payload) {
    state.points = payload.points || [];
    state.palette = payload.palette || [];
    state.featuredCount = payload.featuredColors || 8;
    state.adjustBrightness = payload.adjustBrightness;
    state.preStage = payload.preStage;
    state.minPoints = payload.minPoints || 2;
    state.maxPoints = payload.maxPoints || 8;
    render();
  }).catch(fail);
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootCv(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('cv-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootCv(ready || window.Homey); };
  waitForHomey();
})();
</script>
