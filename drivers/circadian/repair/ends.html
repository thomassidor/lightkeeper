<style>
/* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #end-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #end-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #end-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #end-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #end-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #end-root .section { margin-bottom: 18px; }
  #end-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #end-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #end-root .tile:hover { border-color: var(--lk-hover); }
  #end-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #end-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #end-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #end-root input[type=text], #end-root input[type=password], #end-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #end-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #end-root input:focus, #end-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #end-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #end-root .btn:hover { border-color: var(--lk-hover); }
  #end-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #end-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #end-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #end-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #end-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #end-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #end-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }

  #end-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #end-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #end-root .grid { grid-template-columns: 1fr; } }
  #end-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ==== end shared base ==== */
  /* ---- this view only ----
     A card's own furniture is NOT in the shared base — every view carries its
     own copy of whichever parts it uses, because there is nowhere to put a
     stylesheet (see the header). These match the curve view's rule for rule; the
     screen is the same shape with two fixed cards instead of a list. */
  #end-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
                 border-radius: 14px; padding: 14px; margin-bottom: 12px;
                 box-shadow: var(--lk-shadow); }

  #end-root .rowhead { display: flex; align-items: baseline; justify-content: space-between;
                    margin-bottom: 12px; gap: 10px; }

  #end-root .rowhead .name { font-size: 15px; font-weight: 600; }

  /* Which hours this end applies at. The shape is not editable, so saying when
     it lands is the only way a slider called "warmest" means anything. */
  #end-root .when { font-size: 12px; color: var(--lk-muted); flex: none; }

  #end-root .field { margin-bottom: 14px; }

  #end-root .field:last-child { margin-bottom: 0; }

  #end-root .label { font-size: 12px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 6px 2px; }

  /* `text-transform: none` is not decoration. The pairing container's own
     stylesheet styles bare `label`, and text-transform is one of the few
     properties we never declared — so Homey's `uppercase` won, and the option
     read "SET THE COLOUR BEFORE THE LIGHTS COME ON" on a real Homey while every
     local render showed sentence case. The span inside inherits from the label,
     so stating it here fixes both. */
  #end-root .check { display: flex; align-items: center; gap: 10px; min-height: 44px;
                 font-size: 14px; color: var(--lk-body); cursor: pointer;
                 text-transform: none; letter-spacing: normal; }

  /* A titled block inside a card: what tells the two live controls apart. Each
     one now says what it does before you press it, instead of being a bare
     button whose label had to carry the whole explanation. */
  #end-root .blocktitle { font-size: 15px; font-weight: 600; color: var(--lk-ink); }
  #end-root .blockhelp { font-size: 12.5px; line-height: 1.5; color: var(--lk-muted);
                      margin: 4px 0 12px; }

  /* The pre-stage check, nested under the option it checks and hidden until that
     option is on — the only state in which "does this work on your lights?" is a
     question worth asking, and what stops it sitting next to the preview button
     looking like its twin. */
  #end-root .probe { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--lk-line); }
  #end-root .probe.off { display: none; }

  #end-root .check input { width: 22px; height: 22px; margin: 0; flex: none;
                        accent-color: var(--lk-accent); cursor: pointer; }

  #end-root .slider { display: flex; align-items: center; gap: 10px; }

  #end-root .slider input[type=range] { flex: 1; min-width: 0; accent-color: var(--lk-accent);
                                     height: 28px; }

  #end-root .slider .value { font-size: 13px; color: var(--lk-sub); flex: none;
                          min-width: 62px; text-align: right; }

  #end-root .acts { display: flex; gap: 7px; }

  #end-root .acts .btn { flex: 1; }

  #end-root .result { font-size: 13px; color: var(--lk-sub); margin-top: 8px; }

  #end-root .help { font-size: 12.5px; line-height: 1.5; color: var(--lk-muted);
                 margin: 2px 0 10px 32px; }
  /* The brightness card ends on its help text, and the 10px below it would sit
     inside the card's own padding as a stray gap. */
  #end-root .card > .help:last-child { margin-bottom: 0; }

  /* ==== shared daylight card: identical in every view that carries it ====
     The daylight response is ONE configuration per device, and four of the five
     device types can hold one — a Daylight light, a schedule, a circadian light
     and a Curve light. So this card lands in four different views, for the same
     reason the base above does: all views of a session share one document, and
     Homey will not follow a reference (platform §8).

     GENERATED, like the base: spliced by `npm run sync:views` from
     views/shared/daylight-card.css. **Edit that file, not this one.** The markup
     and the `daylightCard()` function come from views/shared/daylight-card.html
     and views/shared/daylight-card.js the same way, so the whole card is one
     authored copy in three files rather than four hand-kept ones in eight.

     EVERY class is `dl-`prefixed and defined HERE, even where the host view has
     something identical of its own. That is deliberate: the card lands in four
     different stylesheets whose `.help` and `.field` differ in their margins,
     and one of the four defined none of them at all — so a card that borrowed
     them rendered unstyled on that screen and slightly wrong on two others.
     Owning its own furniture is what makes the card the same thing everywhere.

     Every colour is a token from the base. A literal here is a token that is
     missing. */
  #end-root .dl-card { display: block; }
  #end-root .dl-card.dl-off { display: none; }

  #end-root .dl-field { margin-bottom: 14px; }
  #end-root .dl-field:last-child { margin-bottom: 0; }
  #end-root .dl-label { font-size: 12px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 6px 2px; }
  #end-root .dl-help { font-size: 12.5px; line-height: 1.5; color: var(--lk-muted);
                 margin: 2px 0 10px 2px; }
  #end-root .dl-blocktitle { font-size: 15px; font-weight: 600; color: var(--lk-ink); }
  #end-root .dl-blockhelp { font-size: 12.5px; line-height: 1.5; color: var(--lk-muted);
                      margin: 4px 0 12px; }
  #end-root .dl-slider { display: flex; align-items: center; gap: 10px; }
  #end-root .dl-slider input[type=range] { flex: 1; min-width: 0; accent-color: var(--lk-accent);
                                     height: 28px; }
  #end-root .dl-value { font-size: 13px; color: var(--lk-sub); flex: none;
                  min-width: 62px; text-align: right; }
  #end-root .dl-acts { display: flex; gap: 7px; }
  #end-root .dl-acts .btn { flex: 1; }
  #end-root .dl-result { font-size: 13px; color: var(--lk-sub); margin-top: 8px; }

  /* The live readout, which sits ABOVE the controls it explains: two numbers
     labelled "dark" and "bright" cannot be chosen without knowing what the room
     currently reads. */
  #end-root .dl-reading { display: flex; align-items: baseline; justify-content: space-between;
                    gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--lk-line); }
  #end-root .dl-reading:last-child { border-bottom: none; padding-bottom: 0; }
  #end-root .dl-reading .dl-what { font-size: 13.5px; color: var(--lk-body); }
  #end-root .dl-reading .dl-val { font-size: 13.5px; font-weight: 600; color: var(--lk-ink);
                            flex: none; text-align: right; }
  /* An unknown reading is deliberately NOT styled as an error: a Homey with no
     light sensor is the normal case, and the sun answers for it. */
  #end-root .dl-reading .dl-val.dl-unknown { font-weight: 500; color: var(--lk-muted); }

  /* The lux range: two numbers side by side, because they are one setting. */
  #end-root .dl-lux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #end-root .dl-lux input[type=number] { width: 100%; box-sizing: border-box; padding: 12px 13px;
                                   font-size: 15px; border: 1.5px solid var(--lk-field);
                                   border-radius: 11px; background: var(--lk-surface);
                                   color: var(--lk-ink); font-family: inherit;
                                   -webkit-appearance: none; appearance: none; }
  #end-root .dl-lux input[type=number]:focus { outline: none; border-color: var(--lk-accent);
                                         box-shadow: 0 0 0 3px var(--lk-ring); }

  /* A sensor row carries its current reading, which is what makes the lux range
     above choosable rather than a guess. */
  #end-root .dl-tile-lux { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; }
  /* ==== end shared daylight card ==== */
</style>

<div class="wrap" id="end-root">
  <h2 data-i18n="circadian.endsTitle"></h2>
  <p class="sub" data-i18n="circadian.endsIntro"></p>

  <!-- Above the two end cards, not below them: switching this on adds a
       brightness slider to BOTH ends, so a toggle underneath them meant
       scrolling back up to set the sliders it had just produced. -->
  <div class="card" id="end-brightnessCard" style="display:none;">
    <label class="check" id="end-brightnessRow">
      <input type="checkbox" id="end-adjustBrightness" />
      <span data-i18n="circadian.alsoBrightness"></span>
    </label>
    <div class="help" data-i18n="circadian.alsoBrightnessHelpEnds"></div>
  </div>

  <div id="end-list"></div>

  <!-- ==== shared daylight card ====
       Byte-identical markup in every view that carries it, for the reason its
       CSS block gives. `dl-off` until something references the response, because
       a screen that already has twelve windows on it should not also carry a
       sensor picker nobody asked for. -->
  <div class="section dl-card dl-off" id="dl-card">
    <div class="section-title" data-i18n="daylight.nowTitle"></div>
    <div class="card" id="dl-now"></div>

    <div class="section-title" data-i18n="daylight.sensorsTitle"></div>
    <p class="dl-help" data-i18n="daylight.sensorsHelp"></p>
    <div id="dl-sensors"></div>

    <div class="section-title" data-i18n="daylight.rangeTitle"></div>
    <div class="card">
      <p class="dl-help" data-i18n="daylight.rangeHelp"></p>
      <div class="dl-lux">
        <div class="dl-field">
          <div class="dl-label" data-i18n="daylight.luxDark"></div>
          <input type="number" id="dl-dark-lux" min="0" step="1" inputmode="numeric">
        </div>
        <div class="dl-field">
          <div class="dl-label" data-i18n="daylight.luxBright"></div>
          <input type="number" id="dl-bright-lux" min="0" step="1" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="section-title" data-i18n="daylight.endsTitle"></div>
    <div class="card">
      <p class="dl-help" data-i18n="daylight.endsHelp"></p>
      <div class="dl-field">
        <div class="dl-label" data-i18n="daylight.endDark"></div>
        <div class="dl-slider">
          <input type="range" id="dl-dark" min="10" max="100" step="5">
          <span class="dl-value" id="dl-dark-value"></span>
        </div>
      </div>
      <div class="dl-field">
        <div class="dl-label" data-i18n="daylight.endBright"></div>
        <div class="dl-slider">
          <input type="range" id="dl-bright" min="10" max="100" step="5">
          <span class="dl-value" id="dl-bright-value"></span>
        </div>
      </div>
    </div>

    <!-- Standalone only: on the other three drivers the surrounding screen owns
         the footer, and two Test buttons doing different things is worse than
         either. -->
    <div class="card" id="dl-preview-card" hidden>
      <div class="dl-blocktitle" data-i18n="daylight.previewTitle"></div>
      <div class="dl-blockhelp" data-i18n="daylight.previewHelp"></div>
      <div class="dl-acts">
        <button class="btn" id="dl-preview" data-i18n="daylight.preview"></button>
      </div>
      <div class="dl-result" id="dl-preview-result"></div>
    </div>
  </div>
  <!-- ==== end shared daylight card ==== -->

  <!-- Two live controls used to sit here as two bare buttons, one under the
       other, reading "Test it" and "Try it now" — near-synonyms in the same
       shape, so neither said what it did or how it differed from its neighbour.
       They are told apart three ways now: each is a titled block rather than a
       loose button, each carries a sentence saying what it does to which lights,
       and the pre-stage CHECK is nested inside the option it checks and revealed
       only while that option is on — which is the only state it means anything
       in, and which stops the two ever being adjacent by default. -->
  <div class="card">
    <label class="check"><input type="checkbox" id="end-preStage" />
      <span data-i18n="circadian.preStage"></span></label>
    <div class="help" data-i18n="circadian.preStageHelp"></div>

    <div class="probe off" id="end-probe">
      <div class="blocktitle" data-i18n="circadian.preStageCheckTitle"></div>
      <div class="blockhelp" data-i18n="circadian.preStageCheckHelp"></div>
      <div class="acts"><button class="btn" id="end-testPreStage" data-i18n="circadian.preStageTest"></button></div>
      <div class="result" id="end-preResult"></div>
    </div>
  </div>

  <div class="card">
    <div class="blocktitle" data-i18n="circadian.previewTitle"></div>
    <div class="blockhelp" data-i18n="circadian.previewHelp"></div>
    <div class="acts"><button class="btn" id="end-preview" data-i18n="circadian.preview"></button></div>
    <div class="result" id="end-result"></div>
  </div>

  <div class="msg muted" id="end-summary"></div>
  <div class="msg" id="end-msg" style="display:none;"></div>

  <button id="end-save" class="btn-primary" data-i18n="circadian.save"></button>
</div>

<script type="text/javascript">
/**
 * Pair views are INJECTED INTO the pairing container's document — they do not
 * get their own iframe, and they must not load homey.js themselves (a second
 * copy overwrites window.Homey with a base object that has no emit/showView).
 *
 * The container calls window.onHomeyReady once, at its own page load, long
 * before this view's script exists, so waiting to be called never fires. The
 * container's fully-equipped Homey is already on window by the time this runs,
 * so take it directly — while still accepting onHomeyReady if it does arrive.
 *
 * All views of a session share ONE document. That is why every CSS rule here is
 * scoped to this view's root id, and why the boot guard below lives on the root
 * ELEMENT rather than in a global.
 */
/**
 * The guard lives on the view's root ELEMENT, not in a global. All views
 * share one document, and a global flag survives leaving and re-entering the
 * pairing flow — which silently blocked the second run from ever rendering.
 * A freshly injected root has no marker, so each injection boots exactly once.
 */
function __lkBootEn(Homey) {
  var __root = document.getElementById('end-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  if (typeof Homey.ready === 'function') Homey.ready();

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function stabiliseScrollbar() {
    var scroller = null;
    for (var el = __root.parentElement; el && el !== document.documentElement; el = el.parentElement) {
      var overflowY = getComputedStyle(el).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') { scroller = el; break; }
    }
    var targets = scroller ? [scroller] : [document.documentElement, document.body];
    var supported = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');

    targets.forEach(function (el) {
      if (!el) return;
      if (supported) el.style.scrollbarGutter = 'stable';
      // Without gutter support, always showing the track is the stable option.
      else if (el !== document.body) el.style.overflowY = 'scroll';
    });
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
    return el;
  }

  /**
   * The daylight card: ONE configuration per device, on four different screens.
   *
   * A Daylight light's whole plan IS a daylight response, and a schedule, a
   * circadian light and a Curve light may each carry one for the rows that
   * follow it. That is four copies of the same sensor picker, the same lux range,
   * the same two ends and the same live readout — so it is written once here and
   * copied byte-for-byte, exactly as the shared CSS base above is, and for the
   * same reason: all views of a session share ONE document, there is nowhere to
   * put a module, and Homey will not follow a reference.
   *
   * `test/unit/pair-view-styles.test.ts` asserts this function identical across
   * every view that has it. Edit it in all of them, or in none.
   *
   * It takes NO arguments and closes over the four things every view already
   * has: `Homey`, `emit`, `node` and `clear`. That is what lets the body be
   * identical while the surrounding screen is not.
   *
   * It is self-contained on the wire too: it calls `getDaylight`, `listSensors`
   * and `setDaylight` itself, and all four drivers answer those three. The host
   * screen therefore does not have to thread a response through its own reply,
   * and the card can refresh its own readout without asking the screen first.
   */
  /**
   * The daylight card: ONE configuration per device, on four different screens.
   *
   * A Daylight light's whole plan IS a daylight response, and a schedule, a
   * circadian light and a Curve light may each carry one for the rows that
   * follow it. That is four copies of the same sensor picker, the same lux range,
   * the same two ends and the same live readout — so it is written once here and
   * copied byte-for-byte, exactly as the shared CSS base above is, and for the
   * same reason: all views of a session share ONE document, there is nowhere to
   * put a module, and Homey will not follow a reference.
   *
   * `test/unit/pair-view-styles.test.ts` asserts this function identical across
   * every view that has it. Edit it in all of them, or in none.
   *
   * It takes NO arguments and closes over the four things every view already
   * has: `Homey`, `emit`, `node` and `clear`. That is what lets the body be
   * identical while the surrounding screen is not.
   *
   * It is self-contained on the wire too: it calls `getDaylight`, `listSensors`
   * and `setDaylight` itself, and all four drivers answer those three. The host
   * screen therefore does not have to thread a response through its own reply,
   * and the card can refresh its own readout without asking the screen first.
   */
  function daylightCard() {
    /**
     * Every key this card can render, written out as a LITERAL.
     *
     * Not assembled from a prefix. `Homey.__` is given whatever string it is
     * given, so `'daylight.' + key` works at runtime and is invisible to
     * test/unit/locales.test.ts — which finds keys by scanning the source for
     * quoted `group.key` literals, in BOTH directions. A key referenced only by
     * assembly reads as defined-but-never-rendered; one removed from en.json
     * reads as nothing at all, and the screen would ship showing a raw key.
     */
    var KEYS = {
      nowSky: 'daylight.nowSky',
      nowSkyValue: 'daylight.nowSkyValue',
      nowSkyUnknown: 'daylight.nowSkyUnknown',
      nowSensors: 'daylight.nowSensors',
      nowNoSensors: 'daylight.nowNoSensors',
      nowResult: 'daylight.nowResult',
      nowResultValue: 'daylight.nowResultValue',
      nowUnknown: 'daylight.nowUnknown',
      sourceSensors: 'daylight.sourceSensors',
      sourceSky: 'daylight.sourceSky',
      sensorsNone: 'daylight.sensorsNone',
      sensorsNoneHelp: 'daylight.sensorsNoneHelp',
      sensorLux: 'daylight.sensorLux',
      sensorReading: 'daylight.sensorReading',
      sensorNoReading: 'daylight.sensorNoReading',
      sensorUnavailable: 'daylight.sensorUnavailable',
      ageNow: 'daylight.ageNow',
      ageMinutes: 'daylight.ageMinutes',
      ageHours: 'daylight.ageHours',
      percent: 'daylight.percent',
      preview: 'daylight.preview',
      previewing: 'daylight.previewing',
      previewed: 'daylight.previewed'
    };

    function t(key, tokens) {
      return Homey.__(KEYS[key], tokens || {});
    }

    var el = {
      card: document.getElementById('dl-card'),
      now: document.getElementById('dl-now'),
      sensors: document.getElementById('dl-sensors'),
      darkLux: document.getElementById('dl-dark-lux'),
      brightLux: document.getElementById('dl-bright-lux'),
      dark: document.getElementById('dl-dark'),
      bright: document.getElementById('dl-bright'),
      darkValue: document.getElementById('dl-dark-value'),
      brightValue: document.getElementById('dl-bright-value'),
      previewCard: document.getElementById('dl-preview-card'),
      preview: document.getElementById('dl-preview'),
      previewResult: document.getElementById('dl-preview-result')
    };

    var model = {
      standalone: false,
      response: { sensors: [], darkLux: 5, brightLux: 500, dark: 0.9, bright: 0.25 },
      limits: { minLux: 0.1, maxLux: 100000 },
      now: null,
      sky: null,
      readings: [],
      rooms: [],
      loaded: false
    };

    function percentOf(value) {
      return Math.round(Number(value) * 100);
    }

    /**
     * How long ago a reading arrived, in words.
     *
     * A reading is never treated as stale — many Zigbee sensors report only on
     * change, so a quiet sensor in a stable room is telling the truth — which
     * leaves its AGE as the only thing on screen that can reveal one that has
     * simply stopped.
     */
    function ageText(at) {
      if (at === null || at === undefined) return '';
      var minutes = Math.floor((Date.now() - Number(at)) / 60000);
      if (!isFinite(minutes) || minutes < 1) return t('ageNow');
      if (minutes < 60) return t('ageMinutes', { minutes: String(minutes) });
      return t('ageHours', { hours: String(Math.floor(minutes / 60)) });
    }

    function reading(what, value, unknown) {
      var row = node('div', 'dl-reading');
      row.appendChild(node('span', 'dl-what', what));
      row.appendChild(node('span', unknown ? 'dl-val dl-unknown' : 'dl-val', value));
      return row;
    }

    function readingFor(deviceId) {
      for (var i = 0; i < model.readings.length; i++) {
        if (model.readings[i].deviceId === deviceId) return model.readings[i];
      }
      return null;
    }

    function renderNow() {
      clear(el.now);

      var sky = model.sky || {};
      if (sky.elevation === null || sky.elevation === undefined) {
        el.now.appendChild(reading(t('nowSky'), t('nowSkyUnknown'), true));
      } else {
        el.now.appendChild(reading(t('nowSky'), t('nowSkyValue', {
          degrees: String(Math.round(Number(sky.elevation)))
        }), false));
      }

      var chosen = model.response.sensors || [];
      if (chosen.length === 0) {
        el.now.appendChild(reading(t('nowSensors'), t('nowNoSensors'), true));
      } else {
        for (var i = 0; i < chosen.length; i++) {
          var found = readingFor(chosen[i]);
          var name = found && found.name ? found.name : chosen[i];
          if (!found || !found.available || found.lux === null || found.lux === undefined) {
            el.now.appendChild(reading(name, t('sensorNoReading'), true));
          } else {
            el.now.appendChild(reading(name, t('sensorReading', {
              lux: String(Math.round(Number(found.lux))), age: ageText(found.at)
            }), false));
          }
        }
      }

      if (!model.now || model.now.source === 'none') {
        el.now.appendChild(reading(t('nowResult'), t('nowUnknown'), true));
        return;
      }
      el.now.appendChild(reading(t('nowResult'), t('nowResultValue', {
        percent: String(percentOf(model.now.brightness)),
        source: model.now.source === 'sensors' ? t('sourceSensors') : t('sourceSky')
      }), false));
    }

    /**
     * The sensor list, grouped by room, each row carrying its current reading.
     *
     * Built as NODES rather than as a markup string, so nothing here needs
     * escaping — a device name is user-supplied text and this is the safest
     * shape for it.
     *
     * The empty state is not an error. Most households own no light sensor at
     * all, and the sun answers for them perfectly well, so it says so.
     */
    function renderSensors() {
      clear(el.sensors);

      if (model.rooms.length === 0) {
        var none = node('div', 'card');
        none.appendChild(node('div', 'dl-blocktitle', t('sensorsNone')));
        none.appendChild(node('div', 'dl-blockhelp', t('sensorsNoneHelp')));
        el.sensors.appendChild(none);
        return;
      }

      var chosen = model.response.sensors || [];
      for (var r = 0; r < model.rooms.length; r++) {
        var room = model.rooms[r];
        el.sensors.appendChild(node('div', 'section-title', room.zoneName));
        for (var s = 0; s < room.sensors.length; s++) {
          var sensor = room.sensors[s];
          var tile = node('button', chosen.indexOf(sensor.id) !== -1 ? 'tile sel' : 'tile');
          tile.type = 'button';
          tile.dataset.sensor = sensor.id;
          tile.appendChild(node('div', 'name', sensor.name));
          if (!sensor.available) {
            tile.appendChild(node('div', 'dl-tile-lux', t('sensorUnavailable')));
          } else if (sensor.lux === null || sensor.lux === undefined) {
            tile.appendChild(node('div', 'dl-tile-lux', t('sensorNoReading')));
          } else {
            tile.appendChild(node('div', 'dl-tile-lux', t('sensorLux', {
              lux: String(Math.round(Number(sensor.lux)))
            })));
          }
          el.sensors.appendChild(tile);
        }
      }
    }

    function renderControls() {
      el.darkLux.value = String(model.response.darkLux);
      el.brightLux.value = String(model.response.brightLux);
      el.dark.value = String(percentOf(model.response.dark));
      el.bright.value = String(percentOf(model.response.bright));
      el.darkValue.textContent = t('percent', { value: String(percentOf(model.response.dark)) });
      el.brightValue.textContent = t('percent', { value: String(percentOf(model.response.bright)) });
      el.previewCard.hidden = !model.standalone;
    }

    function render() {
      if (!model.loaded) return;
      renderNow();
      renderSensors();
      renderControls();
    }

    function payload() {
      return {
        sensors: (model.response.sensors || []).slice(),
        darkLux: Number(el.darkLux.value),
        brightLux: Number(el.brightLux.value),
        dark: Number(el.dark.value) / 100,
        bright: Number(el.bright.value) / 100
      };
    }

    /**
     * Push, and take back what the driver made of it.
     *
     * The reply is authoritative rather than an acknowledgement:
     * `sanitiseResponse` corrects per field — an inverted lux range resets both
     * ends, a brightness under the floor comes up to it — and a card that went
     * on showing what the user typed would be a card saving something different
     * from what it says.
     */
    function push() {
      return emit('setDaylight', { response: payload() }).then(function (result) {
        model.response = result.response;
        model.now = result.now;
        model.readings = result.sensorReadings || [];
        render();
        return result;
      });
    }

    /**
     * A push whose failure must not be swallowed by the caller's happy path.
     *
     * Every fire-and-forget site needs its own catch: an unhandled rejection
     * inside the pairing container is a screen that silently stops responding.
     */
    function pushQuietly() {
      push().catch(function (err) {
        el.previewResult.textContent = String(err && err.message ? err.message : err);
      });
    }

    el.sensors.addEventListener('click', function (event) {
      var tile = event.target && event.target.closest ? event.target.closest('.tile') : null;
      if (!tile || !tile.dataset.sensor) return;

      var id = tile.dataset.sensor;
      var chosen = (model.response.sensors || []).slice();
      var at = chosen.indexOf(id);
      if (at === -1) chosen.push(id);
      else chosen.splice(at, 1);
      model.response.sensors = chosen;

      // Rendered before the round trip so the tap feels immediate, and again
      // from the reply, which is the authority.
      render();
      pushQuietly();
    });

    el.dark.addEventListener('input', function () {
      el.darkValue.textContent = t('percent', { value: String(el.dark.value) });
    });
    el.bright.addEventListener('input', function () {
      el.brightValue.textContent = t('percent', { value: String(el.bright.value) });
    });

    // `change` rather than `input` for the push: a slider dragged across its
    // range fires input for every pixel, and each one is a round trip.
    el.dark.addEventListener('change', pushQuietly);
    el.bright.addEventListener('change', pushQuietly);
    el.darkLux.addEventListener('change', pushQuietly);
    el.brightLux.addEventListener('change', pushQuietly);

    el.preview.addEventListener('click', function () {
      el.preview.disabled = true;
      el.preview.textContent = t('previewing');
      el.previewResult.textContent = '';

      push().then(function () {
        return emit('previewNow');
      }).then(function (outcome) {
        el.previewResult.textContent = t('previewed', {
          writes: String((outcome && outcome.writes) || 0)
        });
      }).catch(function (err) {
        el.previewResult.textContent = String(err && err.message ? err.message : err);
      }).then(function () {
        el.preview.disabled = false;
        el.preview.textContent = t('preview');
      });
    });

    return {
      /** Fetch everything this card needs. Two calls, because two handlers. */
      load: function () {
        return Promise.all([emit('getDaylight'), emit('listSensors')]).then(function (replies) {
          var data = replies[0] || {};
          var sensors = replies[1] || {};

          model.standalone = data.standalone === true;
          if (data.response) model.response = data.response;
          if (data.limits) model.limits = data.limits;
          model.now = data.now || null;
          model.sky = data.sky || null;
          model.readings = data.sensorReadings || [];
          model.rooms = sensors.rooms || [];
          model.loaded = true;

          // Bounded by what the driver will actually accept, so a number the
          // sanitiser would clamp cannot be typed in the first place.
          el.darkLux.min = String(model.limits.minLux);
          el.darkLux.max = String(model.limits.maxLux);
          el.brightLux.min = String(model.limits.minLux);
          el.brightLux.max = String(model.limits.maxLux);

          render();
          return data;
        });
      },
      /** Whether this device's own plan IS the response. */
      isStandalone: function () {
        return model.standalone;
      },
      /**
       * Show or hide the card.
       *
       * The host screen decides: a Daylight light always shows it, and the other
       * three show it only once a row actually follows the daylight. A schedule
       * screen that already carries twelve windows should not also carry a
       * sensor picker nobody asked for.
       */
      setUsed: function (used) {
        el.card.className = used ? 'section dl-card' : 'section dl-card dl-off';
      },
      /** Push the current controls, for a host screen saving its own plan. */
      push: push
    };
  }

  /**
   * Two ends of the day, and the shape between them is not ours to choose.
   *
   * This screen deliberately has no times on it. The shape is a constant in
   * lib/circadian/simple-curve.ts, and the moment it becomes editable this device
   * type is the Curve light with fewer fields. What the shape IS gets shown —
   * `model.shape` names the hours each end applies at — because a slider called
   * "warmest" with no hours beside it is a slider whose effect has to be guessed.
   */
  var model = {
    warmest: { temperature: 1, brightness: 0.6 },
    coolest: { temperature: 0.15, brightness: 0.9 },
    adjustBrightness: false,
    preStage: false,
    support: { dim: 0, light_temperature: 0 },
    shape: [],
    lights: [],
    timezone: null
  };

  /**
   * The two ends, with their labels named explicitly.
   *
   * A literal per end rather than a key assembled from a prefix, because
   * test/unit/locales.test.ts scans the source for locale keys as string
   * literals: a key assembled at runtime is a key it cannot see, and an unused or
   * missing translation then passes silently.
   */
  var ENDS = [
    { key: 'warmest', label: 'circadian.end_warmest' },
    { key: 'coolest', label: 'circadian.end_coolest' }
  ];

  /**
   * The shared daylight card, as a SECTION of this screen rather than a screen.
   *
   * Named `dlCard` rather than `card` because `render()` below already has a
   * local `card` for each end's own box, and shadowing that would be a bug
   * nobody would see until the second end failed to draw.
   */
  var dlCard = daylightCard();

  /**
   * "Set a brightness" or "Follow the daylight", per END.
   *
   * Per end rather than per device, because the two ends of the day are
   * genuinely different questions — how bright the room needs to be at night,
   * and at noon — and somebody may well want one answered by a sensor and the
   * other by hand.
   *
   * The slider stays visible either way. Following the daylight does not throw
   * the number away: it is the fallback for when no sensor is reporting and the
   * Homey has no location, and a control that vanished would leave that value
   * unreachable and unexplained.
   */
  function endDaylightChoice(end) {
    var select = document.createElement('select');
    var fixed = document.createElement('option');
    fixed.value = 'fixed';
    fixed.textContent = Homey.__('daylight.modeFixed');
    var following = document.createElement('option');
    following.value = 'daylight';
    following.textContent = Homey.__('daylight.modeDaylight');
    select.appendChild(fixed);
    select.appendChild(following);
    select.value = model[end].fromDaylight === true ? 'daylight' : 'fixed';

    select.addEventListener('change', function () {
      model[end].fromDaylight = select.value === 'daylight';
      // Re-rendered rather than patched: the shared card appears with the first
      // end that follows the daylight and goes away with the last.
      render();
      pushQuietly();
    });
    return select;
  }

  function warmthText(value) {
    if (value >= 0.9) return Homey.__('schedule.warmthWarmest');
    if (value >= 0.65) return Homey.__('schedule.warmthWarm');
    if (value >= 0.35) return Homey.__('schedule.warmthNeutral');
    if (value >= 0.1) return Homey.__('schedule.warmthCool');
    return Homey.__('schedule.warmthCoolest');
  }

  /** The hours this end applies at, from the shape the driver sent. */
  function whenText(end) {
    var hours = model.shape.filter(function (point) { return point.end === end; })
      .map(function (point) { return point.at; });
    if (!hours.length) return '';
    return Homey.__('circadian.endWhen', { hours: hours.join(', ') });
  }

  function show(kind, text) {
    var msg = document.getElementById('end-msg');
    msg.className = 'msg ' + kind;
    msg.textContent = text;
    msg.style.display = 'block';
  }

  function slider(end, field, min, max) {
    var wrap = node('div', 'slider');
    var input = document.createElement('input');
    input.type = 'range';
    input.min = String(min);
    input.max = String(max);
    input.step = '5';
    input.value = String(Math.round((model[end][field] || 0) * 100));

    var value = node('span', 'value', field === 'temperature'
      ? warmthText(model[end].temperature)
      : Homey.__('schedule.percent', { percent: Math.round((model[end].brightness || 0) * 100) }));

    input.addEventListener('input', function () {
      var next = Number(input.value) / 100;
      model[end][field] = next;
      value.textContent = field === 'temperature'
        ? warmthText(next)
        : Homey.__('schedule.percent', { percent: Math.round(next * 100) });
    });
    input.addEventListener('change', pushQuietly);

    wrap.appendChild(input);
    wrap.appendChild(value);
    return wrap;
  }

  function render() {
    var list = clear(document.getElementById('end-list'));

    ENDS.forEach(function (which) {
      var end = which.key;
      var card = node('div', 'card');

      var head = node('div', 'rowhead');
      head.appendChild(node('div', 'name', Homey.__(which.label)));
      head.appendChild(node('div', 'when', whenText(end)));
      card.appendChild(head);

      var temperature = node('div', 'field');
      temperature.appendChild(node('div', 'label', Homey.__('circadian.warmth')));
      // The warm end is 100 and sits to the right: higher is warmer on Homey's
      // axis (CLAUDE.md section 6), and every screen in this app agrees.
      temperature.appendChild(slider(end, 'temperature', 0, 100));
      card.appendChild(temperature);

      // Only when the user has asked for brightness to follow. Gating this on
      // whether the lights CAN dim instead put two sliders on the screen that
      // the runtime ignores while the box below them is unchecked — a control
      // that looks configured and does nothing, which is the one failure this
      // app exists to prevent.
      if (model.support.dim > 0 && model.adjustBrightness) {
        var brightness = node('div', 'field');
        brightness.appendChild(node('div', 'label', Homey.__('circadian.brightness')));
        brightness.appendChild(endDaylightChoice(end));
        brightness.appendChild(slider(end, 'brightness', 10, 100));
        if (model[end].fromDaylight === true) {
          brightness.appendChild(node('div', 'help', Homey.__('daylight.fallbackHelp')));
        }
        card.appendChild(brightness);
      }

      list.appendChild(card);
    });

    // The whole card, not the row inside it: the toggle has its own card above
    // the two ends now, so hiding only the row left an empty white box on a
    // screen where nothing dims.
    document.getElementById('end-brightnessCard').style.display =
      model.support.dim > 0 ? 'block' : 'none';
    document.getElementById('end-adjustBrightness').checked = model.adjustBrightness;
    document.getElementById('end-preStage').checked = model.preStage;
    syncProbe();

    // The card is a section of this screen and only earns its space once an end
    // actually follows the daylight.
    dlCard.setUsed(model.adjustBrightness
      && (model.warmest.fromDaylight === true || model.coolest.fromDaylight === true));

    document.getElementById('end-summary').textContent = Homey.__('circadian.endsSummary', {
      lights: model.lights.length,
      zone: model.timezone || Homey.__('schedule.notKnownYet')
    });
  }

  /** Send both ends. The server sanitises and tells us what it corrected. */
  function push() {
    return emit('setEnds', {
      warmest: model.warmest,
      coolest: model.coolest,
      adjustBrightness: model.adjustBrightness,
      preStage: model.preStage
    }).then(function (result) {
      if (result && result.corrected && result.corrected.length) {
        show('bad', Homey.__('circadian.endsCorrected', { fields: result.corrected.join(', ') }));
      }
      return result;
    });
  }

  /**
   * `push()` where nobody is going to chain onto it.
   *
   * `push()` deliberately lets a rejection propagate, because Preview, Test and
   * Save all chain onto it and report the failure themselves. The three
   * fire-and-forget sites — a slider settling, and the two checkboxes — had no
   * catch at all, so a refused round trip was an unhandled rejection in the
   * webview and the user saw nothing. Lower stakes than the light picker's,
   * because Save pushes again before it saves, but silence is still the wrong
   * answer.
   */
  function pushQuietly() {
    push().catch(function (err) {
      show('bad', err.message || String(err));
    });
  }

  document.getElementById('end-adjustBrightness').addEventListener('change', function (e) {
    model.adjustBrightness = e.target.checked;
    // Re-render: the per-end brightness sliders appear and disappear with this
    // box, so switching it on has to put them where the user can see what they
    // just asked for.
    render();
    pushQuietly();
  });

  /**
   * The check belongs to the option, so it appears and disappears with it.
   *
   * Called from the change handler AND from render(), because a repair session
   * arrives with the option already on and the block would otherwise stay
   * hidden behind a class that only a click could clear.
   */
  function syncProbe() {
    document.getElementById('end-probe').classList.toggle('off', !model.preStage);
  }

  document.getElementById('end-preStage').addEventListener('change', function (e) {
    model.preStage = e.target.checked;
    syncProbe();
    pushQuietly();
  });

  document.getElementById('end-preview').addEventListener('click', function () {
    var button = document.getElementById('end-preview');
    var result = document.getElementById('end-result');
    button.disabled = true;
    result.textContent = Homey.__('circadian.previewing');
    push()
      .then(function () { return emit('previewNow'); })
      .then(function (outcome) {
        result.textContent = Homey.__('circadian.previewed', {
          writes: (outcome && outcome.writes) || 0
        });
      })
      .catch(function (err) { result.textContent = err.message || String(err); })
      .then(function () { button.disabled = false; });
  });

  document.getElementById('end-testPreStage').addEventListener('click', function () {
    // Disabled while it runs: the probe deliberately watches the lamp for five
    // seconds, and a button that still looks pressable for all five invites a
    // second press that races the first one's verdict.
    var button = document.getElementById('end-testPreStage');
    var result = document.getElementById('end-preResult');
    button.disabled = true;
    result.textContent = Homey.__('circadian.preStageTesting');
    push()
      .then(function () { return emit('testPreStage'); })
      .then(function (outcome) {
        if (!outcome || !outcome.deviceId) {
          result.textContent = Homey.__('circadian.preStageNoLight');
          return;
        }
        if (outcome.stayedOff) {
          result.textContent = Homey.__('circadian.preStageOk', { name: outcome.name || outcome.deviceId });
          return;
        }
        /**
         * The verdict has to change the MODEL, not just the sentence.
         *
         * Both `preStageCameOn` messages say the option has been turned off —
         * the runtime does turn it off for itself — but this screen went on
         * holding `preStage: true`, so the next `push()` sent it straight back
         * and the message was untrue by the time it finished being read. The
         * curve view already did this; this one only said it.
         */
        model.preStage = false;
        document.getElementById('end-preStage').checked = false;
        result.textContent = Homey.__(
          outcome.restored ? 'circadian.preStageCameOn' : 'circadian.preStageCameOnStuck',
          { name: outcome.name || outcome.deviceId });
        // The verdict stays on screen for this render — hiding the block here
        // would take away the sentence explaining what just happened to the
        // user's lamp — and goes with the next change of the option.
        pushQuietly();
      })
      .catch(function (err) { result.textContent = err.message || String(err); })
      .then(function () { button.disabled = false; });
  });

  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    // Belt and braces: the pairing container translates these itself, but a
    // build that does not leaves the screen showing key names.
    var translated = Homey.__(el.getAttribute('data-i18n'));
    if (translated) el.textContent = translated;
  });

  document.getElementById('end-save').addEventListener('click', function () {
    var button = document.getElementById('end-save');
    button.disabled = true;
    show('muted', Homey.__('circadian.saving'));

    push()
      .then(function () { return emit('save', ''); })
      .then(function (result) {
        if (!result.created) { Homey.done(); return; }
        // createDevice alone does NOT add the device — the view must also emit
        // 'add_device' with the device data.
        return Homey.createDevice(result.device)
          .then(function (deviceData) {
            return emit('add_device', deviceData || result.device);
          })
          .then(function () { Homey.done(); });
      })
      .catch(function (err) {
        button.disabled = false;
        show('bad', err.message || String(err));
      });
  });

  stabiliseScrollbar();

  emit('getEnds').then(function (data) {
    model.warmest = data.warmest || model.warmest;
    model.coolest = data.coolest || model.coolest;
    model.adjustBrightness = data.adjustBrightness === true;
    model.preStage = data.preStage === true;
    model.support = data.support || model.support;
    model.shape = data.shape || [];
    model.lights = data.lights || [];
    model.timezone = data.timezone;
    render();
    /**
     * The daylight card loads itself, AFTER the ends are on screen.
     *
     * Its own two round trips rather than fields threaded through `getEnds`,
     * which is what lets the card be byte-identical on four screens. Chained
     * rather than parallel so the ends never wait on a sensor list, and with its
     * own catch: a Homey that cannot answer `listSensors` must leave this screen
     * working with the brightness set by hand rather than blank.
     */
    return dlCard.load().then(render);
  }).catch(function (err) {
    show('bad', err.message || String(err));
  });
}

window.onHomeyReady = __lkBootEn;

(function waitForHomey(attempt) {
  if (window.Homey && typeof window.Homey.emit === 'function') return __lkBootEn(window.Homey);
  // Homey never arrived, so Homey.__ does not exist and this one string cannot
  // go through a locale key: the failure mode IS "no Homey on the page". It is
  // also inserted into document.body, outside the view root, so the tokens
  // scoped to that root cannot reach it either — hence the literal colours,
  // which are the pair-view error palette rather than the settings one.
  if ((attempt || 0) > 100) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:12px;background:#fdeceb;color:#8f1d18;font-size:13px;">'
      + 'Lightkeeper could not reach Homey from this screen. Close it and try again.</div>');
    return;
  }
  setTimeout(function () { waitForHomey((attempt || 0) + 1); }, 50);
})(0);
</script>
