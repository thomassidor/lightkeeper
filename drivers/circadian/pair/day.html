<style>
  /* ==== shared base: identical in every pair view ====
     Scoped to this view's root because all views of a session share ONE
     document, so unscoped class names bleed between screens (see the script
     header).

     GENERATED. This block is spliced into every pair view by
     `npm run sync:views` from views/shared/base.css, where the placeholder
     ROOT-ID stands in for each view's own root element id. **Edit that file, not
     this one** — a change here is overwritten on the next sync, and
     `npm run sync:views:check` fails in CI until the two agree. It used to be
     authored by hand in all thirteen views, under an instruction to "edit this
     block in all files, or in none of them".

     It is still copied on disk rather than linked, and that part has not
     changed: Homey needs a real file per folder and will not follow a reference
     (platform §8). What HAS changed is the count of places a human edits: one.

     A real stylesheet link may turn out to be possible — the Homey does serve a
     sibling file next to a pair view, measured on hardware and written up in
     platform §8, which is more than the old comment here believed. What is still
     unmeasured is whether an injected view's own external reference loads at all
     once the pairing container has put the view into its shared document. Until
     somebody checks that with the Homey app open, splicing is the honest answer.

     NOTE for whoever edits this comment: no HTML tag literals in here. The boot
     harness finds a view's script by searching for a script tag, so writing one
     inside this stylesheet made it evaluate the CSS as JavaScript — which fails
     on the word `export` in the palette note below, forty lines from anything
     that looked related.

     Colours are tokens so a colour lives in ONE place, not so a second scheme
     can restate them: there IS no second scheme. Homey renders a pairing view
     inside its own panel, and that panel is light whatever the phone is set to
     — so a view that followed the OS scheme went dark inside a white sheet. A
     colour written as a literal anywhere past this block is a token that is
     missing. */
  #dy-root {
    /* Brand. The violet is the manifest brandColor: the logo's ground — 93% of
       its pixels — lightened so it reads as violet rather than black in the
       circle Homey paints behind an icon (platform §10). The lavender is the
       logo's mark. Both are read out of
       artwork/masters/logo-bitmap-original.png by `export-assets.py --palette`,
       so the UI cannot drift from the artwork. The tints and lines are derived:
       the logo itself has no mid-tones. */
    --lk-accent: #2a1958;
    --lk-accent-ink: #ffffff;
    /* Secondary text ON the accent, where white would compete with the number
       beside it rather than support it. */
    --lk-accent-soft: #e2dbf6;
    --lk-accent-tint: #f3eefc;
    --lk-accent-wash: #fbf9fe;
    --lk-accent-line: #d9cbf5;
    --lk-accent-strong: #3b2279;
    --lk-ring: rgba(42, 25, 88, .16);

    /* The ink ladder. Every one of these clears WCAG AA (4.5:1) against
       --lk-surface, because all five are used between 11px and 15px — and the
       two lightest carry the section titles, the tile meta and the help text.
       They were 3.1:1 (--lk-muted) and 2.6:1 (--lk-faint): grey on white that
       is legible on a desk monitor and not on a phone in daylight. What
       separates the steps now is weight, size and caps as much as tone. */
    --lk-ink: #16181d;
    --lk-sub: #5f6672;
    --lk-body: #4b5563;
    --lk-muted: #6a7180;
    --lk-faint: #6f7683;

    /* transparent, not white: the pairing container paints the page behind us,
       and claiming it would flatten every card against it. */
    --lk-page: transparent;
    --lk-surface: #ffffff;
    --lk-raised: #f7f8fa;
    --lk-line: #eceef2;
    --lk-field: #e3e6ec;
    --lk-hover: #c9d2e0;
    --lk-shadow: 0 1px 2px rgba(16, 24, 40, .05);

    /* The pairing primitives' own colours, here for the same reason every
       other literal is: a shadow written inline is a shadow the next palette
       change misses. */
    --lk-knob-shadow: 0 1px 3px rgba(16, 24, 40, .3);
    --lk-slider-knob-shadow: 0 0 0 2px rgba(22, 24, 29, .6), 0 1px 4px rgba(16, 24, 40, .35);
    --lk-slider-inset: inset 0 0 0 1px rgba(22, 24, 29, .1);
    /* The two axes a slider can carry, as whole gradients rather than as a
       list of stops: a ramp is one decision about what the axis LOOKS like,
       and splitting it into six tokens would invite five of them to change. */
    --lk-warm-ramp: linear-gradient(90deg, #e8892c, #efa658, #f4c68a,
                                    #f2e6d6, #eaf0fb, #dbe8fb);
    --lk-bright-ramp: linear-gradient(90deg, #221a3d, #43318a, #7a5fc4,
                                      #b9a6e4, #ece5f9);
    --lk-handle-shadow: 0 2px 6px rgba(16, 24, 40, .2);
    --lk-handle-shadow-sel: 0 0 0 4px var(--lk-ring), 0 2px 8px rgba(16, 24, 40, .28);
    --lk-hairline: rgba(22, 24, 29, .1);
    --lk-day-mark: rgba(22, 24, 29, .4);
    --lk-day-tag-bg: rgba(255, 255, 255, .86);

    --lk-ok-bg: #eaf7ef;   --lk-ok-ink: #10633a;
    --lk-bad-bg: #fdeceb;  --lk-bad-ink: #8f1d18;
    /* Not an error. The one thing that reads this way is a schedule overlap,
       which is allowed, resolved deterministically, and worth pointing at. */
    --lk-warn-bg: #fdf3e7; --lk-warn-ink: #7a4a10;
    --lk-flat-bg: #f4f5f7; --lk-flat-ink: #5b616e;

    background: var(--lk-page);
    padding: 18px 16px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", sans-serif;
    color: var(--lk-ink);
    -webkit-font-smoothing: antialiased;
  }

  #dy-root h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #dy-root .sub { font-size: 14px; line-height: 1.5; color: var(--lk-sub); margin: 0 0 18px; }
  #dy-root p { font-size: 14px; line-height: 1.55; color: var(--lk-body); }

  #dy-root .card { background: var(--lk-surface); border: 1px solid var(--lk-line);
              border-radius: 14px; box-shadow: var(--lk-shadow); padding: 14px;
              margin-bottom: 10px; }

  #dy-root .section { margin-bottom: 18px; }
  #dy-root .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
                       letter-spacing: .06em; color: var(--lk-faint); margin: 0 0 8px 2px; }

  /* Tappable rows: 44px minimum, which is the smallest comfortable touch target. */
  #dy-root .tile { display: block; width: 100%; text-align: left; background: var(--lk-surface);
              border: 1.5px solid var(--lk-line); border-radius: 12px; padding: 13px 14px;
              margin-bottom: 7px; cursor: pointer; min-height: 44px; box-sizing: border-box;
              color: var(--lk-ink);
              transition: border-color .12s ease, background .12s ease; }
  #dy-root .tile:hover { border-color: var(--lk-hover); }
  #dy-root .tile.sel { border-color: var(--lk-accent); background: var(--lk-accent-tint); }
  #dy-root .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  #dy-root .tile .meta { font-size: 12.5px; color: var(--lk-muted); margin-top: 3px; line-height: 1.35; }

  #dy-root input[type=text], #dy-root input[type=password], #dy-root select {
    width: 100%; box-sizing: border-box; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--lk-field); border-radius: 11px; background: var(--lk-surface);
    color: var(--lk-ink); font-family: inherit; -webkit-appearance: none; appearance: none; }
  /* The chevron's fill stays a literal: #6a7180 is --lk-muted, and a data URI
     cannot read a custom property. So this is the one place a token's value is
     written twice, and the two copies have to move together. */
  #dy-root select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%236a7180' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
               background-repeat: no-repeat; background-position: right 13px center;
               background-size: 11px; padding-right: 34px; }
  #dy-root input:focus, #dy-root select:focus { outline: none; border-color: var(--lk-accent);
                                      box-shadow: 0 0 0 3px var(--lk-ring); }

  #dy-root .btn { font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 15px;
             border-radius: 10px; border: 1.5px solid var(--lk-field);
             background: var(--lk-surface); color: var(--lk-ink); cursor: pointer;
             min-height: 40px; }
  #dy-root .btn:hover { border-color: var(--lk-hover); }
  #dy-root .btn:disabled { opacity: .45; cursor: not-allowed; }
  #dy-root .btn-primary { width: 100%; font-size: 16px; font-weight: 600; padding: 14px;
                     border-radius: 12px; border: none; background: var(--lk-accent);
                     color: var(--lk-accent-ink); cursor: pointer; min-height: 50px;
                     margin-top: 16px; font-family: inherit; }
  #dy-root .btn-primary:disabled { opacity: .5; cursor: progress; }

  /* A default ground, so a .msg shown before any state class lands on it is
     still a message rather than bare text on the page. */
  #dy-root .msg { margin-top: 14px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px;
             line-height: 1.5; background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #dy-root .ok { background: var(--lk-ok-bg); color: var(--lk-ok-ink); }
  #dy-root .bad { background: var(--lk-bad-bg); color: var(--lk-bad-ink); }
  #dy-root .muted { background: var(--lk-flat-bg); color: var(--lk-flat-ink); }
  #dy-root .warn { background: var(--lk-warn-bg); color: var(--lk-warn-ink); }
  /* A message whose first line is what happened and whose second is what it
     means. Both belong in one block: split across two, the second reads as
     unrelated body copy. */
  #dy-root .msg .lead { font-weight: 600; margin-bottom: 3px; }

  #dy-root ol { font-size: 14px; line-height: 1.75; padding-left: 20px; margin: 0 0 16px;
           color: var(--lk-body); }
  #dy-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { #dy-root .grid { grid-template-columns: 1fr; } }
  #dy-root .empty { font-size: 14px; color: var(--lk-muted); padding: 12px 0; }
  /* ---- the pairing paradigm --------------------------------------------
     Every screen the redesign draws is built from these six, so a change to
     any of them is one edit rather than fifteen. They live in the shared base
     rather than in each view for exactly the reason the tokens do: a primitive
     defined twice is a primitive that drifts. */

  /* Step dots. The intro is unnumbered — the steps it promises are the ones
     that carry a dot — so a view renders as many as its own flow has. */
  #dy-root .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  #dy-root .steps i { width: 22px; height: 4px; border-radius: 999px;
                   background: var(--lk-field); }
  #dy-root .steps i.on { background: var(--lk-accent); }
  #dy-root .steps span { margin-left: 4px; font-size: 12px; color: var(--lk-faint); }

  /* `label · value · chevron`. The one shape everything secondary takes:
     a row that says what it is, what it is set to, and that it can be opened. */
  #dy-root .row { display: flex; align-items: center; gap: 11px; width: 100%;
               padding: 13px 14px; min-height: 44px; box-sizing: border-box;
               background: none; border: none; font: inherit; color: inherit;
               text-align: left; cursor: pointer; }
  #dy-root .row + .row { border-top: 1px solid var(--lk-line); }
  #dy-root .row .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #dy-root .row .value { font-size: 13px; color: var(--lk-muted); text-align: right; }
  #dy-root .row .chev { flex: none; font-size: 15px; color: var(--lk-muted); }
  #dy-root .row .sub { font-size: 12.5px; color: var(--lk-muted); margin: 2px 0 0; }

  /* The pill switch behind every "Set … too". */
  #dy-root .toggle { display: flex; align-items: center; gap: 11px; width: 100%;
                  padding: 12px 0; min-height: 44px; box-sizing: border-box;
                  background: none; border: none; font: inherit; color: inherit;
                  text-align: left; cursor: pointer; }
  #dy-root .toggle .label { flex: 1; font-size: 14.5px; font-weight: 500; }
  #dy-root .toggle .track { flex: none; width: 44px; height: 26px; border-radius: 999px;
                         position: relative; background: var(--lk-field);
                         transition: background .15s ease; }
  #dy-root .toggle[aria-checked="true"] .track { background: var(--lk-accent); }
  #dy-root .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
                        border-radius: 50%; background: var(--lk-surface);
                        box-shadow: var(--lk-knob-shadow);
                        transition: left .15s ease; }
  #dy-root .toggle[aria-checked="true"] .knob { left: 21px; }

  /* The title above a control, with its value on the right of the same line.
     Sentence case and body-coloured rather than a small-caps section label:
     "Brightness 80%" is a reading of the control directly below it, not a
     heading over a group of unrelated things. */
  #dy-root .control-title { display: flex; align-items: baseline;
                         justify-content: space-between; gap: 10px;
                         font-size: 13.5px; font-weight: 600; line-height: 1.2;
                         color: var(--lk-ink); margin: 0 0 9px; }

  /* A value slider with its two end captions.
     The TRACK carries the range as a gradient and there is no fill: the whole
     axis is visible at once, so a warmth slider shows candlelight at one end
     and daylight at the other rather than asking somebody to imagine it. The
     knob marks the position on it.
     `touch-action: none` is not decoration: without it a horizontal drag
     scrolls the pairing sheet underneath and the control cannot be used on a
     phone at all. */
  #dy-root .slider { position: relative; height: 28px; border-radius: 8px;
                  background: var(--lk-field); margin: 0;
                  box-shadow: var(--lk-slider-inset);
                  touch-action: none; cursor: pointer; }
  /* Candlelight to daylight, left to right — the order the slider reads in,
     which is the REVERSE of the way a warmth is stored (platform §6). */
  #dy-root .slider.warm { background: var(--lk-warm-ramp); }
  #dy-root .slider.bright { background: var(--lk-bright-ramp); }
  #dy-root .slider .knob { position: absolute; top: -4px; bottom: -4px; width: 6px;
                        margin-left: -3px; border-radius: 4px;
                        background: var(--lk-surface);
                        box-shadow: var(--lk-slider-knob-shadow); }
  #dy-root .ends { display: flex; justify-content: space-between;
                font-size: 11px; color: var(--lk-muted); margin: 9px 0 0; }

  /* The swatches a colour is chosen from, four across.
     Not one row of eight: at 390px that is 34px a swatch, under the touch
     minimum and too small to judge a colour by. Two rows of four is the same
     set of eight, legibly, and the sixteen that fold out below continue it. */
  #dy-root .swatches { display: grid; grid-template-columns: repeat(4, 1fr);
                    gap: 8px; margin: 10px 0; }
  #dy-root .swatch { height: 44px; border-radius: 9px; padding: 0;
                  border: 1px solid var(--lk-hairline); cursor: pointer; }
  #dy-root .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--lk-surface),
                                                   0 0 0 4px var(--lk-accent); }

  /* The day strip: a picture of the whole day, drawn once and reused. */
  #dy-root .day { position: relative; height: 104px; border-radius: 12px;
               overflow: hidden; touch-action: none; }
  #dy-root .day .mark { position: absolute; top: 0; bottom: 0; width: 0;
                     border-left: 1.5px dashed var(--lk-day-mark); }
  #dy-root .day .tag { position: absolute; top: 6px; transform: translateX(-50%);
                    background: var(--lk-day-tag-bg); color: var(--lk-body);
                    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; padding: 3px 5px; border-radius: 4px; }
  #dy-root .day .handle { position: absolute; top: 50%; width: 26px; height: 26px;
                       margin: -13px 0 0 -13px; border-radius: 50%;
                       background: var(--lk-surface); box-sizing: border-box;
                       border: 2.5px solid var(--lk-ring);
                       box-shadow: var(--lk-handle-shadow); }
  #dy-root .day .handle.sel { width: 34px; height: 34px; margin: -17px 0 0 -17px;
                           border: 3px solid var(--lk-accent); z-index: 2;
                           box-shadow: var(--lk-handle-shadow-sel); }
  #dy-root .clockline { display: flex; justify-content: space-between;
                     font-size: 12px; color: var(--lk-muted); margin-top: 6px; }

  /* ==== end shared base ==== */

  /* ---- this view only ---------------------------------------------------- */

  #dy-root .today { font-size: 12.5px; color: var(--lk-muted); margin: 8px 2px 16px; }

  /* The selected zone's card: its name, its span, its boundary stepper, and the
     two controls. Only one zone is open at a time — the other two are rows. */
  #dy-root .zone { background: var(--lk-surface); border: 1px solid var(--lk-line);
                   border-radius: 14px; box-shadow: var(--lk-shadow);
                   padding: 14px; margin-bottom: 14px; }
  #dy-root .zone-head { display: flex; align-items: baseline; justify-content: space-between;
                        gap: 10px; margin-bottom: 12px; }
  #dy-root .zone-head .name { font-size: 16px; font-weight: 700; }
  #dy-root .zone-head .span { font-size: 12.5px; color: var(--lk-muted); }

  /* The boundary stepper: "Ends  − Sunrise +30m +". A stepper rather than a
     free field because the offset moves in quarter hours and always has. */
  #dy-root .stepper { display: flex; align-items: center; gap: 8px;
                      background: var(--lk-flat-bg); border-radius: 10px;
                      padding: 6px 8px; margin-bottom: 14px; min-height: 44px;
                      box-sizing: border-box; }
  #dy-root .stepper .what { flex: 1; font-size: 13px; color: var(--lk-body); }
  #dy-root .stepper .at { font-size: 14px; font-weight: 600; min-width: 96px;
                          text-align: center; }
  #dy-root .stepper button { width: 34px; height: 34px; flex: none; border-radius: 8px;
                             border: 1.5px solid var(--lk-field); background: var(--lk-surface);
                             font: 600 18px/1 inherit; color: var(--lk-ink); cursor: pointer; }
  #dy-root .stepper button:disabled { opacity: .4; cursor: not-allowed; }


  /* The two zones that are not open, as rows: a swatch, a name, its span. */
  #dy-root .others { background: var(--lk-surface); border: 1px solid var(--lk-line);
                     border-radius: 14px; box-shadow: var(--lk-shadow);
                     overflow: hidden; margin-bottom: 14px; }
  #dy-root .others .sw { flex: none; width: 26px; height: 26px; border-radius: 7px;
                         border: 1px solid var(--lk-hairline); }
  #dy-root .others .text { flex: 1; }
</style>

<div class="wrap" id="dy-root">
  <div class="steps" id="dy-steps"></div>
  <h2 data-i18n="day.title"></h2>

  <div id="dy-error" class="msg bad" style="display:none;"></div>

  <div class="day" id="dy-strip">
    <div class="mark" id="dy-sunriseMark"></div>
    <div class="tag" id="dy-sunriseTag" data-i18n="day.sunrise"></div>
    <div class="mark" id="dy-sunsetMark"></div>
    <div class="tag" id="dy-sunsetTag" data-i18n="day.sunset"></div>
    <div class="handle" id="dy-morningHandle"></div>
    <div class="handle" id="dy-eveningHandle"></div>
  </div>
  <div class="clockline">
    <span data-i18n="day.midnight"></span>
    <span data-i18n="day.noon"></span>
    <span data-i18n="day.midnight"></span>
  </div>
  <div class="today" id="dy-today"></div>

  <div class="zone" id="dy-zone">
    <div class="zone-head">
      <span class="name" id="dy-zoneName"></span>
      <span class="span" id="dy-zoneSpan"></span>
    </div>

    <div class="stepper" id="dy-stepper">
      <span class="what" id="dy-boundaryWhat"></span>
      <button type="button" id="dy-boundaryDown">&minus;</button>
      <span class="at" id="dy-boundaryAt"></span>
      <button type="button" id="dy-boundaryUp">+</button>
    </div>

    <div class="control-title" data-i18n="day.colour"></div>
    <div class="slider warm" id="dy-warmth">
      <div class="knob" id="dy-warmthKnob"></div>
    </div>
    <div class="ends">
      <span data-i18n="day.candlelight"></span>
      <span data-i18n="day.daylight"></span>
    </div>

    <!--
      Brightness is OFF by default and behind a switch, because a circadian
      light changes colour and touching brightness is a separate decision. With
      it on it is per zone, on the same control every other device uses.
    -->
    <button class="toggle" id="dy-brightToggle" type="button" aria-checked="false">
      <span class="label" data-i18n="day.alsoBrightness"></span>
      <span class="track"><span class="knob"></span></span>
    </button>

    <div id="dy-brightBlock" style="display:none;">
      <div class="control-title"><span data-i18n="day.brightness"></span> <span id="dy-brightPct"></span></div>
      <div class="slider bright" id="dy-bright">
        <div class="knob" id="dy-brightKnob"></div>
      </div>
      <div class="ends">
        <span data-i18n="day.off"></span>
        <span data-i18n="day.full"></span>
      </div>
    </div>
  </div>

  <div class="others" id="dy-others"></div>

  <div class="card" style="padding:0;">
    <button class="row" id="dy-tryit" type="button">
      <span class="label" data-i18n="day.tryIt"></span>
      <span class="chev">&rsaquo;</span>
    </button>
  </div>

  <button class="btn-primary" id="dy-next" data-i18n="day.next"></button>
</div>

<script type="text/javascript">
/**
 * The circadian light's one real screen: three parts of a day, and where the two
 * boundaries between them fall.
 *
 * **Why the strip is the control.** The thing being set is what the lights look
 * like at each part of the day, and a day is the natural picture of that. The
 * two round handles are the boundaries; dragging one moves it against today's
 * real sunrise or sunset, which is why the strip has those marked on it. The
 * previous version of this screen was two sliders labelled "warmest" and
 * "coolest" with no picture at all, and "warmest" was one value the day passed
 * through TWICE — a control that could not be drawn honestly.
 *
 * `touch-action: none` on the strip and on both sliders is load-bearing rather
 * than cosmetic: without it a horizontal drag scrolls the pairing sheet
 * underneath instead, and none of the three controls can be used on a phone.
 *
 * Pair views are INJECTED INTO the pairing container's document — no iframe, no
 * second homey.js, every rule scoped to this view's root id, and the boot guard
 * on the root ELEMENT because all views of a session share one document.
 */
function __lkBootDy(Homey) {
  var __root = document.getElementById('dy-root');
  if (!__root || __root.dataset.llBooted === '1') return;
  __root.dataset.llBooted = '1';

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err instanceof Error ? err : new Error(String(err)));
        else resolve(result);
      };
      var timer = setTimeout(function () { finish(new Error('Homey did not respond in time. Close this screen and try again. (' + event + ')')); }, 20000);
      var done = function (err, result) { clearTimeout(timer); finish(err, result); };
      try {
        var returned = Homey.emit(event, data, function (err, result) { done(err, result); });
        if (returned && typeof returned.then === 'function') {
          returned.then(function (r) { done(null, r); }, function (e) { done(e); });
        }
      } catch (err) { done(err); }
    });
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined && text !== null) el.textContent = String(text);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function pad(value) { return (value < 10 ? '0' : '') + value; }

  function clock(minutes) { return pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60); }

  var el = {
    steps: document.getElementById('dy-steps'),
    error: document.getElementById('dy-error'),
    strip: document.getElementById('dy-strip'),
    sunriseMark: document.getElementById('dy-sunriseMark'),
    sunriseTag: document.getElementById('dy-sunriseTag'),
    sunsetMark: document.getElementById('dy-sunsetMark'),
    sunsetTag: document.getElementById('dy-sunsetTag'),
    morningHandle: document.getElementById('dy-morningHandle'),
    eveningHandle: document.getElementById('dy-eveningHandle'),
    today: document.getElementById('dy-today'),
    zoneName: document.getElementById('dy-zoneName'),
    zoneSpan: document.getElementById('dy-zoneSpan'),
    stepper: document.getElementById('dy-stepper'),
    boundaryWhat: document.getElementById('dy-boundaryWhat'),
    boundaryDown: document.getElementById('dy-boundaryDown'),
    boundaryAt: document.getElementById('dy-boundaryAt'),
    boundaryUp: document.getElementById('dy-boundaryUp'),
    warmth: document.getElementById('dy-warmth'),
    warmthKnob: document.getElementById('dy-warmthKnob'),
    brightToggle: document.getElementById('dy-brightToggle'),
    brightBlock: document.getElementById('dy-brightBlock'),
    brightPct: document.getElementById('dy-brightPct'),
    bright: document.getElementById('dy-bright'),
    brightKnob: document.getElementById('dy-brightKnob'),
    others: document.getElementById('dy-others'),
    tryit: document.getElementById('dy-tryit'),
    next: document.getElementById('dy-next')
  };

  var KEYS = ['morning', 'midday', 'evening'];

  /**
   * The three zone names, as explicit keys rather than `'day.' + key`.
   *
   * `locales.test.ts` reads the views to decide which keys are live, so a key
   * assembled at runtime reads as an unused one — and the honest fix is to write
   * them out rather than to teach the scanner another shape.
   */
  var ZONE_LABEL = {
    morning: 'day.morning',
    midday: 'day.midday',
    evening: 'day.evening'
  };

  var state = {
    zones: null,
    adjustBrightness: false,
    preStage: false,
    selected: 'morning',
    bounds: null,
    sun: { sunriseMinute: null, sunsetMinute: null },
    limits: { maxOffset: 150, offsetStep: 15 },
    nextView: null
  };

  function t(key) { return Homey.__(key); }

  /**
   * The colour a warmth reads as on the strip.
   *
   * The same six stops the design canvas uses, interpolated. It is a PICTURE of
   * the warmth axis rather than a colour-accurate rendering of a lamp: a real
   * 2200K is not this colour on a phone, and pretending otherwise would be a
   * promise the screen cannot keep.
   */
  var STOPS = [
    [0, [219, 232, 251]], [0.2, [234, 240, 251]], [0.4, [242, 230, 214]],
    [0.6, [244, 198, 138]], [0.8, [239, 166, 88]], [1, [232, 137, 44]]
  ];

  function warmthColour(value) {
    var v = Math.max(0, Math.min(1, value));
    var a = STOPS[0];
    var b = STOPS[STOPS.length - 1];
    for (var i = 0; i < STOPS.length - 1; i++) {
      if (v >= STOPS[i][0] && v <= STOPS[i + 1][0]) { a = STOPS[i]; b = STOPS[i + 1]; break; }
    }
    var f = (v - a[0]) / ((b[0] - a[0]) || 1);
    var rgb = [0, 1, 2].map(function (c) { return Math.round(a[1][c] + (b[1][c] - a[1][c]) * f); });
    return 'rgb(' + rgb.join(',') + ')';
  }

  /** The warmth at any minute, which is exactly what `zonePoints` produces. */
  var RAMP = 50;
  function warmthAt(minute) {
    var a = state.bounds.morningEndMinute;
    var b = state.bounds.eveningStartMinute;
    var z = state.zones;
    if (minute < RAMP) return mix(z.evening.temperature, z.morning.temperature, (minute + RAMP) / (2 * RAMP));
    if (minute < a - RAMP) return z.morning.temperature;
    if (minute < a + RAMP) return mix(z.morning.temperature, z.midday.temperature, (minute - (a - RAMP)) / (2 * RAMP));
    if (minute < b - RAMP) return z.midday.temperature;
    if (minute < b + RAMP) return mix(z.midday.temperature, z.evening.temperature, (minute - (b - RAMP)) / (2 * RAMP));
    if (minute < 1440 - RAMP) return z.evening.temperature;
    return mix(z.evening.temperature, z.morning.temperature, (minute - (1440 - RAMP)) / (2 * RAMP));
  }

  function mix(from, to, fraction) {
    return from + (to - from) * Math.max(0, Math.min(1, fraction));
  }

  function drawStrip() {
    var stops = [];
    for (var i = 0; i <= 48; i++) {
      var minute = (i / 48) * 1440;
      stops.push(warmthColour(warmthAt(minute)) + ' ' + ((i / 48) * 100).toFixed(2) + '%');
    }
    el.strip.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';

    place(el.sunriseMark, el.sunriseTag, state.sun.sunriseMinute);
    place(el.sunsetMark, el.sunsetTag, state.sun.sunsetMinute);

    handleAt(el.morningHandle, state.bounds.morningEndMinute, state.selected === 'morning');
    handleAt(el.eveningHandle, state.bounds.eveningStartMinute, state.selected === 'evening');
  }

  function place(mark, tag, minute) {
    // No sunrise to draw is a real state — a polar day, or a Homey that has
    // never been told where it is — and drawing the mark anyway would put a
    // label on the strip that names nothing.
    var show = minute !== null && minute !== undefined;
    mark.style.display = show ? '' : 'none';
    tag.style.display = show ? '' : 'none';
    if (!show) return;
    mark.style.left = (minute / 1440) * 100 + '%';
    tag.style.left = (minute / 1440) * 100 + '%';
  }

  function handleAt(handle, minute, selected) {
    handle.style.left = (minute / 1440) * 100 + '%';
    handle.className = selected ? 'handle sel' : 'handle';
  }

  function spanText(key) {
    var a = clock(state.bounds.morningEndMinute);
    var b = clock(state.bounds.eveningStartMinute);
    if (key === 'morning') return Homey.__('day.spanMorning', { until: a });
    if (key === 'midday') return Homey.__('day.spanMidday', { from: a, until: b });
    return Homey.__('day.spanEvening', { from: b });
  }

  function warmthWord(value) {
    // HIGH is warm: `warmth` is homey-lib's axis, where 1 is the WARMEST end
    // (platform §6). The first render of this screen had it the other way and
    // showed "Warm" beside a blue swatch.
    if (value >= 0.82) return t('warmth.deepAmber');
    if (value >= 0.62) return t('warmth.warm');
    if (value >= 0.44) return t('warmth.softWarm');
    if (value >= 0.24) return t('warmth.softWhite');
    return t('warmth.coolWhite');
  }

  function renderZone() {
    var key = state.selected;
    var zone = state.zones[key];

    el.zoneName.textContent = t(ZONE_LABEL[key]);
    el.zoneSpan.textContent = spanText(key);

    // Midday has no boundary of its own: it is what lies BETWEEN the other two,
    // so a stepper there would be a control for something that is not a value.
    var hasBoundary = key !== 'midday';
    el.stepper.style.display = hasBoundary ? '' : 'none';
    if (hasBoundary) {
      var sunrise = key === 'morning';
      el.boundaryWhat.textContent = t(sunrise ? 'day.ends' : 'day.starts');
      var offset = sunrise ? state.zones.morningEnd : state.zones.eveningStart;
      el.boundaryAt.textContent = offsetText(sunrise, offset);
      el.boundaryDown.disabled = offset <= -state.limits.maxOffset;
      el.boundaryUp.disabled = offset >= state.limits.maxOffset;
    }

    setSlider(el.warmthKnob, warmthToSlider(zone.temperature));
    el.brightToggle.setAttribute('aria-checked', state.adjustBrightness ? 'true' : 'false');
    el.brightBlock.style.display = state.adjustBrightness ? '' : 'none';
    if (state.adjustBrightness) {
      var brightness = zone.brightness === undefined ? 0 : zone.brightness;
      el.brightPct.textContent = Math.round(brightness * 100) + '%';
      setSlider(el.brightKnob, brightness);
    }

    renderOthers();
    drawStrip();
  }

  function offsetText(sunrise, offset) {
    var anchor = t(sunrise ? 'day.sunrise' : 'day.sunset');
    if (offset === 0) return anchor;
    return anchor + (offset > 0 ? ' +' : ' −') + Math.abs(offset) + 'm';
  }

  function setSlider(knob, value) {
    // The track carries the range; the knob is the only thing that moves.
    knob.style.left = (Math.max(0, Math.min(1, value)) * 100) + '%';
  }

  /**
   * The warmth slider runs CANDLELIGHT on the left to DAYLIGHT on the right, and
   * `warmth` runs the other way: 1 is the warmest end (platform §6).
   *
   * So the control inverts, in exactly these two functions and nowhere else. It
   * is a display concern — the axis a person reads left to right — and inverting
   * it at the seam keeps every stored value, every comparison and every word in
   * the app on homey-lib's own convention. Doing it anywhere further in is how
   * "Warmest" came to write 0 and light a room cold white at bedtime.
   */
  function warmthToSlider(warmth) { return 1 - warmth; }
  function sliderToWarmth(fraction) { return 1 - fraction; }

  function renderOthers() {
    clear(el.others);
    for (var i = 0; i < KEYS.length; i++) {
      var key = KEYS[i];
      if (key === state.selected) continue;
      el.others.appendChild(otherRow(key));
    }
  }

  function otherRow(key) {
    var zone = state.zones[key];
    var row = node('button', 'row');
    row.type = 'button';

    var swatch = node('span', 'sw');
    swatch.style.background = warmthColour(zone.temperature);
    row.appendChild(swatch);

    var text = node('div', 'text');
    text.appendChild(node('div', null, t(ZONE_LABEL[key])));
    text.appendChild(node('div', 'sub', spanText(key)));
    row.appendChild(text);

    var value = warmthWord(zone.temperature);
    if (state.adjustBrightness) {
      value += ' · ' + Math.round((zone.brightness || 0) * 100) + '%';
    }
    row.appendChild(node('span', 'value', value));
    row.appendChild(node('span', 'chev', '›'));

    row.addEventListener('click', function () {
      state.selected = key;
      renderZone();
    });
    return row;
  }

  /**
   * Dragging, on the strip and on both sliders.
   *
   * One helper, because the three are the same gesture over a different range.
   * `setPointerCapture` is what makes a drag survive the pointer leaving the
   * element — without it, moving a finger off the strip abandons the drag
   * mid-way and the handle stops wherever it happened to be.
   */
  function draggable(element, onFraction) {
    var dragging = false;

    function fractionOf(event) {
      var rect = element.getBoundingClientRect();
      return Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    }

    element.addEventListener('pointerdown', function (event) {
      dragging = true;
      if (element.setPointerCapture) element.setPointerCapture(event.pointerId);
      onFraction(fractionOf(event), false);
    });
    element.addEventListener('pointermove', function (event) {
      if (!dragging) return;
      onFraction(fractionOf(event), false);
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      // Pushed on the way UP, not on every pixel: a drag would otherwise be one
      // round trip per pointer event.
      push();
    }
    element.addEventListener('pointerup', end);
    element.addEventListener('pointercancel', end);
  }

  draggable(el.strip, function (fraction) {
    var minute = fraction * 1440;
    // Whichever boundary is nearer is the one being dragged, which is also what
    // selects that zone — one gesture rather than a tap and then a drag.
    var toMorning = Math.abs(minute - state.bounds.morningEndMinute);
    var toEvening = Math.abs(minute - state.bounds.eveningStartMinute);
    var sunrise = toMorning <= toEvening;
    var anchor = sunrise ? state.sun.sunriseMinute : state.sun.sunsetMinute;
    var base = anchor === null || anchor === undefined ? (sunrise ? 360 : 1260) : anchor;

    var offset = clampOffset(Math.round((minute - base) / state.limits.offsetStep) * state.limits.offsetStep);
    state.selected = sunrise ? 'morning' : 'evening';
    if (sunrise) state.zones.morningEnd = offset;
    else state.zones.eveningStart = offset;
    localBounds();
    renderZone();
  });

  draggable(el.warmth, function (fraction) {
    state.zones[state.selected].temperature = sliderToWarmth(fraction);
    renderZone();
  });

  draggable(el.bright, function (fraction) {
    state.zones[state.selected].brightness = fraction;
    renderZone();
  });

  function clampOffset(offset) {
    return Math.max(-state.limits.maxOffset, Math.min(state.limits.maxOffset, offset));
  }

  /**
   * The clamp, locally, so a drag does not wait for a round trip to look right.
   *
   * The driver applies the SAME `resolveBoundaries` and echoes its answer back,
   * which is what corrects this if the two ever disagree — so this is an
   * optimistic copy rather than a second implementation with its own opinion.
   */
  function localBounds() {
    var slack = 3 * RAMP;
    var sunrise = state.sun.sunriseMinute === null ? 360 : state.sun.sunriseMinute;
    var sunset = state.sun.sunsetMinute === null ? 1260 : state.sun.sunsetMinute;
    var a = Math.max(slack, Math.min(1440 - 2 * slack, sunrise + state.zones.morningEnd));
    var b = Math.max(a + slack, Math.min(1440 - slack, sunset + state.zones.eveningStart));
    state.bounds = { morningEndMinute: a, eveningStartMinute: b, fromSun: state.bounds.fromSun };
  }

  function stepBoundary(direction) {
    var sunrise = state.selected === 'morning';
    var key = sunrise ? 'morningEnd' : 'eveningStart';
    state.zones[key] = clampOffset(state.zones[key] + direction * state.limits.offsetStep);
    localBounds();
    renderZone();
    push();
  }

  el.boundaryDown.addEventListener('click', function () { stepBoundary(-1); });
  el.boundaryUp.addEventListener('click', function () { stepBoundary(1); });

  el.brightToggle.addEventListener('click', function () {
    state.adjustBrightness = !state.adjustBrightness;
    // All-or-nothing across the three zones, checked here rather than trusted
    // from the driver's echo: the engine interpolates brightness only where both
    // bracketing points carry one, so a zone without one would leave the curve
    // inventing the missing segments.
    for (var i = 0; i < KEYS.length; i++) {
      var zone = state.zones[KEYS[i]];
      if (state.adjustBrightness && zone.brightness === undefined) zone.brightness = 0.6;
    }
    renderZone();
    push();
  });

  el.tryit.addEventListener('click', function () { Homey.showView('tryit'); });

  el.next.addEventListener('click', function () {
    if (state.nextView) Homey.showView(state.nextView);
  });

  function push() {
    emit('setDay', {
      morning: state.zones.morning,
      midday: state.zones.midday,
      evening: state.zones.evening,
      morningEnd: state.zones.morningEnd,
      eveningStart: state.zones.eveningStart,
      adjustBrightness: state.adjustBrightness,
      preStage: state.preStage
    }).then(function (reply) {
      // The driver's clamp is the one that counts. Snapping to it visibly beats
      // leaving a handle where the finger stopped while the device goes
      // somewhere else.
      state.zones = reply.zones;
      state.adjustBrightness = reply.adjustBrightness;
      state.bounds = reply.boundaries;
      renderZone();
    }).catch(show);
  }

  function show(err) {
    el.error.textContent = err && err.message ? err.message : String(err);
    el.error.style.display = '';
  }

  function renderSteps(payload) {
    clear(el.steps);
    for (var i = 1; i <= payload.stepCount; i++) {
      el.steps.appendChild(node('i', i <= payload.stepIndex ? 'on' : null));
    }
    el.steps.appendChild(node('span', null,
      Homey.__('day.step', { index: payload.stepIndex, count: payload.stepCount })));
  }

  emit('getDay').then(function (payload) {
    state.zones = payload.zones;
    state.adjustBrightness = payload.adjustBrightness;
    state.preStage = payload.preStage;
    state.bounds = payload.boundaries;
    state.sun = payload.sun;
    state.limits = payload.limits;
    state.nextView = payload.nextView || 'review';

    renderSteps({ stepIndex: 2, stepCount: 3 });

    el.today.textContent = payload.boundaries.fromSun
      ? Homey.__('day.todaySun', {
        sunrise: clock(payload.sun.sunriseMinute),
        sunset: clock(payload.sun.sunsetMinute)
      })
      : Homey.__('day.todayFixed', {
        sunrise: clock(payload.limits.fallbackSunrise),
        sunset: clock(payload.limits.fallbackSunset)
      });

    renderZone();
  }).catch(show);
}

(function () {
  var tries = 0;
  function waitForHomey() {
    if (window.Homey && typeof window.Homey.emit === 'function') { __lkBootDy(window.Homey); return; }
    if (++tries > 100) {
      var root = document.getElementById('dy-root');
      if (root) {
        var banner = document.createElement('div');
        banner.className = 'msg bad';
        banner.textContent = 'This screen could not reach Homey. Close it and try again.';
        root.appendChild(banner);
      }
      return;
    }
    setTimeout(waitForHomey, 50);
  }
  window.onHomeyReady = function (ready) { __lkBootDy(ready || window.Homey); };
  waitForHomey();
})();
</script>
