name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # SHA-pinned, not tag-pinned: a mutable `v4` tag is a supply-chain
      # write-primitive into every run of this workflow. Dependabot bumps the
      # pin (see .github/dependabot.yml) so the comment and the SHA move
      # together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 22, to stay close to what current Homey Pro firmware runs. homey-api
      # declares engines.node >= 24, which npm only warns about — 3.19.2 is the
      # version verified on real hardware and is pinned exactly in package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Type-check tests and scripts
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Validates app.json, the compose sources, drivers, flow cards and
      # locales at the same level the App Store applies on submission.
      #
      # The CLI is a devDependency at exactly 4.4.2 and runs from the
      # lockfile: an unpinned `npx homey` silently changes what "publish-level
      # valid" means between two runs of the same commit, so a green build
      # stops being evidence of anything. It also means `npm ci` above is the
      # only thing that reaches the network for it.
      - name: Validate Homey app
        run: npm run validate

      # `validate` REGENERATES app.json from .homeycompose/, so a stale
      # committed manifest is silently repaired in the runner and the build
      # goes green over it. This is the step that refuses that.
      # (test/unit/compose-manifest.test.ts is the local equivalent.)
      - name: Check app.json is in sync with .homeycompose/
        run: git diff --exit-code -- app.json

      # `npm run sync:views` is deliberately NOT run here. The repair/ and
      # shared-view copies are committed files, and repair-views.test.ts above
      # is the gate — a CI run that synced them would hide the drift it exists
      # to catch.
