name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # SHA-pinned, not tag-pinned: a mutable major tag is a supply-chain
      # write-primitive into every run of this workflow. Dependabot bumps the
      # pin (see .github/dependabot.yml) so the trailing version comment and
      # the SHA move together — that comment is a label, never what resolves.
      # Deliberately naming no version here: this text outlived `v4`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22, to stay close to what current Homey Pro firmware runs. homey-api
      # declares engines.node >= 24, which npm only warns about — 3.19.2 is the
      # version verified on real hardware and is pinned exactly in package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The SHIPPED tree only, and only high or critical.
      #
      # `--omit=dev` because devDependencies never reach a Homey: the pinned
      # `homey` CLI brings a large tool tree of its own (17 findings, 5 high,
      # through sharp and libvips) that a Homey never sees, and failing CI on
      # those would train everyone to ignore this step.
      #
      # `--audit-level=high` tolerates the four accepted moderates CLAUDE.md
      # records — one chain, parseuri → engine.io-client → socket.io-client,
      # reached only through homey-api, with no upstream fix to take and a
      # downgrade of homey-api as npm's only suggestion. CLAUDE.md says
      # "re-check at each dependency bump"; nothing did, so a new HIGH in the
      # shipped tree would have landed green on a dependabot PR.
      - name: Audit the shipped dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Type-check tests and scripts
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      # BEFORE the tests, and the order is the point.
      #
      # `npm run sync:views` is deliberately NOT run here — a CI run that synced
      # the copies would repair the drift in the runner and go green over it,
      # exactly as an unchecked `homey app validate` does to app.json.
      # `--check` is the other half: it reports what WOULD be copied and exits
      # non-zero, writing nothing.
      #
      # It used to run last, which made it unfalsifiable: `npm test` imports
      # scripts/sync-views.mjs, whose body was top-level statements, so the test
      # run synced the tree first and this step could only ever find it clean.
      # The script no longer does anything on import — both halves of that fix
      # matter, because either one alone leaves the other's failure mode open.
      - name: Check pair/repair and shared views are in sync
        run: npm run sync:views:check

      # The suite once, under coverage, with floors. Not a separate `npm test`
      # step as well: the run IS the suite, and it fails on a failing test before
      # it looks at a single percentage. See scripts/coverage.mjs for why a
      # plain `--test-coverage-lines` threshold is not enough (a file no test
      # loads is not in the report, so it can never lower the number).
      - name: Unit tests, with coverage floors
        run: npm run test:coverage -- --quiet

      # Validates app.json, the compose sources, drivers, flow cards and
      # locales at the same level the App Store applies on submission.
      #
      # The CLI is a devDependency at exactly 4.4.3 and runs from the
      # lockfile: an unpinned `npx homey` silently changes what "publish-level
      # valid" means between two runs of the same commit, so a green build
      # stops being evidence of anything. It also means `npm ci` above is the
      # only thing that reaches the network for it.
      - name: Validate Homey app
        run: npm run validate

      # `validate` REGENERATES app.json from .homeycompose/, so a stale
      # committed manifest is silently repaired in the runner and the build
      # goes green over it. This is the step that refuses that.
      # (test/unit/compose-manifest.test.ts is the local equivalent.)
      - name: Check app.json is in sync with .homeycompose/
        run: git diff --exit-code -- app.json

      # `validate` ran `npm run build` without `.dev-build`, so .homeybuild/ is
      # now exactly what a launch build packages. The build proves its own strip
      # from inside; this looks from outside, so a strip that stopped running at
      # all — a guard inverted, the call deleted — fails here instead of going
      # green over a recorder that would reach households.
      - name: Check the packaged tree is a launch build
        run: node scripts/build.mjs --verify

