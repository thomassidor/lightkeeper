<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <title>Lightkeeper</title>
  <desc>A remote sending a signal to a lit bulb.</desc>

  <!-- Homey renders the app icon at roughly 40 px. The first version of this
       mark drew everything in 52 px strokes with interior detail — a screen,
       two button bars, a lamp stem — and at that size the three clusters
       collapsed into one grey smudge. Solid masses survive the downscale;
       hairlines do not. Verified by rasterising at 32/40/56/80/140 px on light
       and dark grounds, which is also how the two problems below were found. -->

  <!-- Remote. One button: a second one is texture at 32 px, not information. -->
  <rect x="90" y="210" width="190" height="580" rx="78" fill="#1F3A5F"/>
  <circle cx="185" cy="330" r="50" fill="#F2A93B"/>

  <!-- The link. Concentric about (280, 500) rather than two arcs struck from
       the same vertical line — nested that way their stroke bands overlapped
       and the pair rendered as one thick amber crescent. -->
  <g fill="none" stroke="#F2A93B" stroke-width="48" stroke-linecap="round">
    <path d="M371.9 422.8A120 120 0 0 1 371.9 577.2"/>
    <path d="M440.9 365A210 210 0 0 1 440.9 635"/>
  </g>

  <!-- Bulb, amber throughout: the light is lit, which is what the app is for,
       and a large bright mass is the one part of the mark that still carries on
       a dark ground. Glass and cap share a colour deliberately — splitting them
       navy/amber detached the cap and the whole thing read as a balloon. -->
  <circle cx="740" cy="430" r="172" fill="#F2A93B"/>
  <rect x="645" y="560" width="190" height="170" rx="30" fill="#F2A93B"/>
</svg>
